<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · Calendário Letivo</title>
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FFEAD6; font-family:'Poppins', sans-serif; color:#562915;}
</style>
</head>
<body>
<p>Abrindo o Calendário Letivo…</p>
<!--
  O Calendário Letivo deixou de ser uma página à parte: agora é uma aba dentro
  de cada painel (assets/dyse-calendario.js). Esta página só existe pra links
  antigos/favoritos continuarem funcionando — manda cada um pra aba do próprio
  painel.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script>
  (async () => {
    const session = await dyseRequireAuth();
    if(!session) return;
    const profile = await dyseGetProfile(session);
    const destino = dyseIsAdmin(profile) ? '/gestao.html#calendario'
      : (dyseIsTeacher(profile) ? '/professora.html#calendario' : '/area-do-aluno.html#calendario');
    location.replace(destino);
  })();
</script>
</body>
</html>
