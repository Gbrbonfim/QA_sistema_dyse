<script>
/* Pre-A1 BLACK · Class 05 · Escrita (Wave your Flag! - Review)
   Alinhado ao "Grammar Point: Review" (to be afirmativo, negativo e interrogativo:
   She / from Japan (+) → She's from Japan.). Conteúdo NOVO com outras pessoas. A isca é a
   forma errada do be. 20 questões. */
const M = (dica, pt) => dica + ' → Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 5, num: 4, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('He / from Mexico (+)', 'Ele é do México.'), palavras: ["He's", 'from', 'Mexico'], isca: ["He're"], fim: '.', traducao: 'Ele é do México.' },
    { contexto: M('I / Canadian (+)', 'Eu sou canadense.'), palavras: ["I'm", 'Canadian'], isca: ["I's"], fim: '.', traducao: 'Sou canadense.' },
    { contexto: M('It / from Japan (-)', 'Não é do Japão.'), palavras: ['It', "isn't", 'from', 'Japan'], isca: ["aren't"], fim: '.', traducao: 'Não é do Japão.' },
    { contexto: M('You / 15 years old (?)', 'Você tem 15 anos?'), palavras: ['Are', 'you', 'fifteen', 'years', 'old'], isca: ['Is'], fim: '?', traducao: 'Você tem 15 anos?' },
    { contexto: M('They / pop stars (-)', 'Eles não são pop stars.'), palavras: ['They', "aren't", 'pop', 'stars'], isca: ["isn't"], fim: '.', traducao: 'Eles não são pop stars.' },
    { contexto: M('We / in class 3 (?)', 'Estamos na turma 3?'), palavras: ['Are', 'we', 'in', 'class', 'three'], isca: ['Am'], fim: '?', traducao: 'Estamos na turma 3?' },
    { contexto: M('She / a designer (+)', 'Ela é designer.'), palavras: ["She's", 'a', 'designer'], isca: ["She're"], fim: '.', traducao: 'Ela é designer.' },
    { contexto: M('I / from Curitiba (-)', 'Eu não sou de Curitiba.'), palavras: ["I'm", 'not', 'from', 'Curitiba'], isca: ["isn't"], fim: '.', traducao: 'Não sou de Curitiba.' },
    { contexto: M('He / a teacher (?)', 'Ele é professor?'), palavras: ['Is', 'he', 'a', 'teacher'], isca: ['Are'], fim: '?', traducao: 'Ele é professor?' },
    { contexto: M('You / from Germany (?)', 'Você é da Alemanha?'), palavras: ['Are', 'you', 'from', 'Germany'], isca: ['Is'], fim: '?', traducao: 'Você é da Alemanha?' },
    { contexto: M('They / Filipino (+)', 'Eles são filipinos.'), palavras: ["They're", 'Filipino'], isca: ["They's"], fim: '.', traducao: 'Eles são filipinos.' },
    { contexto: M('You / in class 1 (-)', 'Você não está na turma 1.'), palavras: ['You', "aren't", 'in', 'class', 'one'], isca: ["isn't"], fim: '.', traducao: 'Você não está na turma 1.' },
    { contexto: M('It / a pop group (+)', 'É uma banda pop.'), palavras: ["It's", 'a', 'pop', 'group'], isca: ["It're"], fim: '.', traducao: 'É uma banda pop.' },
    { contexto: M('She / 18 years old (-)', 'Ela não tem 18 anos.'), palavras: ['She', "isn't", 'eighteen', 'years', 'old'], isca: ["aren't"], fim: '.', traducao: 'Ela não tem 18 anos.' },
    { contexto: M('We / Brazilian (+)', 'Nós somos brasileiros.'), palavras: ["We're", 'Brazilian'], isca: ["We's"], fim: '.', traducao: 'Somos brasileiros.' },
    { contexto: M('I / late (?)', 'Eu estou atrasado?'), palavras: ['Am', 'I', 'late'], isca: ['Is'], fim: '?', traducao: 'Estou atrasado?' },
    { contexto: M('They / from India (?)', 'Eles são da Índia?'), palavras: ['Are', 'they', 'from', 'India'], isca: ['Is'], fim: '?', traducao: 'Eles são da Índia?' },
    { contexto: M('We / Russian (-)', 'Nós não somos russos.'), palavras: ['We', "aren't", 'Russian'], isca: ["isn't"], fim: '.', traducao: 'Não somos russos.' },
    { contexto: M('She / from Finland (?)', 'Ela é da Finlândia?'), palavras: ['Is', 'she', 'from', 'Finland'], isca: ['Are'], fim: '?', traducao: 'Ela é da Finlândia?' },
    { contexto: M('He / Chinese (-)', 'Ele não é chinês.'), palavras: ['He', "isn't", 'Chinese'], isca: ["aren't"], fim: '.', traducao: 'Ele não é chinês.' }
  ]
});
</script>
