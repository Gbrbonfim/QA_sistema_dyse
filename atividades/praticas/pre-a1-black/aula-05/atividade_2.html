<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · Pre-A1 BLACK · Aula 5 · Words from the song</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Pre-A1 BLACK · Class 05 · Escuta (Wave your Flag! - Review)
   Alinhado ao "Vocabulary" do slide (passion, plane, bags, run, globe, sun) e às cores.
   Conteúdo NOVO: o aluno ouve uma frase curta e escolhe a palavra que ouviu. 24 questões. */
const IC = { passion: 'favorite', plane: 'flight', bags: 'luggage', run: 'directions_run', globe: 'public', sun: 'sunny', flag: 'flag', colors: 'palette' };
let n = 0;
const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 4;
  const ns = iscas.slice(0, 3);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(c => ({ label: c, icon: IC[c] })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 5, num: 2, tipo: 'imagem',
  instrucao: 'Listen and choose the word you hear',
  itens: [
    q('The plane is from Canada.', 'plane', ['bags', 'sun', 'globe']),
    q('My bags are red and black.', 'bags', ['plane', 'run', 'passion']),
    q('The sun is yellow.', 'sun', ['globe', 'flag', 'bags']),
    q('Football is my passion.', 'passion', ['plane', 'colors', 'run']),
    q('The globe is blue and green.', 'globe', ['sun', 'bags', 'plane']),
    q("Let's run!", 'run', ['sun', 'passion', 'flag']),
    q('Wave your flag!', 'flag', ['bags', 'globe', 'run']),
    q('Show me your colors!', 'colors', ['passion', 'plane', 'sun']),
    q("It's a big plane.", 'plane', ['globe', 'passion', 'flag']),
    q('Music is her passion.', 'passion', ['bags', 'globe', 'sun']),
    q('Pack your bags!', 'bags', ['flag', 'run', 'colors']),
    q('Look at the sun!', 'sun', ['plane', 'colors', 'bags']),
    q('Brazil is on the globe.', 'globe', ['flag', 'run', 'passion']),
    q('I run in the park.', 'run', ['plane', 'globe', 'bags']),
    q('The flag of Brazil is green and yellow.', 'flag', ['sun', 'passion', 'plane']),
    q('My favorite colors are blue and white.', 'colors', ['globe', 'run', 'bags']),
    q('The plane is from Japan.', 'plane', ['sun', 'flag', 'colors']),
    q('Her bags are from Germany.', 'bags', ['globe', 'passion', 'run']),
    q("The sun is hot in Mexico.", 'sun', ['run', 'bags', 'globe']),
    q('Dance is his passion.', 'passion', ['flag', 'sun', 'plane']),
    q('The globe is on the table.', 'globe', ['colors', 'plane', 'passion']),
    q('We run every day.', 'run', ['globe', 'colors', 'bags']),
    q("This flag is red and white.", 'flag', ['plane', 'bags', 'passion']),
    q('The colors of the flag are red and white.', 'colors', ['sun', 'run', 'globe'])
  ]
});
</script>
</body>
</html>
