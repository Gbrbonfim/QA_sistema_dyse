<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* Pre-A1 BLACK · Class 05 · Gramática (Wave your Flag! - Review)
   Revisão das aulas 1 a 4: país x nacionalidade, números 1–20, pronomes, perguntas (What /
   Where / How old), "from" e cores das bandeiras. Conteúdo NOVO com fatos verdadeiros.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 5, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: "I'm from Finland. I'm ___.", opcoes: ['Finnish', 'Finland', 'Finlandish'], certa: 0, traducao: 'Sou da Finlândia. Sou finlandês.' },
    { frase: "She's from ___.", opcoes: ['Indian', 'India', 'Indiano'], certa: 1, traducao: 'Ela é da Índia.' },
    { frase: 'Jackie Chan is ___.', opcoes: ['China', 'Chinas', 'Chinese'], certa: 2, traducao: 'O Jackie Chan é chinês.' },
    { frase: '___ your name?', opcoes: ["What's", "Where's", "How's"], certa: 0, traducao: 'Qual é o seu nome?' },
    { frase: '___ are you from?', opcoes: ['How', 'Where', 'What'], certa: 1, traducao: 'De onde você é?' },
    { frase: '___ old are you?', opcoes: ['Where', 'What', 'How'], certa: 2, traducao: 'Quantos anos você tem?' },
    { frase: 'Ten + five = ___', opcoes: ['fifteen', 'fifty', 'five'], certa: 0, traducao: 'Dez + cinco = quinze.' },
    { frase: 'Twelve + seven = ___', opcoes: ['seventeen', 'nineteen', 'eighteen'], certa: 1, traducao: 'Doze + sete = dezenove.' },
    { frase: 'Eight + six = ___', opcoes: ['sixteen', 'twelve', 'fourteen'], certa: 2, traducao: 'Oito + seis = catorze.' },
    { frase: 'Ana and Pedro are from Brazil. → ___ from Brazil.', opcoes: ["They're", "We're", "He's"], certa: 0, traducao: 'A Ana e o Pedro são do Brasil. → Eles são do Brasil.' },
    { frase: 'Kenji is Japanese. → ___ Japanese.', opcoes: ["She's", "He's", "It's"], certa: 1, traducao: 'O Kenji é japonês. → Ele é japonês.' },
    { frase: 'Mia and I are from Mexico. → ___ from Mexico.', opcoes: ["They're", "You're", "We're"], certa: 2, traducao: 'A Mia e eu somos do México. → Somos do México.' },
    { frase: 'Is Drake ___ Toronto?', opcoes: ['from', '– (nothing)', 'of'], certa: 0, traducao: 'O Drake é de Toronto?' },
    { frase: 'Is Neymar ___ Brazilian?', opcoes: ['from', '– (nothing)', 'of'], certa: 1, traducao: 'O Neymar é brasileiro?' },
    { frase: 'The flag of Japan is white and ___.', opcoes: ['green', 'blue', 'red'], certa: 2, traducao: 'A bandeira do Japão é branca e vermelha.' },
    { frase: 'The flag of Finland is white and ___.', opcoes: ['blue', 'red', 'yellow'], certa: 0, traducao: 'A bandeira da Finlândia é branca e azul.' },
    { frase: 'The flag of China is red and ___.', opcoes: ['blue', 'yellow', 'green'], certa: 1, traducao: 'A bandeira da China é vermelha e amarela.' },
    { frase: 'The flag of Germany is black, red and ___.', opcoes: ['white', 'blue', 'yellow'], certa: 2, traducao: 'A bandeira da Alemanha é preta, vermelha e amarela.' },
    { frase: 'The flag of Canada is red and ___.', opcoes: ['white', 'blue', 'green'], certa: 0, traducao: 'A bandeira do Canadá é vermelha e branca.' },
    { frase: 'The flag of Mexico is green, white and ___.', opcoes: ['blue', 'red', 'black'], certa: 1, traducao: 'A bandeira do México é verde, branca e vermelha.' },
    { frase: '"Konichiwa" is ___.', opcoes: ['Spanish', 'English', 'Japanese'], certa: 2, traducao: '"Konichiwa" é japonês.' },
    { frase: '"¿Cómo está?" is ___.', opcoes: ['Spanish', 'Japanese', 'English'], certa: 0, traducao: '"¿Cómo está?" é espanhol.' },
    { frase: '"Where are you from?" is ___.', opcoes: ['Spanish', 'English', 'Japanese'], certa: 1, traducao: '"Where are you from?" é inglês.' },
    { frase: 'Now United is a ___.', opcoes: ['designer', 'top model', 'pop group'], certa: 2, traducao: 'O Now United é uma banda pop.' }
  ]
});
</script>
</body>
</html>
