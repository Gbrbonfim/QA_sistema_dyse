<script>
/* Pre-A1 BLACK · Class 05 · Gramática (Wave your Flag! - Review)
   "Grammar Point: Review": to be afirmativo ('m, 's, 're), negativo (I'm not, isn't, aren't)
   e interrogativo (Am / Is / Are) — inclusive as frases da música (It's Now United. / We're
   born to wander. / Where are you from?). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 5, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'She / from Japan (+) → She___ from Japan.', opcoes: ["'s", "'re", "'m"], certa: 0, traducao: 'Ela é do Japão.' },
    { frase: 'I / Brazilian (+) → I___ Brazilian.', opcoes: ["'s", "'m", "'re"], certa: 1, traducao: 'Sou brasileiro.' },
    { frase: 'It / from China (-) → It ___ from China.', opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'Não é da China.' },
    { frase: 'You / 20 years old (?) → ___ you twenty years old?', opcoes: ['Are', 'Is', 'Am'], certa: 0, traducao: 'Você tem vinte anos?' },
    { frase: 'They / students (-) → They ___ students.', opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Eles não são alunos.' },
    { frase: 'We / in class 2 (?) → ___ we in class two?', opcoes: ['Is', 'Am', 'Are'], certa: 2, traducao: 'Estamos na turma 2?' },
    { frase: 'He / Canadian (+) → He___ Canadian.', opcoes: ["'s", "'re", "'m"], certa: 0, traducao: 'Ele é canadense.' },
    { frase: 'I / from Recife (-) → ___ from Recife.', opcoes: ["I isn't", "I'm not", "I aren't"], certa: 1, traducao: 'Não sou de Recife.' },
    { frase: 'She / a teacher (?) → ___ she a teacher?', opcoes: ['Are', 'Am', 'Is'], certa: 2, traducao: 'Ela é professora?' },
    { frase: 'They / a pop group (+) → They___ a pop group.', opcoes: ["'re", "'s", "'m"], certa: 0, traducao: 'Eles são uma banda pop.' },
    { frase: 'You / in class 3 (-) → You ___ in class three.', opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Você não está na turma 3.' },
    { frase: 'I / late (?) → ___ I late?', opcoes: ['Is', 'Are', 'Am'], certa: 2, traducao: 'Estou atrasado?' },
    { frase: 'From the song: "It___ Now United."', opcoes: ["'s", "'re", "'m"], certa: 0, traducao: 'É o Now United.' },
    { frase: 'From the song: "We___ born to wander."', opcoes: ["'s", "'re", "'m"], certa: 1, traducao: 'Nascemos para vagar.' },
    { frase: 'From the song: "Where ___ you from?"', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'De onde você é?' },
    { frase: 'The flag of Brazil ___ green, yellow, blue and white.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'A bandeira do Brasil é verde, amarela, azul e branca.' },
    { frase: 'My bags ___ black.', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'As minhas malas são pretas.' },
    { frase: 'The flag of Japan ___ green.', opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'A bandeira do Japão não é verde.' },
    { frase: '___ the flag of Canada red and white? — Yes, it is.', opcoes: ['Is', 'Are', 'Am'], certa: 0, traducao: 'A bandeira do Canadá é vermelha e branca? — Sim.' },
    { frase: 'Are you from Busan? — No, I ___.', opcoes: ["isn't", "'m not", "aren't"], certa: 1, traducao: 'Você é de Busan? — Não.' },
    { frase: 'Is Yuna South Korean? — Yes, she ___.', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'A Yuna é sul-coreana? — Sim.' },
    { frase: 'Are they Mexican? — No, they ___.', opcoes: ["aren't", "isn't", "'m not"], certa: 0, traducao: 'Eles são mexicanos? — Não.' },
    { frase: 'The sun ___ yellow.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O sol é amarelo.' },
    { frase: 'Football ___ my passion.', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'Futebol é a minha paixão.' }
  ]
});
</script>
</body>
</html>
