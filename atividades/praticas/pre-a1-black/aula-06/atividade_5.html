<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Pre-A1 BLACK · Class 06 and 07 · Leitura (In a Hotel)
   Alinhado ao "Speaking and Writing: a Hotel Check in" (perguntas da ficha, How do you spell
   your last name?, Could you repeat, please?, Thank you / You're welcome). Conteúdo NOVO: a
   recepcionista faz o check-in do Carlos Oliveira. 20 questões: 12 de "próxima fala" + 8 de
   compreensão. */
const D = [
  ['Receptionist', 'Good evening! Welcome to the Sun Hotel. What\'s your first name?'],
  ['Carlos', "Good evening! My first name is Carlos."],
  ['Receptionist', "And what's your last name?"],
  ['Carlos', "It's Oliveira."],
  ['Receptionist', 'How do you spell your last name?'],
  ['Carlos', 'O, L, I, V, E, I, R, A.'],
  ['Receptionist', 'Could you repeat, please?'],
  ['Carlos', 'Sure. O, L, I, V, E, I, R, A.'],
  ['Receptionist', 'Thank you. Where are you from?'],
  ['Carlos', "I'm from Brazil."],
  ['Receptionist', 'Where in your country?'],
  ['Carlos', 'Belo Horizonte.'],
  ['Receptionist', "What's your phone number?"],
  ['Carlos', "It's 31 9876 5432."],
  ['Receptionist', "And what's your email?"],
  ['Carlos', "It's carlos.oliveira@email.com."],
  ['Receptionist', 'Perfect. Your room is number nineteen. It has a double bed.'],
  ['Carlos', 'Thank you!'],
  ['Receptionist', "You're welcome!"]
];
const lado = q => q === 'Receptionist' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 6, num: 5, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ['Good evening! My first name is Carlos.', 'Good evening! My last name is Carlos.', 'Good evening! I from Carlos.'], 0, 'Boa noite! O meu primeiro nome é Carlos.'),
    prox(2, ["And where's your last name?", "And what's your last name?", "And what your last name?"], 1, 'E qual é o seu sobrenome?'),
    prox(4, ['How do you spell your first name?', 'How you spell your last name?', 'How do you spell your last name?'], 2, 'Como se soletra o seu sobrenome?'),
    prox(6, ['Could you repeat, please?', 'Could you repeat, thank you?', 'You could repeat, please?'], 0, 'Pode repetir, por favor?'),
    prox(7, ['Sure. C, A, R, L, O, S.', 'Sure. O, L, I, V, E, I, R, A.', "Sure. You're welcome."], 1, 'Claro. O, L, I, V, E, I, R, A.'),
    prox(8, ['Thank you. How are you from?', 'Thank you. Where you are from?', 'Thank you. Where are you from?'], 2, 'Obrigada. De onde você é?'),
    prox(9, ["I'm from Brazil.", "I'm Brazil.", "I from Brazilian."], 0, 'Sou do Brasil.'),
    prox(10, ['Where on your country?', 'Where in your country?', 'What in your country?'], 1, 'De onde no seu país?'),
    prox(12, ["What's your phone name?", "Where's your phone number?", "What's your phone number?"], 2, 'Qual é o seu número de telefone?'),
    prox(14, ["And what's your email?", "And where's your email?", "And what your email?"], 0, 'E qual é o seu e-mail?'),
    prox(17, ["You're welcome!", 'Thank you!', 'Please!'], 1, 'Obrigado!'),
    prox(18, ['Thank you!', 'Please!', "You're welcome!"], 2, 'De nada!'),
    { instrucao: "What's the name of the hotel?", frase: 'The ___ Hotel.', opcoes: ['Sun', 'Star', 'Globe'], certa: 0, traducao: 'O Sun Hotel.' },
    { instrucao: "What's Carlos's last name?", frase: '___', opcoes: ['Olivera', 'Oliveira', 'Oliveyra'], certa: 1, traducao: 'Oliveira.' },
    { instrucao: 'Where is Carlos from?', frase: "He's from ___.", opcoes: ['Mexico', 'Portugal', 'Brazil'], certa: 2, traducao: 'Ele é do Brasil.' },
    { instrucao: 'Where in his country?', frase: '___', opcoes: ['Belo Horizonte', 'São Paulo', 'Brasília'], certa: 0, traducao: 'Belo Horizonte.' },
    { instrucao: "What's his room number?", frase: 'Number ___.', opcoes: ['nine', 'nineteen', 'ten'], certa: 1, traducao: 'Número dezenove.' },
    { instrucao: 'What bed is in his room?', frase: 'A ___ bed.', opcoes: ['single', 'big', 'double'], certa: 2, traducao: 'Uma cama de casal.' },
    { instrucao: 'What does Carlos say after "Could you repeat, please?"', frase: '___', opcoes: ['Sure.', 'Thank you.', "You're welcome."], certa: 0, traducao: 'Claro.' },
    { instrucao: 'What is Carlos\'s email?', frase: '___', opcoes: ['oliveira.carlos@email.com', 'carlos.oliveira@email.com', 'carlos@oliveira.com'], certa: 1, traducao: 'carlos.oliveira@email.com' }
  ]
});
</script>
