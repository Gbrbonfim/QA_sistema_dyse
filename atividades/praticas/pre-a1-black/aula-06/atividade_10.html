<script>
/* Pre-A1 BLACK · Class 06 and 07 · Gramática (In a Hotel)
   To be com o vocabulário do hotel: singular (the shower IS, the remote control ISN'T) x
   plural (the towels ARE, the pillows AREN'T), perguntas (Is / Are) e short answers.
   Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 6, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'The towels ___ white.', opcoes: ['are', 'is', 'am'], certa: 0, traducao: 'As toalhas são brancas.' },
    { frase: 'The shower ___ great.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O chuveiro é ótimo.' },
    { frase: 'The pillows ___ in the room.', opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'Os travesseiros não estão no quarto.' },
    { frase: 'The remote control ___ in the room.', opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'O controle remoto não está no quarto.' },
    { frase: 'The toiletries ___ in the bathroom.', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'Os produtos de higiene estão no banheiro.' },
    { frase: 'Breakfast ___ at the bar.', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'O café da manhã é no bar.' },
    { frase: '___ the swimming pool open?', opcoes: ['Is', 'Are', 'Am'], certa: 0, traducao: 'A piscina está aberta?' },
    { frase: '___ the towels in the bathroom?', opcoes: ['Is', 'Are', 'Am'], certa: 1, traducao: 'As toalhas estão no banheiro?' },
    { frase: '___ breakfast in the room?', opcoes: ['Are', 'Am', 'Is'], certa: 2, traducao: 'O café da manhã é no quarto?' },
    { frase: 'Is the gym open? — Yes, it ___.', opcoes: ['is', 'are', "'s"], certa: 0, traducao: 'A academia está aberta? — Sim.' },
    { frase: "Are the pillows white? — No, they ___.", opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Os travesseiros são brancos? — Não.' },
    { frase: "Is the air conditioning good? — No, it ___.", opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'O ar-condicionado é bom? — Não.' },
    { frase: 'My room ___ number eleven.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'O meu quarto é o número onze.' },
    { frase: 'The reception ___ open.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'A recepção está aberta.' },
    { frase: 'Two ___, please.', opcoes: ['towel', 'towelses', 'towels'], certa: 2, traducao: 'Duas toalhas, por favor.' },
    { frase: 'A ___ bed is for one person.', opcoes: ['single', 'double', 'two'], certa: 0, traducao: 'Uma cama de solteiro é para uma pessoa.' },
    { frase: 'A ___ bed is for two people.', opcoes: ['single', 'double', 'one'], certa: 1, traducao: 'Uma cama de casal é para duas pessoas.' },
    { frase: 'You swim in the ___.', opcoes: ['gym', 'reception', 'swimming pool'], certa: 2, traducao: 'Você nada na piscina.' },
    { frase: 'Your car is in the ___.', opcoes: ['parking', 'shower', 'bar'], certa: 0, traducao: 'O seu carro está no estacionamento.' },
    { frase: 'The check-in is at the ___.', opcoes: ['gym', 'reception', 'swimming pool'], certa: 1, traducao: 'O check-in é na recepção.' },
    { frase: "The ___ isn't in the room. Where's the TV control?", opcoes: ['towel', 'pillow', 'remote control'], certa: 2, traducao: 'O controle remoto não está no quarto. Cadê o controle da TV?' },
    { frase: "It's hot! Where's the ___?", opcoes: ['air conditioning', 'breakfast', 'pillow'], certa: 0, traducao: 'Está calor! Cadê o ar-condicionado?' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ['The towels is white.', 'The towels are white.', 'The towels am white.'], certa: 1, traducao: 'As toalhas são brancas.' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ["The shower aren't good.", "The shower not good.", "The shower isn't good."], certa: 2, traducao: 'O chuveiro não é bom.' }
  ]
});
</script>
