/* Pre-A1 BLACK · Class 06 and 07 · Fala (In a Hotel)
   Alinhado ao "Reading and Writing" (perguntas da ficha do hotel), ao alfabeto e ao Speaking
   (How do you spell...? / Could you repeat, please?). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 6, num: 8, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "What's your first name?", dica: 0, traducao: 'Qual é o seu primeiro nome?' },
    { frase: "My first name is Laura.", dica: 0, traducao: 'O meu primeiro nome é Laura.' },
    { frase: "What's your last name?", dica: 0, traducao: 'Qual é o seu sobrenome?' },
    { frase: 'My last name is Silva.', dica: 0, traducao: 'O meu sobrenome é Silva.' },
    { frase: 'How do you spell your last name?', dica: 0, traducao: 'Como se soletra o seu sobrenome?' },
    { frase: 'My first name is Laura and my last name is Silva.', dica: 0, traducao: 'O meu primeiro nome é Laura e o meu sobrenome é Silva.' },
    { frase: 'Could you repeat, please?', dica: 0, traducao: 'Pode repetir, por favor?' },
    { frase: 'Sure.', dica: 0, traducao: 'Claro.' },
    { frase: 'Where are you from?', dica: 0, traducao: 'De onde você é?' },
    { frase: "I'm from Brazil.", dica: 0, traducao: 'Sou do Brasil.' },
    { frase: 'Where in your country?', dica: 0, traducao: 'De onde no seu país?' },
    { frase: 'Recife.', dica: 0, traducao: 'Recife.' },
    { frase: "What's your address?", dica: 0, traducao: 'Qual é o seu endereço?' },
    { frase: "What's your phone number?", dica: 0, traducao: 'Qual é o seu número de telefone?' },
    { frase: "What's your email?", dica: 0, traducao: 'Qual é o seu e-mail?' },
    { frase: 'How do you spell your first name?', dica: 0, traducao: 'Como se soletra o seu primeiro nome?' },
    { frase: 'My room is number nine.', dica: 0, traducao: 'O meu quarto é o número nove.' },
    { frase: 'Your room is number twelve.', dica: 0, traducao: 'O seu quarto é o número doze.' },
    { frase: 'Welcome to the hotel!', dica: 0, traducao: 'Bem-vindo ao hotel!' },
    { frase: 'Thank you very much!', dica: 0, traducao: 'Muito obrigado!' }
  ]
});
</script>
