<script>
/* Pre-A1 BLACK · Class 03 · Gramática (Guess the country!)
   "Grammar Point: To Be - Negative Form": I'm not, you aren't, he/she/it isn't, we/they
   aren't, e a correção "X isn't ... . He's ...". Conteúdo NOVO com fatos verdadeiros.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 3, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: '___ Mexican.', opcoes: ["I'm not", "I isn't", "I aren't"], certa: 0, traducao: 'Não sou mexicano.' },
    { frase: 'Neymar ___ Mexican.', opcoes: ["aren't", "isn't", "'m not"], certa: 1, traducao: 'O Neymar não é mexicano.' },
    { frase: 'BTS ___ Japanese.', opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'O BTS não é japonês.' },
    { frase: 'Sushi ___ Chinese.', opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'O sushi não é chinês.' },
    { frase: 'You ___ German.', opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Você não é alemão.' },
    { frase: 'We ___ Russian.', opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'Não somos russos.' },
    { frase: 'She ___ Canadian.', opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'Ela não é canadense.' },
    { frase: 'They ___ Filipino.', opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Eles não são filipinos.' },
    { frase: 'It ___ from Brazil.', opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'Não é do Brasil.' },
    { frase: 'Tacos ___ Indian.', opcoes: ["aren't", "isn't", "'m not"], certa: 0, traducao: 'Os tacos não são indianos.' },
    { frase: 'He ___ twenty years old.', opcoes: ["aren't", "isn't", "'m not"], certa: 1, traducao: 'Ele não tem vinte anos.' },
    { frase: 'Justin Bieber and Celine Dion ___ American.', opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'O Justin Bieber e a Celine Dion não são americanos.' },
    { frase: "Jackie Chan isn't Japanese. ___ Chinese.", opcoes: ["He's", "She's", "It's"], certa: 0, traducao: 'O Jackie Chan não é japonês. Ele é chinês.' },
    { frase: "Heidi Klum isn't Russian. ___ German.", opcoes: ["He's", "She's", "They're"], certa: 1, traducao: 'A Heidi Klum não é russa. Ela é alemã.' },
    { frase: "Pizza isn't German. ___ Italian.", opcoes: ["She's", "They're", "It's"], certa: 2, traducao: 'A pizza não é alemã. É italiana.' },
    { frase: "Tacos aren't Chinese. ___ Mexican.", opcoes: ["They're", "It's", "He's"], certa: 0, traducao: 'Os tacos não são chineses. São mexicanos.' },
    { frase: "I'm not Japanese. I'm ___.", opcoes: ['Japanese', 'Chinese', 'Japan'], certa: 1, traducao: 'Não sou japonês. Sou chinês.' },
    { frase: 'The full form of "isn\'t" is ___.', opcoes: ['are not', 'am not', 'is not'], certa: 2, traducao: 'A forma completa de "isn\'t" é "is not".' },
    { frase: 'The full form of "aren\'t" is ___.', opcoes: ['are not', 'is not', 'am not'], certa: 0, traducao: 'A forma completa de "aren\'t" é "are not".' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ["I amn't Russian.", "I'm not Russian.", "I isn't Russian."], certa: 1, traducao: 'Não sou russo.' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ["Salma Hayek aren't Brazilian.", "Salma Hayek not Brazilian.", "Salma Hayek isn't Brazilian."], certa: 2, traducao: 'A Salma Hayek não é brasileira.' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ["We aren't from Finland.", "We isn't from Finland.", "We not from Finland."], certa: 0, traducao: 'Não somos da Finlândia.' },
    { frase: 'Is Taylor Swift Canadian? — No, she ___.', opcoes: ["aren't", "isn't", "'m not"], certa: 1, traducao: 'A Taylor Swift é canadense? — Não.' },
    { frase: 'Are BTS Chinese? — No, they ___.', opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'O BTS é chinês? — Não.' }
  ]
});
</script>
