<body>

<script>
/* Pre-A1 BLACK · Class 01 and 02 · Escuta (Meet a pop group)
   Alinhado ao "Vocabulary: Numbers 1-20" e ao "How old are you? I'm ... years old.".
   Conteúdo NOVO: o aluno ouve a idade ou o número e escolhe o número certo. As iscas são
   números de som parecido, só de 1 a 20 (thirteen x three, fourteen x four...).
   24 questões. */
let n = 0;
const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 4;
  const ns = iscas.slice(0, 3);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(x => ({ label: String(x), icon: 'tag' })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 1, num: 2, tipo: 'imagem',
  instrucao: 'Listen and choose the right number',
  itens: [
    q("I'm thirteen years old.", 13, [3, 20, 14]),
    q("She's fifteen years old.", 15, [5, 16, 6]),
    q("He's twelve years old.", 12, [2, 20, 11]),
    q("I'm eighteen.", 18, [8, 17, 19]),
    q('Number seven.', 7, [11, 17, 6]),
    q("They're sixteen years old.", 16, [6, 15, 19]),
    q('Number four.', 4, [14, 5, 9]),
    q("I'm nineteen years old.", 19, [9, 18, 20]),
    q("She's eleven.", 11, [7, 12, 1]),
    q('Number twenty.', 20, [12, 2, 10]),
    q("He's fourteen years old.", 14, [4, 10, 13]),
    q('Number eight.', 8, [18, 6, 3]),
    q("We're seventeen years old.", 17, [7, 16, 11]),
    q('Number three.', 3, [13, 8, 2]),
    q("I'm ten years old.", 10, [20, 12, 11]),
    q('Number nine.', 9, [19, 5, 1]),
    q("You're sixteen.", 16, [6, 14, 17]),
    q('Number five.', 5, [15, 9, 4]),
    q("He's nineteen.", 19, [9, 17, 18]),
    q('Number one.', 1, [11, 7, 9]),
    q("She's twelve.", 12, [2, 20, 13]),
    q('Number six.', 6, [16, 7, 2]),
    q("I'm fifteen.", 15, [5, 14, 16]),
    q('Number two.', 2, [12, 20, 3])
  ]
});
</script>
</body>
