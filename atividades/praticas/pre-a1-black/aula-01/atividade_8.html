    { frase: "You're seventeen years old.", dica: 0, traducao: 'Você tem dezessete anos.' },
    { frase: "It's a pop group from Korea.", dica: 0, traducao: 'É uma banda pop da Coreia.' },
    { frase: "She's a top model.", dica: 0, traducao: 'Ela é top model.' },
    { frase: "He's a designer from China.", dica: 0, traducao: 'Ele é um designer da China.' },
    { frase: "They're pop stars.", dica: 0, traducao: 'Eles são pop stars.' },
    { frase: "We're eighteen years old.", dica: 0, traducao: 'Temos dezoito anos.' },
    { frase: "She's fifteen.", dica: 0, traducao: 'Ela tem quinze anos.' },
    { frase: "He's twelve.", dica: 0, traducao: 'Ele tem doze anos.' },
    { frase: "It's a hamburger.", dica: 0, traducao: 'É um hambúrguer.' },

    { frase: "You're from Mexico.", dica: 0, traducao: 'Você é do México.' },
    { frase: "They're nineteen years old.", dica: 0, traducao: 'Eles têm dezenove anos.' }
