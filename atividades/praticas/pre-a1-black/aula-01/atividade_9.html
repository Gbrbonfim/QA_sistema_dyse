<script>
/* Pre-A1 BLACK · Class 01 and 02 · Gramática (Meet a pop group)
   Alinhado ao "Grammar Point: To Be Affirmative": I'm, you're, he's, she's, it's, we're,
   they're (contrações). Conteúdo NOVO com outras pessoas. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 1, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: "Hello! I___ Bruna.", opcoes: ["'m", "'s", "'re"], certa: 0, traducao: 'Olá! Sou a Bruna.' },
    { frase: "Diego is my friend. He___ from Mexico.", opcoes: ["'re", "'s", "'m"], certa: 1, traducao: 'O Diego é meu amigo. Ele é do México.' },
    { frase: "We___ from Russia.", opcoes: ["'s", "'m", "'re"], certa: 2, traducao: 'Somos da Rússia.' },
    { frase: "It___ a hamburger.", opcoes: ["'s", "'re", "'m"], certa: 0, traducao: 'É um hambúrguer.' },
    { frase: "They___ from Finland.", opcoes: ["'s", "'re", "'m"], certa: 1, traducao: 'Eles são da Finlândia.' },
    { frase: "You___ twelve years old.", opcoes: ["'m", "'s", "'re"], certa: 2, traducao: 'Você tem doze anos.' },
    { frase: "She___ a designer.", opcoes: ["'s", "'re", "'m"], certa: 0, traducao: 'Ela é designer.' },
    { frase: "I___ from the Philippines.", opcoes: ["'s", "'m", "'re"], certa: 1, traducao: 'Sou das Filipinas.' },
    { frase: "Jin and Hana ___ pop stars.", opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'O Jin e a Hana são pop stars.' },
    { frase: 'Priya ___ from India.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'A Priya é da Índia.' },
    { frase: 'I ___ fourteen years old.', opcoes: ['is', 'am', 'are'], certa: 1, traducao: 'Tenho catorze anos.' },
    { frase: 'Mike and I ___ from Canada.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'O Mike e eu somos do Canadá.' },
    { frase: 'Lucas ___ seventeen.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'O Lucas tem dezessete anos.' },
    { frase: 'You and Ana ___ from Brazil.', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'Você e a Ana são do Brasil.' },
    { frase: 'Star Five ___ a pop group.', opcoes: ['am', 'are', 'is'], certa: 2, traducao: 'A Star Five é uma banda pop.' },
    { frase: "I'm Ivan. I'm ___ Russia.", opcoes: ['from', 'is', 'of the'], certa: 0, traducao: 'Sou o Ivan. Sou da Rússia.' },
    { frase: "She's sixteen ___.", opcoes: ['years', 'years old', 'old years'], certa: 1, traducao: 'Ela tem dezesseis anos.' },
    { frase: "I ___ eighteen. (eu tenho 18 anos)", opcoes: ['have', 'has', "'m"], certa: 2, traducao: 'Tenho dezoito anos.' },
    { frase: '___ your name?', opcoes: ["What's", "Where's", "How's"], certa: 0, traducao: 'Qual é o seu nome?' },
    { frase: '___ are you from?', opcoes: ['What', 'Where', 'How'], certa: 1, traducao: 'De onde você é?' },
    { frase: '___ old are you?', opcoes: ['What', 'Where', 'How'], certa: 2, traducao: 'Quantos anos você tem?' },
    { frase: 'The full form of "they\'re" is ___.', opcoes: ['they are', 'they is', 'they am'], certa: 0, traducao: 'A forma completa de "they\'re" é "they are".' },
    { frase: 'The full form of "she\'s" is ___.', opcoes: ['she are', 'she is', 'she am'], certa: 1, traducao: 'A forma completa de "she\'s" é "she is".' },
    { frase: 'The full form of "I\'m" is ___.', opcoes: ['I is', 'I are', 'I am'], certa: 2, traducao: 'A forma completa de "I\'m" é "I am".' }
  ]
});
</script>
