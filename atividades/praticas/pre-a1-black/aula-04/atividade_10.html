<script>
/* Pre-A1 BLACK · Class 04 · Gramática (Changing nationalities?)
   Short answers do slide: Yes, I am. / No, I'm not. / Yes, you are. / No, you aren't. / Yes,
   he/she/it is. / No, he/she/it isn't. / Yes, we/they are. / No, we/they aren't. Conteúdo
   NOVO com fatos verdadeiros. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 4, num: 10, tipo: 'escolha',
  instrucao: 'Complete the short answer',
  itens: [
    { frase: 'Are you Brazilian? — Yes, I ___.', opcoes: ['am', 'is', 'are'], certa: 0, traducao: 'Você é brasileiro? — Sim.' },
    { frase: 'Is Neymar Brazilian? — Yes, he ___.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O Neymar é brasileiro? — Sim.' },
    { frase: 'Are tacos Japanese? — No, they ___.', opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'Os tacos são japoneses? — Não.' },
    { frase: 'Is sushi Chinese? — No, it ___.', opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'O sushi é chinês? — Não.' },
    { frase: 'Am I late? — No, you ___.', opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Estou atrasado? — Não.' },
    { frase: 'Are you from Canada? — No, I ___.', opcoes: ["isn't", "aren't", "'m not"], certa: 2, traducao: 'Você é do Canadá? — Não.' },
    { frase: 'Is Taylor Swift Canadian? — No, ___.', opcoes: ["she isn't", "he isn't", "it isn't"], certa: 0, traducao: 'A Taylor Swift é canadense? — Não.' },
    { frase: 'Is Lionel Messi Argentinian? — Yes, ___.', opcoes: ['she is', 'he is', 'it is'], certa: 1, traducao: 'O Lionel Messi é argentino? — Sim.' },
    { frase: 'Is pizza Italian? — Yes, ___.', opcoes: ['he is', 'she is', 'it is'], certa: 2, traducao: 'A pizza é italiana? — Sim.' },
    { frase: 'Are BTS South Korean? — Yes, ___.', opcoes: ['they are', 'he is', 'we are'], certa: 0, traducao: 'O BTS é sul-coreano? — Sim.' },
    { frase: 'Are you and Ana in class one? — Yes, ___.', opcoes: ['they are', 'we are', 'you are'], certa: 1, traducao: 'Você e a Ana estão na turma 1? — Sim.' },
    { frase: 'Is Heidi Klum Russian? — No, she ___.', opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'A Heidi Klum é russa? — Não.' },
    { frase: 'Is Cristiano Ronaldo Spanish? — No, he isn\'t. He\'s ___.', opcoes: ['Portuguese', 'Portugal', 'Spanish'], certa: 0, traducao: 'O Cristiano Ronaldo é espanhol? — Não. Ele é português.' },
    { frase: 'Is Drake American? — No, he isn\'t. He\'s ___ Toronto.', opcoes: ['Canadian', 'from', 'in Canadian'], certa: 1, traducao: 'O Drake é americano? — Não. Ele é de Toronto.' },
    { frase: 'Are Pepe and Deco Portuguese? — Yes, they ___.', opcoes: ["'re", 'is', 'are'], certa: 2, traducao: 'O Pepe e o Deco são portugueses? — Sim.' },
    { frase: 'Is Jackie Chan from Hong Kong? — Yes, he ___.', opcoes: ['is', "'s", 'are'], certa: 0, traducao: 'O Jackie Chan é de Hong Kong? — Sim.' },
    { frase: 'Is Anitta Mexican? — No, ___.', opcoes: ["she aren't", "she isn't", "she not"], certa: 1, traducao: 'A Anitta é mexicana? — Não.' },
    { frase: 'Are you Japanese? — Yes, ___.', opcoes: ["I'm", 'I is', 'I am'], certa: 2, traducao: 'Você é japonês? — Sim.' },
    { frase: 'Are Justin Bieber and Drake Canadian? — ___', opcoes: ['Yes, they are.', "No, they aren't.", 'Yes, he is.'], certa: 0, traducao: 'O Justin Bieber e o Drake são canadenses? — Sim.' },
    { frase: 'Is Salma Hayek Brazilian? — ___', opcoes: ['Yes, she is.', "No, she isn't.", "No, he isn't."], certa: 1, traducao: 'A Salma Hayek é brasileira? — Não.' },
    { frase: 'Is Toyota Japanese? — ___', opcoes: ["No, it isn't.", 'Yes, he is.', 'Yes, it is.'], certa: 2, traducao: 'A Toyota é japonesa? — Sim.' },
    { frase: 'Are Lady Gaga and Beyoncé English? — ___', opcoes: ["No, they aren't.", 'Yes, they are.', "No, she isn't."], certa: 0, traducao: 'A Lady Gaga e a Beyoncé são inglesas? — Não.' },
    { frase: 'Is Shohei Ohtani Japanese? — ___', opcoes: ["No, he isn't.", 'Yes, he is.', 'Yes, she is.'], certa: 1, traducao: 'O Shohei Ohtani é japonês? — Sim.' },
    { frase: 'Is Maria Sharapova from Russia? — ___', opcoes: ["No, she isn't.", 'Yes, it is.', 'Yes, she is.'], certa: 2, traducao: 'A Maria Sharapova é da Rússia? — Sim.' }
  ]
});
