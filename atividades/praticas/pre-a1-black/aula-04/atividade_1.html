/* Pre-A1 BLACK · Class 04 · Escuta (Changing nationalities?)

const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 4;
  const ns = iscas.slice(0, 3);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(c => ({ label: c, icon: /^Yes/.test(c) ? 'check_circle' : 'cancel' })), certa: pos };
};

    q('Is Neymar Brazilian?', 'Yes, he is.', ["No, he isn't.", 'Yes, she is.', 'Yes, they are.']),

    q('Is Toyota South Korean?', "No, it isn't.", ['Yes, it is.', "No, he isn't.", "No, they aren't."]),
