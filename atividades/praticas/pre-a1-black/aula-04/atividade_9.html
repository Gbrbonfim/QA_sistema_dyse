<script>
/* Pre-A1 BLACK · Class 04 · Gramática (Changing nationalities?)
   "Grammar Point: To Be - Interrogative Form": Am I...? / Are you...? / Is he/she/it...? /
   Are we/they...? e quando usar "from" (país/cidade) ou não (nacionalidade). Conteúdo NOVO
   com fatos verdadeiros. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 4, num: 9, tipo: 'escolha',
  instrucao: 'Complete the question',
  itens: [
    { frase: '___ I late?', opcoes: ['Am', 'Is', 'Are'], certa: 0, traducao: 'Estou atrasado?' },
    { frase: '___ you Spanish?', opcoes: ['Is', 'Are', 'Am'], certa: 1, traducao: 'Você é espanhol?' },
    { frase: '___ Neymar Brazilian?', opcoes: ['Are', 'Am', 'Is'], certa: 2, traducao: 'O Neymar é brasileiro?' },
    { frase: '___ sushi Japanese?', opcoes: ['Is', 'Are', 'Am'], certa: 0, traducao: 'O sushi é japonês?' },
    { frase: '___ BTS South Korean?', opcoes: ['Is', 'Are', 'Am'], certa: 1, traducao: 'O BTS é sul-coreano?' },
    { frase: '___ we in class one?', opcoes: ['Is', 'Am', 'Are'], certa: 2, traducao: 'Estamos na turma 1?' },
    { frase: '___ she from Mumbai?', opcoes: ['Is', 'Are', 'Am'], certa: 0, traducao: 'Ela é de Mumbai?' },
    { frase: '___ tacos Mexican?', opcoes: ['Is', 'Are', 'Am'], certa: 1, traducao: 'Os tacos são mexicanos?' },
    { frase: '___ it from China?', opcoes: ['Are', 'Am', 'Is'], certa: 2, traducao: 'É da China?' },
    { frase: '___ Lady Gaga and Beyoncé American?', opcoes: ['Are', 'Is', 'Am'], certa: 0, traducao: 'A Lady Gaga e a Beyoncé são americanas?' },
    { frase: '___ your teacher Canadian?', opcoes: ['Are', 'Is', 'Am'], certa: 1, traducao: 'A sua professora é canadense?' },
    { frase: '___ Pepe and Deco from Brazil?', opcoes: ['Is', 'Am', 'Are'], certa: 2, traducao: 'O Pepe e o Deco são do Brasil?' },
    { frase: 'Is Drake ___ Toronto?', opcoes: ['from', 'is', '– (nothing)'], certa: 0, traducao: 'O Drake é de Toronto?' },
    { frase: 'Is Cristiano Ronaldo ___ Portuguese?', opcoes: ['from', '– (nothing)', 'of'], certa: 1, traducao: 'O Cristiano Ronaldo é português?' },
    { frase: 'Are you ___ Canada?', opcoes: ['– (nothing)', 'of', 'from'], certa: 2, traducao: 'Você é do Canadá?' },
    { frase: 'Is she ___ Argentinian?', opcoes: ['– (nothing)', 'from', 'of'], certa: 0, traducao: 'Ela é argentina?' },
    { frase: 'Are they ___ Tokyo?', opcoes: ['– (nothing)', 'from', 'of'], certa: 1, traducao: 'Eles são de Tóquio?' },
    { frase: 'Are we ___ class one?', opcoes: ['from', '– (nothing)', 'in'], certa: 2, traducao: 'Estamos na turma 1?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Is Messi Argentinian?', 'Is Messi from Argentinian?', 'Are Messi Argentinian?'], certa: 0, traducao: 'O Messi é argentino?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Are he from Brazil?', 'Is he from Brazil?', 'Is he Brazil?'], certa: 1, traducao: 'Ele é do Brasil?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Is you German?', 'Am you German?', 'Are you German?'], certa: 2, traducao: 'Você é alemão?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Are they from London?', 'Is they from London?', 'Are they London?'], certa: 0, traducao: 'Eles são de Londres?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Is I late?', 'Am I late?', 'Are I late?'], certa: 1, traducao: 'Estou atrasado?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Is Anitta from Rio?', 'Is Anitta Rio?', 'Are Anitta from Rio?'], certa: 0, traducao: 'A Anitta é do Rio?' }
  ]
});
</script>
