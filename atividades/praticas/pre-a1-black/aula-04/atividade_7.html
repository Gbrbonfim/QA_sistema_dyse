/* Pre-A1 BLACK · Class 04 · Fala (Changing nationalities?)
   Alinhado ao "Grammar Point: To Be - Interrogative Form" e ao "Speaking and Writing"
   (perguntar sobre famosos com Is...? / Are...?), com entonação de pergunta yes/no. Conteúdo
   NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-pre-a1-black', aula: 4, num: 7, tipo: 'fala',
  instrucao: 'Listen and record the whole question',
  itens: [
    { frase: 'Am I late?', dica: 0, traducao: 'Estou atrasado?' },
    { frase: 'Are you Spanish?', dica: 0, traducao: 'Você é espanhol?' },
    { frase: 'Is he from Brazil?', dica: 0, traducao: 'Ele é do Brasil?' },
    { frase: 'Is she Argentinian?', dica: 0, traducao: 'Ela é argentina?' },
    { frase: 'Is it from China?', dica: 0, traducao: 'É da China?' },
    { frase: 'Are we in class one?', dica: 0, traducao: 'Estamos na turma 1?' },
    { frase: 'Are they from Chicago?', dica: 0, traducao: 'Eles são de Chicago?' },
    { frase: 'Is Neymar Brazilian?', dica: 0, traducao: 'O Neymar é brasileiro?' },
    { frase: 'Is Lionel Messi Italian?', dica: 0, traducao: 'O Lionel Messi é italiano?' },
    { frase: 'Is Cristiano Ronaldo Portuguese?', dica: 0, traducao: 'O Cristiano Ronaldo é português?' },
    { frase: 'Are BTS South Korean?', dica: 0, traducao: 'O BTS é sul-coreano?' },
    { frase: 'Is Anitta from Rio de Janeiro?', dica: 0, traducao: 'A Anitta é do Rio de Janeiro?' },
    { frase: 'Is sushi Japanese?', dica: 0, traducao: 'O sushi é japonês?' },
    { frase: 'Are tacos Mexican?', dica: 0, traducao: 'Os tacos são mexicanos?' },
    { frase: 'Is Drake from Toronto?', dica: 0, traducao: 'O Drake é de Toronto?' },
    { frase: 'Are you from London?', dica: 0, traducao: 'Você é de Londres?' },
    { frase: 'Is your teacher Canadian?', dica: 0, traducao: 'A sua professora é canadense?' },
    { frase: 'Are Lady Gaga and Beyoncé American?', dica: 0, traducao: 'A Lady Gaga e a Beyoncé são americanas?' },
    { frase: 'Is Jackie Chan from Hong Kong?', dica: 0, traducao: 'O Jackie Chan é de Hong Kong?' },
    { frase: 'Are Pepe and Deco from Brazil?', dica: 0, traducao: 'O Pepe e o Deco são do Brasil?' }
  ]
});
