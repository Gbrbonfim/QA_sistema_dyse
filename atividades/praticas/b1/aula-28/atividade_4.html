<script>
/* B1 · Class 28 · Fala (Same Here!)
   Alinhado ao Warm Up, ao Reading (evento para fazer amigos) e ao "Grammar Point" e
   Speaking (So / Neither + auxiliar + comentário curto). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 28, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Is it easy or difficult to make friends as an adult?', dica: 0, traducao: 'É fácil ou difícil fazer amigos quando se é adulto?' },
    { frase: 'Where can people make new friends today?', dica: 0, traducao: 'Onde as pessoas podem fazer novos amigos hoje?' },
    { frase: 'Would you join an event to meet new friends?', dica: 0, traducao: 'Você participaria de um evento para conhecer novos amigos?' },
    { frase: 'Hi, nice to meet you. Is this your first time here?', dica: 0, traducao: 'Oi, prazer. É a sua primeira vez aqui?' },
    { frase: 'So do I. I love parties too.', dica: 0, traducao: 'Eu também. Também adoro festas.' },
    { frase: 'Neither do I. I prefer quiet places.', dica: 0, traducao: 'Eu também não. Prefiro lugares tranquilos.' },
    { frase: "So am I. It's my first time.", dica: 0, traducao: 'Eu também. É a minha primeira vez.' },
    { frase: "Neither am I. I'm a bit shy.", dica: 0, traducao: 'Eu também não. Sou um pouco tímido.' },
    { frase: 'So can I. I play every weekend.', dica: 0, traducao: 'Eu também. Toco todo fim de semana.' },
    { frase: 'Neither can I. I never learned.', dica: 0, traducao: 'Eu também não. Nunca aprendi.' },
    { frase: "I'm having a great time here.", dica: 0, traducao: 'Estou me divertindo muito aqui.' },
    { frase: 'I usually go to the gym after work.', dica: 0, traducao: 'Normalmente vou à academia depois do trabalho.' },
    { frase: "I don't have many free evenings.", dica: 0, traducao: 'Não tenho muitas noites livres.' },
    { frase: "I'm not very good at small talk.", dica: 0, traducao: 'Não sou muito bom de papo.' },
    { frase: 'The event starts at two in the afternoon.', dica: 0, traducao: 'O evento começa às duas da tarde.' },
    { frase: "There will be snacks, so you don't need to bring food.", dica: 0, traducao: 'Vai ter lanches, então você não precisa levar comida.' },
    { frase: 'Icebreakers help people feel comfortable.', dica: 0, traducao: 'As dinâmicas quebra-gelo ajudam as pessoas a se sentirem à vontade.' },
    { frase: "It isn't a romantic event. It's for making friends.", dica: 0, traducao: 'Não é um evento romântico. É para fazer amigos.' },
    { frase: 'You can email the library to register.', dica: 0, traducao: 'Você pode mandar um e-mail para a biblioteca para se inscrever.' },
    { frase: 'We have a lot in common!', dica: 0, traducao: 'Temos muito em comum!' }
  ]
});
</script>
