/* B1 · Class 29 · Fala (Same Here!)
   Alinhado ao "Grammar Point" (So / Neither com did, was, would, have, will), ao Speaking
   (reagir na hora + comentário curto), ao vocabulário de semelhanças e ao Listening da
   psicóloga. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 28, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'So did I. It was really fun.', dica: 0, traducao: 'Eu também. Foi muito divertido.' },
    { frase: 'Neither did I. I finished early.', dica: 0, traducao: 'Eu também não. Terminei cedo.' },
    { frase: 'So was I. I was very nervous too.', dica: 0, traducao: 'Eu também. Também estava muito nervoso.' },
    { frase: "Neither was I. I was at work.", dica: 0, traducao: 'Eu também não. Estava no trabalho.' },
    { frase: 'So would I. I love travelling.', dica: 0, traducao: 'Eu também. Adoro viajar.' },
    { frase: 'Neither would I. I prefer relaxed places.', dica: 0, traducao: 'Eu também não. Prefiro lugares descontraídos.' },
    { frase: 'So have I. It was amazing.', dica: 0, traducao: 'Eu também. Foi incrível.' },
    { frase: "Neither have I. I'd like to try it.", dica: 0, traducao: 'Eu também não. Gostaria de experimentar.' },
    { frase: "So will I. I'm very hungry.", dica: 0, traducao: 'Eu também. Estou com muita fome.' },
    { frase: 'My sister and I look like each other.', dica: 0, traducao: 'A minha irmã e eu somos parecidas.' },
    { frase: 'We both enjoy talking about everyday topics.', dica: 0, traducao: 'Nós dois gostamos de conversar sobre o dia a dia.' },
    { frase: 'I have the same hobbies as my best friend.', dica: 0, traducao: 'Tenho os mesmos hobbies que o meu melhor amigo.' },
    { frase: "We're not identical, but we're very similar.", dica: 0, traducao: 'Não somos idênticos, mas somos muito parecidos.' },
    { frase: "She's very different from her brother.", dica: 0, traducao: 'Ela é muito diferente do irmão.' },
    { frase: 'We have a lot in common.', dica: 0, traducao: 'Temos muito em comum.' },
    { frase: 'Adults are busy, so making friends takes time.', dica: 0, traducao: 'Os adultos são ocupados, então fazer amigos leva tempo.' },
    { frase: 'Talking about everyday things helps people connect.', dica: 0, traducao: 'Conversar sobre o dia a dia ajuda as pessoas a se conectarem.' },
    { frase: 'Listening carefully helps friendships grow.', dica: 0, traducao: 'Ouvir com atenção ajuda as amizades a crescer.' },
    { frase: "Friends don't need to have the same personality.", dica: 0, traducao: 'Os amigos não precisam ter a mesma personalidade.' },
    { frase: 'Tell me one similarity and one difference.', dica: 0, traducao: 'Me diga uma semelhança e uma diferença.' }
  ]
});
</script>
