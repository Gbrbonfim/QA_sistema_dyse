<script>
/* B1 · Class 13 · Fala (Campaign Catastrophes)
   Alinhado ao "Fix The Failed Campaign" (What went wrong / What the company is doing now /
   What they will do next) e à tabela de tempos verbais. Conteúdo NOVO (empresas FICTÍCIAS).
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 12, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Our company sells sports clothes.', dica: 0, traducao: 'A nossa empresa vende roupas esportivas.' },
    { frase: 'We usually make two ads every year.', dica: 0, traducao: 'Normalmente fazemos dois anúncios por ano.' },
    { frase: 'They launched the new ad last month.', dica: 0, traducao: 'Eles lançaram o anúncio novo no mês passado.' },
    { frase: "The company didn't test the product first.", dica: 0, traducao: 'A empresa não testou o produto antes.' },
    { frase: 'People were sharing bad reviews online.', dica: 0, traducao: 'As pessoas estavam compartilhando avaliações ruins na internet.' },
    { frase: 'We were filming when it started to rain.', dica: 0, traducao: 'Estávamos filmando quando começou a chover.' },
    { frase: 'The company has lost many customers.', dica: 0, traducao: 'A empresa perdeu muitos clientes.' },
    { frase: 'The video has gone viral, but not in a good way.', dica: 0, traducao: 'O vídeo viralizou, mas não de um jeito bom.' },
    { frase: 'They are working with a new team now.', dica: 0, traducao: 'Eles estão trabalhando com uma equipe nova agora.' },
    { frase: "We're planning a new campaign at the moment.", dica: 0, traducao: 'Estamos planejando uma campanha nova no momento.' },
    { frase: "We're going to change the slogan.", dica: 0, traducao: 'Vamos mudar o slogan.' },
    { frase: "We'll listen to our customers, we promise.", dica: 0, traducao: 'Vamos ouvir os nossos clientes, prometemos.' },
    { frase: "I'm sure the new ad will be a success.", dica: 0, traducao: 'Tenho certeza de que o anúncio novo vai ser um sucesso.' },
    { frase: 'Does your team often talk about ads?', dica: 0, traducao: 'A sua equipe fala sobre propaganda com frequência?' },
    { frase: 'Did you see the commercial last night?', dica: 0, traducao: 'Você viu o comercial ontem à noite?' },
    { frase: 'Have you ever seen an ad for that brand?', dica: 0, traducao: 'Você já viu um anúncio dessa marca?' },
    { frase: 'What are you going to show at the meeting?', dica: 0, traducao: 'O que você vai mostrar na reunião?' },
    { frase: 'Were you at the client meeting yesterday?', dica: 0, traducao: 'Você estava na reunião com o cliente ontem?' },
    { frase: 'Has the campaign gone viral yet?', dica: 0, traducao: 'A campanha já viralizou?' },
    { frase: 'Who do you think will lead the next campaign?', dica: 0, traducao: 'Quem você acha que vai liderar a próxima campanha?' }
  ]
});
</script>
