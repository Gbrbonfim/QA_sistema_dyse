<script>
/* B1 · Class 13 · Gramática (Campaign Catastrophes)
   Alinhado ao "Review Of Verb Tenses": tabela (tempo, exemplo, uso) e "Complete the sentences
   with ONE word" (Does, Did, Have, Has, Was, Were, are, will). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 12, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: '___ your company sell clothes?', opcoes: ['Does', 'Do', 'Is'], certa: 0, traducao: 'A sua empresa vende roupas?' },
    { frase: '___ you watch the game last night?', opcoes: ['Do', 'Did', 'Have'], certa: 1, traducao: 'Você assistiu ao jogo ontem à noite?' },
    { frase: '___ you ever tried Japanese food?', opcoes: ['Did', 'Do', 'Have'], certa: 2, traducao: 'Você já experimentou comida japonesa?' },
    { frase: '___ the new ad already gone viral?', opcoes: ['Has', 'Have', 'Is'], certa: 0, traducao: 'O anúncio novo já viralizou?' },
    { frase: '___ it raining when you left home?', opcoes: ['Were', 'Was', 'Did'], certa: 1, traducao: 'Estava chovendo quando você saiu de casa?' },
    { frase: '___ they at the party on Saturday?', opcoes: ['Was', 'Did', 'Were'], certa: 2, traducao: 'Eles estavam na festa no sábado?' },
    { frase: 'What ___ you going to do after class?', opcoes: ['are', 'will', 'do'], certa: 0, traducao: 'O que você vai fazer depois da aula?' },
    { frase: 'Who do you think ___ win the game?', opcoes: ['does', 'will', 'did'], certa: 1, traducao: 'Quem você acha que vai ganhar o jogo?' },
    { frase: '___ your sister usually work on Saturdays?', opcoes: ['Do', 'Is', 'Does'], certa: 2, traducao: 'A sua irmã costuma trabalhar aos sábados?' },
    { frase: 'We ___ a new product every year.', opcoes: ['launch', 'launching', 'are launch'], certa: 0, traducao: 'Lançamos um produto novo todo ano.' },
    { frase: 'Look! They ___ the new commercial right now.', opcoes: ['film', 'are filming', 'filmed'], certa: 1, traducao: 'Olha! Eles estão gravando o comercial novo agora.' },
    { frase: 'The company ___ the slogan in 2019.', opcoes: ['has changed', 'is changing', 'changed'], certa: 2, traducao: 'A empresa mudou o slogan em 2019.' },
    { frase: 'I ___ dinner when you called.', opcoes: ['was cooking', 'cooked', 'am cooking'], certa: 0, traducao: 'Eu estava fazendo o jantar quando você ligou.' },
    { frase: "We ___ lost many customers since the ad came out.", opcoes: ['are', 'have', 'were'], certa: 1, traducao: 'Perdemos muitos clientes desde que o anúncio saiu.' },
    { frase: "Don't worry. ___ help you with the report.", opcoes: ['I am', 'I helping', "I'll"], certa: 2, traducao: 'Não se preocupe. Eu te ajudo com o relatório.' },
    { frase: "We ___ going to open a new shop in May. It's all planned.", opcoes: ['are', 'will', 'does'], certa: 0, traducao: 'Vamos abrir uma loja nova em maio. Está tudo planejado.' },
    { frase: 'The present simple is for ___.', opcoes: ['something that finished', 'what happens regularly', 'future plans'], certa: 1, traducao: 'O present simple é para o que acontece regularmente.' },
    { frase: 'The past continuous is for ___.', opcoes: ['future promises', 'what happens regularly', 'what was happening at a past time'], certa: 2, traducao: 'O past continuous é para o que estava acontecendo num momento do passado.' },
    { frase: 'The present perfect is for ___.', opcoes: ['a past result that matters now', 'what is happening now', 'future offers'], certa: 0, traducao: 'O present perfect é para um resultado passado que importa agora.' },
    { frase: '"Be going to" is for ___.', opcoes: ['something that finished', 'future plans or decisions', 'what happens regularly'], certa: 1, traducao: '"Be going to" é para planos ou decisões futuras.' },
    { frase: '"Will / won\'t" is for ___.', opcoes: ['what was happening at a past time', 'something that finished', 'future offers or promises'], certa: 2, traducao: '"Will / won\'t" é para ofertas ou promessas futuras.' },
    { frase: 'They launched the ad last month. This sentence talks about ___.', opcoes: ['the past', 'the present', 'the future'], certa: 0, traducao: 'Eles lançaram o anúncio no mês passado. A frase fala do passado.' },
    { frase: "The agency is presenting their idea tomorrow. This sentence talks about ___.", opcoes: ['the past', 'the future', 'every day'], certa: 1, traducao: 'A agência vai apresentar a ideia amanhã. A frase fala do futuro.' },
    { frase: 'You work with global clients. This sentence talks about ___.', opcoes: ['the past', 'the future', 'the present'], certa: 2, traducao: 'Você trabalha com clientes do mundo todo. A frase fala do presente.' }
  ]
});
</script>
</body>
</html>
