<script>
/* B1 · Class 12 · Fala (Campaign Catastrophes)
   Alinhado ao "Speaking" (pretended, realized, library, sensible, argument, discussion, doubts,
   questions), ao "Talking Point" e aos falsos cognatos. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 12, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "Actually, I've never been to London.", dica: 0, traducao: 'Na verdade, nunca fui a Londres.' },
    { frase: "At the moment, I'm studying English and Spanish.", dica: 0, traducao: 'No momento, estou estudando inglês e espanhol.' },
    { frase: 'I pretended to like the gift.', dica: 0, traducao: 'Fingi que gostei do presente.' },
    { frase: 'I intend to visit my grandparents next month.', dica: 0, traducao: 'Pretendo visitar os meus avós no mês que vem.' },
    { frase: "I didn't realize the shop was closed.", dica: 0, traducao: 'Não percebi que a loja estava fechada.' },
    { frase: 'I usually borrow books from the library.', dica: 0, traducao: 'Normalmente pego livros emprestados na biblioteca.' },
    { frase: 'There is a nice bookshop near my house.', dica: 0, traducao: 'Tem uma livraria legal perto da minha casa.' },
    { frase: 'It was a sensible idea to save money.', dica: 0, traducao: 'Foi uma ideia sensata economizar dinheiro.' },
    { frase: 'My sister is very sensitive about her hair.', dica: 0, traducao: 'A minha irmã é muito sensível em relação ao cabelo.' },
    { frase: 'We had an argument about money.', dica: 0, traducao: 'Tivemos uma briga por causa de dinheiro.' },
    { frase: 'We had a good discussion about the project.', dica: 0, traducao: 'Tivemos uma boa conversa sobre o projeto.' },
    { frase: 'Can I ask you a question?', dica: 0, traducao: 'Posso te fazer uma pergunta?' },
    { frase: 'I have some doubts about buying a new phone.', dica: 0, traducao: 'Tenho algumas dúvidas sobre comprar um celular novo.' },
    { frase: 'Translation mistakes can be very expensive.', dica: 0, traducao: 'Erros de tradução podem sair muito caros.' },
    { frase: "A message that works in one country can be offensive in another.", dica: 0, traducao: 'Uma mensagem que funciona em um país pode ser ofensiva em outro.' },
    { frase: "It's important to understand cultural differences.", dica: 0, traducao: 'É importante entender as diferenças culturais.' },
    { frase: 'The campaign could confuse customers.', dica: 0, traducao: 'A campanha poderia confundir os clientes.' },
    { frase: 'The chicken was so good that I licked my fingers.', dica: 0, traducao: 'O frango estava tão bom que lambi os dedos.' },
    { frase: 'In many cultures, people revere their ancestors.', dica: 0, traducao: 'Em muitas culturas, as pessoas reverenciam os antepassados.' },
    { frase: 'Do you think it is sensible to buy products because of ads?', dica: 0, traducao: 'Você acha sensato comprar produtos por causa de propagandas?' }
  ]
});
</script>
