<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* B1 · Class 25 · Gramática (City Battles)
   Alinhado ao "Grammar Point" (comparativos -er / -ier / more ... than; as ... as;
   superlativos the -est / the most; better / worse / the best / the worst; pronúncia de
   waffle), aos adjetivos do Warm Up e aos verbos / adjetivos + preposição.
   Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 25, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'Lisbon is ___ than London.', opcoes: ['cheaper', 'more cheap', 'cheapest'], certa: 0, traducao: 'Lisboa é mais barata que Londres.' },
    { frase: 'Tokyo is ___ than many cities in Europe.', opcoes: ['modern', 'more modern', 'most modern'], certa: 1, traducao: 'Tóquio é mais moderna que muitas cidades da Europa.' },
    { frase: "This is the ___ city I've ever visited.", opcoes: ['more peaceful', 'peacefuller', 'most peaceful'], certa: 2, traducao: 'Esta é a cidade mais tranquila que já visitei.' },
    { frase: 'The metro is as fast ___ the bus.', opcoes: ['as', 'than', 'that'], certa: 0, traducao: 'O metrô é tão rápido quanto o ônibus.' },
    { frase: 'New York is ___ than my hometown.', opcoes: ['busyer', 'busier', 'more busy'], certa: 1, traducao: 'Nova York é mais movimentada que a minha cidade natal.' },
    { frase: 'It was the ___ hotel of our trip. Dirty and noisy!', opcoes: ['baddest', 'worse', 'worst'], certa: 2, traducao: 'Foi o pior hotel da nossa viagem. Sujo e barulhento!' },
    { frase: 'The food here is ___ than at home.', opcoes: ['better', 'gooder', 'best'], certa: 0, traducao: 'A comida aqui é melhor do que em casa.' },
    { frase: 'Venice is one of the ___ cities in the world.', opcoes: ['more beautiful', 'most beautiful', 'beautifullest'], certa: 1, traducao: 'Veneza é uma das cidades mais bonitas do mundo.' },
    { frase: "Berlin isn't ___ hot as Bangkok.", opcoes: ['more', 'than', 'as'], certa: 2, traducao: 'Berlim não é tão quente quanto Bangkok.' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ['Rome is older than Paris.', 'Rome is more old than Paris.', 'Rome is older that Paris.'], certa: 0, traducao: 'Roma é mais antiga que Paris.' },
    { instrucao: 'Which sentence compares ONE city with all the others?', frase: '___', opcoes: ['Dubai is bigger than my town.', 'Dubai has the tallest building in the world.', 'Dubai is as hot as Doha.'], certa: 1, traducao: 'Dubai tem o prédio mais alto do mundo.' },
    { frase: 'A city with too many people is ___.', opcoes: ['peaceful', 'cheap', 'crowded'], certa: 2, traducao: 'Uma cidade com gente demais é lotada.' },
    { frase: 'A city with dirty air is ___.', opcoes: ['polluted', 'historic', 'clean'], certa: 0, traducao: 'Uma cidade com ar sujo é poluída.' },
    { frase: 'A city with old buildings and castles is ___.', opcoes: ['modern', 'historic', 'polluted'], certa: 1, traducao: 'Uma cidade com prédios antigos e castelos é histórica.' },
    { frase: "I'm really interested ___ street art.", opcoes: ['on', 'at', 'in'], certa: 2, traducao: 'Tenho muito interesse em arte de rua.' },
    { frase: 'My travel plans depend ___ my budget.', opcoes: ['on', 'of', 'in'], certa: 0, traducao: 'Os meus planos de viagem dependem do meu orçamento.' },
    { frase: "She's afraid ___ flying.", opcoes: ['from', 'of', 'about'], certa: 1, traducao: 'Ela tem medo de voar.' },
    { frase: 'We arrived ___ the airport at six.', opcoes: ['in', 'to', 'at'], certa: 2, traducao: 'Chegamos ao aeroporto às seis.' },
    { frase: 'Belgium is famous ___ chocolate and waffles.', opcoes: ['for', 'of', 'by'], certa: 0, traducao: 'A Bélgica é famosa pelo chocolate e pelos waffles.' },
    { frase: 'Bangkok is very different ___ Berlin.', opcoes: ['of', 'from', 'with'], certa: 1, traducao: 'Bangkok é muito diferente de Berlim.' },
    { frase: 'I always worry ___ missing the last bus.', opcoes: ['of', 'for', 'about'], certa: 2, traducao: 'Sempre me preocupo em perder o último ônibus.' },
    { frase: "Who's going to pay ___ the tickets?", opcoes: ['for', 'to', 'on'], certa: 0, traducao: 'Quem vai pagar os ingressos?' },
    { frase: 'Many tourists spend too much money ___ souvenirs.', opcoes: ['in', 'on', 'at'], certa: 1, traducao: 'Muitos turistas gastam dinheiro demais com lembrancinhas.' },
    { frase: 'In "waffle", the A sounds like the O in ___.', opcoes: ['day', 'way', 'not'], certa: 2, traducao: 'Em "waffle", o A soa como o O de "not".' }
  ]
});
</script>
</body>
</html>
