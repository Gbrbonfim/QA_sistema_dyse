<script>
/* B1 · Class 25 · Fala (City Battles)
   Alinhado ao Warm Up (o que torna uma cidade boa de visitar; adjetivos), ao "Grammar
   Point" (comparativos, superlativos, as ... as; pronúncia de waffle) e às perguntas do
   exercício 6 (preposições). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 25, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'What makes a city nice to visit?', dica: 0, traducao: 'O que torna uma cidade boa de visitar?' },
    { frase: 'My favourite city is historic and peaceful.', dica: 0, traducao: 'A minha cidade favorita é histórica e tranquila.' },
    { frase: 'Is your city crowded or peaceful?', dica: 0, traducao: 'A sua cidade é cheia ou tranquila?' },
    { frase: 'Lisbon is cheaper than London.', dica: 0, traducao: 'Lisboa é mais barata que Londres.' },
    { frase: 'Tokyo is more modern than Rome.', dica: 0, traducao: 'Tóquio é mais moderna que Roma.' },
    { frase: 'The metro is as fast as the bus.', dica: 0, traducao: 'O metrô é tão rápido quanto o ônibus.' },
    { frase: 'This is the most beautiful square in the city.', dica: 0, traducao: 'Esta é a praça mais bonita da cidade.' },
    { frase: 'It was the worst hotel of our trip.', dica: 0, traducao: 'Foi o pior hotel da nossa viagem.' },
    { frase: 'The food here is better than at home.', dica: 0, traducao: 'A comida aqui é melhor do que em casa.' },
    { frase: 'Venice has no cars in its historic centre.', dica: 0, traducao: 'Veneza não tem carros no centro histórico.' },
    { frase: "I'm really interested in history and art.", dica: 0, traducao: 'Tenho muito interesse em história e arte.' },
    { frase: 'My travel plans depend on my budget.', dica: 0, traducao: 'Os meus planos de viagem dependem do meu orçamento.' },
    { frase: "I'm afraid of flying.", dica: 0, traducao: 'Tenho medo de voar.' },
    { frase: 'We arrived in Paris early in the morning.', dica: 0, traducao: 'Chegamos a Paris de manhã cedo.' },
    { frase: 'Excuse me, can I ask for directions?', dica: 0, traducao: 'Com licença, posso pedir informação?' },
    { frase: 'I agree with you. The city looks amazing.', dica: 0, traducao: 'Concordo com você. A cidade parece incrível.' },
    { frase: 'What is your city famous for?', dica: 0, traducao: 'A sua cidade é famosa pelo quê?' },
    { frase: 'Are people in your city nice to tourists?', dica: 0, traducao: 'As pessoas da sua cidade são simpáticas com os turistas?' },
    { frase: 'What do you spend most of your money on when you travel?', dica: 0, traducao: 'Com o que você gasta mais dinheiro quando viaja?' },
    { frase: 'Belgian waffles are delicious.', dica: 0, traducao: 'Os waffles belgas são deliciosos.' }
  ]
});
</script>
