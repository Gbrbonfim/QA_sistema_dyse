<script>
/* B1 · Class 10 · Fala (Why Is It Always Raining?)
   Alinhado ao "Speaking and Writing" (você é o repórter do tempo: Today's forecast is...,
   We'll have... / There will be..., It won't be..., The high / low will be..., There's a
   chance of...) e às perguntas do "Talking Point". Conteúdo NOVO (outras cidades). 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 10, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "Good evening! Here's the weather forecast for tomorrow.", dica: 0, traducao: 'Boa noite! Aqui está a previsão do tempo para amanhã.' },
    { frase: "Today's forecast is sunny with clear skies.", dica: 0, traducao: 'A previsão de hoje é de sol com céu limpo.' },
    { frase: "We'll have showers in the afternoon.", dica: 0, traducao: 'Vamos ter pancadas de chuva à tarde.' },
    { frase: 'There will be strong winds near the coast.', dica: 0, traducao: 'Vai haver ventos fortes perto da costa.' },
    { frase: "It won't be cold this weekend.", dica: 0, traducao: 'Não vai estar frio neste fim de semana.' },
    { frase: 'The high will be twenty-six degrees.', dica: 0, traducao: 'A máxima vai ser de vinte e seis graus.' },
    { frase: 'The low will be around nine degrees.', dica: 0, traducao: 'A mínima vai ser de uns nove graus.' },
    { frase: "There's a chance of rain in the evening.", dica: 0, traducao: 'Há chance de chuva à noite.' },
    { frase: 'It will be partly cloudy in the morning.', dica: 0, traducao: 'Vai estar parcialmente nublado de manhã.' },
    { frase: 'A light breeze is expected by the sea.', dica: 0, traducao: 'Espera-se uma brisa leve perto do mar.' },
    { frase: "Don't forget your umbrella!", dica: 0, traducao: 'Não esqueça o seu guarda-chuva!' },
    { frase: "I think it'll be a warm evening.", dica: 0, traducao: 'Acho que vai ser uma noite quente.' },
    { frase: "I don't think it'll snow in Rome.", dica: 0, traducao: 'Não acho que vai nevar em Roma.' },
    { frase: "I'm sure you'll like the weather in Rio.", dica: 0, traducao: 'Tenho certeza de que você vai gostar do tempo no Rio.' },
    { frase: 'Will the weather be nice for the picnic?', dica: 0, traducao: 'O tempo vai estar bom para o piquenique?' },
    { frase: 'Everything will be dry by tomorrow, so don\'t worry.', dica: 0, traducao: 'Tudo vai estar seco até amanhã, então não se preocupe.' },
    { frase: 'Do you like rainy weather?', dica: 0, traducao: 'Você gosta de tempo chuvoso?' },
    { frase: 'How often do you check the weather forecast?', dica: 0, traducao: 'Com que frequência você confere a previsão do tempo?' },
    { frase: 'The weather where I live changes a lot.', dica: 0, traducao: 'O tempo onde eu moro muda muito.' },
    { frase: 'Warm water evaporates faster than cold water.', dica: 0, traducao: 'A água quente evapora mais rápido do que a água fria.' }
  ]
});
</script>
