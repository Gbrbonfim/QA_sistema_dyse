    { frase: 'My best friend is very reliable.', dica: 0, traducao: 'O meu melhor amigo é muito confiável.' },
    { frase: 'She is creative and always has original ideas.', dica: 0, traducao: 'Ela é criativa e sempre tem ideias originais.' },
    { frase: 'He is confident and speaks clearly in meetings.', dica: 0, traducao: 'Ele é confiante e fala com clareza nas reuniões.' },
    { frase: 'My brother is easy-going and stays calm.', dica: 0, traducao: 'O meu irmão é tranquilo e fica calmo.' },

    { frase: 'They are the people that make my life work.', dica: 0, traducao: 'São as pessoas que fazem a minha vida funcionar.' },

    { frase: 'Home is the place where the heart is.', dica: 0, traducao: 'Lar é o lugar onde está o coração.' }
  ]
