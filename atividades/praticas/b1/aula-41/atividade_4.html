<script>
/* B1 · Class 41 · Fala ("I Almost Agree With You")
   Alinhado ao Speaking (perguntas pessoais, relatar as respostas do colega com He said...,
   She told me..., e descobrir a mentira) e ao Grammar Point. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 41, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "What's something you really enjoy doing on weekends?", dica: 0, traducao: 'O que você realmente gosta de fazer nos fins de semana?' },
    { frase: "What's a skill you would like to learn?", dica: 0, traducao: 'Que habilidade você gostaria de aprender?' },
    { frase: "What's something you've tried but didn't like?", dica: 0, traducao: 'O que você já experimentou e não gostou?' },
    { frase: 'Have you ever had a very embarrassing moment?', dica: 0, traducao: 'Você já passou por um momento muito constrangedor?' },
    { frase: 'She said she enjoyed cooking on weekends.', dica: 0, traducao: 'Ela disse que gostava de cozinhar nos fins de semana.' },
    { frase: 'He told me he wanted to learn the guitar.', dica: 0, traducao: 'Ele me disse que queria aprender violão.' },
    { frase: 'She said she had visited Japan last year.', dica: 0, traducao: 'Ela disse que tinha visitado o Japão no ano passado.' },
    { frase: "He said he couldn't live without his phone.", dica: 0, traducao: 'Ele disse que não conseguia viver sem o celular.' },
    { frase: 'She told me she would change one bad habit.', dica: 0, traducao: 'Ela me disse que ia mudar um mau hábito.' },
    { frase: 'He said he was learning to swim.', dica: 0, traducao: 'Ele disse que estava aprendendo a nadar.' },
    { frase: 'I think that answer was the lie.', dica: 0, traducao: 'Acho que essa resposta era a mentira.' },
    { frase: 'She said she almost agreed with me.', dica: 0, traducao: 'Ela disse que quase concordava comigo.' },
    { frase: 'He told me he was sure it was his fault.', dica: 0, traducao: 'Ele me disse que tinha certeza de que era culpa dele.' },
    { frase: 'She said she only had a few minor comments.', dica: 0, traducao: 'Ela disse que só tinha alguns comentários pequenos.' },
    { frase: "I'm sure it's my fault.", dica: 0, traducao: 'Tenho certeza de que é culpa minha.' },
    { frase: "I hear what you're saying.", dica: 0, traducao: 'Entendo o que você está dizendo.' },
    { frase: "I'll bear it in mind.", dica: 0, traducao: 'Vou levar isso em conta.' },
    { frase: 'Do British people always say exactly what they mean?', dica: 0, traducao: 'Os britânicos sempre dizem exatamente o que querem dizer?' },
    { frase: 'We use reported speech to tell someone what another person said.', dica: 0, traducao: 'Usamos o discurso indireto para contar o que outra pessoa disse.' },
    { frase: 'Say something, but tell someone.', dica: 0, traducao: 'Say + algo, mas tell + alguém.' }
  ]
});
</script>
