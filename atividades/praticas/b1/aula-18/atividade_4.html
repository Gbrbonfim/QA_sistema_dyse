/* B1 · Class 18 · Fala (How to Make Better Decisions)
   Alinhado ao Warm Up (quiz decisive / indecisive), ao vídeo (small choices, Obama, energy,
   hungry, honest friend, good fuel, safest option) e ao "Grammar Point" (may / might).
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 18, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Are you decisive or indecisive?', dica: 0, traducao: 'Você é decidido ou indeciso?' },
    { frase: 'I take forever to decide what to wear.', dica: 0, traducao: 'Demoro uma eternidade para decidir o que vestir.' },
    { frase: 'I usually decide quickly when I choose food.', dica: 0, traducao: 'Normalmente decido rápido quando escolho comida.' },
    { frase: 'Do you ask others for advice before a decision?', dica: 0, traducao: 'Você pede conselho aos outros antes de uma decisão?' },
    { frase: "I don't usually regret my decisions.", dica: 0, traducao: 'Normalmente não me arrependo das minhas decisões.' },
    { frase: 'I might change my mind later.', dica: 0, traducao: 'Talvez eu mude de ideia depois.' },
    { frase: 'She may not come to class tomorrow.', dica: 0, traducao: 'Talvez ela não venha à aula amanhã.' },
    { frase: 'It might rain this afternoon.', dica: 0, traducao: 'Pode chover hoje à tarde.' },
    { frase: 'You may need more time to decide.', dica: 0, traducao: 'Talvez você precise de mais tempo para decidir.' },
    { frase: "You might not think clearly if you're tired.", dica: 0, traducao: 'Talvez você não pense com clareza se estiver cansado.' },
    { frase: "I'm not sure. I might ask a friend for advice.", dica: 0, traducao: 'Não tenho certeza. Talvez eu peça conselho a um amigo.' },
    { frase: 'We might skip breakfast, but that is not a good idea.', dica: 0, traducao: 'Talvez a gente pule o café da manhã, mas não é uma boa ideia.' },
    { frase: 'Remove small choices from your day.', dica: 0, traducao: 'Tire as pequenas escolhas do seu dia.' },
    { frase: 'Obama always wore grey or blue suits.', dica: 0, traducao: 'O Obama sempre usava ternos cinza ou azuis.' },
    { frase: "Don't waste energy on small things.", dica: 0, traducao: 'Não desperdice energia com coisas pequenas.' },
    { frase: "Don't make big decisions when you're hungry.", dica: 0, traducao: 'Não tome decisões grandes quando estiver com fome.' },
    { frase: 'Water and porridge are good fuel for your brain.', dica: 0, traducao: 'Água e mingau são um bom combustível para o seu cérebro.' },
    { frase: 'Ask an honest friend for advice.', dica: 0, traducao: 'Peça conselho a um amigo sincero.' },
    { frase: 'People usually choose the safest option.', dica: 0, traducao: 'As pessoas costumam escolher a opção mais segura.' },
    { frase: "Don't be afraid of losing something.", dica: 0, traducao: 'Não tenha medo de perder alguma coisa.' }
  ]
});
</script>
