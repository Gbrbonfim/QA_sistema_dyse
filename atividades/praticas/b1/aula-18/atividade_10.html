<script>
/* B1 · Class 19 · Gramática (How to Make Better Decisions)
   Alinhado ao "Vocabulary: Do Vs Make" (do research / your best / nothing / exercise / the
   right thing / work / homework; make a decision / a mistake / sure / a difference / a
   plan), com revisão de may / might, decisive e do vídeo. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 18, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'Scientists ___ research every day.', opcoes: ['do', 'make', 'have'], certa: 0, traducao: 'Os cientistas fazem pesquisa todos os dias.' },
    { frase: 'Every time you ___ a decision, your brain uses energy.', opcoes: ['do', 'make', 'get'], certa: 1, traducao: 'Toda vez que você toma uma decisão, o cérebro gasta energia.' },
    { frase: "Don't worry if you ___ a mistake.", opcoes: ['do', 'have', 'make'], certa: 2, traducao: 'Não se preocupe se cometer um erro.' },
    { frase: 'Just ___ your best!', opcoes: ['do', 'make', 'get'], certa: 0, traducao: 'Apenas faça o seu melhor!' },
    { frase: "Sometimes it's better to ___ nothing.", opcoes: ['make', 'do', 'have'], certa: 1, traducao: 'Às vezes é melhor não fazer nada.' },
    { frase: 'Regular exercise ___ a difference to your health.', opcoes: ['does', 'gets', 'makes'], certa: 2, traducao: 'Exercício regular faz diferença na sua saúde.' },
    { frase: "Before deciding, ___ sure you've rested well.", opcoes: ['make', 'do', 'get'], certa: 0, traducao: 'Antes de decidir, certifique-se de que descansou bem.' },
    { frase: 'An honest friend can help you ___ the right thing.', opcoes: ['make', 'do', 'have'], certa: 1, traducao: 'Um amigo sincero pode te ajudar a fazer a coisa certa.' },
    { frase: 'If you feel lost, ___ a plan.', opcoes: ['do', 'take', 'make'], certa: 2, traducao: 'Se você se sentir perdido, faça um plano.' },
    { frase: 'I ___ exercise three times a week.', opcoes: ['do', 'make', 'play'], certa: 0, traducao: 'Faço exercício três vezes por semana.' },
    { frase: 'She ___ her homework every evening.', opcoes: ['makes', 'does', 'takes'], certa: 1, traducao: 'Ela faz a lição de casa toda noite.' },
    { frase: 'Can you ___ me a favour?', opcoes: ['make', 'have', 'do'], certa: 2, traducao: 'Você pode me fazer um favor?' },
    { frase: "Let's ___ a cake for Mum's birthday.", opcoes: ['make', 'do', 'play'], certa: 0, traducao: 'Vamos fazer um bolo para o aniversário da mamãe.' },
    { frase: 'I ___ my bed every morning.', opcoes: ['do', 'make', 'take'], certa: 1, traducao: 'Arrumo a minha cama toda manhã.' },
    { frase: 'We need to ___ the dishes after dinner.', opcoes: ['make', 'take', 'do'], certa: 2, traducao: 'Precisamos lavar a louça depois do jantar.' },
    { instrucao: 'Which collocation is NOT correct?', frase: '___', opcoes: ['make exercise', 'make a mistake', 'do research'], certa: 0, traducao: 'O certo é do exercise.' },
    { instrucao: 'Which collocation is NOT correct?', frase: '___', opcoes: ['do your best', 'do a decision', 'make a plan'], certa: 1, traducao: 'O certo é make a decision.' },
    { frase: 'It ___ rain this afternoon, so take an umbrella.', opcoes: ['might', "mustn't", "doesn't have to"], certa: 0, traducao: 'Pode chover hoje à tarde, então leve um guarda-chuva.' },
    { frase: "I ___ go to the party. I'm not sure yet.", opcoes: ['must', 'may', 'have to'], certa: 1, traducao: 'Talvez eu vá à festa. Ainda não tenho certeza.' },
    { frase: "You ___ not think clearly if you're hungry.", opcoes: ['might to', 'mights', 'might'], certa: 2, traducao: 'Talvez você não pense com clareza se estiver com fome.' },
    { frase: "He's very ___. He decides everything in seconds.", opcoes: ['decisive', 'indecisive', 'afraid'], certa: 0, traducao: 'Ele é muito decidido. Decide tudo em segundos.' },
    { frase: 'Obama wore the same kind of suit to avoid ___ small choices.', opcoes: ['make', 'making', 'made'], certa: 1, traducao: 'O Obama usava o mesmo tipo de terno para evitar fazer pequenas escolhas.' },
    { frase: "She's afraid ___ losing her job.", opcoes: ['to', 'for', 'of'], certa: 2, traducao: 'Ela tem medo de perder o emprego.' },
    { frase: 'I made the right decision, and now I feel calm and ___.', opcoes: ['confident', 'confidently', 'confidence'], certa: 0, traducao: 'Tomei a decisão certa e agora me sinto calmo e confiante.' }
  ]
});
</script>
