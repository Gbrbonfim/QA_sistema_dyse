<script>
/* B1 · Class 23 · Fala (Is It Really a Dream Job?)
   Alinhado ao Warm Up (o que importa num emprego), ao vídeo do travel vlogger, aos empregos
   dos sonhos, ao Talking Point e ao "Grammar Point" / Speaking (second conditional).
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 23, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Which things are important for you in a job?', dica: 0, traducao: 'O que é importante para você num emprego?' },
    { frase: 'A good salary is important for me.', dica: 0, traducao: 'Um bom salário é importante para mim.' },
    { frase: "I'd like a fun and friendly workplace.", dica: 0, traducao: 'Eu gostaria de um ambiente de trabalho divertido e amigável.' },
    { frase: 'I want opportunities to grow and learn.', dica: 0, traducao: 'Quero oportunidades de crescer e aprender.' },
    { frase: 'He writes the script for his video on his phone.', dica: 0, traducao: 'Ele escreve o roteiro do vídeo no celular.' },
    { frase: 'One video usually takes four to five hours to edit.', dica: 0, traducao: 'Um vídeo normalmente leva de quatro a cinco horas para editar.' },
    { frase: 'If I won the lottery, I would travel around the world.', dica: 0, traducao: 'Se eu ganhasse na loteria, viajaria pelo mundo.' },
    { frase: "If I were you, I'd ask for a pay rise.", dica: 0, traducao: 'Se eu fosse você, pediria um aumento.' },
    { frase: 'If I had more free time, I would learn to cook.', dica: 0, traducao: 'Se eu tivesse mais tempo livre, aprenderia a cozinhar.' },
    { frase: 'What would you do if you lost your job?', dica: 0, traducao: 'O que você faria se perdesse o emprego?' },
    { frase: "I wouldn't work so much if I didn't need the money.", dica: 0, traducao: 'Eu não trabalharia tanto se não precisasse do dinheiro.' },
    { frase: 'If I lived near the beach, I could surf every day.', dica: 0, traducao: 'Se eu morasse perto da praia, poderia surfar todo dia.' },
    { frase: "If I could choose any job, I'd be a chocolate taster.", dica: 0, traducao: 'Se eu pudesse escolher qualquer emprego, seria provador de chocolate.' },
    { frase: 'A panda nanny takes care of baby pandas.', dica: 0, traducao: 'Uma babá de panda cuida de pandas filhotes.' },
    { frase: 'A video game tester has to pay attention to details.', dica: 0, traducao: 'Um testador de videogame tem que prestar atenção aos detalhes.' },
    { frase: 'People think my job is just fun.', dica: 0, traducao: 'As pessoas acham que o meu trabalho é só diversão.' },
    { frase: 'Is it possible to love your job and still feel tired?', dica: 0, traducao: 'É possível amar o seu trabalho e mesmo assim se sentir cansado?' },
    { frase: 'If you needed to travel for work, where would you go?', dica: 0, traducao: 'Se você precisasse viajar a trabalho, aonde iria?' },
    { frase: "Would you enjoy a job that didn't pay well?", dica: 0, traducao: 'Você gostaria de um emprego que não pagasse bem?' },
    { frase: 'If he worked less, he could explore more places.', dica: 0, traducao: 'Se ele trabalhasse menos, poderia explorar mais lugares.' }
  ]
});
</script>
