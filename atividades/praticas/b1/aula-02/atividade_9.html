<script>
/* B1 · Class 03 · Fala (A moment that changed everything)
   Alinhado ao "Grammar Point" (past simple x past continuous, when/while), ao exercício 3
   (When I arrived at the airport... / While I was saying goodbye...) e ao "Speaking: A Moment
   That Changed Everything". Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 2, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'I was walking in the park when my phone rang.', dica: 0, traducao: 'Eu estava andando no parque quando o meu telefone tocou.' },
    { frase: 'While I was staying in London, something important happened.', dica: 0, traducao: 'Enquanto eu estava em Londres, algo importante aconteceu.' },
    { frase: 'When I arrived at the airport, my parents were waiting for me.', dica: 0, traducao: 'Quando cheguei ao aeroporto, os meus pais estavam me esperando.' },
    { frase: 'While I was boarding the plane, I felt nervous but excited.', dica: 0, traducao: 'Enquanto embarcava no avião, me senti nervoso, mas animado.' },
    { frase: 'I was packing my suitcase when I found my old passport.', dica: 0, traducao: 'Eu estava fazendo a mala quando encontrei o meu passaporte antigo.' },
    { frase: 'While we were walking around London, it started to rain.', dica: 0, traducao: 'Enquanto andávamos por Londres, começou a chover.' },
    { frase: 'We were having dinner when the lights went out.', dica: 0, traducao: 'Estávamos jantando quando as luzes se apagaram.' },
    { frase: 'What were you doing when the alarm went off?', dica: 0, traducao: 'O que você estava fazendo quando o alarme tocou?' },
    { frase: 'Did you miss your family while you were living abroad?', dica: 0, traducao: 'Você sentiu falta da sua família enquanto morava fora?' },
    { frase: 'I was waiting at the check-in when I met an old friend.', dica: 0, traducao: 'Eu estava esperando no check-in quando encontrei um velho amigo.' },
    { frase: 'While I was saying goodbye, my mom started to cry.', dica: 0, traducao: 'Enquanto eu me despedia, a minha mãe começou a chorar.' },
    { frase: 'I was thinking about home when my sister called me.', dica: 0, traducao: 'Eu estava pensando em casa quando a minha irmã me ligou.' },
    { frase: "I wasn't planning to travel, but I changed my plans.", dica: 0, traducao: 'Eu não estava planejando viajar, mas mudei os meus planos.' },
    { frase: 'She was working in a café when she met her business partner.', dica: 0, traducao: 'Ela estava trabalhando num café quando conheceu o sócio.' },
    { frase: 'Where were you and what were you doing?', dica: 0, traducao: 'Onde você estava e o que estava fazendo?' },
    { frase: 'What happened next?', dica: 0, traducao: 'O que aconteceu depois?' },
    { frase: 'How did that change something for you?', dica: 0, traducao: 'Como aquilo mudou algo para você?' },
    { frase: 'That trip was the beginning of a new adventure.', dica: 0, traducao: 'Aquela viagem foi o começo de uma nova aventura.' },
    { frase: 'She was nervous before her first solo trip.', dica: 0, traducao: 'Ela estava nervosa antes da primeira viagem sozinha.' },
    { frase: 'I booked a ticket the next day.', dica: 0, traducao: 'Reservei uma passagem no dia seguinte.' }
  ]
});
</script>
