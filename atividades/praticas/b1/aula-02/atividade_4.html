/* B1 · Class 02 · Fala (An important decision)
   Alinhado ao Warm Up (viajar, morar fora), ao blog de Harris Cheng, ao Talking Point
   (decisões importantes, seguir o coração) e ao "Test yourself" de in/on/at. Conteúdo NOVO.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 2, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Would you like to live abroad one day?', dica: 0, traducao: 'Você gostaria de morar fora um dia?' },
    { frase: 'I would like to live in Canada for a year.', dica: 0, traducao: 'Eu gostaria de morar no Canadá por um ano.' },
    { frase: 'The best thing about living abroad is meeting new people.', dica: 0, traducao: 'A melhor coisa de morar fora é conhecer pessoas novas.' },
    { frase: 'My family was surprised and worried.', dica: 0, traducao: 'A minha família ficou surpresa e preocupada.' },
    { frase: 'I followed my heart.', dica: 0, traducao: 'Segui o meu coração.' },
    { frase: 'No place is perfect.', dica: 0, traducao: 'Nenhum lugar é perfeito.' },
    { frase: 'Life is not only about the destination.', dica: 0, traducao: 'A vida não é só sobre o destino.' },
    { frase: 'Being a global citizen is about being open.', dica: 0, traducao: 'Ser um cidadão global é ser aberto.' },
    { frase: 'Have you ever made a big decision in your life?', dica: 0, traducao: 'Você já tomou uma grande decisão na vida?' },
    { frase: 'I changed jobs last year. It was a big decision.', dica: 0, traducao: 'Mudei de emprego no ano passado. Foi uma grande decisão.' },
    { frase: 'I think following your heart is more important.', dica: 0, traducao: 'Acho que seguir o seu coração é mais importante.' },
    { frase: 'I arrived in Toronto on a cold morning in January.', dica: 0, traducao: 'Cheguei a Toronto numa manhã fria de janeiro.' },
    { frase: 'I usually wake up at nine at the weekend.', dica: 0, traducao: 'Normalmente acordo às nove no fim de semana.' },
    { frase: 'We have a family party at Christmas.', dica: 0, traducao: 'Temos uma festa de família no Natal.' },
    { frase: 'I read on the bus every morning.', dica: 0, traducao: 'Leio no ônibus todas as manhãs.' },
    { frase: 'My keys are on the kitchen table.', dica: 0, traducao: 'As minhas chaves estão na mesa da cozinha.' },
    { frase: 'She was born on the tenth of June.', dica: 0, traducao: 'Ela nasceu no dia dez de junho.' },
    { frase: 'They waited for me at the station.', dica: 0, traducao: 'Eles me esperaram na estação.' },
    { frase: 'It is very hot in Hong Kong in summer.', dica: 0, traducao: 'Faz muito calor em Hong Kong no verão.' },
    { frase: 'Try to enjoy every step of the journey.', dica: 0, traducao: 'Tente aproveitar cada passo da jornada.' }
  ]
});
</script>
