<title>DYSE · B1 · Aula 3 · Past simple or past continuous?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* B1 · Class 03 · Gramática (A moment that changed everything)
   Alinhado ao "Grammar Point": past continuous (was/were + -ing) para a ação longa, past
   simple para a curta; "while" com o past continuous e "when" com o past simple; perguntas
   (What were you doing...? / Did you miss...?). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 2, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'I ___ my suitcase when I found my old passport.', opcoes: ['was packing', 'packing', 'were packing'], certa: 0, traducao: 'Eu estava fazendo a mala quando encontrei o meu passaporte antigo.' },
    { frase: 'While we were walking around the city, it ___ to rain.', opcoes: ['was start', 'started', 'were starting'], certa: 1, traducao: 'Enquanto andávamos pela cidade, começou a chover.' },
    { frase: 'They ___ dinner when the lights went out.', opcoes: ['was having', 'having', 'were having'], certa: 2, traducao: 'Eles estavam jantando quando as luzes se apagaram.' },
    { frase: 'He was working at a co-working space when he ___ his business partner.', opcoes: ['met', 'was meet', 'meets'], certa: 0, traducao: 'Ele estava trabalhando num coworking quando conheceu o sócio.' },
    { frase: "I ___ attention when my manager explained the task.", opcoes: ["weren't paying", "wasn't paying", "didn't paying"], certa: 1, traducao: 'Eu não estava prestando atenção quando o meu gerente explicou a tarefa.' },
    { frase: 'What ___ you doing when the alarm went off?', opcoes: ['did', 'was', 'were'], certa: 2, traducao: 'O que você estava fazendo quando o alarme tocou?' },
    { frase: '___ you miss your family while you were living in Canada?', opcoes: ['Did', 'Were', 'Was'], certa: 0, traducao: 'Você sentiu falta da sua família enquanto morava no Canadá?' },
    { frase: 'She was sitting in the park when her phone ___.', opcoes: ['ringed', 'rang', 'was ring'], certa: 1, traducao: 'Ela estava sentada no parque quando o telefone dela tocou.' },
    { frase: 'My parents ___ for me when I arrived.', opcoes: ['was waiting', 'waiting', 'were waiting'], certa: 2, traducao: 'Os meus pais estavam me esperando quando cheguei.' },
    { frase: '___ I was saying goodbye, I started to cry.', opcoes: ['While', 'When', 'During'], certa: 0, traducao: 'Enquanto eu me despedia, comecei a chorar.' },
    { frase: 'I was waiting at the bus stop ___ I saw an old friend.', opcoes: ['while', 'when', 'during'], certa: 1, traducao: 'Eu estava esperando no ponto de ônibus quando vi um velho amigo.' },
    { frase: 'We use the past continuous for ___ actions in the past.', opcoes: ['shorter', 'future', 'longer'], certa: 2, traducao: 'Usamos o past continuous para ações mais longas no passado.' },
    { frase: 'We use the past simple for ___ actions that interrupt.', opcoes: ['shorter', 'longer', 'future'], certa: 0, traducao: 'Usamos o past simple para as ações mais curtas que interrompem.' },
    { frase: 'The past continuous is was / were + ___.', opcoes: ['the base verb', 'verb + -ing', 'verb + -ed'], certa: 1, traducao: 'O past continuous é was / were + verbo com -ing.' },
    { frase: 'We usually use "___" with the past continuous.', opcoes: ['when', 'yesterday', 'while'], certa: 2, traducao: 'Normalmente usamos "while" com o past continuous.' },
    { frase: 'In "I was cooking when you called", the longer action is ___.', opcoes: ['I was cooking', 'you called', 'when'], certa: 0, traducao: 'Em "I was cooking when you called", a ação mais longa é "I was cooking".' },
    { frase: 'In "While she was reading, the cat jumped on the table", the shorter action is ___.', opcoes: ['she was reading', 'the cat jumped on the table', 'while'], certa: 1, traducao: 'A ação mais curta é "the cat jumped on the table".' },
    { frase: 'Kacie was nervous before she ___ her first solo trip.', opcoes: ['was take', 'taking', 'took'], certa: 2, traducao: 'A Kacie estava nervosa antes de fazer a primeira viagem sozinha.' },
    { frase: 'Kacie ___ to stay in Italy for only six months at first.', opcoes: ['planned', 'plan', 'was plan'], certa: 0, traducao: 'No começo, a Kacie planejava ficar na Itália só seis meses.' },
    { frase: 'I was looking for a place to live when I ___ a great offer online.', opcoes: ['was see', 'saw', 'seed'], certa: 1, traducao: 'Eu estava procurando um lugar para morar quando vi uma ótima oferta na internet.' },
    { frase: 'While he ___ late, he had a great idea.', opcoes: ['working', 'were working', 'was working'], certa: 2, traducao: 'Enquanto trabalhava até tarde, ele teve uma ótima ideia.' },
    { frase: 'We ___ a photo while we were standing on the bridge.', opcoes: ['took', 'taked', 'was taking'], certa: 0, traducao: 'Tiramos uma foto enquanto estávamos na ponte.' },
    { frase: 'I ___ my first meal abroad when I met my new neighbor.', opcoes: ['were having', 'was having', 'having'], certa: 1, traducao: 'Eu estava fazendo a minha primeira refeição no exterior quando conheci o meu novo vizinho.' },
    { frase: 'When I arrived at the airport, I ___ very tired.', opcoes: ['were', 'am', 'was'], certa: 2, traducao: 'Quando cheguei ao aeroporto, eu estava muito cansado.' }
  ]
});
</script>
</body>
</html>
