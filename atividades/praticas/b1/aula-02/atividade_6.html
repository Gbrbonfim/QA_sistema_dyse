<title>DYSE · B1 · Aula 3 · What interrupted the action?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* B1 · Class 03 · Escuta (A moment that changed everything)
   Alinhado ao "Grammar Point": a ação mais longa no past continuous (was/were + -ing) e a ação
   mais curta, que interrompe, no past simple (I was walking in the park when my phone rang).
   Conteúdo NOVO: o aluno ouve a frase e escolhe a ação curta. As iscas são a ação longa e uma
   ação que não aparece na frase. 24 questões. */
let n = 0;
const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 3;
  const ns = iscas.slice(0, 2);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(c => ({ label: c, icon: 'bolt' })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-b1', aula: 2, num: 6, tipo: 'imagem',
  instrucao: 'Listen: what is the shorter action?',
  itens: [
    q('I was cooking dinner when the doorbell rang.', 'the doorbell rang', ['I was cooking dinner', 'I opened the window']),
    q('She was driving to work when she saw the accident.', 'she saw the accident', ['she was driving to work', 'she called the police']),
    q('While we were watching a film, the lights went out.', 'the lights went out', ['we were watching a film', 'we went to bed']),
    q('He was running in the park when he fell.', 'he fell', ['he was running in the park', 'he lost his phone']),
    q('While I was taking a shower, my phone rang.', 'my phone rang', ['I was taking a shower', 'I sent a message']),
    q('They were having lunch when their boss arrived.', 'their boss arrived', ['they were having lunch', 'they paid the bill']),
    q('While she was studying in Spain, she met her husband.', 'she met her husband', ['she was studying in Spain', 'she got a job']),
    q('I was sleeping when the baby started to cry.', 'the baby started to cry', ['I was sleeping', 'the baby laughed']),
    q('While we were walking on the beach, it started to rain.', 'it started to rain', ['we were walking on the beach', 'we took a photo']),
    q('He was waiting for the bus when he found a wallet.', 'he found a wallet', ['he was waiting for the bus', 'he bought a ticket']),
    q('While I was packing my suitcase, I found my old passport.', 'I found my old passport', ['I was packing my suitcase', 'I lost my keys']),
    q('She was reading a book when the fire alarm went off.', 'the fire alarm went off', ['she was reading a book', 'she called her mother']),
    q('While they were travelling in Peru, they lost their luggage.', 'they lost their luggage', ['they were travelling in Peru', 'they missed the flight']),
    q('I was working late when my manager called me.', 'my manager called me', ['I was working late', 'I left the office']),
    q('While he was shopping, somebody stole his bike.', 'somebody stole his bike', ['he was shopping', 'he bought a new bike']),
    q('We were sitting in a café when a famous singer came in.', 'a famous singer came in', ['we were sitting in a café', 'we asked for the menu']),
    q('While I was boarding the plane, I dropped my ticket.', 'I dropped my ticket', ['I was boarding the plane', 'I found my seat']),
    q('She was painting the kitchen when she hurt her hand.', 'she hurt her hand', ['she was painting the kitchen', 'she washed the brushes']),
    q('While the teacher was explaining the task, a student fell asleep.', 'a student fell asleep', ['the teacher was explaining the task', 'the class finished']),
    q('I was looking for a flat when I saw an amazing offer.', 'I saw an amazing offer', ['I was looking for a flat', 'I paid the rent']),
    q('While my parents were sleeping, the cat broke a glass.', 'the cat broke a glass', ['my parents were sleeping', 'the dog ran away']),
    q('He was making a speech when his microphone stopped working.', 'his microphone stopped working', ['he was making a speech', 'people clapped']),
    q('While we were having dinner, my brother told us some big news.', 'my brother told us some big news', ['we were having dinner', 'my brother cooked dinner']),
    q('I was saying goodbye to my family when I started to cry.', 'I started to cry', ['I was saying goodbye to my family', 'I got on the train'])
  ]
});
</script>
</body>
</html>
