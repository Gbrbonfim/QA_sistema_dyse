/* B1 · Class 15 · Fala (A Dose of Good Advice)
   Alinhado ao Warm Up (ir ao médico, o que faz um bom médico), ao "What's the matter?", aos
   conselhos com should / shouldn't e à série The Good Doctor. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 15, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "What's the matter?", dica: 0, traducao: 'O que você tem?' },
    { frase: 'I have a terrible headache.', dica: 0, traducao: 'Estou com uma dor de cabeça terrível.' },
    { frase: 'I have a sore throat and a cough.', dica: 0, traducao: 'Estou com dor de garganta e tosse.' },
    { frase: 'She has a high fever.', dica: 0, traducao: 'Ela está com febre alta.' },
    { frase: 'I think I have an allergy.', dica: 0, traducao: 'Acho que estou com alergia.' },
    { frase: 'You should see a doctor.', dica: 0, traducao: 'Você deveria ir ao médico.' },
    { frase: 'You should rest and drink plenty of fluids.', dica: 0, traducao: 'Você deveria descansar e beber bastante líquido.' },
    { frase: 'You should take a painkiller.', dica: 0, traducao: 'Você deveria tomar um analgésico.' },
    { frase: "You shouldn't drink so much coffee.", dica: 0, traducao: 'Você não deveria tomar tanto café.' },
    { frase: "You shouldn't look at your phone now.", dica: 0, traducao: 'Você não deveria olhar o celular agora.' },
    { frase: 'I think you should stay in bed today.', dica: 0, traducao: 'Acho que você deveria ficar na cama hoje.' },
    { frase: "I don't think you should take antibiotics.", dica: 0, traducao: 'Não acho que você deveria tomar antibióticos.' },
    { frase: 'Should I take a fever reducer?', dica: 0, traducao: 'Eu deveria tomar um antitérmico?' },
    { frase: 'Eat light food, like soup.', dica: 0, traducao: 'Coma comida leve, como sopa.' },
    { frase: 'Antibiotics do not work for the flu.', dica: 0, traducao: 'Antibióticos não funcionam para gripe.' },
    { frase: 'A cold is milder than the flu.', dica: 0, traducao: 'O resfriado é mais leve que a gripe.' },
    { frase: 'When was the last time you went to the doctor?', dica: 0, traducao: 'Quando foi a última vez que você foi ao médico?' },
    { frase: 'A good doctor listens to the patient.', dica: 0, traducao: 'Um bom médico ouve o paciente.' },
    { frase: 'Dr. Shaun Murphy is a young surgeon with autism.', dica: 0, traducao: 'O Dr. Shaun Murphy é um jovem cirurgião com autismo.' },
    { frase: 'You should check with a doctor before using any medicine.', dica: 0, traducao: 'Você deveria consultar um médico antes de usar qualquer remédio.' }
  ]
});
