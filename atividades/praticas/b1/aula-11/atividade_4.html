<script>
/* B1 · Class 11 · Fala (Scenes You Will Never Forget)
   Alinhado ao "Speaking" (reagir com 'll / won't + verb phrase: Don't worry, I'll... / It's
   okay, I'll... / No problem, I'll... / Oh no! I'll...) e às perguntas do "Talking Point".
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 11, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "Don't worry, I'll help you with your bags.", dica: 0, traducao: 'Não se preocupe, eu te ajudo com as malas.' },
    { frase: "It's okay, I'll pay for the tickets.", dica: 0, traducao: 'Tudo bem, eu pago os ingressos.' },
    { frase: "No problem, I'll take you home.", dica: 0, traducao: 'Sem problema, eu te levo para casa.' },
    { frase: "Really? I'll explain the story to you.", dica: 0, traducao: 'Sério? Eu te explico a história.' },
    { frase: "Oh no! I'll make you a sandwich.", dica: 0, traducao: 'Ah, não! Vou fazer um sanduíche para você.' },
    { frase: "Seriously? I'll recommend a good comedy.", dica: 0, traducao: 'Sério? Vou recomendar uma boa comédia.' },
    { frase: "I'll call you back in ten minutes.", dica: 0, traducao: 'Te retorno a ligação em dez minutos.' },
    { frase: "I'll send you an email tonight.", dica: 0, traducao: 'Vou te mandar um e-mail hoje à noite.' },
    { frase: 'Shall I make you a coffee?', dica: 0, traducao: 'Quer que eu faça um café para você?' },
    { frase: 'Shall we watch something lighter?', dica: 0, traducao: 'Vamos assistir algo mais leve?' },
    { frase: 'Shall I bring some snacks for movie night?', dica: 0, traducao: 'Quer que eu leve uns petiscos para a noite de filme?' },
    { frase: "I won't tell anybody, I promise.", dica: 0, traducao: 'Não vou contar para ninguém, prometo.' },
    { frase: "I'll never forget this day.", dica: 0, traducao: 'Nunca vou esquecer este dia.' },
    { frase: "You know what? I'll watch it with you tonight.", dica: 0, traducao: 'Sabe de uma coisa? Vou assistir com você hoje à noite.' },
    { frase: "We'll solve this problem together.", dica: 0, traducao: 'Vamos resolver esse problema juntos.' },
    { frase: 'I need to make a decision today.', dica: 0, traducao: 'Preciso tomar uma decisão hoje.' },
    { frase: 'My favourite film is a romantic comedy.', dica: 0, traducao: 'O meu filme favorito é uma comédia romântica.' },
    { frase: 'Which scene would you like to watch again?', dica: 0, traducao: 'Que cena você gostaria de ver de novo?' },
    { frase: 'When was the last time you made a promise?', dica: 0, traducao: 'Quando foi a última vez que você fez uma promessa?' },
    { frase: 'I think the characters kept their promises.', dica: 0, traducao: 'Acho que os personagens cumpriram as promessas.' }
  ]
});
</script>
