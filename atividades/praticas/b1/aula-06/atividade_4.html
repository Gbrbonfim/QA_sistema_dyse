/* B1 · Class 06 · Fala (Unlock your cleaning motivation)
   Alinhado ao vocabulário de tarefas domésticas, ao Talking Point (motivação, dicas para quem

DysePratica.iniciar({
  course: 'ativ-b1', aula: 6, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "I've already made my bed today.", dica: 0, traducao: 'Já arrumei a minha cama hoje.' },
    { frase: "I've just done the washing up.", dica: 0, traducao: 'Acabei de lavar a louça.' },
    { frase: "I haven't taken out the rubbish yet.", dica: 0, traducao: 'Ainda não tirei o lixo.' },
    { frase: 'Have you finished the cleaning yet?', dica: 0, traducao: 'Você já terminou a limpeza?' },
    { frase: "She's already folded the clothes.", dica: 0, traducao: 'Ela já dobrou as roupas.' },
    { frase: "He's just finished the laundry.", dica: 0, traducao: 'Ele acabou de terminar a roupa.' },
    { frase: "Be careful! I've just mopped the floor.", dica: 0, traducao: 'Cuidado! Acabei de passar pano no chão.' },
    { frase: "We haven't vacuumed the living room yet.", dica: 0, traducao: 'Ainda não passamos aspirador na sala.' },
    { frase: "Have you loaded the washing machine? Yes, I have.", dica: 0, traducao: 'Você colocou a roupa na máquina? Sim.' },
    { frase: 'I usually do the laundry on Saturday mornings.', dica: 0, traducao: 'Normalmente lavo a roupa nas manhãs de sábado.' },
    { frase: 'I hate ironing clothes. It is my least favorite chore.', dica: 0, traducao: 'Odeio passar roupa. É a tarefa de que menos gosto.' },
    { frase: 'Music helps me feel motivated to do housework.', dica: 0, traducao: 'A música me ajuda a ficar motivado para fazer as tarefas de casa.' },
    { frase: 'Start with an easy room, like the living room.', dica: 0, traducao: 'Comece por um cômodo fácil, como a sala.' },
    { frase: 'Use a timer and clean for a short time.', dica: 0, traducao: 'Use um timer e limpe por pouco tempo.' },
    { frase: 'Write a short list with two or three tasks.', dica: 0, traducao: 'Escreva uma lista curta com duas ou três tarefas.' },
    { frase: 'Any small cleaning is important.', dica: 0, traducao: 'Qualquer pequena limpeza é importante.' },
    { frase: 'Cleaning is a habit.', dica: 0, traducao: 'Limpeza é um hábito.' },
    { frase: 'Sorry, I have just spilled water on the table.', dica: 0, traducao: 'Desculpe, acabei de derramar água na mesa.' },
    { frase: 'We can go now. We have just had lunch.', dica: 0, traducao: 'Podemos ir agora. Acabamos de almoçar.' },
    { frase: 'Which chores do you do every day?', dica: 0, traducao: 'Quais tarefas você faz todos os dias?' }
  ]
});
