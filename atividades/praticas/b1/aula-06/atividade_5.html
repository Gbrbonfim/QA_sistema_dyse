<script>
/* B1 · Class 06 · Gramática (Unlock your cleaning motivation)
   Alinhado ao vocabulário (do the washing up, take out the rubbish, iron clothes...) e ao
   "Grammar Point": just (acabou de acontecer, antes do verbo), already (antes de agora ou mais
   cedo que o esperado, antes do verbo), yet (perguntas e negativas, no fim). Conteúdo NOVO.
   24 questões. */
const V = 'Choose the right word';
DysePratica.iniciar({
  course: 'ativ-b1', aula: 6, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { instrucao: V, frase: 'Can you ___ the rubbish, please? The bin is full.', opcoes: ['take out', 'do', 'make'], certa: 0, traducao: 'Você pode tirar o lixo, por favor? A lixeira está cheia.' },
    { instrucao: V, frase: 'After dinner, I always do the ___.', opcoes: ['rubbish', 'washing up', 'floor'], certa: 1, traducao: 'Depois do jantar, sempre lavo a louça.' },
    { instrucao: V, frase: 'My shirt is wrinkled. I need to ___ it.', opcoes: ['sweep', 'mop', 'iron'], certa: 2, traducao: 'A minha camisa está amassada. Preciso passá-la.' },
    { instrucao: V, frase: 'I use a broom to ___ the floor.', opcoes: ['sweep', 'iron', 'load'], certa: 0, traducao: 'Uso uma vassoura para varrer o chão.' },
    { instrucao: V, frase: 'First ___ the washing machine, then hang the clothes.', opcoes: ['take out', 'load', 'fold'], certa: 1, traducao: 'Primeiro coloque a roupa na máquina, depois estenda as roupas.' },
    { instrucao: V, frase: 'Your bedroom is a mess! Please ___.', opcoes: ['take out', 'iron', 'tidy up'], certa: 2, traducao: 'O seu quarto está uma bagunça! Arrume, por favor.' },
    { frase: "I've ___ done the washing up. Look, the plates are still wet.", opcoes: ['just', 'yet', 'ever'], certa: 0, traducao: 'Acabei de lavar a louça. Olhe, os pratos ainda estão molhados.' },
    { frase: "Have you cleaned your room ___?", opcoes: ['ago', 'yet', 'just'], certa: 1, traducao: 'Você já limpou o seu quarto?' },
    { frase: "I haven't ironed my shirt ___.", opcoes: ['ago', 'just', 'yet'], certa: 2, traducao: 'Ainda não passei a minha camisa.' },
    { frase: "Wow, you've ___ finished? You started ten minutes ago!", opcoes: ['already', 'yet', 'ever'], certa: 0, traducao: 'Uau, você já terminou? Você começou há dez minutos!' },
    { frase: 'We use "just" for something that happened ___.', opcoes: ['a long time ago', 'very recently', 'in the future'], certa: 1, traducao: 'Usamos "just" para algo que aconteceu muito recentemente.' },
    { frase: 'We use "yet" in ___.', opcoes: ['affirmative sentences only', 'the middle of the sentence', 'questions and negatives'], certa: 2, traducao: 'Usamos "yet" em perguntas e negativas.' },
    { frase: '"Yet" goes ___ of the sentence.', opcoes: ['at the end', 'at the beginning', 'in the middle'], certa: 0, traducao: '"Yet" vai no fim da frase.' },
    { frase: '"Just" and "already" go ___ the main verb.', opcoes: ['after', 'before', 'instead of'], certa: 1, traducao: '"Just" e "already" vão antes do verbo principal.' },
    { frase: 'Why is the floor wet? — I ___ it.', opcoes: ['just have mopped', 'have mopped yet', "'ve just mopped"], certa: 2, traducao: 'Por que o chão está molhado? — Acabei de passar pano.' },
    { frase: 'Julia ___ already cleaned the bathroom.', opcoes: ['has', 'have', 'is'], certa: 0, traducao: 'A Julia já limpou o banheiro.' },
    { frase: "They ___ hung the clothes yet.", opcoes: ["hasn't", "haven't", "didn't"], certa: 1, traducao: 'Eles ainda não estenderam as roupas.' },
    { frase: 'Ouch! He has just ___ off his bike.', opcoes: ['fell', 'fall', 'fallen'], certa: 2, traducao: 'Ai! Ele acabou de cair da bicicleta.' },
    { frase: 'Look how happy she is! She has just ___ the race.', opcoes: ['won', 'winned', 'win'], certa: 0, traducao: 'Olhe como ela está feliz! Ela acabou de ganhar a corrida.' },
    { frase: 'Sorry, I have just ___ coffee on your book.', opcoes: ['spill', 'spilled', 'spilling'], certa: 1, traducao: 'Desculpe, acabei de derramar café no seu livro.' },
    { frase: 'Has Luca loaded the washing machine? — Yes, he ___.', opcoes: ['did', 'have', 'has'], certa: 2, traducao: 'O Luca colocou a roupa na máquina? — Sim.' },
    { frase: "Brandon says to start with ___ room, like the living room.", opcoes: ['an easy', 'the most difficult', 'the dirtiest'], certa: 0, traducao: 'O Brandon diz para começar por um cômodo fácil, como a sala.' },
    { frase: 'Brandon prefers ___ lists with two or three tasks.', opcoes: ['long', 'short', 'no'], certa: 1, traducao: 'O Brandon prefere listas curtas com duas ou três tarefas.' },
    { frase: 'For Brandon, cleaning is ___.', opcoes: ['only for professionals', 'only big jobs', 'a habit'], certa: 2, traducao: 'Para o Brandon, limpar é um hábito.' }
  ]
});
</script>
