<script>
/* B1 · Class 30 · Gramática (Review Classes 21-29)
   Revisão cumulativa: condicionais (21-23), for / since (24), comparativos, superlativos e
   preposições (25), relative clauses e personalidade (26), used to (27), so / neither e
   semelhanças (28-29) e sustentabilidade (22). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 30, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'If you heat ice, it ___.', opcoes: ['melts', 'melting', 'melted'], certa: 0, traducao: 'Se você esquenta gelo, ele derrete.' },
    { frase: 'If it rains tomorrow, we ___ stay at home.', opcoes: ['would', 'will', 'are'], certa: 1, traducao: 'Se chover amanhã, vamos ficar em casa.' },
    { frase: "If I ___ rich, I'd travel the world.", opcoes: ['am', 'will be', 'were'], certa: 2, traducao: 'Se eu fosse rico, viajaria pelo mundo.' },
    { frase: 'How long ___ you known her?', opcoes: ['have', 'has', 'did'], certa: 0, traducao: 'Há quanto tempo você a conhece?' },
    { frase: "She's lived here ___ 2015.", opcoes: ['for', 'since', 'ago'], certa: 1, traducao: 'Ela mora aqui desde 2015.' },
    { frase: "We've been friends ___ ten years.", opcoes: ['since', 'ago', 'for'], certa: 2, traducao: 'Somos amigos há dez anos.' },
    { frase: 'Tokyo is ___ than my hometown.', opcoes: ['bigger', 'more big', 'biggest'], certa: 0, traducao: 'Tóquio é maior que a minha cidade natal.' },
    { frase: "It's the ___ restaurant in town.", opcoes: ['better', 'best', 'good'], certa: 1, traducao: 'É o melhor restaurante da cidade.' },
    { frase: 'The metro is as fast ___ the bus.', opcoes: ['than', 'that', 'as'], certa: 2, traducao: 'O metrô é tão rápido quanto o ônibus.' },
    { frase: 'My plans depend ___ the weather.', opcoes: ['on', 'of', 'in'], certa: 0, traducao: 'Os meus planos dependem do tempo.' },
    { frase: "She's interested ___ art.", opcoes: ['on', 'in', 'at'], certa: 1, traducao: 'Ela tem interesse em arte.' },
    { frase: 'A tailor is someone ___ adjusts clothes.', opcoes: ['which', 'where', 'who'], certa: 2, traducao: 'Um alfaiate é alguém que ajusta roupas.' },
    { frase: 'This is the park ___ I used to play.', opcoes: ['where', 'who', 'which'], certa: 0, traducao: 'Este é o parque onde eu brincava.' },
    { frase: "I ___ have long hair, but now it's short.", opcoes: ['use to', 'used to', 'using to'], certa: 1, traducao: 'Eu tinha cabelo comprido, mas agora está curto.' },
    { frase: '___ you use to play outside?', opcoes: ['Were', 'Do', 'Did'], certa: 2, traducao: 'Você costumava brincar na rua?' },
    { frase: "A: I haven't seen that film. B: Neither ___ I.", opcoes: ['have', 'did', 'do'], certa: 0, traducao: 'A: Não vi esse filme. B: Eu também não.' },
    { frase: "A: I'd like a coffee. B: So ___ I.", opcoes: ['will', 'would', 'do'], certa: 1, traducao: 'A: Eu queria um café. B: Eu também.' },
    { instrucao: 'A: "I didn\'t sleep well." What does B say?', frase: '___', opcoes: ['So did I.', 'Neither do I.', 'Neither did I.'], certa: 2, traducao: 'Eu também não.' },
    { frase: "She never cancels plans. She's ___.", opcoes: ['reliable', 'creative', 'ambitious'], certa: 0, traducao: 'Ela nunca cancela planos. É confiável.' },
    { frase: "He prefers small groups to big parties. He's ___.", opcoes: ['extroverted', 'introverted', 'confident'], certa: 1, traducao: 'Ele prefere grupos pequenos a festas grandes. É introvertido.' },
    { frase: "Don't ___ your old clothes; donate them.", opcoes: ['wear', 'buy', 'throw away'], certa: 2, traducao: 'Não jogue fora as suas roupas velhas; doe.' },
    { frase: 'Cheap clothes made very quickly by big companies are called ___.', opcoes: ['fast fashion', 'sustainable', 'landfill'], certa: 0, traducao: 'Roupas baratas feitas muito rápido por grandes empresas são fast fashion.' },
    { frase: 'My brother and I look ___ each other.', opcoes: ['as', 'like', 'from'], certa: 1, traducao: 'O meu irmão e eu somos parecidos.' },
    { frase: 'I have the same phone ___ you.', opcoes: ['like', 'than', 'as'], certa: 2, traducao: 'Tenho o mesmo celular que você.' }
  ]
});
</script>
