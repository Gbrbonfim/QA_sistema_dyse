<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* B1 · Class 30 · Escuta (Review Classes 21-29)
   Revisão: zero, first e second conditional (21-23), present perfect + for / since (24),
   comparativos e preposições (25), relative clauses e personalidade (26), used to e
   aparência (27), so / neither e semelhanças (28-29) e vocabulário de sustentabilidade (22).
   Conteúdo NOVO. 24 questões. */
let n = 0;
const q = (audioTexto, certa, iscas, icon) => {
  const pos = n++ % 3;
  const ns = iscas.slice(0, 2);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(c => ({ label: c, icon })), certa: pos };
};
const AT = 'always true', FU = 'a possible future situation', IM = 'an imaginary situation';
const S = 'Listen. You are the same. How do you answer?', P = 'Listen. What is this person like?',
  T = "It's 2026 now. Listen. When did it start?", W = 'Listen. What is it?', M = 'Listen. What does it mean?',
  H = 'Listen. Which preposition do you hear?';
DysePratica.iniciar({
  course: 'ativ-b1', aula: 30, num: 1, tipo: 'imagem',
  instrucao: 'Listen. What kind of situation is it?',
  itens: [
    q('If you freeze water, it becomes ice.', AT, [FU, IM], 'help'),
    q("If it's sunny this weekend, we'll have a barbecue.", FU, [AT, IM], 'help'),
    q("If I lived in Japan, I'd eat sushi every day.", IM, [FU, AT], 'help'),
    q('If you heat chocolate, it melts.', AT, [IM, FU], 'help'),
    q("If I wake up early tomorrow, I'll go running.", FU, [IM, AT], 'help'),
    q("If I were a bird, I'd fly over the ocean.", IM, [AT, FU], 'help'),
    { instrucao: S, ...q('I used to have a bowl cut.', 'So did I.', ['So was I.', 'So do I.'], 'forum') },
    { instrucao: S, ...q("I've never been to Brussels.", 'Neither have I.', ['Neither did I.', 'So have I.'], 'forum') },
    { instrucao: S, ...q("I'm not very ambitious.", 'Neither am I.', ['Neither do I.', 'So am I.'], 'forum') },
    { instrucao: S, ...q("I'd love to try a clothes swap.", 'So would I.', ['So do I.', 'So will I.'], 'forum') },
    { instrucao: P, ...q('You can always trust him. He never forgets anything.', 'reliable', ['creative', 'introverted'], 'psychology') },
    { instrucao: P, ...q("She feels full of energy when she's around a lot of people.", 'extroverted', ['introverted', 'independent'], 'psychology') },
    { instrucao: P, ...q("He doesn't get stressed easily. He's always calm.", 'easy-going', ['ambitious', 'confident'], 'psychology') },
    { instrucao: T, ...q("I've lived in this flat for three years.", 'in 2023', ['in 2020', 'three months ago'], 'schedule') },
    { instrucao: T, ...q("She's worked as a nurse since 2010.", 'in 2010', ['in 2016', 'ten years ago'], 'schedule') },
    { instrucao: W, ...q("It's an event where people exchange clothes they don't wear any more.", 'a clothes swap', ['a landfill', 'a tailor'], 'checkroom') },
    { instrucao: W, ...q("It's a person who changes clothes so that they fit you.", 'a tailor', ['a stylist', 'a nanny'], 'checkroom') },
    { instrucao: W, ...q("It's something which keeps your drink cold or hot for hours.", 'a stainless steel tumbler', ['a hoodie', 'a fanny pack'], 'checkroom') },
    { instrucao: M, ...q('Here, the train is as cheap as the bus.', 'They cost the same.', ['The train is cheaper.', 'The bus is cheaper.'], 'location_city') },
    { instrucao: M, ...q('This is the busiest street in the city.', 'No other street there is busier.', ['It is a quiet street.', 'Other streets are busier.'], 'location_city') },
    { instrucao: H, ...q('Your opinion depends on how often you travel.', 'on', ['of', 'in'], 'hearing') },
    { instrucao: H, ...q("He's afraid of travelling alone.", 'of', ['about', 'from'], 'hearing') },
    { instrucao: M, ...q('I used to wear make-up every day, but now I prefer a natural look.', "The speaker doesn't wear much make-up now.", ['The speaker wears a lot of make-up now.', 'The speaker never wore make-up.'], 'history') },
    { instrucao: M, ...q('We waste water when we leave the tap on.', 'We use it badly.', ['We save it.', 'We clean it.'], 'eco') }
  ]
});
</script>
