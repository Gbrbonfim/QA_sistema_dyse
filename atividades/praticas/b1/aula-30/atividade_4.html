/* B1 · Class 30 · Fala (Review Classes 21-29)
   Alinhado ao Talking Point da revisão ("Can you...?": condicionais, How long have you...?,
   comparar cidades, pessoas importantes, used to, so / neither) e ao vocabulário de
   personalidade, aparência e sustentabilidade. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 30, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'If you heat chocolate, it melts.', dica: 0, traducao: 'Se você esquenta chocolate, ele derrete.' },
    { frase: "If I wake up early tomorrow, I'll go for a run.", dica: 0, traducao: 'Se eu acordar cedo amanhã, vou correr.' },
    { frase: "I'll be tired tomorrow if I go to bed late.", dica: 0, traducao: 'Vou estar cansado amanhã se for dormir tarde.' },
    { frase: "If it's sunny this weekend, we'll go to the beach.", dica: 0, traducao: 'Se fizer sol neste fim de semana, vamos à praia.' },
    { frase: "If I had more money, I'd travel around the world.", dica: 0, traducao: 'Se eu tivesse mais dinheiro, viajaria pelo mundo.' },
    { frase: 'How long have you studied English?', dica: 0, traducao: 'Há quanto tempo você estuda inglês?' },
    { frase: "I've lived in my city since I was born.", dica: 0, traducao: 'Moro na minha cidade desde que nasci.' },
    { frase: 'Paris is bigger than Brussels.', dica: 0, traducao: 'Paris é maior que Bruxelas.' },
    { frase: 'Venice is one of the most beautiful cities in the world.', dica: 0, traducao: 'Veneza é uma das cidades mais bonitas do mundo.' },
    { frase: 'My grandmother is the person who taught me to cook.', dica: 0, traducao: 'A minha avó é a pessoa que me ensinou a cozinhar.' },
    { frase: 'My best friend is reliable and very supportive.', dica: 0, traducao: 'O meu melhor amigo é confiável e me apoia muito.' },
    { frase: 'She has curly hair and a ponytail.', dica: 0, traducao: 'Ela tem cabelo cacheado e rabo de cavalo.' },
    { frase: 'I used to play outside every day when I was a child.', dica: 0, traducao: 'Eu brincava na rua todos os dias quando era criança.' },
    { frase: "I didn't use to have a phone.", dica: 0, traducao: 'Eu não tinha celular.' },
    { frase: 'So do I. I love that song.', dica: 0, traducao: 'Eu também. Adoro essa música.' },
    { frase: "Neither have I. I'd like to go there.", dica: 0, traducao: 'Eu também não. Gostaria de ir lá.' },
    { frase: 'We have a lot in common.', dica: 0, traducao: 'Temos muito em comum.' },
    { frase: 'Buying sustainable products helps the planet.', dica: 0, traducao: 'Comprar produtos sustentáveis ajuda o planeta.' },
    { frase: "Don't throw away your old clothes. Donate them.", dica: 0, traducao: 'Não jogue fora as suas roupas velhas. Doe.' },
    { frase: 'The city is famous for its colourful buildings.', dica: 0, traducao: 'A cidade é famosa pelos prédios coloridos.' }
  ]
});
</script>
