/* B1 · Class 27 · Fala (Then vs. Now)
   Alinhado ao Warm Up (década), ao vídeo e ao Talking Point (infância nos anos 90 x hoje,
   liberdade x proteção, pais rígidos ou tranquilos), ao "Grammar Point" (used to; som de
   "used to" junto) e ao Speaking de aparência. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 27, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Which decade is it?', dica: 0, traducao: 'Que década é essa?' },
    { frase: 'I used to have long, curly hair.', dica: 0, traducao: 'Eu tinha cabelo comprido e cacheado.' },
    { frase: 'Now I have short, straight hair.', dica: 0, traducao: 'Agora tenho cabelo curto e liso.' },
    { frase: 'I used to wear baggy jeans and colorful pullovers.', dica: 0, traducao: 'Eu usava calça larga e blusas coloridas.' },
    { frase: 'Now I wear basic clothes and sneakers.', dica: 0, traducao: 'Agora uso roupas básicas e tênis.' },
    { frase: 'My parents used to shout to call me home.', dica: 0, traducao: 'Os meus pais gritavam para me chamar para casa.' },
    { frase: 'Kids used to drink water from the garden hose.', dica: 0, traducao: 'As crianças bebiam água da mangueira.' },
    { frase: "Parents didn't use to worry so much about safety.", dica: 0, traducao: 'Os pais não se preocupavam tanto com segurança.' },
    { frase: 'Did you use to play outside after school?', dica: 0, traducao: 'Você costumava brincar na rua depois da escola?' },
    { frase: 'Yes, I did. I used to ride my bike every day.', dica: 0, traducao: 'Sim. Eu andava de bicicleta todos os dias.' },
    { frase: "I didn't use to have a phone.", dica: 0, traducao: 'Eu não tinha celular.' },
    { frase: 'Today, kids have smartwatches.', dica: 0, traducao: 'Hoje, as crianças têm relógios inteligentes.' },
    { frase: 'Now parents use a mobile app to track their kids.', dica: 0, traducao: 'Agora os pais usam um aplicativo para acompanhar os filhos.' },
    { frase: 'Some people say childhood in the nineties was better.', dica: 0, traducao: 'Algumas pessoas dizem que a infância nos anos noventa era melhor.' },
    { frase: 'Should kids have more freedom or more protection?', dica: 0, traducao: 'As crianças deveriam ter mais liberdade ou mais proteção?' },
    { frase: 'Did you grow up with strict or relaxed parents?', dica: 0, traducao: 'Você cresceu com pais rígidos ou tranquilos?' },
    { frase: "He used to have a mullet. Now he's bald.", dica: 0, traducao: 'Ele tinha um mullet. Agora é careca.' },
    { frase: 'She used to have a fringe and a ponytail.', dica: 0, traducao: 'Ela tinha franja e rabo de cavalo.' },
    { frase: 'We used to watch other kids play video games.', dica: 0, traducao: 'A gente ficava vendo outras crianças jogarem videogame.' },
    { frase: 'Water balloons are easy and fast to fill up now.', dica: 0, traducao: 'Os balões de água são fáceis e rápidos de encher agora.' }
  ]
});
</script>
