/* B1 · Class 24 · Fala (From Clicks to Causes)
   Alinhado ao Warm Up (usar a fama para boas causas), ao Reading, ao "Grammar Point"
   (present perfect + for / since; pronúncia de since x science) e ao Speaking (Do you...?
   + How long have you...?). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 24, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Is it possible to use fame for good causes?', dica: 0, traducao: 'É possível usar a fama para boas causas?' },
    { frase: 'How long have you lived here?', dica: 0, traducao: 'Há quanto tempo você mora aqui?' },
    { frase: "I've lived here for five years.", dica: 0, traducao: 'Moro aqui há cinco anos.' },
    { frase: 'She has worked here since last year.', dica: 0, traducao: 'Ela trabalha aqui desde o ano passado.' },
    { frase: "We've known each other for a long time.", dica: 0, traducao: 'Nós nos conhecemos há muito tempo.' },
    { frase: 'He has made science videos for more than ten years.', dica: 0, traducao: 'Ele faz vídeos de ciência há mais de dez anos.' },
    { frase: 'Do you follow any YouTubers?', dica: 0, traducao: 'Você segue algum youtuber?' },
    { frase: 'Yes, I do. I follow a science channel.', dica: 0, traducao: 'Sigo, sim. Sigo um canal de ciência.' },
    { frase: 'How long have you followed her?', dica: 0, traducao: 'Há quanto tempo você segue ela?' },
    { frase: "I've followed her for three years.", dica: 0, traducao: 'Sigo ela há três anos.' },
    { frase: 'Do you have a social media account?', dica: 0, traducao: 'Você tem conta em alguma rede social?' },
    { frase: 'How long have you had it?', dica: 0, traducao: 'Há quanto tempo você tem?' },
    { frase: "I haven't posted anything for a month.", dica: 0, traducao: 'Não posto nada há um mês.' },
    { frase: 'He has donated millions of dollars to good causes.', dica: 0, traducao: 'Ele já doou milhões de dólares para boas causas.' },
    { frase: 'She has inspired young people to be confident.', dica: 0, traducao: 'Ela inspirou jovens a ter confiança.' },
    { frase: 'They have used their fame to help others.', dica: 0, traducao: 'Eles usaram a fama para ajudar os outros.' },
    { frase: 'Some people say influencers help others only to get famous.', dica: 0, traducao: 'Algumas pessoas dizem que influencers ajudam os outros só para ficar famosos.' },
    { frase: "I've been a fan of his music since high school.", dica: 0, traducao: 'Sou fã da música dele desde o ensino médio.' },
    { frase: 'How long has she taught English?', dica: 0, traducao: 'Há quanto tempo ela ensina inglês?' },
    { frase: "Since and science don't sound the same.", dica: 0, traducao: 'Since e science não soam iguais.' }
  ]
});
</script>
