<script>
/* B1 · Class 32 · Escrita (The Case of the Missing Contract)
   Alinhado ao "Grammar Point" (perguntas de sujeito sem auxiliar: Who entered? What
   happened? Which suspect had? x perguntas de objeto com did / does: What did you do?
   Where did the witness see? Where does Sherlock live?). Conteúdo NOVO. 20 questões. */
const M = pt => 'Write the question in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-b1', aula: 31, num: 7, tipo: 'montar',
  instrucao: 'Click the words and make the question (one word is extra)',
  itens: [
    { contexto: M('Quem entrou no escritório primeiro?'), palavras: ['Who', 'entered', 'the', 'office', 'first'], isca: ['did'], fim: '?', traducao: 'Quem entrou no escritório primeiro?' },
    { contexto: M('O que você fez entre nove e onze?'), palavras: ['What', 'did', 'you', 'do', 'between', 'nine', 'and', 'eleven'], isca: ['done'], fim: '?', traducao: 'O que você fez entre nove e onze?' },
    { contexto: M('Quem fez este café?'), palavras: ['Who', 'made', 'this', 'coffee'], isca: ['did'], fim: '?', traducao: 'Quem fez este café?' },
    { contexto: M('A que horas você fez o café?'), palavras: ['What', 'time', 'did', 'you', 'make', 'the', 'coffee'], isca: ['made'], fim: '?', traducao: 'A que horas você fez o café?' },
    { contexto: M('O que aconteceu na cena do crime?'), palavras: ['What', 'happened', 'at', 'the', 'crime', 'scene'], isca: ['did'], fim: '?', traducao: 'O que aconteceu na cena do crime?' },
    { contexto: M('O que o detetive encontrou debaixo da mesa?'), palavras: ['What', 'did', 'the', 'detective', 'find', 'under', 'the', 'desk'], isca: ['found'], fim: '?', traducao: 'O que o detetive encontrou debaixo da mesa?' },
    { contexto: M('Quem ouviu o barulho estranho ontem à noite?'), palavras: ['Who', 'heard', 'the', 'strange', 'noise', 'last', 'night'], isca: ['did'], fim: '?', traducao: 'Quem ouviu o barulho estranho ontem à noite?' },
    { contexto: M('Onde a testemunha viu o suspeito?'), palavras: ['Where', 'did', 'the', 'witness', 'see', 'the', 'suspect'], isca: ['saw'], fim: '?', traducao: 'Onde a testemunha viu o suspeito?' },
    { contexto: M('Qual suspeito tinha um motivo claro?'), palavras: ['Which', 'suspect', 'had', 'a', 'clear', 'motive'], isca: ['did'], fim: '?', traducao: 'Qual suspeito tinha um motivo claro?' },
    { contexto: M('Quem revelou a verdade no final?'), palavras: ['Who', 'revealed', 'the', 'truth', 'in', 'the', 'end'], isca: ['did'], fim: '?', traducao: 'Quem revelou a verdade no final?' },
    { contexto: M('Quando a investigação começou?'), palavras: ['When', 'did', 'the', 'investigation', 'begin'], isca: ['began'], fim: '?', traducao: 'Quando a investigação começou?' },
    { contexto: M('Quantas pistas o detetive encontrou?'), palavras: ['How', 'many', 'clues', 'did', 'the', 'detective', 'find'], isca: ['found'], fim: '?', traducao: 'Quantas pistas o detetive encontrou?' },
    { contexto: M('Quem criou o Sherlock Holmes?'), palavras: ['Who', 'created', 'Sherlock', 'Holmes'], isca: ['did'], fim: '?', traducao: 'Quem criou o Sherlock Holmes?' },
    { contexto: M('Onde o Sherlock Holmes mora?'), palavras: ['Where', 'does', 'Sherlock', 'Holmes', 'live'], isca: ['lives'], fim: '?', traducao: 'Onde o Sherlock Holmes mora?' },
    { contexto: M('Quem interpreta o Sherlock na série da BBC?'), palavras: ['Who', 'plays', 'Sherlock', 'in', 'the', 'BBC', 'series'], isca: ['does'], fim: '?', traducao: 'Quem interpreta o Sherlock na série da BBC?' },
    { contexto: M('O que normalmente acontece no começo de uma história de mistério?'), palavras: ['What', 'usually', 'happens', 'at', 'the', 'beginning', 'of', 'a', 'mystery', 'story'], isca: ['does'], fim: '?', traducao: 'O que normalmente acontece no começo de uma história de mistério?' },
    { contexto: M('Para quem você ligou ontem?'), palavras: ['Who', 'did', 'you', 'call', 'yesterday'], isca: ['called'], fim: '?', traducao: 'Para quem você ligou ontem?' },
    { contexto: M('Quem te ligou ontem?'), palavras: ['Who', 'called', 'you', 'yesterday'], isca: ['did'], fim: '?', traducao: 'Quem te ligou ontem?' },
    { contexto: M('O que fez o alarme disparar?'), palavras: ['What', 'caused', 'the', 'alarm', 'to', 'go', 'off'], isca: ['did'], fim: '?', traducao: 'O que fez o alarme disparar?' },
    { contexto: M('Quem saiu da sala antes de a polícia chegar?'), palavras: ['Who', 'left', 'the', 'room', 'before', 'the', 'police', 'arrived'], isca: ['did'], fim: '?', traducao: 'Quem saiu da sala antes de a polícia chegar?' }
  ]
});
</script>
