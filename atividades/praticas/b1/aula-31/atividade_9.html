<script>
/* B1 · Class 32 · Fala (The Case of the Missing Contract)
   Alinhado ao "Grammar Point" (perguntas de sujeito e de objeto) e ao Role-Play (o detetive
   faz pelo menos quatro perguntas e decide quem é o responsável). Conteúdo NOVO.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 31, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Who entered the office first?', dica: 0, traducao: 'Quem entrou no escritório primeiro?' },
    { frase: 'What did you do between nine and eleven?', dica: 0, traducao: 'O que você fez entre nove e onze?' },
    { frase: 'Who made this coffee?', dica: 0, traducao: 'Quem fez este café?' },
    { frase: 'What time did you make it?', dica: 0, traducao: 'A que horas você fez?' },
    { frase: 'Who was the last person alone in this office?', dica: 0, traducao: 'Quem foi a última pessoa sozinha neste escritório?' },
    { frase: 'What happened at the crime scene?', dica: 0, traducao: 'O que aconteceu na cena do crime?' },
    { frase: 'What did the detective find under the desk?', dica: 0, traducao: 'O que o detetive encontrou debaixo da mesa?' },
    { frase: 'Who heard the strange noise last night?', dica: 0, traducao: 'Quem ouviu o barulho estranho ontem à noite?' },
    { frase: 'Where did the witness see the suspect?', dica: 0, traducao: 'Onde a testemunha viu o suspeito?' },
    { frase: 'Which suspect had a clear motive?', dica: 0, traducao: 'Qual suspeito tinha um motivo claro?' },
    { frase: 'Who left the room before the police arrived?', dica: 0, traducao: 'Quem saiu da sala antes de a polícia chegar?' },
    { frase: 'What caused the alarm to go off?', dica: 0, traducao: 'O que fez o alarme disparar?' },
    { frase: 'When did the investigation begin?', dica: 0, traducao: 'Quando a investigação começou?' },
    { frase: 'How many clues did the detective find?', dica: 0, traducao: 'Quantas pistas o detetive encontrou?' },
    { frase: 'Who revealed the truth in the end?', dica: 0, traducao: 'Quem revelou a verdade no final?' },
    { frase: 'Who plays Sherlock in the BBC series?', dica: 0, traducao: 'Quem interpreta o Sherlock na série da BBC?' },
    { frase: 'Where does Sherlock Holmes live?', dica: 0, traducao: 'Onde o Sherlock Holmes mora?' },
    { frase: 'Who wrote Murder on the Orient Express?', dica: 0, traducao: 'Quem escreveu Assassinato no Expresso do Oriente?' },
    { frase: 'The detective must ask the right questions.', dica: 0, traducao: 'O detetive precisa fazer as perguntas certas.' },
    { frase: 'I think the assistant is responsible.', dica: 0, traducao: 'Acho que o assistente é o responsável.' }
  ]
});
</script>
