/* B1 · Class 31 · Fala (The Case of the Missing Contract)
   Alinhado ao Warm Up (histórias de detetive, Sherlock), ao Reading / Listening (o caso do
   contrato) e ao vocabulário (suspect, motive, clue, fingerprints, witness). Conteúdo NOVO.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 31, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Have you ever read or watched any detective stories?', dica: 0, traducao: 'Você já leu ou assistiu a alguma história de detetive?' },
    { frase: 'What problems do detectives usually have to solve?', dica: 0, traducao: 'Que problemas os detetives normalmente têm que resolver?' },
    { frase: 'What makes a good detective story?', dica: 0, traducao: 'O que faz uma boa história de detetive?' },
    { frase: 'A confidential contract disappeared from the office.', dica: 0, traducao: 'Um contrato confidencial desapareceu do escritório.' },
    { frase: 'The door was locked and the window was closed.', dica: 0, traducao: 'A porta estava trancada e a janela estava fechada.' },
    { frase: 'Nothing looked broken.', dica: 0, traducao: 'Nada parecia quebrado.' },
    { frase: 'Only three people had access to the office.', dica: 0, traducao: 'Só três pessoas tinham acesso ao escritório.' },
    { frase: 'The assistant was under financial pressure.', dica: 0, traducao: 'O assistente estava sob pressão financeira.' },
    { frase: 'She wanted control of the project.', dica: 0, traducao: 'Ela queria o controle do projeto.' },
    { frase: 'Sherlock noticed fingerprints near the drawer.', dica: 0, traducao: 'O Sherlock notou impressões digitais perto da gaveta.' },
    { frase: 'The coffee was still warm.', dica: 0, traducao: 'O café ainda estava quente.' },
    { frase: 'Someone was in this office very recently.', dica: 0, traducao: 'Alguém esteve neste escritório há pouquíssimo tempo.' },
    { frase: "It's time to ask the right questions.", dica: 0, traducao: 'É hora de fazer as perguntas certas.' },
    { frase: 'Every suspect had a possible motive.', dica: 0, traducao: 'Todos os suspeitos tinham um possível motivo.' },
    { frase: 'The witness saw a man near the door.', dica: 0, traducao: 'A testemunha viu um homem perto da porta.' },
    { frase: 'Sherlock Holmes was created by Arthur Conan Doyle.', dica: 0, traducao: 'Sherlock Holmes foi criado por Arthur Conan Doyle.' },
    { frase: 'He is famous for his sharp observation.', dica: 0, traducao: 'Ele é famoso pela observação aguçada.' },
    { frase: 'Agatha Christie wrote Murder on the Orient Express.', dica: 0, traducao: 'Agatha Christie escreveu Assassinato no Expresso do Oriente.' },
    { frase: 'Small details can solve big mysteries.', dica: 0, traducao: 'Pequenos detalhes podem resolver grandes mistérios.' },
    { frase: 'In the end, the manager took the contract by mistake.', dica: 0, traducao: 'No final, o gerente levou o contrato por engano.' }
  ]
});
</script>
