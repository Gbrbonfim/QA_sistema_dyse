/* B1 · Class 37 · Fala (That's Small Talk, Isn't It?)
   Alinhado ao Role-Play (conversa com vizinho, na fila, com colega antes da reunião, no
   ponto de ônibus), às dicas do vídeo e às question tags. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 37, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "Cold morning, isn't it?", dica: 0, traducao: 'Manhã fria, não é?' },
    { frase: "Lovely weather today, isn't it?", dica: 0, traducao: 'Tempo lindo hoje, não é?' },
    { frase: 'How was your weekend?', dica: 0, traducao: 'Como foi o seu fim de semana?' },
    { frase: 'Did you get to do anything fun?', dica: 0, traducao: 'Você conseguiu fazer algo divertido?' },
    { frase: 'My sister was in town, so I showed her around.', dica: 0, traducao: 'Minha irmã estava na cidade, então mostrei tudo para ela.' },
    { frase: "That's so cool! I love your jacket.", dica: 0, traducao: 'Que legal! Adorei a sua jaqueta.' },
    { frase: 'What kind of dog do you have?', dica: 0, traducao: 'Que tipo de cachorro você tem?' },
    { frase: "The meeting starts at nine, doesn't it?", dica: 0, traducao: 'A reunião começa às nove, não começa?' },
    { frase: "You work here, don't you?", dica: 0, traducao: 'Você trabalha aqui, não trabalha?' },
    { frase: "This bus is always late, isn't it?", dica: 0, traducao: 'Este ônibus está sempre atrasado, não está?' },
    { frase: "The café isn't open yet, is it?", dica: 0, traducao: 'O café ainda não está aberto, está?' },
    { frase: "You had a good holiday, didn't you?", dica: 0, traducao: 'Você teve boas férias, não teve?' },
    { frase: "We can sit here, can't we?", dica: 0, traducao: 'Podemos sentar aqui, não podemos?' },
    { frase: "You don't live far from here, do you?", dica: 0, traducao: 'Você não mora longe daqui, mora?' },
    { frase: "It was a long meeting, wasn't it?", dica: 0, traducao: 'Foi uma reunião longa, não foi?' },
    { frase: 'Actually, no. It finishes at six thirty.', dica: 0, traducao: 'Na verdade, não. Termina às seis e meia.' },
    { frase: "Yes, they are. They're always saying hello.", dica: 0, traducao: 'São, sim. Estão sempre cumprimentando.' },
    { frase: "Well, I'd better get back to work.", dica: 0, traducao: 'Bom, é melhor eu voltar ao trabalho.' },
    { frase: 'It was nice talking to you!', dica: 0, traducao: 'Foi bom conversar com você!' },
    { frase: 'See you at the meeting later, right?', dica: 0, traducao: 'Te vejo na reunião mais tarde, certo?' }
  ]
});
</script>
