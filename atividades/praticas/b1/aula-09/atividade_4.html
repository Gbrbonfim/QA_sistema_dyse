/* B1 · Class 09 · Fala (Review Classes 1-8)
   Alinhado ao "Talking Point" da revisão (um momento que mudou a vida — past simple/continuous;
   descrever comida com verbos de sentido; experiências com present perfect; housework com
   just/already/yet; algo emocionante nas últimas férias; algo que te deixou relaxed/bored/
   surprised). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 9, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'How long have you studied English?', dica: 0, traducao: 'Há quanto tempo você estuda inglês?' },
    { frase: 'What do you like doing at the weekend?', dica: 0, traducao: 'O que você gosta de fazer no fim de semana?' },
    { frase: 'I started my new job in January.', dica: 0, traducao: 'Comecei no meu emprego novo em janeiro.' },
    { frase: 'I was living in a small town when I met my best friend.', dica: 0, traducao: 'Eu morava numa cidade pequena quando conheci o meu melhor amigo.' },
    { frase: 'While I was studying, my phone rang.', dica: 0, traducao: 'Enquanto eu estudava, o meu celular tocou.' },
    { frase: 'This bread smells delicious.', dica: 0, traducao: 'Este pão tem um cheiro delicioso.' },
    { frase: 'The soup tastes a little salty.', dica: 0, traducao: 'A sopa está um pouco salgada.' },
    { frase: 'Your new sofa feels really comfortable.', dica: 0, traducao: 'O seu sofá novo é muito confortável.' },
    { frase: 'She seems nervous today.', dica: 0, traducao: 'Ela parece nervosa hoje.' },
    { frase: 'Have you ever tried Indian food?', dica: 0, traducao: 'Você já experimentou comida indiana?' },
    { frase: "I've never eaten anything so spicy.", dica: 0, traducao: 'Nunca comi nada tão apimentado.' },
    { frase: "I've just cleaned the bathroom.", dica: 0, traducao: 'Acabei de limpar o banheiro.' },
    { frase: "I've already done the washing up.", dica: 0, traducao: 'Já lavei a louça.' },
    { frase: "I haven't ironed my clothes yet.", dica: 0, traducao: 'Ainda não passei as minhas roupas.' },
    { frase: 'Is there anything I can do to help?', dica: 0, traducao: 'Tem algo que eu possa fazer para ajudar?' },
    { frase: 'Nobody called me yesterday.', dica: 0, traducao: 'Ninguém me ligou ontem.' },
    { frase: 'I was going to go to the beach, but it rained.', dica: 0, traducao: 'Eu ia à praia, mas choveu.' },
    { frase: 'The trip was exciting and the hotel was relaxing.', dica: 0, traducao: 'A viagem foi emocionante e o hotel era relaxante.' },
    { frase: 'I was really surprised by the news.', dica: 0, traducao: 'Fiquei muito surpreso com a notícia.' },
    { frase: 'The meeting was so boring that I almost fell asleep.', dica: 0, traducao: 'A reunião foi tão chata que quase dormi.' }
  ]
});
</script>
