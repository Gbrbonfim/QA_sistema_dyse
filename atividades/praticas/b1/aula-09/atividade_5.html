<script>
/* B1 · Class 09 · Gramática (Review Classes 1-8)
   Alinhado aos exercícios da revisão (verbos de sentido seem/taste/feel/sound; housework
   phrases; adjetivos -ed/-ing) + pontos de gramática das aulas 1-8. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 9, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'This milk ___ strange. I think it is old.', opcoes: ['tastes', 'sounds', 'seems like'], certa: 0, traducao: 'Este leite está com um gosto estranho. Acho que está velho.' },
    { frase: 'Your new jacket ___ really warm.', opcoes: ['sounds', 'feels', 'tastes'], certa: 1, traducao: 'A sua jaqueta nova é bem quentinha.' },
    { frase: 'Listen! That guitar ___ amazing.', opcoes: ['tastes', 'feels', 'sounds'], certa: 2, traducao: 'Escute! Esse violão está com um som incrível.' },
    { frase: 'Our new neighbour ___ very friendly.', opcoes: ['seems', 'tastes', 'sounds like'], certa: 0, traducao: 'O nosso vizinho novo parece muito simpático.' },
    { frase: 'Your T-shirt looks ___ mine.', opcoes: ['as', 'like', 'same'], certa: 1, traducao: 'A sua camiseta parece a minha.' },
    { frase: 'Please ___ the blankets and put them in the cupboard.', opcoes: ['iron', 'sweep', 'fold'], certa: 2, traducao: 'Por favor, dobre os cobertores e guarde no armário.' },
    { frase: 'I use a broom to ___ the floor.', opcoes: ['sweep', 'iron', 'fold'], certa: 0, traducao: 'Uso uma vassoura para varrer o chão.' },
    { frase: 'The guests are coming! Let\'s ___ the living room.', opcoes: ['take out', 'tidy up', 'hang'], certa: 1, traducao: 'As visitas estão chegando! Vamos arrumar a sala.' },
    { frase: 'The flight was ___. It was eleven hours long!', opcoes: ['tired', 'tiring', 'tire'], certa: 1, traducao: 'O voo foi cansativo. Foram onze horas!' },
    { frase: 'My cat is ___ of the vacuum cleaner.', opcoes: ['frightening', 'frighten', 'frightened'], certa: 2, traducao: 'O meu gato tem medo do aspirador.' },
    { frase: 'I was ___ when I saw my exam results. They were great!', opcoes: ['surprised', 'surprising', 'surprise'], certa: 0, traducao: 'Fiquei surpreso quando vi as notas da prova. Foram ótimas!' },
    { frase: '___ do you usually have lunch?', opcoes: ['Where you', 'Where', 'Where are'], certa: 1, traducao: 'Onde você costuma almoçar?' },
    { frase: 'What time ___ the class start?', opcoes: ['do', 'is', 'does'], certa: 2, traducao: 'A que horas começa a aula?' },
    { frase: 'My grandmother was born ___ 1950.', opcoes: ['in', 'on', 'at'], certa: 0, traducao: 'A minha avó nasceu em 1950.' },
    { frase: 'See you ___ Friday!', opcoes: ['in', 'on', 'at'], certa: 1, traducao: 'Até sexta!' },
    { frase: 'I was reading ___ my mum called.', opcoes: ['while', 'during', 'when'], certa: 2, traducao: 'Eu estava lendo quando a minha mãe ligou.' },
    { frase: 'While she ___ dinner, she burned her finger.', opcoes: ['was cooking', 'cooks', 'cooked was'], certa: 0, traducao: 'Enquanto cozinhava o jantar, ela queimou o dedo.' },
    { frase: 'Have you ___ been to Argentina?', opcoes: ['yet', 'ever', 'already'], certa: 1, traducao: 'Você já foi à Argentina?' },
    { frase: 'I have ___ seen snow. I want to see it one day!', opcoes: ['ever', 'yet', 'never'], certa: 2, traducao: 'Eu nunca vi neve. Quero ver um dia!' },
    { frase: "Is the pizza ready? — No, it isn't ready ___.", opcoes: ['yet', 'already', 'just'], certa: 0, traducao: 'A pizza está pronta? — Não, ainda não está pronta.' },
    { frase: "I'm thirsty. Is there ___ to drink?", opcoes: ['nothing', 'anything', 'nowhere'], certa: 1, traducao: 'Estou com sede. Tem algo para beber?' },
    { frase: 'I can\'t find my keys ___!', opcoes: ['nowhere', 'somewhere', 'anywhere'], certa: 2, traducao: 'Não consigo achar as minhas chaves em lugar nenhum!' },
    { frase: 'We ___ going to have a picnic, but it was too cold.', opcoes: ['were', 'are', 'was'], certa: 0, traducao: 'Íamos fazer um piquenique, mas estava frio demais.' },
    { frase: "___ you going to watch the game tonight?", opcoes: ['Were', 'Are', 'Is'], certa: 1, traducao: 'Você vai assistir ao jogo hoje à noite?' }
  ]
});
</script>
