/* B1 · Class 35 · Fala (Before You Share)
   Alinhado ao Warm Up (por que histórias se espalham rápido, como saber se é real), ao
   Vocabulary (exercício 4: perguntas sobre headline, source, quote, meme...) e às dicas do
   Listening. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 35, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Always check the source before you share.', dica: 0, traducao: 'Sempre verifique a fonte antes de compartilhar.' },
    { frase: 'This headline sounds too dramatic.', dica: 0, traducao: 'Essa manchete parece dramática demais.' },
    { frase: "I'm a bit skeptical about this story.", dica: 0, traducao: 'Estou um pouco desconfiado dessa notícia.' },
    { frase: 'The video went viral in just two hours.', dica: 0, traducao: 'O vídeo viralizou em só duas horas.' },
    { frase: 'Many people share content without checking it.', dica: 0, traducao: 'Muitas pessoas compartilham conteúdo sem verificar.' },
    { frase: 'Double-check the quote before you believe it.', dica: 0, traducao: 'Confira a citação antes de acreditar.' },
    { frase: 'Misleading information can be dangerous.', dica: 0, traducao: 'Informação enganosa pode ser perigosa.' },
    { frase: 'Sensationalist language gets more clicks.', dica: 0, traducao: 'Linguagem sensacionalista ganha mais cliques.' },
    { frase: 'This meme has a fake quote from a public figure.', dica: 0, traducao: 'Este meme tem uma citação falsa de uma figura pública.' },
    { frase: "Look at the account's bio and username.", dica: 0, traducao: 'Olhe a bio e o nome de usuário da conta.' },
    { frase: 'Zoom in and look for street signs.', dica: 0, traducao: 'Dê zoom e procure placas de rua.' },
    { frase: 'This account posts seventy times a day.', dica: 0, traducao: 'Esta conta posta setenta vezes por dia.' },
    { frase: 'It may be a bot account.', dica: 0, traducao: 'Pode ser uma conta robô.' },
    { frase: 'Do a reverse image search to find the original photo.', dica: 0, traducao: 'Faça uma busca reversa de imagem para achar a foto original.' },
    { frase: 'How can we know if a news story is real?', dica: 0, traducao: 'Como podemos saber se uma notícia é real?' },
    { frase: 'Why do some stories spread so fast?', dica: 0, traducao: 'Por que algumas histórias se espalham tão rápido?' },
    { frase: 'What makes you click on a headline?', dica: 0, traducao: 'O que faz você clicar numa manchete?' },
    { frase: 'Is this source reliable?', dica: 0, traducao: 'Esta fonte é confiável?' },
    { frase: 'Checking information should be a habit.', dica: 0, traducao: 'Verificar informações deveria ser um hábito.' },
    { frase: "Don't believe everything you read online.", dica: 0, traducao: 'Não acredite em tudo que você lê na internet.' }
  ]
});
