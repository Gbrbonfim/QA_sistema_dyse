    { frase: 'The photos were taken in Mexico.', dica: 0, traducao: 'As fotos foram tiradas no México.' },
    { frase: 'The information was not checked.', dica: 0, traducao: 'A informação não foi verificada.' },
    { frase: 'The headline was written by a robot.', dica: 0, traducao: 'A manchete foi escrita por um robô.' },
    { frase: 'The Mona Lisa was painted by Leonardo da Vinci.', dica: 0, traducao: 'A Mona Lisa foi pintada por Leonardo da Vinci.' },
    { frase: 'Penicillin was discovered by Alexander Fleming.', dica: 0, traducao: 'A penicilina foi descoberta por Alexander Fleming.' },
