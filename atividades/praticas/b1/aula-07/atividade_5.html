<script>
/* B1 · Class 07 · Gramática (There's nothing like it!)
   Alinhado ao "Grammar Point I": -body (pessoas), -thing (coisas), -where (lugares); some- em
   frases positivas, any- em perguntas e negativas, no- com verbo positivo quando nenhuma
   pessoa / coisa / lugar está envolvido; any- + positivo = "não importa". Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 7, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: "I didn't see ___ at the park. It was empty.", opcoes: ['anybody', 'anywhere', 'nobody'], certa: 0, traducao: 'Não vi ninguém no parque. Estava vazio.' },
    { frase: '___ took my pen! Who was it?', opcoes: ['Anybody', 'Somebody', 'Nobody'], certa: 1, traducao: 'Alguém pegou a minha caneta! Quem foi?' },
    { frase: "There's ___ in the fridge. Let's order a pizza.", opcoes: ['anything', 'something', 'nothing'], certa: 2, traducao: 'Não há nada na geladeira. Vamos pedir uma pizza.' },
    { frase: 'Is there ___ good on TV tonight?', opcoes: ['anything', 'anybody', 'anywhere'], certa: 0, traducao: 'Tem alguma coisa boa na TV hoje à noite?' },
    { frase: 'They want to travel ___ warm in July.', opcoes: ['something', 'somewhere', 'somebody'], certa: 1, traducao: 'Eles querem viajar para algum lugar quente em julho.' },
    { frase: "We didn't go ___ last weekend. We stayed home.", opcoes: ['nowhere', 'anybody', 'anywhere'], certa: 2, traducao: 'Não fomos a lugar nenhum no último fim de semana. Ficamos em casa.' },
    { frase: '___ knows the answer. Even the teacher is confused!', opcoes: ['Nobody', 'Anybody', 'Somebody'], certa: 0, traducao: 'Ninguém sabe a resposta. Até a professora está confusa!' },
    { frase: 'Where are you going? — ___. I\'m staying here.', opcoes: ['Nothing', 'Nowhere', 'Nobody'], certa: 1, traducao: 'Aonde você vai? — A lugar nenhum. Vou ficar aqui.' },
    { frase: 'What did you buy? — ___. Everything was too expensive.', opcoes: ['Nobody', 'Nowhere', 'Nothing'], certa: 2, traducao: 'O que você comprou? — Nada. Estava tudo caro demais.' },
    { frase: 'Did ___ call while I was out?', opcoes: ['anybody', 'anywhere', 'anything'], certa: 0, traducao: 'Alguém ligou enquanto eu estava fora?' },
    { frase: 'Sit ___ you like. It doesn\'t matter.', opcoes: ['nowhere', 'anywhere', 'somebody'], certa: 1, traducao: 'Sente onde quiser. Não importa.' },
    { frase: "Don't worry. ___ can make a mistake.", opcoes: ['Nobody', 'Anything', 'Anybody'], certa: 2, traducao: 'Não se preocupe. Qualquer um pode errar.' },
    { frase: 'We use something, anything and nothing for ___.', opcoes: ['things', 'people', 'places'], certa: 0, traducao: 'Usamos something, anything e nothing para coisas.' },
    { frase: 'We use somebody, anybody and nobody for ___.', opcoes: ['places', 'people', 'things'], certa: 1, traducao: 'Usamos somebody, anybody e nobody para pessoas.' },
    { frase: 'We use somewhere, anywhere and nowhere for ___.', opcoes: ['people', 'things', 'places'], certa: 2, traducao: 'Usamos somewhere, anywhere e nowhere para lugares.' },
    { frase: 'We usually use "any-" words in ___.', opcoes: ['questions and negative sentences', 'only positive sentences', 'only names'], certa: 0, traducao: 'Normalmente usamos palavras com "any-" em perguntas e frases negativas.' },
    { frase: '"Nobody", "nothing" and "nowhere" go with a ___ verb.', opcoes: ['negative', 'positive', 'past'], certa: 1, traducao: '"Nobody", "nothing" e "nowhere" vão com verbo positivo.' },
    { instrucao: 'Choose the sentence with the same meaning: "I saw nobody."', frase: '___', opcoes: ["I didn't see nobody.", "I saw anybody.", "I didn't see anybody."], certa: 2, traducao: 'Não vi ninguém.' },
    { instrucao: 'Choose the sentence with the same meaning: "They went nowhere for vacation."', frase: '___', opcoes: ["They didn't go anywhere for vacation.", "They didn't go nowhere for vacation.", 'They went anywhere for vacation.'], certa: 0, traducao: 'Eles não foram a lugar nenhum nas férias.' },
    { instrucao: 'Choose the sentence with the same meaning: "She did nothing to prepare."', frase: '___', opcoes: ["She didn't do nothing to prepare.", "She didn't do anything to prepare.", 'She did anything to prepare.'], certa: 1, traducao: 'Ela não fez nada para se preparar.' },
    { frase: 'Why did the Heck family think it was still summer? Because ___ checked the school website.', opcoes: ['somebody', 'everybody', 'nobody'], certa: 2, traducao: 'Por que a família Heck achou que ainda era verão? Porque ninguém olhou o site da escola.' },
    { frase: 'In The Middle, the family forgot ___.', opcoes: ['the first week of school', 'a birthday party', 'a doctor appointment'], certa: 0, traducao: 'Em The Middle, a família esqueceu a primeira semana de aula.' },
    { frase: 'Sue called her senior year "___".', opcoes: ['The Best Year', 'The Year of Sue', 'The Summer of Sue'], certa: 1, traducao: 'A Sue chamou o último ano da escola de "The Year of Sue".' },
    { frase: 'Sue is upset because she is the only senior with ___.', opcoes: ['a car', 'glasses', 'braces'], certa: 2, traducao: 'A Sue está chateada porque é a única aluna do último ano com aparelho nos dentes.' }
  ]
});
</script>
