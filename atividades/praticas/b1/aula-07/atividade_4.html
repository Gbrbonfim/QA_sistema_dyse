/* B1 · Class 07 · Fala (There's nothing like it!)
   Alinhado ao episódio de The Middle (a família esqueceu a primeira semana de aula; "The Year
   of Sue"), ao Talking Point e ao "Grammar Point I: Indefinite Pronouns". Conteúdo NOVO.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 7, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "There's nothing like summer.", dica: 0, traducao: 'Não há nada como o verão.' },
    { frase: "Why didn't anybody tell us?", dica: 0, traducao: 'Por que ninguém nos contou?' },
    { frase: 'We had nowhere to go.', dica: 0, traducao: 'Não tínhamos para onde ir.' },
    { frase: 'Somebody forgot to check the school website.', dica: 0, traducao: 'Alguém esqueceu de olhar o site da escola.' },
    { frase: 'Nobody remembered to check the calendar.', dica: 0, traducao: 'Ninguém lembrou de olhar o calendário.' },
    { frase: "They didn't go anywhere all summer.", dica: 0, traducao: 'Eles não foram a lugar nenhum o verão inteiro.' },
    { frase: "She didn't do anything to get ready for school.", dica: 0, traducao: 'Ela não fez nada para se preparar para a escola.' },
    { frase: 'Anybody can forget a date.', dica: 0, traducao: 'Qualquer um pode esquecer uma data.' },
    { frase: 'They planned something fun for the last day of summer.', dica: 0, traducao: 'Eles planejaram algo divertido para o último dia do verão.' },
    { frase: 'Is there anything to eat in the fridge?', dica: 0, traducao: 'Tem alguma coisa para comer na geladeira?' },
    { frase: 'I want to go somewhere quiet this weekend.', dica: 0, traducao: 'Quero ir a algum lugar tranquilo neste fim de semana.' },
    { frase: 'There is somebody at the door.', dica: 0, traducao: 'Tem alguém na porta.' },
    { frase: 'Have you ever forgotten an important date?', dica: 0, traducao: 'Você já esqueceu uma data importante?' },
    { frase: 'I forgot my best friend\'s birthday last year.', dica: 0, traducao: 'Esqueci o aniversário do meu melhor amigo no ano passado.' },
    { frase: 'How did you handle the situation?', dica: 0, traducao: 'Como você lidou com a situação?' },
    { frase: 'The family forgot the first week of school.', dica: 0, traducao: 'A família esqueceu a primeira semana de aula.' },
    { frase: 'Sue called her senior year "The Year of Sue".', dica: 0, traducao: 'A Sue chamou o último ano da escola de "O Ano da Sue".' },
    { frase: 'On my last day of vacation, I usually stay home.', dica: 0, traducao: 'No meu último dia de férias, normalmente fico em casa.' },
    { frase: 'I feel a little sad when vacation is about to end.', dica: 0, traducao: 'Fico um pouco triste quando as férias estão para acabar.' },
    { frase: 'Did anybody call me?', dica: 0, traducao: 'Alguém me ligou?' }
  ]
});
</script>
