<script>
/* B1 · Class 08 · Fala (Plans that didn't happen)
   Alinhado ao "Grammar Point II" (be going to / was going to), aos adjetivos -ed / -ing do
   texto do Jordan e às perguntas do "Speaking and Writing". Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 7, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Sue was going to do everything this year.', dica: 0, traducao: 'A Sue ia fazer tudo neste ano.' },
    { frase: 'I was going to travel, but I changed my plans.', dica: 0, traducao: 'Eu ia viajar, mas mudei os meus planos.' },
    { frase: "I'm going to meet my friends this weekend.", dica: 0, traducao: 'Vou encontrar os meus amigos neste fim de semana.' },
    { frase: 'We were going to visit the museum, but it was closed.', dica: 0, traducao: 'Íamos visitar o museu, mas estava fechado.' },
    { frase: 'Are you going to do anything interesting for your next break?', dica: 0, traducao: 'Você vai fazer algo interessante nas próximas férias?' },
    { frase: 'The film was boring, so I was bored.', dica: 0, traducao: 'O filme era chato, então fiquei entediado.' },
    { frase: 'The news was surprising. We were all surprised.', dica: 0, traducao: 'A notícia foi surpreendente. Todos nós ficamos surpresos.' },
    { frase: 'I felt embarrassed on my first day at work.', dica: 0, traducao: 'Fiquei com vergonha no meu primeiro dia de trabalho.' },
    { frase: 'The instructions were really confusing.', dica: 0, traducao: 'As instruções eram muito confusas.' },
    { frase: 'I feel relaxed when I listen to music.', dica: 0, traducao: 'Fico relaxado quando ouço música.' },
    { frase: 'That noise is so annoying!', dica: 0, traducao: 'Esse barulho é tão irritante!' },
    { frase: 'Making new friends is exciting.', dica: 0, traducao: 'Fazer novos amigos é emocionante.' },
    { frase: 'I was excited to meet my new teacher.', dica: 0, traducao: 'Eu estava animado para conhecer o meu novo professor.' },
    { frase: 'She felt frightened before her first day at school.', dica: 0, traducao: 'Ela ficou com medo antes do primeiro dia na escola.' },
    { frase: 'The science video was more interesting than I expected.', dica: 0, traducao: 'O vídeo de ciências foi mais interessante do que eu esperava.' },
    { frase: 'Check your schedule twice.', dica: 0, traducao: 'Confira a sua agenda duas vezes.' },
    { frase: 'Prepare everything the night before.', dica: 0, traducao: 'Prepare tudo na noite anterior.' },
    { frase: "Don't panic. Stay calm.", dica: 0, traducao: 'Não entre em pânico. Fique calmo.' },
    { frase: 'Did you do anything exciting during your last holiday?', dica: 0, traducao: 'Você fez algo emocionante nas últimas férias?' },
    { frase: 'Was there anybody you were going to meet last week?', dica: 0, traducao: 'Havia alguém que você ia encontrar na semana passada?' }
  ]
});
</script>
