/* B1 · Class 05 · Fala (Food Experience Passport)
   Alinhado ao "Grammar Point" (Have you ever + particípio? Yes, I have / No, I haven't.
   I've tried... / I've never...) e às perguntas do "My Food Experience Passport".
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 4, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Have you ever tried this before?', dica: 0, traducao: 'Você já provou isto antes?' },
    { frase: "I've tried soy sauce before.", dica: 0, traducao: 'Já provei molho de soja antes.' },
    { frase: "I've never had rice for breakfast.", dica: 0, traducao: 'Nunca comi arroz no café da manhã.' },
    { frase: 'Yes, I have.', dica: 0, traducao: 'Sim, já.' },
    { frase: "No, I haven't.", dica: 0, traducao: 'Não, nunca.' },
    { frase: 'Have you ever eaten something really spicy?', dica: 0, traducao: 'Você já comeu algo muito apimentado?' },
    { frase: 'Have you ever cooked a traditional dish from another country?', dica: 0, traducao: 'Você já cozinhou um prato tradicional de outro país?' },
    { frase: 'Have you ever shared food with someone from another culture?', dica: 0, traducao: 'Você já dividiu comida com alguém de outra cultura?' },
    { frase: 'Have you ever made a food mistake?', dica: 0, traducao: 'Você já cometeu um erro na cozinha?' },
    { frase: 'Have you ever ordered food at a restaurant in English?', dica: 0, traducao: 'Você já pediu comida num restaurante em inglês?' },
    { frase: "I've never eaten blood sausage.", dica: 0, traducao: 'Nunca comi morcela.' },
    { frase: "My friend has always wanted to taste durian.", dica: 0, traducao: 'O meu amigo sempre quis provar durião.' },
    { frase: "We've never been to an African restaurant.", dica: 0, traducao: 'Nunca fomos a um restaurante africano.' },
    { frase: "She has never tried mango sticky rice.", dica: 0, traducao: 'Ela nunca provou arroz grudento com manga.' },
    { frase: "We haven't eaten anything today.", dica: 0, traducao: 'Não comemos nada hoje.' },
    { frase: 'My dad has taught me how to cook rice.', dica: 0, traducao: 'O meu pai me ensinou a cozinhar arroz.' },
    { frase: 'It was spicy, but delicious.', dica: 0, traducao: 'Era apimentado, mas delicioso.' },
    { frase: 'I tried it when I was in Thailand.', dica: 0, traducao: 'Provei quando estava na Tailândia.' },
    { frase: 'I ate it in a small restaurant in Lisbon.', dica: 0, traducao: 'Comi num pequeno restaurante em Lisboa.' },
    { frase: "I've eaten food from Thailand once.", dica: 0, traducao: 'Já comi comida da Tailândia uma vez.' }
  ]
});
</script>
