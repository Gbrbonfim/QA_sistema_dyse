/* B1 · Class 04 · Fala (Food, facts and fun)
   Alinhado aos verbos de sentido (look, look like, seem, taste, feel, smell, sound), às
   perguntas do exercício 5 (food that smells bad but tastes good...) e ao Talking Point sobre
   estereótipos. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 4, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'This looks interesting.', dica: 0, traducao: 'Isto parece interessante.' },
    { frase: 'It looks like rice pudding.', dica: 0, traducao: 'Parece arroz-doce.' },
    { frase: 'It tastes like coconut water.', dica: 0, traducao: 'Tem gosto de água de coco.' },
    { frase: 'It seems like a breakfast snack.', dica: 0, traducao: 'Parece um lanchinho de café da manhã.' },
    { frase: 'The bread feels soft and warm.', dica: 0, traducao: 'O pão está macio e quentinho.' },
    { frase: 'It smells strange but sweet.', dica: 0, traducao: 'Tem um cheiro estranho, mas doce.' },
    { frase: 'That sounds delicious!', dica: 0, traducao: 'Parece delicioso!' },
    { frase: 'This cheese smells bad, but it tastes good.', dica: 0, traducao: 'Este queijo tem cheiro ruim, mas o gosto é bom.' },
    { frase: 'Sushi looks strange, but it tastes delicious.', dica: 0, traducao: 'Sushi parece estranho, mas é delicioso.' },
    { frase: 'Some cereals seem healthy, but they have a lot of sugar.', dica: 0, traducao: 'Alguns cereais parecem saudáveis, mas têm muito açúcar.' },
    { frase: 'Which meal is the most important of the day?', dica: 0, traducao: 'Qual refeição é a mais importante do dia?' },
    { frase: 'I think breakfast is the most important meal.', dica: 0, traducao: 'Acho que o café da manhã é a refeição mais importante.' },
    { frase: 'Would you like to try blood sausage?', dica: 0, traducao: 'Você gostaria de provar morcela?' },
    { frase: 'Honey can last for thousands of years.', dica: 0, traducao: 'O mel pode durar milhares de anos.' },
    { frase: 'Carrots were originally purple.', dica: 0, traducao: 'As cenouras eram originalmente roxas.' },
    { frase: 'Bananas grow on large herbs, not trees.', dica: 0, traducao: 'As bananas crescem em ervas grandes, não em árvores.' },
    { frase: 'A stereotype is not always true.', dica: 0, traducao: 'Um estereótipo nem sempre é verdadeiro.' },
    { frase: 'Lagos, Cairo and Nairobi are big cities in Africa.', dica: 0, traducao: 'Lagos, Cairo e Nairóbi são grandes cidades da África.' },
    { frase: 'It is important to be respectful about other cultures.', dica: 0, traducao: 'É importante ser respeitoso com outras culturas.' },
    { frase: 'Your idea sounds like a lot of fun.', dica: 0, traducao: 'A sua ideia parece muito divertida.' }
  ]
});
</script>
