<script>
/* B1 · Class 05 · Gramática (Food Experience Passport)
   Alinhado ao "Grammar Point" (present perfect para experiências, sem tempo específico; Have
   you ever + particípio?; I've / I've never + particípio; has com he/she/it) e ao exercício 3
   (particípios: tried, wanted, been, eaten, written, spoken, gone, taught, made).
   Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 4, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'Have you ever ___ octopus?', opcoes: ['eaten', 'ate', 'eat'], certa: 0, traducao: 'Você já comeu polvo?' },
    { frase: "I've never ___ a word in Chinese.", opcoes: ['spoke', 'spoken', 'speak'], certa: 1, traducao: 'Nunca falei uma palavra em chinês.' },
    { frase: 'Have you ever ___ a letter to a famous person?', opcoes: ['wrote', 'write', 'written'], certa: 2, traducao: 'Você já escreveu uma carta para uma pessoa famosa?' },
    { frase: 'She ___ never tried Indian food.', opcoes: ['has', 'have', 'is'], certa: 0, traducao: 'Ela nunca provou comida indiana.' },
    { frase: 'We ___ been to a Mexican restaurant.', opcoes: ['has', 'have', 'are'], certa: 1, traducao: 'Já fomos a um restaurante mexicano.' },
    { frase: 'My grandma has ___ me how to make bread.', opcoes: ['teached', 'teach', 'taught'], certa: 2, traducao: 'A minha avó me ensinou a fazer pão.' },
    { frase: 'Have you ever ___ a cake for a friend?', opcoes: ['made', 'make', 'maked'], certa: 0, traducao: 'Você já fez um bolo para um amigo?' },
    { frase: 'Have you ever tried snails? — Yes, I ___.', opcoes: ['did', 'have', 'am'], certa: 1, traducao: 'Você já provou escargot? — Sim, já.' },
    { frase: "Has he ever cooked for his family? — No, he ___.", opcoes: ["haven't", "didn't", "hasn't"], certa: 2, traducao: 'Ele já cozinhou para a família? — Não.' },
    { frase: "They ___ eaten anything today. They're hungry.", opcoes: ["haven't", "hasn't", "aren't"], certa: 0, traducao: 'Eles não comeram nada hoje. Estão com fome.' },
    { frase: "I've ___ wanted to visit Italy.", opcoes: ['ever', 'always', 'yesterday'], certa: 1, traducao: 'Sempre quis visitar a Itália.' },
    { frase: "I've ___ eaten blood sausage. I don't want to!", opcoes: ['ever', 'yesterday', 'never'], certa: 2, traducao: 'Nunca comi morcela. Não quero!' },
    { frase: 'Have you ___ tried durian?', opcoes: ['ever', 'ago', 'yesterday'], certa: 0, traducao: 'Você já provou durião?' },
    { frase: 'We use the present perfect to talk about ___.', opcoes: ['one specific time in the past', 'life experiences with no specific time', 'future plans'], certa: 1, traducao: 'Usamos o present perfect para falar de experiências de vida sem tempo específico.' },
    { frase: 'The present perfect is have / has + ___.', opcoes: ['the base verb', 'verb + -ing', 'the past participle'], certa: 2, traducao: 'O present perfect é have / has + particípio passado.' },
    { frase: '"I\'ve" means ___.', opcoes: ['I have', 'I was', 'I am'], certa: 0, traducao: '"I\'ve" significa "I have".' },
    { frase: 'eat → ate → ___', opcoes: ['ated', 'eaten', 'eated'], certa: 1, traducao: 'comer (particípio: eaten)' },
    { frase: 'be → was → ___', opcoes: ['being', 'were', 'been'], certa: 2, traducao: 'ser/estar (particípio: been)' },
    { frase: 'write → wrote → ___', opcoes: ['written', 'writed', 'wrote'], certa: 0, traducao: 'escrever (particípio: written)' },
    { frase: 'speak → spoke → ___', opcoes: ['speaked', 'spoken', 'spoke'], certa: 1, traducao: 'falar (particípio: spoken)' },
    { frase: 'go → went → ___', opcoes: ['goed', 'went', 'gone'], certa: 2, traducao: 'ir (particípio: gone)' },
    { frase: 'try → tried → ___', opcoes: ['tried', 'tryed', 'trying'], certa: 0, traducao: 'provar, tentar (particípio: tried)' },
    { frase: 'Have you ever eaten sushi? — Yes, I have. I ___ it in Tokyo.', opcoes: ['have eaten', 'ate', 'eaten'], certa: 1, traducao: 'Você já comeu sushi? — Sim. Comi em Tóquio.' },
    { frase: '___ your parents ever travelled abroad?', opcoes: ['Has', 'Did', 'Have'], certa: 2, traducao: 'Os seus pais já viajaram para o exterior?' }
  ]
});
</script>
</body>
</html>
