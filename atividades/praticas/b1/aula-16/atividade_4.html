/* B1 · Class 16 · Fala (From TikTok to Time Clock)
   Alinhado ao Warm Up (Gen Z e outras gerações), ao artigo (problemas na contratação,
   etiquette x character, trabalho remoto, mentoring), ao "Grammar Point" (must, mustn't,
   have to, don't have to) e ao Speaking "Generations At Work". Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 16, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'You have to arrive at nine every day.', dica: 0, traducao: 'Você tem que chegar às nove todos os dias.' },
    { frase: "You don't have to wear a suit.", dica: 0, traducao: 'Você não precisa usar terno.' },
    { frase: 'You must look neat and professional.', dica: 0, traducao: 'Você deve estar arrumado e com aparência profissional.' },
    { frase: "You mustn't use your phone during meetings.", dica: 0, traducao: 'Você não pode usar o celular durante as reuniões.' },
    { frase: 'Do I have to work on weekends?', dica: 0, traducao: 'Eu tenho que trabalhar nos fins de semana?' },
    { frase: 'She has to answer emails every morning.', dica: 0, traducao: 'Ela tem que responder e-mails toda manhã.' },
    { frase: "He doesn't have to come in on Fridays.", dica: 0, traducao: 'Ele não precisa vir às sextas.' },
    { frase: 'What time does the new employee have to start?', dica: 0, traducao: 'A que horas o novo funcionário tem que começar?' },
    { frase: "Don't have to means it's not necessary.", dica: 0, traducao: "Don't have to significa que não é necessário." },
    { frase: "Mustn't means it's forbidden.", dica: 0, traducao: "Mustn't significa que é proibido." },
    { frase: 'In an interview, you should make eye contact.', dica: 0, traducao: 'Numa entrevista, você deveria fazer contato visual.' },
    { frase: 'You should answer questions confidently.', dica: 0, traducao: 'Você deveria responder às perguntas com confiança.' },
    { frase: "Candidates mustn't arrive late for interviews.", dica: 0, traducao: 'Os candidatos não podem chegar atrasados às entrevistas.' },
    { frase: 'Etiquette is easier to teach than character.', dica: 0, traducao: 'Etiqueta é mais fácil de ensinar do que caráter.' },
    { frase: 'Honesty and hard work are part of good character.', dica: 0, traducao: 'Honestidade e trabalho duro fazem parte do bom caráter.' },
    { frase: 'Many young people prefer remote and flexible jobs.', dica: 0, traducao: 'Muitos jovens preferem empregos remotos e flexíveis.' },
    { frase: 'Many of them started working during the pandemic.', dica: 0, traducao: 'Muitos deles começaram a trabalhar durante a pandemia.' },
    { frase: 'Companies should invest in mentoring and training.', dica: 0, traducao: 'As empresas deveriam investir em mentoria e treinamento.' },
    { frase: 'Do you think Gen Z talks too informally at work?', dica: 0, traducao: 'Você acha que a Geração Z fala de modo informal demais no trabalho?' },
    { frase: 'In my country, you have to arrive at work punctually.', dica: 0, traducao: 'No meu país, você tem que chegar ao trabalho pontualmente.' }
  ]
});
</script>
