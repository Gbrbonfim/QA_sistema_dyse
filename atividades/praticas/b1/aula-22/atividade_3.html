<script>
/* B1 · Class 22 · Leitura (The Green Wardrobe)
   Alinhado ao documentário (clear-out, clothes swap, tokens, tailor, stylist, fit x suit,
   fast fashion e poluição) e ao "Grammar Point" (first conditional com will / won't / can).
   Conteúdo NOVO: Hannah convence o Tom a ir a uma troca de roupas.
   20 questões: 12 de "próxima fala" + 8 de compreensão. */
const D = [
  ['Hannah', 'Tom, what are you doing with all those bags?'],
  ['Tom', "I'm doing a clear-out. I'm going to throw away some old clothes."],
  ['Hannah', "Wait! If you throw them in the bin, they'll go to the landfill."],
  ['Tom', "Oh. I didn't think about that. What should I do with them?"],
  ['Hannah', "There's a clothes swap at the library on Saturday. Why don't you come with me?"],
  ['Tom', 'How does it work? Will they pay me for my clothes?'],
  ['Hannah', "No, they won't. If you bring clothes, you'll get tokens."],
  ['Tom', 'And what can I do with the tokens?'],
  ['Hannah', "You can use them to choose other clothes. It's free!"],
  ['Tom', "Cool. But what if I find a shirt I like and it doesn't fit?"],
  ['Hannah', "If it doesn't fit, you can take it to a tailor."],
  ['Tom', "Good idea. This orange jacket is my size, but it doesn't suit me."],
  ['Hannah', 'Then bring it! Someone will love it.'],
  ['Tom', 'OK. Is it really better for the environment?'],
  ['Hannah', "Yes. If more people swap clothes, we'll produce less waste."],
  ['Tom', "And I won't spend money on fast fashion."],
  ['Hannah', 'Exactly. Fast fashion causes a lot of pollution.'],
  ['Tom', "All right, I'll come. If I enjoy it, I'll tell my friends."],
  ['Hannah', 'Great! There will be a stylist there too, so she can help you.'],
  ['Tom', "A stylist? Then I'll find my new style for free!"]
];
const lado = q => q === 'Hannah' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-b1', aula: 22, num: 3, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ["I'm doing a clear-out. I'm going to throw away some old clothes.", "I'm doing a clear-out. I'm going to throwing away some old clothes.", "I'm doing a clear-out. I'm going to buy more fast fashion."], 0, 'Estou fazendo uma limpa. Vou jogar fora umas roupas velhas.'),
    prox(2, ["Wait! If you will throw them in the bin, they'll go to the landfill.", "Wait! If you throw them in the bin, they'll go to the landfill.", "Wait! If you throw them in the bin, they'll go to a nice new home."], 1, 'Espera! Se você jogar no lixo, elas vão para o aterro.'),
    prox(4, ["There's a clothes swap at the library on Saturday. Why don't you coming with me?", "There's a clothes swap at the library on Saturday. Why you don't come with me?", "There's a clothes swap at the library on Saturday. Why don't you come with me?"], 2, 'Tem uma troca de roupas na biblioteca no sábado. Por que você não vem comigo?'),
    prox(6, ["No, they won't. If you bring clothes, you'll get tokens.", "No, they won't. If you bring clothes, you get will tokens.", "Yes, they will. If you bring clothes, they'll pay you a lot of money."], 0, 'Não. Se você levar roupas, vai ganhar fichas.'),
    prox(8, ["You can to use them to choose other clothes. It's free!", "You can use them to choose other clothes. It's free!", "You can use them to choose other clothes. It's very expensive!"], 1, 'Você pode usar para escolher outras roupas. É de graça!'),
    prox(10, ["If it don't fit, you can take it to a tailor.", "If it doesn't fit, you can take it to a dentist.", "If it doesn't fit, you can take it to a tailor."], 2, 'Se não servir, você pode levar a um alfaiate.'),
    prox(12, ['Then bring it! Someone will love it.', 'Then bring it! Someone loves will it.', 'Then bring it! Nobody will want it.'], 0, 'Então leva! Alguém vai adorar.'),
    prox(14, ["Yes. If more people will swap clothes, we'll produce less waste.", "Yes. If more people swap clothes, we'll produce less waste.", "Yes. If more people swap clothes, we'll produce more waste."], 1, 'Sim. Se mais pessoas trocarem roupas, vamos produzir menos lixo.'),
    prox(15, ["And I won't spending money on fast fashion.", "And I don't will spend money on fast fashion.", "And I won't spend money on fast fashion."], 2, 'E não vou gastar dinheiro com fast fashion.'),
    prox(17, ["All right, I'll come. If I enjoy it, I'll tell my friends.", "All right, I'll come. If I will enjoy it, I'll tell my friends.", "All right, I'll come. If I enjoy it, I telling my friends."], 0, 'Tá bom, eu vou. Se eu gostar, vou contar para os meus amigos.'),
    prox(18, ['Great! There will be a tailor there too, so she can cut your hair.', 'Great! There will be a stylist there too, so she can help you.', 'Great! There will a stylist there too, so she can help you.'], 1, 'Ótimo! Vai ter uma stylist lá também, então ela pode te ajudar.'),
    prox(19, ["A stylist? Then I find will my new style for free!", "A stylist? Then I'll find my new style for a lot of money!", "A stylist? Then I'll find my new style for free!"], 2, 'Uma stylist? Então vou encontrar o meu novo estilo de graça!'),
    { instrucao: 'Why does Tom have bags of clothes?', frase: '___', opcoes: ["He's doing a clear-out.", "He's moving house.", "He's going on holiday."], certa: 0, traducao: 'Ele está fazendo uma limpa.' },
    { instrucao: 'Where will the clothes go if Tom throws them in the bin?', frase: '___', opcoes: ['To the library.', 'To the landfill.', 'To a tailor.'], certa: 1, traducao: 'Para o aterro.' },
    { instrucao: 'Where is the clothes swap?', frase: '___', opcoes: ['At a shopping centre.', "At Hannah's house.", 'At the library.'], certa: 2, traducao: 'Na biblioteca.' },
    { instrucao: 'What will Tom get for his clothes?', frase: '___', opcoes: ['Tokens.', 'Money.', 'A free coffee.'], certa: 0, traducao: 'Fichas.' },
    { instrucao: "What can Tom do if a shirt doesn't fit?", frase: '___', opcoes: ['Throw it away.', 'Take it to a tailor.', 'Return it for money.'], certa: 1, traducao: 'Levar a um alfaiate.' },
    { instrucao: 'What is the problem with the orange jacket?', frase: '___', opcoes: ["It doesn't fit.", "It's dirty.", "It doesn't suit him."], certa: 2, traducao: 'Ela não combina com ele.' },
    { instrucao: 'What will happen if more people swap clothes?', frase: '___', opcoes: ["We'll produce less waste.", 'Fast fashion will grow.', 'Clothes will be more expensive.'], certa: 0, traducao: 'Vamos produzir menos lixo.' },
    { instrucao: 'What will Tom do if he enjoys the swap?', frase: '___', opcoes: ["He'll open a shop.", "He'll tell his friends.", "He'll become a stylist."], certa: 1, traducao: 'Vai contar para os amigos.' }
  ]
});
</script>
