<script>
/* B1 · Class 22 · Fala (The Green Wardrobe)
   Alinhado ao Warm Up (o que fazer com roupas que cansou), ao vocabulário de moda
   sustentável, ao documentário (clothes swap, tailor, fit x suit) e ao "Grammar Point" +
   "First Conditional Race" (first conditional). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 22, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'When you get bored of your clothes, what do you usually do?', dica: 0, traducao: 'Quando você enjoa das suas roupas, o que costuma fazer?' },
    { frase: 'I usually give my old clothes away.', dica: 0, traducao: 'Normalmente dou as minhas roupas velhas.' },
    { frase: 'Fast fashion causes a lot of pollution.', dica: 0, traducao: 'A fast fashion causa muita poluição.' },
    { frase: "Don't throw away clothes you can still wear.", dica: 0, traducao: 'Não jogue fora roupas que você ainda pode usar.' },
    { frase: 'Second-hand clothes are more sustainable.', dica: 0, traducao: 'Roupas de segunda mão são mais sustentáveis.' },
    { frase: "If you swap your clothes, you'll save money.", dica: 0, traducao: 'Se você trocar as suas roupas, vai economizar dinheiro.' },
    { frase: "If you bring clothes to the swap, you'll get tokens.", dica: 0, traducao: 'Se você levar roupas para a troca, vai ganhar fichas.' },
    { frase: "If it doesn't fit, take it to a tailor.", dica: 0, traducao: 'Se não servir, leve a um alfaiate.' },
    { frase: "This jacket doesn't suit me. It isn't my style.", dica: 0, traducao: 'Essa jaqueta não combina comigo. Não é o meu estilo.' },
    { frase: "These jeans don't fit. They're too big.", dica: 0, traducao: 'Esse jeans não serve. Está grande demais.' },
    { frase: "If more people swap clothes, we'll produce less waste.", dica: 0, traducao: 'Se mais pessoas trocarem roupas, vamos produzir menos lixo.' },
    { frase: "You'll help the environment if you donate your clothes.", dica: 0, traducao: 'Você vai ajudar o meio ambiente se doar as suas roupas.' },
    { frase: "If it rains tomorrow, we'll stay at home.", dica: 0, traducao: 'Se chover amanhã, vamos ficar em casa.' },
    { frase: "I'll be tired tomorrow if I go to bed late.", dica: 0, traducao: 'Vou estar cansado amanhã se for dormir tarde.' },
    { frase: "If I don't study for the test, I won't pass.", dica: 0, traducao: 'Se eu não estudar para a prova, não vou passar.' },
    { frase: 'What will happen if people stop buying fast fashion?', dica: 0, traducao: 'O que vai acontecer se as pessoas pararem de comprar fast fashion?' },
    { frase: "If I have extra money this month, I'll buy a second-hand bike.", dica: 0, traducao: 'Se eu tiver dinheiro extra este mês, vou comprar uma bicicleta usada.' },
    { frase: 'My parents will be angry if I come home late.', dica: 0, traducao: 'Os meus pais vão ficar bravos se eu chegar tarde.' },
    { frase: "I'm doing a clear-out of my wardrobe.", dica: 0, traducao: 'Estou fazendo uma limpa no meu guarda-roupa.' },
    { frase: 'Would you like to try a clothes swap?', dica: 0, traducao: 'Você gostaria de experimentar uma troca de roupas?' }
  ]
});
</script>
