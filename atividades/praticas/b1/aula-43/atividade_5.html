/* B1 · Class 43 · Gramática (Review Classes 31-42)
   Alinhado ao Grammar Point da revisão (passiva, question tags, past perfect, reported
   speech, told us to..., present perfect x past simple, perguntas indiretas) e ao Vocabulary
   (phrasal verbs, mídia, BrE x AmE). Conteúdo NOVO. Uma só opção certa. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 43, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'The new phone ___ in thirty countries.', opcoes: ['is sold', 'is sell', 'selling'], certa: 0, traducao: 'O novo celular é vendido em trinta países.' },
    { frase: 'This bridge ___ in 1950.', opcoes: ['built', 'was built', 'is build'], certa: 1, traducao: 'Esta ponte foi construída em 1950.' },
    { frase: 'Portuguese ___ in Brazil and Portugal.', opcoes: ['speaks', 'was speak', 'is spoken'], certa: 2, traducao: 'O português é falado no Brasil e em Portugal.' },
    { frase: "You've seen this film, ___?", opcoes: ["haven't you", "didn't you", "don't you"], certa: 0, traducao: 'Você já viu este filme, não viu?' },
    { frase: 'This is your first visit, ___?', opcoes: ["don't you", "isn't it", "wasn't it"], certa: 1, traducao: 'É a sua primeira visita, não é?' },
    { frase: 'We should leave now, ___?', opcoes: ["don't we", "aren't we", "shouldn't we"], certa: 2, traducao: 'Devíamos ir agora, não devíamos?' },
    { frase: 'When we arrived at the station, the train ___.', opcoes: ['had left', 'leaves', 'has left'], certa: 0, traducao: 'Quando chegamos à estação, o trem já tinha saído.' },
    { frase: 'By the time I called, my friend ___ to bed.', opcoes: ['goes', 'had gone', 'has gone'], certa: 1, traducao: 'Quando liguei, meu amigo já tinha ido dormir.' },
    { frase: '"I\'m working on a project." → He said he ___ working on a project.', opcoes: ['will', 'is be', 'was'], certa: 2, traducao: 'Ele disse que estava trabalhando num projeto.' },
    { frase: 'The teacher told us ___ quiet during the test.', opcoes: ['to be', 'be', 'being'], certa: 0, traducao: 'A professora nos mandou ficar em silêncio durante a prova.' },
    { frase: 'My boss told me ___ the documents before Friday.', opcoes: ['send', 'to send', 'sending'], certa: 1, traducao: 'Meu chefe me mandou enviar os documentos antes de sexta.' },
    { frase: 'How long ___ you lived in this city? — Since 2019.', opcoes: ['did', 'do', 'have'], certa: 2, traducao: 'Há quanto tempo você mora nesta cidade? — Desde 2019.' },
    { frase: 'I ___ that film last weekend.', opcoes: ['watched', 'have watched', 'had watched'], certa: 0, traducao: 'Assisti a esse filme no fim de semana passado.' },
    { frase: 'Have you ever ___ sushi?', opcoes: ['try', 'tried', 'trying'], certa: 1, traducao: 'Você já experimentou sushi?' },
    { frase: 'Could you tell me where ___?', opcoes: ['is the station', 'is station the', 'the station is'], certa: 2, traducao: 'Você poderia me dizer onde fica a estação?' },
    { frase: 'Do you know how ___ to the museum from here?', opcoes: ['I can get', 'can I get', 'get I'], certa: 0, traducao: 'Você sabe como eu chego ao museu daqui?' },
    { frase: '___ stole the painting? — The cleaner did!', opcoes: ['Who did', 'Who', 'Who does'], certa: 1, traducao: 'Quem roubou o quadro? — A pessoa da limpeza!' },
    { frase: 'Who ___ you see at the museum? — I saw the guard.', opcoes: ['saw', 'was', 'did'], certa: 2, traducao: 'Quem você viu no museu? — Vi o segurança.' },
    { frase: 'I really look forward ___ seeing you.', opcoes: ['to', 'for', 'at'], certa: 0, traducao: 'Estou muito ansioso para te ver.' },
    { frase: 'We ran ___ of coffee, so I had tea.', opcoes: ['off', 'out', 'away'], certa: 1, traducao: 'Ficamos sem café, então tomei chá.' },
    { frase: 'My colleagues are great. I get ___ with them very well.', opcoes: ['up', 'off', 'on'], certa: 2, traducao: 'Meus colegas são ótimos. Me dou muito bem com eles.' },
    { frase: 'A funny image that spreads quickly online is a ___.', opcoes: ['meme', 'headline', 'source'], certa: 0, traducao: 'Uma imagem engraçada que se espalha rápido na internet é um meme.' },
    { frase: 'In British English, people wait in a ___.', opcoes: ['line', 'queue', 'flat'], certa: 1, traducao: 'No inglês britânico, as pessoas esperam numa "queue".' },
    { frase: 'She ___ me that she had corrected the test.', opcoes: ['said', 'spoke', 'told'], certa: 2, traducao: 'Ela me disse que tinha corrigido a prova.' }
  ]
});
</script>
