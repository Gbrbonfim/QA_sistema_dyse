    { frase: 'Do you enjoy reading before bed?', dica: 0, traducao: 'Você gosta de ler antes de dormir?' },

    { frase: "I'm thinking about joining a book club.", dica: 0, traducao: 'Estou pensando em entrar num clube do livro.' },
    { frase: "I don't mind reading on my phone.", dica: 0, traducao: 'Não me importo de ler no celular.' },
    { frase: 'I listen to audiobooks while I am driving.', dica: 0, traducao: 'Ouço audiolivros enquanto dirijo.' },
    { frase: 'Listening to music helps me study.', dica: 0, traducao: 'Ouvir música me ajuda a estudar.' },
    { frase: 'Reading books in English improves my vocabulary.', dica: 0, traducao: 'Ler livros em inglês melhora o meu vocabulário.' },
    { frase: "I'm interested in reading about history.", dica: 0, traducao: 'Tenho interesse em ler sobre história.' },
    { frase: 'I usually get distracted when I am reading.', dica: 0, traducao: 'Costumo me distrair quando estou lendo.' },
    { frase: 'I stopped buying paper books last year.', dica: 0, traducao: 'Parei de comprar livros de papel no ano passado.' },
    { frase: 'She finished reading the novel in two days.', dica: 0, traducao: 'Ela terminou de ler o romance em dois dias.' },

    { frase: 'He promised to lend me his book.', dica: 0, traducao: 'Ele prometeu me emprestar o livro dele.' },
    { frase: 'We decided to start a reading habit.', dica: 0, traducao: 'Decidimos começar um hábito de leitura.' },
    { frase: 'I never know what to read on holiday.', dica: 0, traducao: 'Nunca sei o que ler nas férias.' },
    { frase: 'Would you like to read more books in the future?', dica: 0, traducao: 'Você gostaria de ler mais livros no futuro?' },
    { frase: 'Do you like listening to audiobooks instead of reading?', dica: 0, traducao: 'Você gosta de ouvir audiolivros em vez de ler?' }
  ]
});
