<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* B1 · Class 14 · Gramática (On The Same Page)
   Alinhado ao "Grammar Point" (gerúndio depois de alguns verbos, como sujeito e depois de
   preposição; infinitivo depois de promise / decide / know what) e ao "Verbs + Gerund" (spend
   + -ing sempre; start aceita os dois). Só itens com UMA resposta: like, love, hate e start não
   aparecem com "to" como isca. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 14, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'My grandfather enjoys ___ the newspaper every morning.', opcoes: ['reading', 'to read', 'read'], certa: 0, traducao: 'O meu avô gosta de ler o jornal toda manhã.' },
    { frase: '___ a new language takes time.', opcoes: ['Learn', 'Learning', 'To learning'], certa: 1, traducao: 'Aprender uma língua nova leva tempo.' },
    { frase: "I'm good at ___ stories.", opcoes: ['write', 'to write', 'writing'], certa: 2, traducao: 'Sou bom em escrever histórias.' },
    { frase: "She doesn't mind ___ on her phone.", opcoes: ['reading', 'to read', 'read'], certa: 0, traducao: 'Ela não se importa de ler no celular.' },
    { frase: 'They finished ___ the kitchen at ten.', opcoes: ['to clean', 'cleaning', 'clean'], certa: 1, traducao: 'Eles terminaram de limpar a cozinha às dez.' },
    { frase: 'I avoid ___ coffee at night.', opcoes: ['to drink', 'drink', 'drinking'], certa: 2, traducao: 'Evito tomar café à noite.' },
    { frase: "We're considering ___ to Portugal.", opcoes: ['moving', 'to move', 'move'], certa: 0, traducao: 'Estamos considerando nos mudar para Portugal.' },
    { frase: 'He spends all his money ___ books.', opcoes: ['to buy', 'buying', 'buy'], certa: 1, traducao: 'Ele gasta todo o dinheiro comprando livros.' },
    { frase: "I don't feel like ___ out tonight.", opcoes: ['to go', 'go', 'going'], certa: 2, traducao: 'Não estou com vontade de sair hoje à noite.' },
    { frase: 'She went on ___ after the teacher asked her to stop.', opcoes: ['talking', 'talked', 'talk'], certa: 0, traducao: 'Ela continuou falando depois que a professora pediu para parar.' },
    { frase: 'Thank you for ___ me with my homework.', opcoes: ['help', 'helping', 'to help'], certa: 1, traducao: 'Obrigado por me ajudar com a lição.' },
    { frase: 'She promised ___ me back the book on Monday.', opcoes: ['giving', 'give', 'to give'], certa: 2, traducao: 'Ela prometeu me devolver o livro na segunda.' },
    { frase: 'We decided ___ a book club at school.', opcoes: ['to start', 'starting', 'start'], certa: 0, traducao: 'Decidimos começar um clube do livro na escola.' },
    { frase: "I don't know what ___ for my mum's birthday.", opcoes: ['buying', 'to buy', 'buy'], certa: 1, traducao: 'Não sei o que comprar para o aniversário da minha mãe.' },
    { frase: 'I want ___ more books this year.', opcoes: ['reading', 'read', 'to read'], certa: 2, traducao: 'Quero ler mais livros neste ano.' },
    { frase: 'She started reading a new novel. = She started ___ a new novel.', opcoes: ['to read', 'read', 'reads'], certa: 0, traducao: 'Ela começou a ler um romance novo.' },
    { frase: 'After enjoy, finish, avoid and consider, we use ___.', opcoes: ['to + verb', 'the -ing form', 'the past form'], certa: 1, traducao: 'Depois de enjoy, finish, avoid e consider, usamos a forma -ing.' },
    { frase: 'After a preposition (in, about, of, for), we use ___.', opcoes: ['to + verb', 'the past form', 'the -ing form'], certa: 2, traducao: 'Depois de preposição, usamos a forma -ing.' },
    { frase: 'In "Reading is a habit", the gerund is ___.', opcoes: ['the subject', 'after a preposition', 'after enjoy'], certa: 0, traducao: 'Em "Reading is a habit", o gerúndio é o sujeito.' },
    { frase: 'A book you can listen to is an ___.', opcoes: ['e-book', 'audiobook', 'novel'], certa: 1, traducao: 'Um livro que você pode ouvir é um audiolivro.' },
    { frase: 'Stories that are not real are called ___.', opcoes: ['history', 'news', 'fiction'], certa: 2, traducao: 'Histórias que não são reais se chamam ficção.' },
    { frase: 'I check my phone every two minutes when I read. I get ___ easily.', opcoes: ['distracted', 'distracting', 'distract'], certa: 0, traducao: 'Olho o celular a cada dois minutos quando leio. Me distraio fácil.' },
    { frase: 'A group of people who meet to talk about books is a book ___.', opcoes: ['shop', 'club', 'page'], certa: 1, traducao: 'Um grupo que se reúne para falar de livros é um clube do livro.' },
    { frase: 'Tip from the video: avoid ___ your phone in bed and read instead.', opcoes: ['use', 'to use', 'using'], certa: 2, traducao: 'Dica do vídeo: evite usar o celular na cama e leia.' }
  ]
});
</script>
</body>
</html>
