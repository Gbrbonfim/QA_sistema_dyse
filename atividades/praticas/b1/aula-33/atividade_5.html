/* B1 · Class 33 · Gramática (The 5 a.m. Club)
   Alinhado ao Vocabulary & Grammar (o que são phrasal verbs; significado pelo contexto;
   exercício 3: wake up, get up, give up, put away, look forward to) e ao Reading.
   Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 33, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'Before the challenge, I used to stay ___ late watching Netflix.', opcoes: ['up', 'away', 'over'], certa: 0, traducao: 'Antes do desafio, eu costumava ficar acordado até tarde vendo Netflix.' },
    { frase: 'I had to give ___ scrolling on my phone at night.', opcoes: ['out', 'up', 'on'], certa: 1, traducao: 'Tive que largar o hábito de rolar o celular à noite.' },
    { frase: 'I started to put my phone ___ after 9 p.m.', opcoes: ['on', 'up', 'away'], certa: 2, traducao: 'Comecei a guardar o celular depois das 21h.' },
    { frase: 'When my alarm went ___, I felt tired and unsure.', opcoes: ['off', 'out', 'up'], certa: 0, traducao: 'Quando o alarme tocou, me senti cansado e inseguro.' },
    { frase: 'I wanted to find ___ if this habit could change my life.', opcoes: ['up', 'out', 'off'], certa: 1, traducao: 'Eu queria descobrir se esse hábito podia mudar a minha vida.' },
    { frase: 'Some mornings I woke ___ by myself.', opcoes: ['off', 'on', 'up'], certa: 2, traducao: 'Algumas manhãs eu acordei sozinho.' },
    { frase: 'I could get ___ with my day quietly.', opcoes: ['on', 'up', 'out'], certa: 0, traducao: 'Eu podia seguir com o meu dia com calma.' },
    { frase: 'I really started to look forward ___ my calm mornings.', opcoes: ['for', 'to', 'at'], certa: 1, traducao: 'Comecei a esperar ansiosamente pelas minhas manhãs calmas.' },
    { frase: 'I often had to turn ___ invitations from friends.', opcoes: ['up', 'on', 'down'], certa: 2, traducao: 'Muitas vezes tive que recusar convites de amigos.' },
    { frase: 'I felt like I was missing ___ on fun moments.', opcoes: ['out', 'off', 'up'], certa: 0, traducao: 'Eu sentia que estava perdendo momentos divertidos.' },
    { frase: 'After some time, I started to run ___ of energy.', opcoes: ['off', 'out', 'away'], certa: 1, traducao: 'Depois de um tempo, comecei a ficar sem energia.' },
    { frase: 'I stopped looking ___ distractions on my phone.', opcoes: ['on', 'off', 'for'], certa: 2, traducao: 'Parei de procurar distrações no celular.' },
    { instrucao: 'What does "give up" mean?', frase: '___', opcoes: ['to stop doing something', 'to leave your bed', 'to feel excited'], certa: 0, traducao: 'give up = parar de fazer algo, largar.' },
    { instrucao: 'What does "get up" mean?', frase: '___', opcoes: ['to say no to an invitation', 'to leave your bed', 'to use all of something'], certa: 1, traducao: 'get up = levantar da cama.' },
    { instrucao: 'What does "turn down an invitation" mean?', frase: '___', opcoes: ['to accept it', 'to forget it', 'to say no to it'], certa: 2, traducao: 'turn down = recusar.' },
    { instrucao: 'What does "run out of" mean?', frase: '___', opcoes: ['to have nothing left', 'to look for something', 'to go out at night'], certa: 0, traducao: 'run out of = ficar sem.' },
    { instrucao: 'What does "look forward to" mean?', frase: '___', opcoes: ['to be afraid of', 'to be excited about', 'to look behind you'], certa: 1, traducao: 'look forward to = esperar ansiosamente por.' },
    { instrucao: 'What does "miss out on" mean?', frase: '___', opcoes: ['to arrive late', 'to go to a party', 'to not have a fun experience'], certa: 2, traducao: 'miss out on = perder (uma oportunidade, um momento).' },
    { instrucao: 'What does "stay up" mean?', frase: '___', opcoes: ['to not go to bed', 'to stand on a chair', 'to wake up early'], certa: 0, traducao: 'stay up = ficar acordado.' },
    { instrucao: 'What does "find out" mean?', frase: '___', opcoes: ['to lose something', 'to discover information', 'to go outside'], certa: 1, traducao: 'find out = descobrir.' },
    { frase: 'Phrasal verbs are made of a verb + a small word, like up, off, on or ___.', opcoes: ['the', 'and', 'out'], certa: 2, traducao: 'Phrasal verbs = verbo + partícula (up, off, on, out...).' },
    { frase: 'In the end, Keltie says waking up at 5 a.m. is just a ___.', opcoes: ['tool', 'rule', 'problem'], certa: 0, traducao: 'No fim, a Keltie diz que acordar às 5h é só uma ferramenta.' },
    { frase: 'People who feel better when they stay up late are called night ___.', opcoes: ['birds', 'owls', 'cats'], certa: 1, traducao: 'Pessoas que rendem mais à noite são chamadas de "corujas".' },
    { frase: 'People who love the morning are called early ___.', opcoes: ['owls', 'cats', 'birds'], certa: 2, traducao: 'Pessoas matutinas são chamadas de early birds.' }
  ]
});
</script>
