<script>
/* B1 · Class 01 · Fala (Are you a language learner?)
   Alinhado às "15 Essential Questions", ao Grammar Point (be/can invertidos, do/does/did,
   preposição no fim) e ao Talking Point (desafios, sentimentos ao falar outro idioma).
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 1, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Where are you originally from?', dica: 0, traducao: 'De onde você é originalmente?' },
    { frase: 'What languages can you speak?', dica: 0, traducao: 'Que idiomas você fala?' },
    { frase: 'Why are you studying English?', dica: 0, traducao: 'Por que você está estudando inglês?' },
    { frase: 'Who do you live with?', dica: 0, traducao: 'Com quem você mora?' },
    { frase: 'What are you talking about?', dica: 0, traducao: 'Sobre o que você está falando?' },
    { frase: 'Where did you study English before?', dica: 0, traducao: 'Onde você estudou inglês antes?' },
    { frase: 'What does this word mean?', dica: 0, traducao: 'O que esta palavra significa?' },
    { frase: 'Can you say that again, please?', dica: 0, traducao: 'Você pode repetir, por favor?' },
    { frase: 'How often do you meet your friends?', dica: 0, traducao: 'Com que frequência você encontra os seus amigos?' },
    { frase: 'What are you going to do next weekend?', dica: 0, traducao: 'O que você vai fazer no próximo fim de semana?' },
    { frase: 'Were you born in this city?', dica: 0, traducao: 'Você nasceu nesta cidade?' },
    { frase: 'Does anybody in your family speak English?', dica: 0, traducao: 'Alguém na sua família fala inglês?' },
    { frase: 'I want to learn Italian because I love the culture.', dica: 0, traducao: 'Quero aprender italiano porque adoro a cultura.' },
    { frase: 'Learning languages changes the way we see the world.', dica: 0, traducao: 'Aprender idiomas muda a forma como vemos o mundo.' },
    { frase: 'My biggest challenge is listening to native speakers.', dica: 0, traducao: 'O meu maior desafio é ouvir falantes nativos.' },
    { frase: 'I feel a little nervous when I speak English.', dica: 0, traducao: 'Fico um pouco nervoso quando falo inglês.' },
    { frase: 'I would prefer to speak two languages very well.', dica: 0, traducao: 'Eu preferiria falar dois idiomas muito bem.' },
    { frase: 'He is curious, so he learns languages quickly.', dica: 0, traducao: 'Ele é curioso, então aprende idiomas rápido.' },
    { frase: 'You need to use a language to learn it.', dica: 0, traducao: 'Você precisa usar um idioma para aprendê-lo.' },
    { frase: 'Travelling and talking to people is very important.', dica: 0, traducao: 'Viajar e conversar com as pessoas é muito importante.' }
  ]
});
</script>
