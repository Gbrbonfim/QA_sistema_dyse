<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · B1 · Aula 1 · Questions in the right order</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/atividades/praticas/praticas.css">
</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* B1 · Class 01 · Escrita (Are you a language learner?)
   Alinhado ao "Grammar Point: Word Order in Questions": be/can antes do sujeito; regra ASI /
   QuASI (Question word + Auxiliary + Subject + Infinitive) com do/does/did; preposição no
   fim (Who do you live with?). Conteúdo NOVO. A isca é o auxiliar/forma errada. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-b1', aula: 1, num: 2, tipo: 'montar',
  instrucao: 'Click the words and make the question (one word is extra)',
  itens: [
    { contexto: M('Você está cansado?'), palavras: ['Are', 'you', 'tired'], isca: ['Do'], fim: '?', traducao: 'Você está cansado?' },
    { contexto: M('Ela é a sua professora?'), palavras: ['Is', 'she', 'your', 'teacher'], isca: ['Does'], fim: '?', traducao: 'Ela é a sua professora?' },
    { contexto: M('Ele sabe nadar?'), palavras: ['Can', 'he', 'swim'], isca: ['swims'], fim: '?', traducao: 'Ele sabe nadar?' },
    { contexto: M('Eles estavam atrasados?'), palavras: ['Were', 'they', 'late'], isca: ['Did'], fim: '?', traducao: 'Eles estavam atrasados?' },
    { contexto: M('Você mora perto daqui?'), palavras: ['Do', 'you', 'live', 'near', 'here'], isca: ['Are'], fim: '?', traducao: 'Você mora perto daqui?' },
    { contexto: M('Ela trabalha num hospital?'), palavras: ['Does', 'she', 'work', 'in', 'a', 'hospital'], isca: ['works'], fim: '?', traducao: 'Ela trabalha num hospital?' },
    { contexto: M('Eles estudaram inglês?'), palavras: ['Did', 'they', 'study', 'English'], isca: ['studied'], fim: '?', traducao: 'Eles estudaram inglês?' },
    { contexto: M('Que idiomas você fala?'), palavras: ['What', 'languages', 'do', 'you', 'speak'], isca: ['does'], fim: '?', traducao: 'Que idiomas você fala?' },
    { contexto: M('Onde você estudou inglês antes?'), palavras: ['Where', 'did', 'you', 'study', 'English', 'before'], isca: ['studied'], fim: '?', traducao: 'Onde você estudou inglês antes?' },
    { contexto: M('Por que você está aprendendo um idioma?'), palavras: ['Why', 'are', 'you', 'learning', 'a', 'language'], isca: ['do'], fim: '?', traducao: 'Por que você está aprendendo um idioma?' },
    { contexto: M('O que esta palavra significa?'), palavras: ['What', 'does', 'this', 'word', 'mean'], isca: ['means'], fim: '?', traducao: 'O que esta palavra significa?' },
    { contexto: M('Com quem você mora?'), palavras: ['Who', 'do', 'you', 'live', 'with'], isca: ['lives'], fim: '?', traducao: 'Com quem você mora?' },
    { contexto: M('Sobre o que vocês estão falando?'), palavras: ['What', 'are', 'you', 'talking', 'about'], isca: ['talk'], fim: '?', traducao: 'Sobre o que vocês estão falando?' },
    { contexto: M('Onde você nasceu?'), palavras: ['Where', 'were', 'you', 'born'], isca: ['did'], fim: '?', traducao: 'Onde você nasceu?' },
    { contexto: M('Quando ele começou a aprender japonês?'), palavras: ['When', 'did', 'he', 'start', 'learning', 'Japanese'], isca: ['started'], fim: '?', traducao: 'Quando ele começou a aprender japonês?' },
    { contexto: M('Com que frequência você pratica a fala?'), palavras: ['How', 'often', 'do', 'you', 'practice', 'speaking'], isca: ['practices'], fim: '?', traducao: 'Com que frequência você pratica a fala?' },
    { contexto: M('Alguém na sua família fala alemão?'), palavras: ['Does', 'anybody', 'in', 'your', 'family', 'speak', 'German'], isca: ['speaks'], fim: '?', traducao: 'Alguém na sua família fala alemão?' },
    { contexto: M('Foi difícil aprender o alfabeto russo?'), palavras: ['Was', 'it', 'difficult', 'to', 'learn', 'the', 'Russian', 'alphabet'], isca: ['Did'], fim: '?', traducao: 'Foi difícil aprender o alfabeto russo?' },
    { contexto: M('Você consegue escrever e-mails em italiano?'), palavras: ['Can', 'you', 'write', 'emails', 'in', 'Italian'], isca: ['writes'], fim: '?', traducao: 'Você consegue escrever e-mails em italiano?' },
    { contexto: M('Para quem ela está escrevendo?'), palavras: ['Who', 'is', 'she', 'writing', 'to'], isca: ['writes'], fim: '?', traducao: 'Para quem ela está escrevendo?' }
  ]
});
</script>
</body>
</html>
