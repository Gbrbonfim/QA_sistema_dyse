  itens: [
    { frase: 'Have you ever had a school experience that stayed with you?', dica: 0, traducao: 'Você já teve uma experiência na escola que ficou com você?' },
    { frase: 'When did it happen?', dica: 0, traducao: 'Quando aconteceu?' },
    { frase: 'Who was involved?', dica: 0, traducao: 'Quem estava envolvido?' },
    { frase: 'What lesson have you learned from it?', dica: 0, traducao: 'Que lição você aprendeu com isso?' },
    { frase: "I've learned that mistakes are part of learning.", dica: 0, traducao: 'Aprendi que erros fazem parte do aprendizado.' },
    { frase: 'I learned it when I was in middle school.', dica: 0, traducao: 'Aprendi isso quando estava no ensino fundamental.' },
    { frase: "I've met many great teachers in my life.", dica: 0, traducao: 'Conheci muitos professores ótimos na vida.' },
    { frase: 'I met my favourite teacher when I was ten.', dica: 0, traducao: 'Conheci minha professora favorita quando tinha dez anos.' },
    { frase: "I've never forgotten her classes.", dica: 0, traducao: 'Nunca esqueci as aulas dela.' },
    { frase: 'She always gave us useful feedback.', dica: 0, traducao: 'Ela sempre nos dava um feedback útil.' },
    { frase: "I didn't understand fractions at that time.", dica: 0, traducao: 'Eu não entendia frações naquela época.' },
    { frase: 'My grades have improved a lot this year.', dica: 0, traducao: 'Minhas notas melhoraram muito este ano.' },
    { frase: 'I failed a test, but I passed the next one.', dica: 0, traducao: 'Reprovei numa prova, mas passei na seguinte.' },
    { frase: "I've never been to the principal's office.", dica: 0, traducao: 'Nunca fui à sala do diretor.' },
    { frase: 'Thank you for never giving up on us.', dica: 0, traducao: 'Obrigado por nunca desistir de nós.' },
    { frase: 'Teaching can be tough, but it is very rewarding.', dica: 0, traducao: 'Ensinar pode ser difícil, mas é muito gratificante.' },
    { frase: 'See, saw, seen.', dica: 0, traducao: 'Ver: see, saw, seen.' },
    { frase: 'Give, gave, given.', dica: 0, traducao: 'Dar: give, gave, given.' },
    { frase: 'Forget, forgot, forgotten.', dica: 0, traducao: 'Esquecer: forget, forgot, forgotten.' },
    { frase: 'Teach, taught, taught.', dica: 0, traducao: 'Ensinar: teach, taught, taught.' }
  ]
});
