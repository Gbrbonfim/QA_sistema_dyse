  course: 'ativ-b1', aula: 39, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'By the time the firefighters arrived, the casino had burned down.', dica: 0, traducao: 'Quando os bombeiros chegaram, o cassino tinha queimado.' },
    { frase: 'She had already decided to change her style.', dica: 0, traducao: 'Ela já tinha decidido mudar o seu estilo.' },
    { frase: "Adele hadn't accepted the breakup at first.", dica: 0, traducao: 'No início, a Adele não tinha aceitado o término.' },
    { frase: 'They had prepared everything carefully.', dica: 0, traducao: 'Eles tinham preparado tudo com cuidado.' },
    { frase: 'When we arrived, the band had already started.', dica: 0, traducao: 'Quando chegamos, a banda já tinha começado.' },
    { frase: 'I had never seen them live before.', dica: 0, traducao: 'Eu nunca os tinha visto ao vivo antes.' },
    { frase: 'We missed the train because we had woken up late.', dica: 0, traducao: 'Perdemos o trem porque tínhamos acordado tarde.' },
    { frase: 'She felt nervous because she had never sung on TV.', dica: 0, traducao: 'Ela ficou nervosa porque nunca tinha cantado na TV.' },
    { frase: 'Had you heard the song before the concert?', dica: 0, traducao: 'Você já tinha ouvido a música antes do show?' },
    { frase: 'What had happened before this moment?', dica: 0, traducao: 'O que tinha acontecido antes desse momento?' },
    { frase: 'Tones and I had played music on the streets.', dica: 0, traducao: 'A Tones and I tinha tocado música nas ruas.' },
    { frase: 'People had asked her to repeat songs again and again.', dica: 0, traducao: 'As pessoas tinham pedido para ela repetir as músicas sem parar.' },
    { frase: 'Ed Sheeran had volunteered at a homeless shelter.', dica: 0, traducao: 'O Ed Sheeran tinha sido voluntário num abrigo.' },
    { frase: "He had met a young woman, and her story inspired the song.", dica: 0, traducao: 'Ele tinha conhecido uma jovem, e a história dela inspirou a música.' },
    { frase: "She'd already left when I called.", dica: 0, traducao: 'Ela já tinha saído quando liguei.' },
    { frase: "She said she'd call me after the show.", dica: 0, traducao: 'Ela disse que me ligaria depois do show.' },
    { frase: 'The concert had been cancelled, so we went home.', dica: 0, traducao: 'O show tinha sido cancelado, então fomos para casa.' },
    { frase: "The band hadn't had time to practise.", dica: 0, traducao: 'A banda não tinha tido tempo de ensaiar.' },
    { frase: 'Have you ever changed your opinion about a song?', dica: 0, traducao: 'Você já mudou de opinião sobre uma música?' },
    { frase: 'Which real story surprised you more?', dica: 0, traducao: 'Qual história real te surpreendeu mais?' }
  ]
});
