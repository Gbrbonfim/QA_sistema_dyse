/* B1 · Class 39 · Fala (The Story Behind the Lyrics)
   Alinhado ao Warm Up (por que artistas escrevem músicas) e ao exercício 6 (contar as três

DysePratica.iniciar({
  course: 'ativ-b1', aula: 39, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Why do artists write songs?', dica: 0, traducao: 'Por que os artistas escrevem músicas?' },
    { frase: 'Sad experiences often make great songs.', dica: 0, traducao: 'Experiências tristes muitas vezes rendem ótimas músicas.' },
    { frase: 'The band traveled to Switzerland to record an album.', dica: 0, traducao: 'A banda viajou para a Suíça para gravar um álbum.' },
    { frase: 'Suddenly, a man in the audience fired a flare gun.', dica: 0, traducao: 'De repente, um homem na plateia disparou um sinalizador.' },
    { frase: 'Immediately, the ceiling caught fire.', dica: 0, traducao: 'Imediatamente, o teto pegou fogo.' },
    { frase: 'The band watched the fire in shock.', dica: 0, traducao: 'A banda assistiu ao incêndio em choque.' },
    { frase: 'Later, they found another place to record.', dica: 0, traducao: 'Mais tarde, encontraram outro lugar para gravar.' },
    { frase: 'At first, she felt angry and confused.', dica: 0, traducao: 'No início, ela se sentiu com raiva e confusa.' },
    { frase: 'Meanwhile, she continued working on her album.', dica: 0, traducao: 'Enquanto isso, ela continuou trabalhando no álbum.' },
    { frase: 'Eventually, the song became a worldwide success.', dica: 0, traducao: 'Por fim, a música virou um sucesso mundial.' },
    { frase: 'She decided to respond with humour and confidence.', dica: 0, traducao: 'Ela decidiu responder com humor e confiança.' },
    { frase: 'The song changed how the public saw her.', dica: 0, traducao: 'A música mudou como o público a via.' },
    { frase: 'At first, nobody stopped to listen.', dica: 0, traducao: 'No início, ninguém parava para ouvir.' },
    { frase: 'Suddenly, the lights went out.', dica: 0, traducao: 'De repente, as luzes apagaram.' },
    { frase: 'I immediately started writing the lyrics.', dica: 0, traducao: 'Imediatamente comecei a escrever a letra.' },
    { frase: 'Later that week, I finished the song.', dica: 0, traducao: 'Mais tarde naquela semana, terminei a música.' },
    { frase: 'Eventually, it was played on the radio.', dica: 0, traducao: 'Por fim, ela tocou no rádio.' },
    { frase: 'Paul McCartney dreamed the melody of Yesterday.', dica: 0, traducao: 'Paul McCartney sonhou com a melodia de Yesterday.' },
    { frase: 'Do you know the story behind your favourite song?', dica: 0, traducao: 'Você conhece a história por trás da sua música favorita?' },
    { frase: 'Happy experiences can make great songs too.', dica: 0, traducao: 'Experiências felizes também podem render ótimas músicas.' }
  ]
});
</script>
