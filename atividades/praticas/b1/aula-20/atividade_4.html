/* B1 · Class 20 · Fala (Review Classes 10-19)
   Alinhado ao Talking Point da revisão ("Can you...?": clima e previsão, promessa, campanha
   ou anúncio, IA, livros, conselhos com should, regras com have to / must, convidar e
   responder, decisão recente) e a may / might e do / make. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 20, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'What is the weather like in your city today?', dica: 0, traducao: 'Como está o tempo na sua cidade hoje?' },
    { frase: 'I think it will be sunny tomorrow.', dica: 0, traducao: 'Acho que vai fazer sol amanhã.' },
    { frase: "I promise I'll call you later.", dica: 0, traducao: 'Prometo que te ligo mais tarde.' },
    { frase: 'Shall I help you with your bags?', dica: 0, traducao: 'Quer que eu te ajude com as malas?' },
    { frase: 'The ad was clever and very funny.', dica: 0, traducao: 'O anúncio era inteligente e muito engraçado.' },
    { frase: 'I use AI to write emails and plan my trips.', dica: 0, traducao: 'Uso IA para escrever e-mails e planejar as minhas viagens.' },
    { frase: 'I enjoy reading books before bed.', dica: 0, traducao: 'Gosto de ler livros antes de dormir.' },
    { frase: 'You should drink a lot of water.', dica: 0, traducao: 'Você deveria beber muita água.' },
    { frase: "You shouldn't eat too much sugar.", dica: 0, traducao: 'Você não deveria comer açúcar demais.' },
    { frase: 'At my school, we have to arrive at eight.', dica: 0, traducao: 'Na minha escola, temos que chegar às oito.' },
    { frase: "We mustn't use our phones in class.", dica: 0, traducao: 'Não podemos usar o celular na aula.' },
    { frase: "We don't have to wear a uniform.", dica: 0, traducao: 'Não precisamos usar uniforme.' },
    { frase: 'How about eating out tonight?', dica: 0, traducao: 'Que tal comer fora hoje à noite?' },
    { frase: "Why don't we try the new restaurant?", dica: 0, traducao: 'Por que não experimentamos o restaurante novo?' },
    { frase: "That sounds great! Let's do it!", dica: 0, traducao: 'Parece ótimo! Vamos nessa!' },
    { frase: "Sorry, I'm going to pass on that.", dica: 0, traducao: 'Desculpa, vou passar essa.' },
    { frase: 'I made an important decision last month.', dica: 0, traducao: 'Tomei uma decisão importante no mês passado.' },
    { frase: 'I did a lot of research before I decided.', dica: 0, traducao: 'Fiz muita pesquisa antes de decidir.' },
    { frase: 'I might change my job next year.', dica: 0, traducao: 'Talvez eu mude de emprego no ano que vem.' },
    { frase: "I'm not sure. I may need more time.", dica: 0, traducao: 'Não tenho certeza. Talvez eu precise de mais tempo.' }
  ]
});
</script>
