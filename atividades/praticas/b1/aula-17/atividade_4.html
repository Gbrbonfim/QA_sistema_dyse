/* B1 · Class 17 · Fala (Shall We Eat Out?)
   Alinhado ao "Functional Language" (sugerir e responder), às gírias (starving, stuffed,
   grab a bite, craving, mouth is watering), ao Talking Point (fome, fast food favorito) e ao
   quiz de comida. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 17, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Shall we eat out tonight?', dica: 0, traducao: 'Vamos comer fora hoje à noite?' },
    { frase: "Why don't we try the new Italian restaurant?", dica: 0, traducao: 'Por que não experimentamos o restaurante italiano novo?' },
    { frase: 'How about ordering some Chinese food?', dica: 0, traducao: 'Que tal pedir comida chinesa?' },
    { frase: "Let's grab a coffee after class!", dica: 0, traducao: 'Vamos tomar um café depois da aula!' },
    { frase: 'Should we invite our friends too?', dica: 0, traducao: 'Devemos convidar nossos amigos também?' },
    { frase: "Yes, let's! I'm craving it!", dica: 0, traducao: 'Sim, vamos! Estou morrendo de vontade!' },
    { frase: "That sounds great, let's do it!", dica: 0, traducao: 'Parece ótimo, vamos nessa!' },
    { frase: "I'm in! That would be great.", dica: 0, traducao: 'Estou dentro! Seria ótimo.' },
    { frase: "I'd rather not. I'm not in the mood for it.", dica: 0, traducao: 'Prefiro não. Não estou no clima.' },
    { frase: "Sorry, I'm not really up for that tonight.", dica: 0, traducao: 'Desculpa, não estou muito a fim disso hoje.' },
    { frase: "I'm going to pass on dessert, thanks.", dica: 0, traducao: 'Vou dispensar a sobremesa, obrigado.' },
    { frase: "That's not really my thing.", dica: 0, traducao: 'Isso não é muito a minha praia.' },
    { frase: "I'm on the fence about that place.", dica: 0, traducao: 'Estou em dúvida sobre aquele lugar.' },
    { frase: "I'll have to think about it.", dica: 0, traducao: 'Vou ter que pensar.' },
    { frase: "I don't know if that's a good idea. It's too expensive.", dica: 0, traducao: 'Não sei se é uma boa ideia. É caro demais.' },
    { frase: "I'm starving! I worked all day without a break.", dica: 0, traducao: 'Estou morrendo de fome! Trabalhei o dia todo sem pausa.' },
    { frase: "That meal was delicious, but now I'm stuffed.", dica: 0, traducao: 'A refeição estava deliciosa, mas agora estou empanturrado.' },
    { frase: 'Just thinking about that burger, my mouth is watering!', dica: 0, traducao: 'Só de pensar naquele hambúrguer, fico com água na boca!' },
    { frase: 'I like my pizza with mushrooms, olives and pepperoni.', dica: 0, traducao: 'Gosto da minha pizza com cogumelos, azeitonas e pepperoni.' },
    { frase: 'What is the best place to grab a bite in your city?', dica: 0, traducao: 'Qual é o melhor lugar para comer alguma coisa na sua cidade?' }
  ]
});
</script>
