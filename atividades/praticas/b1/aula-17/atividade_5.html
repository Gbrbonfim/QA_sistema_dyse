<script>
/* B1 · Class 17 · Gramática (Shall We Eat Out?)
   Alinhado ao "Functional Language" (Shall we / Should we / Why don't we / Let's + verbo;
   How about + -ing / How about we + verbo; aceitar, recusar, dúvida: in the mood, up for,
   on the fence, pass on, I'd rather not), às gírias e ao vocabulário do quiz (toppings,
   sauces, healthy foods). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b1', aula: 17, num: 5, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: '___ we order some pizza?', opcoes: ['Shall', "Let's", 'Why'], certa: 0, traducao: 'Vamos pedir pizza?' },
    { frase: 'How about ___ to the cinema tonight?', opcoes: ['go', 'going', 'to go'], certa: 1, traducao: 'Que tal ir ao cinema hoje à noite?' },
    { frase: "Why don't we ___ a picnic in the park?", opcoes: ['having', 'to have', 'have'], certa: 2, traducao: 'Por que não fazemos um piquenique no parque?' },
    { frase: '___ grab some coffee!', opcoes: ["Let's", 'Shall we', "Why don't"], certa: 0, traducao: 'Vamos tomar um café!' },
    { frase: 'How about ___ go to that new café?', opcoes: ['us', 'we', 'our'], certa: 1, traducao: 'Que tal a gente ir àquele café novo?' },
    { frase: 'Why ___ we try the Japanese restaurant?', opcoes: ['not', "doesn't", "don't"], certa: 2, traducao: 'Por que não experimentamos o restaurante japonês?' },
    { frase: 'Should we ___ the new menu?', opcoes: ['try', 'trying', 'to try'], certa: 0, traducao: 'Devemos experimentar o cardápio novo?' },
    { instrucao: 'Which response accepts the suggestion?', frase: '___', opcoes: ["I'd rather not.", "I'm in! That would be great.", "I'm on the fence about that."], certa: 1, traducao: 'Estou dentro! Seria ótimo.' },
    { instrucao: 'Which response refuses politely?', frase: '___', opcoes: ["Yes, let's!", 'That sounds great!', "I'm going to pass on that."], certa: 2, traducao: 'Vou passar essa.' },
    { instrucao: 'Which response expresses doubt?', frase: '___', opcoes: ["I'll have to think about it.", "That sounds great, let's do it!", "Sorry, I'm not really up for that."], certa: 0, traducao: 'Vou ter que pensar.' },
    { frase: "Sorry, I'm not in the ___ for Chinese food.", opcoes: ['humor', 'mood', 'feeling'], certa: 1, traducao: 'Desculpa, não estou no clima para comida chinesa.' },
    { frase: "I'm not really ___ for going out tonight. I'm tired.", opcoes: ['in', 'on', 'up'], certa: 2, traducao: 'Não estou muito a fim de sair hoje. Estou cansado.' },
    { frase: "I'm on the ___ about the trip. I can't decide.", opcoes: ['fence', 'wall', 'door'], certa: 0, traducao: 'Estou em dúvida sobre a viagem. Não consigo decidir.' },
    { frase: "I'm going to ___ on dessert, thanks.", opcoes: ['past', 'pass', 'passing'], certa: 1, traducao: 'Vou dispensar a sobremesa, obrigado.' },
    { frase: "I'd rather ___ go out. It's raining.", opcoes: ['no', 'not to', 'not'], certa: 2, traducao: 'Prefiro não sair. Está chovendo.' },
    { frase: "I didn't have breakfast or lunch. I'm ___!", opcoes: ['starving', 'stuffed', 'full'], certa: 0, traducao: 'Não tomei café nem almocei. Estou morrendo de fome!' },
    { frase: "I ate three slices of cake. I'm ___.", opcoes: ['starving', 'stuffed', 'craving'], certa: 1, traducao: 'Comi três fatias de bolo. Estou empanturrado.' },
    { frase: "We have ten minutes. Let's ___ a bite before the meeting.", opcoes: ['take', 'catch', 'grab'], certa: 2, traducao: 'Temos dez minutos. Vamos comer alguma coisa antes da reunião.' },
    { frase: 'That smells delicious! My mouth is ___.', opcoes: ['watering', 'drinking', 'raining'], certa: 0, traducao: 'Que cheiro delicioso! Estou com água na boca.' },
    { frase: "I'm ___ chocolate. I really want some now.", opcoes: ['stuffing', 'craving', 'passing'], certa: 1, traducao: 'Estou morrendo de vontade de chocolate. Quero muito agora.' },
    { frase: 'Pepperoni, mushrooms and olives are pizza ___.', opcoes: ['sauces', 'desserts', 'toppings'], certa: 2, traducao: 'Pepperoni, cogumelos e azeitonas são coberturas de pizza.' },
    { frase: 'Barbecue, ranch and honey mustard are ___.', opcoes: ['sauces', 'toppings', 'vegetables'], certa: 0, traducao: 'Barbecue, ranch e mostarda com mel são molhos.' },
    { frase: 'Spinach, cucumber and nuts are ___ foods.', opcoes: ['fast', 'healthy', 'fried'], certa: 1, traducao: 'Espinafre, pepino e castanhas são alimentos saudáveis.' },
    { frase: "A: Shall we get fro-yo? B: Yes, ___! I'm craving it!", opcoes: ['let', 'shall', "let's"], certa: 2, traducao: 'A: Vamos tomar frozen iogurte? B: Sim, vamos! Estou morrendo de vontade!' }
  ]
});
</script>
