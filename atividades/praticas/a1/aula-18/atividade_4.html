/* Class 18 · Fala
   Alinhado ao slide "Class 18: A Day in the Life" — Vocabulary: Jobs (listen and repeat),
   Talking Point ("What's his job? He's a..."), Grammar (as 3 formas do present simple).
   Conteúdo NOVO: outras frases. 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 18, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'engineer', traducao: 'engenheiro', nota: 'A força fica no fim: en-dji-NIR.' },
    { instrucao: PAL, frase: 'lawyer', traducao: 'advogado', nota: 'Soa como "LÓI-er".' },
    { instrucao: PAL, frase: 'nurse', traducao: 'enfermeiro, enfermeira' },
    { instrucao: PAL, frase: 'doctor', traducao: 'médico, médica' },
    { instrucao: PAL, frase: 'dentist', traducao: 'dentista' },
    { instrucao: PAL, frase: 'farmer', traducao: 'fazendeiro, agricultor' },
    { instrucao: PAL, frase: 'secretary', traducao: 'secretário, secretária' },
    { instrucao: PAL, frase: 'influencer', traducao: 'influenciador, influenciadora' },
    { instrucao: PAL, frase: 'uniform', traducao: 'uniforme', nota: 'Começa com "IU": IU-ni-form.' },
    { instrucao: PAL, frase: 'factory worker', traducao: 'operário, operária' },
    { frase: "What's his job? He's a factory worker.", dica: 0, traducao: 'Qual é a profissão dele? Ele é operário.' },
    { frase: "What's her job? She's a doctor.", dica: 0, traducao: 'Qual é a profissão dela? Ela é médica.' },
    { frase: "They're football players.", dica: 0, traducao: 'Eles são jogadores de futebol.' },
    { frase: "My father is a dentist. He doesn't work on Fridays.", dica: 0, traducao: 'Meu pai é dentista. Ele não trabalha às sextas.' },
    { frase: 'Do you wear a uniform?', dica: 0, traducao: 'Você usa uniforme?' },
    { frase: 'Does a doctor work at weekends?', dica: 0, traducao: 'Um médico trabalha nos fins de semana?' },
    { frase: "Nurses don't have a lot of free time.", dica: 0, traducao: 'Enfermeiros não têm muito tempo livre.' },
    { frase: 'She works with a computer in an office.', dica: 0, traducao: 'Ela trabalha com computador num escritório.' },
    { frase: 'My mom is a teacher. She teaches English.', dica: 0, traducao: 'Minha mãe é professora. Ela ensina inglês.' },
    { frase: "I'm an engineer and I sometimes work at night.", dica: 0, traducao: 'Eu sou engenheiro e às vezes trabalho à noite.' }
  ]
});
</script>
