/* Class 08 · Fala
   Alinhado ao slide "Class 08: Is it cheap or expensive?" — Vocabulary (números: a força no
   -TEEN e no começo do -ty; comida do mercado) e Functional Skills (perguntar e dizer preços).
   Conteúdo NOVO: outros produtos e preços. Números e preços vêm por extenso; o motor converte
   o que o reconhecimento escreve com algarismos ("£4.50"). 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 8, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'thirteen', traducao: 'treze', nota: 'A força fica no fim: thir-TEEN.' },
    { instrucao: PAL, frase: 'thirty', traducao: 'trinta', nota: 'A força fica no começo: THIR-ty.' },
    { instrucao: PAL, frase: 'fifteen', traducao: 'quinze', nota: 'A força fica no fim: fif-TEEN.' },
    { instrucao: PAL, frase: 'fifty', traducao: 'cinquenta', nota: 'A força fica no começo: FIF-ty.' },
    { instrucao: PAL, frase: 'pineapple', traducao: 'abacaxi' },
    { instrucao: PAL, frase: 'avocado', traducao: 'abacate' },
    { instrucao: PAL, frase: 'salmon', traducao: 'salmão', nota: 'O L não se fala: SA-mon.' },
    { instrucao: PAL, frase: 'vegetables', traducao: 'legumes e verduras', nota: 'São só três sílabas: VEJ-ta-bles.' },
    { instrucao: PAL, frase: 'cheese', traducao: 'queijo' },
    { instrucao: PAL, frase: 'expensive', traducao: 'caro' },
    { frase: 'How much is the cheese?', dica: 0, traducao: 'Quanto custa o queijo?' },
    { frase: 'How much are the apples?', dica: 0, traducao: 'Quanto custam as maçãs?' },
    { frase: "It's four pounds fifty.", dica: 0, traducao: 'Custa quatro libras e cinquenta.' },
    { frase: "They're eighty-nine pence.", dica: 0, traducao: 'Custam oitenta e nove centavos (de libra).' },
    { frase: "It's twelve dollars and thirty cents.", dica: 0, traducao: 'Custa doze dólares e trinta centavos.' },
    { frase: 'The salmon is expensive.', dica: 0, traducao: 'O salmão é caro.' },
    { frase: 'The tomatoes are cheap.', dica: 0, traducao: 'Os tomates são baratos.' },
    { frase: 'Two pineapples, please.', dica: 0, traducao: 'Dois abacaxis, por favor.' },
    { frase: "Is it cheap? No, it isn't.", dica: 0, traducao: 'É barato? Não, não é.' },
    { frase: 'The chocolate is three euros and fifty cents.', dica: 0, traducao: 'O chocolate custa três euros e cinquenta centavos.' }
  ]
});
</script>
