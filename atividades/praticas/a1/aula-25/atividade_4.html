/* Class 25 · Fala
   Alinhado ao slide "Class 25: Know Your Coffee" — Vocabulary (listen and repeat), café x coffee,
   could /kʊd/ e I'd like /aɪd laɪk/ como um bloco só. Conteúdo NOVO: outros pedidos. 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 25, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'espresso', traducao: 'espresso', nota: 'Não tem "x": es-PRÉ-sou.' },
    { instrucao: PAL, frase: 'cappuccino', traducao: 'cappuccino' },
    { instrucao: PAL, frase: 'latte', traducao: 'latte (café com bastante leite)', aceita: { lot: 'latte', lottie: 'latte', latay: 'latte' } },
    { instrucao: PAL, frase: 'iced', traducao: 'gelado', nota: 'Soa como "AIST".' },
    { instrucao: PAL, frase: 'medium', traducao: 'médio' },
    { instrucao: PAL, frase: 'almond milk', traducao: 'leite de amêndoas', nota: 'O "l" quase não se fala: Á-mond.' },
    { instrucao: PAL, frase: 'vanilla', traducao: 'baunilha' },
    { instrucao: PAL, frase: 'caramel', traducao: 'caramelo' },
    { instrucao: PAL, frase: 'coffee', traducao: 'café (a bebida)', nota: 'A força fica no começo: CÓ-fi.' },
    { instrucao: PAL, frase: 'café', traducao: 'café (o lugar)', nota: 'A força fica no fim: ca-FEI.', aceita: { caffe: 'cafe' } },
    { frase: 'Can I help you?', dica: 0, traducao: 'Posso ajudar?' },
    { frase: 'Can I have a latte, please?', dica: 0, traducao: 'Posso pedir um latte, por favor?' },
    { frase: 'Could I have an iced cappuccino?', dica: 0, traducao: 'Eu poderia pedir um cappuccino gelado?', nota: 'Could soa "KUD", com "u" curto.' },
    { frase: "I'd like a hot caramel latte.", dica: 0, traducao: 'Eu gostaria de um latte de caramelo quente.' },
    { frase: 'Could I have almond milk in my coffee?', dica: 0, traducao: 'Eu poderia pedir leite de amêndoas no meu café?' },
    { frase: 'Could you help me, please?', dica: 0, traducao: 'Você poderia me ajudar, por favor?' },
    { frase: 'Can I pay by credit card?', dica: 0, traducao: 'Posso pagar com cartão de crédito?' },
    { frase: "I'd like two shots of espresso in my coffee.", dica: 0, traducao: 'Eu gostaria de duas doses de espresso no meu café.' },
    { frase: 'Iced or hot?', dica: 0, traducao: 'Gelado ou quente?' },
    { frase: "Let's go to a café.", dica: 0, traducao: 'Vamos a um café.', aceita: { caffe: 'cafe' } }
  ]
});
</script>
