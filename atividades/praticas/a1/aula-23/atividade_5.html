<script>
/* Class 23 · Gramática
   Alinhado ao slide "Class 23: Friends in a Restaurant" — Functional Skills (I'll start with x
   I'll have; I will = I'll; I'm gonna have é informal), side dishes (with a side of...) e o
   Role-Play. Conteúdo NOVO e mais difícil: escolher a fala certa do garçom e do cliente.
   24 questões. */
const QUEM = 'Choose the right answer';
const CERTA = 'Which sentence is correct?';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 23, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: "I'll start ___ the tomato soup.", opcoes: ['with', 'of', 'for'], certa: 0, traducao: 'Vou começar com a sopa de tomate.' },
    { frase: "I'll have the fish with a side ___ rice.", opcoes: ['with', 'of', 'for'], certa: 1, traducao: 'Vou querer o peixe com arroz de acompanhamento.' },
    { frase: "Same ___ me.", opcoes: ['to', 'with', 'for'], certa: 2, traducao: 'O mesmo para mim.' },
    { frase: "I want the pasta. → ___ have the pasta.", opcoes: ["I'll", 'I', "I'm"], certa: 0, completa: "I'll have the pasta.", traducao: 'Vou querer o macarrão.' },
    { frase: "I want the chicken soup to start. → I'll ___ with the chicken soup.", opcoes: ['have', 'start', 'want'], certa: 1, completa: "I'll start with the chicken soup.", traducao: 'Vou começar com a sopa de frango.' },
    { frase: "I will have = ___", opcoes: ["I've", "I'm", "I'll"], certa: 2, completa: "I'll have", traducao: 'Eu vou querer' },
    { frase: "I'll have ___ omelette.", opcoes: ['an', 'a', 'the a'], certa: 0, traducao: 'Vou querer uma omelete.' },
    { frase: "I'll have ___ cup of coffee.", opcoes: ['an', 'a', 'two'], certa: 1, traducao: 'Vou querer uma xícara de café.' },
    { frase: 'A small portion of food that comes with your main course is a ___.', opcoes: ['menu', 'waiter', 'side dish'], certa: 2, traducao: 'Uma porção pequena que vem com o prato principal é um acompanhamento.' },
    { frase: 'Soup is often an ___.', opcoes: ['appetizer', 'side dish', 'drink'], certa: 0, traducao: 'Sopa muitas vezes é uma entrada.' },
    { frase: '"I\'m gonna have the pizza" is ___.', opcoes: ['formal', 'informal', 'wrong'], certa: 1, completa: "I'm gonna have the pizza.", traducao: '"I\'m gonna have the pizza" é informal.' },
    { instrucao: QUEM, frase: 'Waiter: Are you ready to order? — Customer: ___', opcoes: ['Yes, please.', "That's all.", 'Enjoy!'], certa: 0, completa: 'Yes, please.', traducao: 'Garçom: Estão prontos para pedir? — Cliente: Sim, por favor.' },
    { instrucao: QUEM, frase: 'Waiter: Anything to start with? — Customer: ___', opcoes: ['Same for me.', "I'll start with the salad.", 'Yes, I am.'], certa: 1, completa: "I'll start with the salad.", traducao: 'Garçom: Alguma coisa para começar? — Cliente: Vou começar com a salada.' },
    { instrucao: QUEM, frase: 'Waiter: And to drink? — Customer: ___', opcoes: ["I'll start with the soup.", 'The chicken, please.', "I'll have a fruit juice."], certa: 2, completa: "I'll have a fruit juice.", traducao: 'Garçom: E para beber? — Cliente: Vou querer um suco de fruta.' },
    { instrucao: QUEM, frase: 'Waiter: Anything else? — Customer: ___', opcoes: ["No, thank you. That's all.", 'Yes, please.', "I'm ready."], certa: 0, completa: "No, thank you. That's all.", traducao: 'Garçom: Mais alguma coisa? — Cliente: Não, obrigado. É só isso.' },
    { instrucao: QUEM, frase: 'Customer: I\'ll have the lasagne. — Friend: ___', opcoes: ['Anything else?', 'Same for me.', 'Enjoy!'], certa: 1, completa: 'Same for me.', traducao: 'Cliente: Vou querer a lasanha. — Amigo: O mesmo para mim.' },
    { instrucao: QUEM, frase: "Customer: I'll have the chicken. Waiter: Will you have a side dish? — Customer: ___", opcoes: ['Yes, I have.', 'Yes, I will have side.', "Yes, I'll have a side of rice."], certa: 2, completa: "Yes, I'll have a side of rice.", traducao: 'Cliente: Vou querer o frango. Garçom: Vai querer acompanhamento? — Cliente: Sim, vou querer arroz.' },
    { instrucao: QUEM, frase: "The waiter says at the end: ___", opcoes: ["I'll be back with your order. Enjoy!", "I'll start with the soup.", 'Same for me.'], certa: 0, completa: "I'll be back with your order. Enjoy!", traducao: 'O garçom diz no fim: Já volto com o seu pedido. Bom apetite!' },
    { frase: "And for your ___ course?", opcoes: ['big', 'main', 'side'], certa: 1, traducao: 'E para o seu prato principal?' },
    { frase: 'How ___ do you go to restaurants?', opcoes: ['much', 'old', 'often'], certa: 2, traducao: 'Com que frequência você vai a restaurantes?' },
    { instrucao: CERTA, opcoes: ["I'll have the pasta with a side of bread.", "I'll have the pasta with side a of bread.", "I have the pasta with a side bread of."], certa: 0, traducao: 'Vou querer o macarrão com pão de acompanhamento.' },
    { instrucao: CERTA, opcoes: ["I'll start of the carpaccio.", "I'll start with the carpaccio.", "I start the carpaccio with."], certa: 1, traducao: 'Vou começar com o carpaccio.' },
    { instrucao: CERTA, opcoes: ['Same to me.', 'For me same.', 'Same for me.'], certa: 2, traducao: 'O mesmo para mim.' },
    { instrucao: CERTA, opcoes: ['Are you ready to order?', 'Do you ready to order?', 'You are ready order?'], certa: 0, traducao: 'Vocês estão prontos para pedir?' }
  ]
});
</script>
</body>
</html>
