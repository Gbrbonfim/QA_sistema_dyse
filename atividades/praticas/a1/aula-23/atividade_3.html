<script>
/* Class 23 · Leitura
   Alinhado ao slide "Class 23: Friends in a Restaurant" — Role-Play: in a restaurant (Are you
   ready to order? Anything to start with? And for your main course? And to drink? Anything
   else?) e Same for me. Conteúdo NOVO: Julia e Marcos pedem com o garçom. 20 questões:
   12 de "próxima fala" + 8 de compreensão. */
const D = [
  ['Waiter', 'Good evening! Are you ready to order?'],
  ['Julia', 'Yes, please.'],
  ['Waiter', 'Great! Anything to start with?'],
  ['Julia', "I'll start with the vegetable soup."],
  ['Marcos', 'Same for me.'],
  ['Waiter', 'And for your main course?'],
  ['Julia', "I'll have the grilled fish with a side of rice."],
  ['Marcos', "I'll have the chicken with a side of fries."],
  ['Waiter', 'And to drink?'],
  ['Julia', "I'll have a fruit juice, please."],
  ['Marcos', 'A cup of coffee for me, please.'],
  ['Waiter', 'Of course. Anything else?'],
  ['Julia', "No, thank you. That's all."],
  ['Waiter', "Perfect. I'll be back with your order. Enjoy!"]
];
const lado = q => q === 'Waiter' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a1', aula: 23, num: 3, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ['Yes, please.', 'Yes, I want.', "That's all."], 0, 'Sim, por favor.'),
    prox(2, ['And to drink?', 'Great! Anything to start with?', 'Great! Anything to start of?'], 1, 'Ótimo! Alguma coisa para começar?'),
    prox(3, ["I'll start of the vegetable soup.", 'I want soup.', "I'll start with the vegetable soup."], 2, 'Vou começar com a sopa de legumes.'),
    prox(4, ['Same for me.', 'Same for I.', 'Me too same.'], 0, 'O mesmo para mim.'),
    prox(5, ['Anything else?', 'And for your main course?', 'And for you main course?'], 1, 'E para o prato principal?'),
    prox(6, ["I'll have the grilled fish with a side rice of.", 'And to drink?', "I'll have the grilled fish with a side of rice."], 2, 'Vou querer o peixe grelhado com arroz de acompanhamento.'),
    prox(7, ["I'll have the chicken with a side of fries.", "I'll have the chicken with side of a fries.", "That's all."], 0, 'Vou querer o frango com batata frita de acompanhamento.'),
    prox(8, ['Enjoy!', 'And to drink?', 'And to drinks?'], 1, 'E para beber?'),
    prox(9, ["I'll start with a fruit juice.", 'Same for me.', "I'll have a fruit juice, please."], 2, 'Vou querer um suco de fruta, por favor.'),
    prox(10, ['A cup of coffee for me, please.', 'A cup of coffee for I, please.', 'Anything else?'], 0, 'Uma xícara de café para mim, por favor.'),
    prox(11, ['Are you ready to order?', 'Of course. Anything else?', 'Of course. Anything other?'], 1, 'Claro. Mais alguma coisa?'),
    prox(12, ["No, thank you. All that's.", 'Yes, please.', "No, thank you. That's all."], 2, 'Não, obrigada. É só isso.'),
    { instrucao: 'What does Julia start with?', frase: 'The vegetable ___.', opcoes: ['soup', 'salad', 'pizza'], certa: 0, traducao: 'A sopa de legumes.' },
    { instrucao: 'What does Marcos start with?', frase: 'The same: the vegetable ___.', opcoes: ['salad', 'soup', 'juice'], certa: 1, traducao: 'O mesmo: a sopa de legumes.' },
    { instrucao: "What is Julia's main course?", frase: 'The grilled ___.', opcoes: ['chicken', 'prawns', 'fish'], certa: 2, traducao: 'O peixe grelhado.' },
    { instrucao: "What is Julia's side dish?", frase: '___.', opcoes: ['Rice', 'Fries', 'Bread'], certa: 0, traducao: 'Arroz.' },
    { instrucao: "What is Marcos's main course?", frase: 'The ___ with a side of fries.', opcoes: ['fish', 'chicken', 'lasagne'], certa: 1, traducao: 'O frango com batata frita de acompanhamento.' },
    { instrucao: 'What does Julia drink?', frase: 'A fruit ___.', opcoes: ['coffee', 'soup', 'juice'], certa: 2, traducao: 'Um suco de fruta.' },
    { instrucao: 'What does Marcos drink?', frase: 'A cup of ___.', opcoes: ['coffee', 'tea', 'juice'], certa: 0, traducao: 'Uma xícara de café.' },
    { instrucao: 'How does Julia say she is finished ordering?', frase: "No, thank you. ___ all.", opcoes: ['Is', "That's", "It's"], certa: 1, traducao: 'Não, obrigada. É só isso.' }
  ]
});
</script>
