/* Class 11 · Fala
   Alinhado ao slide "Class 11: Dog Lovers" — Vocabulary (listen and repeat os adjetivos),
   Grammar Point (adjetivo + substantivo ligados: "a friendly dog") e Speaking and Writing ("My
   favorite dog is the Poodle..."). Conteúdo NOVO: outras raças e frases. 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 11, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'friendly', traducao: 'amigável', nota: 'São duas sílabas: FREND-ly.' },
    { instrucao: PAL, frase: 'hungry', traducao: 'com fome' },
    { instrucao: PAL, frase: 'thirsty', traducao: 'com sede', nota: 'O "th" é com a língua entre os dentes.' },
    { instrucao: PAL, frase: 'expensive', traducao: 'caro' },
    { instrucao: PAL, frase: 'lazy', traducao: 'preguiçoso', nota: 'Soa como "LEI-zi".' },
    { instrucao: PAL, frase: 'smart', traducao: 'esperto, inteligente' },
    { instrucao: PAL, frase: 'noisy', traducao: 'barulhento', nota: 'Soa como "NÓI-zi".' },
    { instrucao: PAL, frase: 'cute', traducao: 'fofo' },
    { instrucao: PAL, frase: 'clean', traducao: 'limpo' },
    { instrucao: PAL, frase: 'unfriendly', traducao: 'pouco amigável' },
    { frase: "It's a small dog.", dica: 0, traducao: 'É um cachorro pequeno.' },
    { frase: "They're big dogs.", dica: 0, traducao: 'Eles são cachorros grandes.', nota: 'Big não ganha "s": big dogs.' },
    { frase: 'Poodles are smart dogs.', dica: 0, traducao: 'Poodles são cachorros espertos.' },
    { frase: 'The French Bulldog is lazy.', dica: 0, traducao: 'O Buldogue Francês é preguiçoso.' },
    { frase: 'The baby is very hungry.', dica: 0, traducao: 'O bebê está com muita fome.' },
    { frase: "It isn't a good laptop.", dica: 0, traducao: 'Não é um notebook bom.' },
    { frase: 'Greyhounds are fast dogs.', dica: 0, traducao: 'Greyhounds são cachorros rápidos.' },
    { frase: 'Chihuahuas are small dogs from Mexico.', dica: 0, traducao: 'Chihuahuas são cachorros pequenos do México.' },
    { frase: 'My favorite dog is the Labrador. Labradors are friendly.', dica: 0, traducao: 'Meu cachorro favorito é o Labrador. Labradores são amigáveis.' },
    { frase: "Is it a cheap phone? No, it's expensive.", dica: 0, traducao: 'É um celular barato? Não, é caro.' }
  ]
});
</script>
