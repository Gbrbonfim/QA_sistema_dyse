DysePratica.iniciar({

    { instrucao: PAL, frase: 'weather', traducao: 'tempo (clima)', nota: 'Soa como "UÉ-der", com o th da língua entre os dentes.' },

    { instrucao: PAL, frase: 'summer', traducao: 'verão' },
    { instrucao: PAL, frase: 'spring', traducao: 'primavera' },

    { instrucao: PAL, frase: 'cloudy', traducao: 'nublado' },
    { instrucao: PAL, frase: 'windy', traducao: 'com vento' },
    { instrucao: PAL, frase: 'umbrella', traducao: 'guarda-chuva' },
    { instrucao: PAL, frase: 'scarf', traducao: 'cachecol' },
    { instrucao: PAL, frase: 'gloves', traducao: 'luvas' },
    { frase: "What's the weather like today?", dica: 0, traducao: 'Como está o tempo hoje?' },
    { frase: "It's sunny and hot.", dica: 0, traducao: 'Está ensolarado e quente.' },
    { frase: 'Is it raining?', dica: 0, traducao: 'Está chovendo?' },
    { frase: "No, it isn't. It's snowing.", dica: 0, traducao: 'Não. Está nevando.' },
    { frase: "She isn't wearing a jacket.", dica: 0, traducao: 'Ela não está usando jaqueta.' },
    { frase: 'Are your parents working now?', dica: 0, traducao: 'Seus pais estão trabalhando agora?' },
    { frase: "My brother isn't playing football today.", dica: 0, traducao: 'Meu irmão não está jogando futebol hoje.' },
    { frase: "I'm not wearing jeans. It's a formal party.", dica: 0, traducao: 'Eu não estou usando jeans. É uma festa formal.' },
    { frase: "Is she going to the gym? Yes, she is.", dica: 0, traducao: 'Ela está indo para a academia? Sim, está.' },
    { frase: "It's cold. I'm wearing a coat, a scarf and gloves.", dica: 0, traducao: 'Está frio. Eu estou usando casaco, cachecol e luvas.' }
  ]
