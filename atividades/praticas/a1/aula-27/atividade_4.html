    { instrucao: PAL, frase: 'pajamas', traducao: 'pijama', aceita: { pyjamas: 'pajamas' } },
    { instrucao: PAL, frase: 'clothes', traducao: 'roupas', nota: 'Uma sílaba só: CLOUZ.' },
    { instrucao: PAL, frase: 'wearing', traducao: 'usando, vestindo', nota: 'O -ing termina suave, sem "g" forte: WÉR-ing.' },
    { frase: "I'm wearing a jacket today.", dica: 0, traducao: 'Eu estou usando uma jaqueta hoje.' },

    { frase: "They're wearing pajamas right now.", dica: 0, traducao: 'Eles estão de pijama agora.' },
    { frase: 'The girls are dancing.', dica: 0, traducao: 'As meninas estão dançando.' },
    { frase: "I'm shopping online today.", dica: 0, traducao: 'Eu estou fazendo compras online hoje.' },
    { frase: 'The baby is crying.', dica: 0, traducao: 'O bebê está chorando.' },
    { frase: "We're driving to the city now.", dica: 0, traducao: 'Nós estamos dirigindo para a cidade agora.' },
    { frase: "I'm studying at the moment.", dica: 0, traducao: 'Eu estou estudando no momento.' },
    { frase: "My sister's working in Spain at the moment.", dica: 0, traducao: 'Minha irmã está trabalhando na Espanha no momento.' },
    { frase: "You're wearing a lovely dress.", dica: 0, traducao: 'Você está usando um vestido lindo.' },
