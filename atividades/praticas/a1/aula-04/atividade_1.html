    { audioTexto: "She's Austrian.", opcoes: op('au', 'at', 'de', 'ch'), certa: 1 },
    { audioTexto: "They're South African.", opcoes: op('au', 'us', 'za', 'pk'), certa: 2 },
    { audioTexto: "We're Slovenian.", opcoes: op('gr', 'at', 'de', 'si'), certa: 3 },

    { instrucao: DIALOGO, audioTexto: 'Is Ali Indian? No, he isn\'t. He\'s Pakistani.', opcoes: op('in', 'pk', 'za', 'pt'), certa: 1 },
