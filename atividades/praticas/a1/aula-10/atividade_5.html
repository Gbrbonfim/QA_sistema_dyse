<script>
/* Class 10 · Gramática
   Alinhado ao slide "Class 10: Famous Families 1" — Grammar Point (genitivo 's; "Luke is
   Haley's brother" = "He is her brother") e exercício 3 (Claire is Phil's wife → Phil is
   Claire's husband). Conteúdo NOVO e mais difícil: raciocínio de parentesco (a irmã da minha
   mãe = minha tia), 's de posse x 's de is, e his / her / their. 24 questões. */
const QUER = 'O que o \'s quer dizer nesta frase?';
const CERTA = 'Qual frase está correta?';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 10, num: 5, tipo: 'escolha',
  instrucao: 'Complete a frase',
  itens: [
    { frase: "Kate is William's wife. William is Kate's ___.", opcoes: ['husband', 'wife', 'father'], certa: 0, traducao: 'A Kate é a esposa do William. O William é o marido da Kate.' },
    { frase: "Charlotte is William's daughter. William is Charlotte's ___.", opcoes: ['son', 'father', 'brother'], certa: 1, traducao: 'A Charlotte é a filha do William. O William é o pai da Charlotte.' },
    { frase: "George is Charles's grandson. Charles is George's ___.", opcoes: ['father', 'uncle', 'grandfather'], certa: 2, traducao: 'O George é o neto do Charles. O Charles é o avô do George.' },
    { frase: "Willow is Jaden's sister. Jaden is Willow's ___.", opcoes: ['brother', 'sister', 'son'], certa: 0, traducao: 'A Willow é a irmã do Jaden. O Jaden é o irmão da Willow.' },
    { frase: "Will and Jada are Willow's parents. Willow is their ___.", opcoes: ['mother', 'daughter', 'sister'], certa: 1, traducao: 'O Will e a Jada são os pais da Willow. A Willow é a filha deles.' },
    { frase: "Rosa is my mother's sister. Rosa is my ___.", opcoes: ['aunt', 'uncle', 'cousin'], certa: 0, traducao: 'A Rosa é a irmã da minha mãe. A Rosa é a minha tia.' },
    { frase: "Pedro is my father's brother. Pedro is my ___.", opcoes: ['aunt', 'cousin', 'uncle'], certa: 2, traducao: 'O Pedro é o irmão do meu pai. O Pedro é o meu tio.' },
    { frase: "Leo is my aunt's son. Leo is my ___.", opcoes: ['brother', 'cousin', 'uncle'], certa: 1, traducao: 'O Leo é o filho da minha tia. O Leo é o meu primo.' },
    { frase: "Ana is my mother's mother. Ana is my ___.", opcoes: ['grandmother', 'granddaughter', 'stepmother'], certa: 0, traducao: 'A Ana é a mãe da minha mãe. A Ana é a minha avó.' },
    { frase: "Camilla is William's stepmother. She is King Charles's ___.", opcoes: ['daughter', 'sister', 'wife'], certa: 2, traducao: 'A Camilla é a madrasta do William. Ela é a esposa do rei Charles.' },
    { frase: "Luke is Haley's brother. He is ___ brother.", opcoes: ['his', 'her'], certa: 1, traducao: 'O Luke é o irmão da Haley. Ele é o irmão dela.' },
    { frase: "Lily is Mitchell's daughter. She is ___ daughter.", opcoes: ['his', 'her'], certa: 0, traducao: 'A Lily é a filha do Mitchell. Ela é a filha dele.' },
    { frase: "Claire and Mitchell are DeDe's children. They are ___ children.", opcoes: ['his', 'her', 'their'], certa: 1, traducao: 'A Claire e o Mitchell são os filhos da DeDe. Eles são os filhos dela.' },
    { frase: "Haley and Alex are Phil and Claire's daughters. They are ___ daughters.", opcoes: ['their', 'her', 'his'], certa: 0, traducao: 'A Haley e a Alex são as filhas do Phil e da Claire. Elas são as filhas deles.' },
    { frase: "___ is Victoria Beckham's daughter.", opcoes: ['Harper', 'Harpers', "Harper's"], certa: 0, traducao: 'A Harper é a filha da Victoria Beckham.' },
    { frase: 'Victoria is ___ wife.', opcoes: ['David', "David's", 'Davids'], certa: 1, traducao: 'A Victoria é a esposa do David.' },
    { frase: "Haley and Alex are Phil's ___.", opcoes: ['daughter', 'daughters'], certa: 1, traducao: 'A Haley e a Alex são as filhas do Phil.' },
    { frase: "Poppy and George are Haley's ___.", opcoes: ['children', 'childs', 'child'], certa: 0, traducao: 'A Poppy e o George são os filhos da Haley.' },
    { frase: "Who ___ Alex and Luke? They're Haley's sister and brother.", opcoes: ['is', 'are'], certa: 1, traducao: 'Quem são a Alex e o Luke? Eles são a irmã e o irmão da Haley.' },
    { instrucao: QUER + " — Haley's a mother.", opcoes: ['is (verbo to be)', 'posse (de)'], certa: 0, completa: "Haley's a mother.", traducao: 'A Haley é mãe. (\'s = is)' },
    { instrucao: QUER + " — Haley's mother is Claire.", opcoes: ['is (verbo to be)', 'posse (de)'], certa: 1, completa: "Haley's mother is Claire.", traducao: 'A mãe da Haley é a Claire. (\'s = posse)' },
    { instrucao: CERTA, opcoes: ["Luke is Haley's brother.", "Luke is brother's Haley.", 'Luke is Haley brother.'], certa: 0, traducao: 'O Luke é o irmão da Haley.' },
    { instrucao: CERTA, opcoes: ['Kate is William wife.', "Kate is William's wife.", "Kate is wife's William."], certa: 1, traducao: 'A Kate é a esposa do William.' },
    { instrucao: CERTA, opcoes: ["Who is Harper's?", 'Who are Harper?', 'Who is Harper?'], certa: 2, traducao: 'Quem é a Harper?' }
  ]
});
</script>
