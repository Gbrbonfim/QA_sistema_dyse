<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Class 10 · Escrita
   Alinhado ao slide "Class 10: Famous Families 1" — Grammar Point (Luke is Haley's brother:
   nome + 's + família, nunca "the brother of Haley") e Vocabulary (Who is...? She is my sister).
   Conteúdo NOVO: família real britânica e família Smith (fatos verdadeiros). O contexto mostra a
   frase em português para que só uma ordem seja certa. A isca é "of" (a ordem do português) ou
   is/are trocado. 20 questões. */
const M = pt => 'Monte em inglês: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 10, num: 2, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('A Kate é a esposa do William.'), palavras: ['Kate', 'is', "William's", 'wife'], isca: ['of'], fim: '.', traducao: 'A Kate é a esposa do William.' },
    { contexto: M('O Harry é o irmão do William.'), palavras: ['Harry', 'is', "William's", 'brother'], isca: ['of'], fim: '.', traducao: 'O Harry é o irmão do William.' },
    { contexto: M('A Charlotte é a filha da Kate.'), palavras: ['Charlotte', 'is', "Kate's", 'daughter'], isca: ['of'], fim: '.', traducao: 'A Charlotte é a filha da Kate.' },
    { contexto: M('O George é o neto do Charles.'), palavras: ['George', 'is', "Charles's", 'grandson'], isca: ['of'], fim: '.', traducao: 'O George é o neto do Charles.' },
    { contexto: M('O Archie é o primo do George.'), palavras: ['Archie', 'is', "George's", 'cousin'], isca: ['the'], fim: '.', traducao: 'O Archie é o primo do George.' },
    { contexto: M('A Camilla é a madrasta do William.'), palavras: ['Camilla', 'is', "William's", 'stepmother'], isca: ['of'], fim: '.', traducao: 'A Camilla é a madrasta do William.' },
    { contexto: M('O Harry é o tio do George.'), palavras: ['Harry', 'is', "George's", 'uncle'], isca: ['of'], fim: '.', traducao: 'O Harry é o tio do George.' },
    { contexto: M('A Willow é a irmã do Jaden.'), palavras: ['Willow', 'is', "Jaden's", 'sister'], isca: ['of'], fim: '.', traducao: 'A Willow é a irmã do Jaden.' },
    { contexto: M('O Will e a Jada são os pais da Willow.'), palavras: ['Will', 'and', 'Jada', 'are', "Willow's", 'parents'], isca: ['is'], fim: '.', traducao: 'O Will e a Jada são os pais da Willow.' },
    { contexto: M('O Jaden é o filho do Will.'), palavras: ['Jaden', 'is', "Will's", 'son'], isca: ['of'], fim: '.', traducao: 'O Jaden é o filho do Will.' },
    { contexto: M('Quem é a Harper?'), palavras: ['Who', 'is', 'Harper'], isca: ['are'], fim: '?', traducao: 'Quem é a Harper?' },
    { contexto: M('Ela é a filha da Victoria.'), palavras: ['She', 'is', "Victoria's", 'daughter'], isca: ['Her'], fim: '.', traducao: 'Ela é a filha da Victoria.' },
    { contexto: M('Quem são os filhos da Haley?'), palavras: ['Who', 'are', "Haley's", 'children'], isca: ['is'], fim: '?', traducao: 'Quem são os filhos da Haley?' },
    { contexto: M('Eles são os filhos da Haley.'), palavras: ['They', 'are', "Haley's", 'children'], isca: ['Their'], fim: '.', traducao: 'Eles são os filhos da Haley.' },
    { contexto: M('A minha mãe é a Claire.'), palavras: ['My', 'mom', 'is', 'Claire'], isca: ['I'], fim: '.', traducao: 'A minha mãe é a Claire.' },
    { contexto: M('A Paula é minha tia.'), palavras: ['Paula', 'is', 'my', 'aunt'], isca: ['I'], fim: '.', traducao: 'A Paula é minha tia.' },
    { contexto: M('Eu tenho um irmão. O nome dele é Pedro.'), palavras: ['I', 'have', 'a', 'brother.', 'His', 'name', 'is', 'Pedro'], isca: ['He'], fim: '.', traducao: 'Eu tenho um irmão. O nome dele é Pedro.' },
    { contexto: M('Eu tenho duas primas. Os nomes delas são Ana e Bia.'), palavras: ['I', 'have', 'two', 'cousins.', 'Their', 'names', 'are', 'Ana', 'and', 'Bia'], isca: ['They'], fim: '.', traducao: 'Eu tenho duas primas. Os nomes delas são Ana e Bia.' },
    { contexto: M('A Gloria é a mãe do Manny e do Joe.'), palavras: ['Gloria', 'is', 'Manny', 'and', "Joe's", 'mother'], isca: ['of'], fim: '.', traducao: 'A Gloria é a mãe do Manny e do Joe.' },
    { contexto: M('O Phil é o marido da Claire e o pai do Luke.'), palavras: ['Phil', 'is', "Claire's", 'husband', 'and', "Luke's", 'father'], isca: ['of'], fim: '.', traducao: 'O Phil é o marido da Claire e o pai do Luke.' }
  ]
});
</script>
