   Alinhado ao slide "Class 33 and 34: When Were You Born?" (parte Class 34) — Vocabulary and

const signo = (...cs) => cs.map(c => ({ label: c, icon: 'stars' }));

  course: 'ativ-a1', aula: 33, num: 6, tipo: 'imagem',
  instrucao: 'Listen and choose the zodiac sign',
  itens: [
    { audioTexto: 'Aries', opcoes: signo('Aries', 'Taurus', 'Leo', 'Libra'), certa: 0 },
    { audioTexto: 'Gemini', opcoes: signo('Cancer', 'Gemini', 'Virgo', 'Pisces'), certa: 1 },
    { audioTexto: 'Sagittarius', opcoes: signo('Scorpio', 'Capricorn', 'Sagittarius', 'Aquarius'), certa: 2 },
    { audioTexto: 'Aquarius', opcoes: signo('Aries', 'Pisces', 'Capricorn', 'Aquarius'), certa: 3 },
    { audioTexto: 'Virgo', opcoes: signo('Virgo', 'Libra', 'Leo', 'Taurus'), certa: 0 },
    { audioTexto: 'Capricorn', opcoes: signo('Cancer', 'Capricorn', 'Scorpio', 'Sagittarius'), certa: 1 },
    { audioTexto: 'Scorpio', opcoes: signo('Sagittarius', 'Gemini', 'Scorpio', 'Leo'), certa: 2 },
    { audioTexto: 'Pisces', opcoes: signo('Aries', 'Aquarius', 'Virgo', 'Pisces'), certa: 3 },
    { audioTexto: 'Taurus', opcoes: signo('Taurus', 'Aries', 'Cancer', 'Libra'), certa: 0 },
    { audioTexto: 'Libra', opcoes: signo('Leo', 'Libra', 'Virgo', 'Gemini'), certa: 1 },
    { audioTexto: 'Cancer', opcoes: signo('Capricorn', 'Scorpio', 'Cancer', 'Taurus'), certa: 2 },
    { audioTexto: 'Leo', opcoes: signo('Libra', 'Aries', 'Pisces', 'Leo'), certa: 3 },
    { instrucao: SA, audioTexto: 'Was Pelé a football player?', opcoes: resp('Yes, he was.', "No, he wasn't.", 'Yes, he were.', 'Yes, she was.'), certa: 0 },
    { instrucao: SA, audioTexto: 'Was Frida Kahlo a singer?', opcoes: resp('Yes, she was.', "No, she wasn't.", "No, she weren't.", "No, he wasn't."), certa: 1 },
    { instrucao: SA, audioTexto: 'Were Einstein and Marie Curie scientists?', opcoes: resp('Yes, they was.', "No, they weren't.", 'Yes, they were.', 'Yes, we were.'), certa: 2 },
    { instrucao: SA, audioTexto: 'Was Mozart from Brazil?', opcoes: resp('Yes, he was.', 'No, he were.', 'Yes, he is.', "No, he wasn't."), certa: 3 },
    { instrucao: SA, audioTexto: 'Was Ayrton Senna Brazilian?', opcoes: resp('Yes, he was.', 'Yes, he were.', "No, he wasn't.", 'Yes, she was.'), certa: 0 },
    { instrucao: SA, audioTexto: 'Were the Beatles from the USA?', opcoes: resp('Yes, they were.', "No, they weren't.", "No, they wasn't.", 'No, it was.'), certa: 1 },
    { instrucao: SA, audioTexto: 'Was Queen Victoria born in May?', opcoes: resp("No, she wasn't.", 'Yes, she were.', 'Yes, she was.', 'Yes, it was.'), certa: 2 },
    { instrucao: SA, audioTexto: 'Was Michael Jackson a football player?', opcoes: resp('Yes, he was.', 'No, he were.', "No, he isn't.", "No, he wasn't."), certa: 3 },
    { instrucao: SA, audioTexto: 'Was Einstein a Pisces?', opcoes: resp('Yes, he was.', "No, he wasn't.", 'Yes, he were.', 'Yes, they were.'), certa: 0 },

    { instrucao: SA, audioTexto: 'Were Pelé and Ayrton Senna Argentinian?', opcoes: resp('Yes, they were.', "No, they wasn't.", "No, he wasn't.", "No, they weren't. They were Brazilian."), certa: 3 }
  ]
});
