<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* Class 03 · Leitura
   Alinhado ao slide "Class 03: Guess the Country" — Listening (diálogo de nacionalidades),
   Reading (texto com "is not / isn't") e Grammar 7 (diálogos com afirmativa e negativa).
   Conteúdo NOVO: Tom e Julia brincam de adivinhar o país. 20 questões: 11 de "próxima fala"
   + 9 de compreensão. Opções erradas nunca são plausíveis com o que já foi dito: a
   nacionalidade do Tom só aparece quando ele mesmo fala. */
const D = [
  ['Tom', "Hi! I'm Tom. What's your name?"],
  ['Julia', "Hi, Tom! I'm Julia. Nice to meet you."],
  ['Tom', 'Nice to meet you too. Where are you from?'],
  ['Julia', "Guess! I'm not from Spain."],
  ['Tom', "Hmm... You're Italian!"],
  ['Julia', "No, I'm not Italian. I'm French."],
  ['Tom', 'Oh, France is beautiful!'],
  ['Julia', 'Thank you! And you?'],
  ['Tom', "I'm not American. I'm Canadian."],
  ['Julia', 'Canadian? My friend Mei is Canadian too.'],
  ['Tom', 'Nice! See you later, Julia!'],
  ['Julia', 'Bye, Tom!']
];
const lado = q => q === 'Tom' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a1', aula: 3, num: 3, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ["No, I'm not Italian. I'm French.", "Hi, Tom! I'm Julia. Nice to meet you.", 'Bye, Tom!'], 1, 'Oi, Tom! Eu sou a Julia. Prazer em te conhecer.'),
    prox(2, ["Hmm... You're Italian!", 'Bye, Tom!', 'Nice to meet you too. Where are you from?'], 2, 'Prazer em te conhecer também. De onde você é?'),
    prox(3, ["Guess! I'm not from Spain.", 'Thank you! And you?', 'Bye, Tom!'], 0, 'Adivinha! Eu não sou da Espanha.'),
    prox(4, ["Hmm... You're Spanish!", "Hmm... You're Italian!", 'Bye, Julia!'], 1, 'Hmm... Você é italiana!'),
    prox(5, ["No, I'm not Italian. I'm Spanish.", 'Nice to meet you too.', "No, I'm not Italian. I'm French."], 2, 'Não, eu não sou italiana. Eu sou francesa.'),
    prox(6, ['Oh, France is beautiful!', 'Oh, Spain is beautiful!', 'Oh, Italy is beautiful!'], 0, 'Ah, a França é linda!'),
    prox(7, ["Guess! I'm not from Spain.", 'Thank you! And you?', 'Thank you! Italy is nice too.'], 1, 'Obrigada! E você?'),
    prox(8, ['Bye, Julia!', 'Nice to meet you too.', "I'm not American. I'm Canadian."], 2, 'Eu não sou americano. Eu sou canadense.'),
    prox(9, ['Canadian? My friend Mei is Canadian too.', 'French? My friend Mei is French too.', "Hmm... You're Italian!"], 0, 'Canadense? Minha amiga Mei também é canadense.'),
    prox(10, ['Nice! See you later, Tom!', 'Nice! See you later, Julia!', 'Where are you from?'], 1, 'Legal! Até mais, Julia!'),
    prox(11, ['Bye, Julia!', "Hi! I'm Tom.", 'Bye, Tom!'], 2, 'Tchau, Tom!'),
    { instrucao: "What's Julia's nationality?", frase: 'Julia is ___.', opcoes: ['Italian', 'French', 'Spanish'], certa: 1, traducao: 'A Julia é francesa.' },
    { instrucao: 'Tom says Julia is... what?', frase: 'Tom says: "You\'re ___!"', opcoes: ['Italian', 'French', 'Canadian'], certa: 0, traducao: 'Tom diz: "Você é italiana!"' },
    { instrucao: 'Is Julia Italian?', frase: 'No, she ___ Italian.', opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'Não, ela não é italiana.' },
    { instrucao: 'Is Tom American?', frase: 'No, he ___ American.', opcoes: ["'m not", "aren't", "isn't"], certa: 2, traducao: 'Não, ele não é americano.' },
    { instrucao: "What's Tom's nationality?", frase: 'Tom is ___.', opcoes: ['American', 'Canadian', 'English'], certa: 1, traducao: 'O Tom é canadense.' },
    { instrucao: "What's Mei's nationality?", frase: 'Mei is ___.', opcoes: ['Chinese', 'Canadian', 'French'], certa: 1, traducao: 'A Mei é canadense.' },
    { instrucao: 'Is Julia Spanish?', frase: 'Julia ___ Spanish.', opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'A Julia não é espanhola.' },
    { instrucao: "Complete Julia's line:", frase: 'Julia: "No, I\'m ___ Italian."', opcoes: ['not', 'no', "isn't"], certa: 0, traducao: 'Julia: "Não, eu não sou italiana."' },
    { instrucao: 'Who says "See you later"?', frase: '___ says: "See you later, Julia!"', opcoes: ['Tom', 'Julia'], certa: 0, traducao: 'O Tom diz: "Até mais, Julia!"' }
  ]
});
</script>
