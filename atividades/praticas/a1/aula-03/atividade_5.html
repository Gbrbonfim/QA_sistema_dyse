<script>
/* Class 03 · Gramática
   Alinhado ao slide "Class 03: Guess the Country" — Grammar Point: To Be Negative Form
   (am not / is not / are not e as contrações isn't / aren't / I'm not; corrigir uma
   informação falsa). Conteúdo NOVO: outras frases e famosos (fatos verdadeiros).
   24 questões: 10 forma por extenso + 6 contração + 8 de achar a frase correta. */
const N = ['am not', 'is not', 'are not'];
const COR = 'The sentence is wrong. Complete the correction:';
const CERTA = 'Which sentence is correct?';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 3, num: 5, tipo: 'escolha',
  instrucao: 'Complete with the negative of the verb to be',
  itens: [
    { frase: 'I ___ Chinese.', opcoes: N, certa: 0, traducao: 'Eu não sou chinês(a).' },
    { frase: 'She ___ Japanese.', opcoes: N, certa: 1, traducao: 'Ela não é japonesa.' },
    { frase: 'They ___ German.', opcoes: N, certa: 2, traducao: 'Eles não são alemães.' },
    { frase: 'He ___ from Spain.', opcoes: N, certa: 1, traducao: 'Ele não é da Espanha.' },
    { frase: 'We ___ Indian.', opcoes: N, certa: 2, traducao: 'Nós não somos indianos.' },
    { frase: 'You ___ French.', opcoes: N, certa: 2, traducao: 'Você não é francês.' },
    { frase: 'It ___ from Italy.', opcoes: N, certa: 1, traducao: 'Não é da Itália.' },
    { frase: 'I ___ from Canada.', opcoes: N, certa: 0, traducao: 'Eu não sou do Canadá.' },
    { frase: 'Emma and Mike ___ Swiss.', opcoes: N, certa: 2, traducao: 'A Emma e o Mike não são suíços.' },
    { frase: 'Pedro ___ Italian.', opcoes: N, certa: 1, traducao: 'O Pedro não é italiano.' },
    { instrucao: COR, frase: "Pizza ___ Spanish. It's Italian.", opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'A pizza não é espanhola. Ela é italiana.' },
    { instrucao: COR, frase: "Neymar ___ Spanish. He's Brazilian.", opcoes: ["aren't", "isn't", "'m not"], certa: 1, traducao: 'O Neymar não é espanhol. Ele é brasileiro.' },
    { instrucao: COR, frase: "Taylor Swift ___ English. She's American.", opcoes: ["'m not", "aren't", "isn't"], certa: 2, traducao: 'A Taylor Swift não é inglesa. Ela é americana.' },
    { instrucao: COR, frase: "Paella ___ Italian. It's Spanish.", opcoes: ["'m not", "isn't", "aren't"], certa: 1, traducao: 'A paella não é italiana. Ela é espanhola.' },
    { instrucao: COR, frase: "Justin Bieber and Celine Dion ___ American. They're Canadian.", opcoes: ["isn't", "'m not", "aren't"], certa: 2, traducao: 'O Justin Bieber e a Celine Dion não são americanos. Eles são canadenses.' },
    { instrucao: COR, frase: "Jackie Chan ___ Japanese. He's Chinese.", opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'O Jackie Chan não é japonês. Ele é chinês.' },
    { instrucao: CERTA, opcoes: ["I'm not Swiss.", "I isn't Swiss.", "I aren't Swiss."], certa: 0, traducao: 'Eu não sou suíço(a).' },
    { instrucao: CERTA, opcoes: ["He aren't German.", "He isn't German.", "He'm not German."], certa: 1, traducao: 'Ele não é alemão.' },
    { instrucao: CERTA, opcoes: ["We isn't Chinese.", "We'm not Chinese.", "We aren't Chinese."], certa: 2, traducao: 'Nós não somos chineses.' },
    { instrucao: CERTA, opcoes: ["They aren't Indian.", "They isn't Indian.", "They'm not Indian."], certa: 0, traducao: 'Eles não são indianos.' },
    { instrucao: CERTA, opcoes: ["She aren't Canadian.", "She isn't Canadian.", "She'm not Canadian."], certa: 1, traducao: 'Ela não é canadense.' },
    { instrucao: CERTA, opcoes: ["You isn't Spanish.", "You'm not Spanish.", "You aren't Spanish."], certa: 2, traducao: 'Você não é espanhol(a).' },
    { instrucao: CERTA, opcoes: ["I'm not Italian. I'm Brazilian.", "I isn't Italian. I'm Brazilian.", "I'm not Italian. I's Brazilian."], certa: 0, traducao: 'Eu não sou italiano(a). Eu sou brasileiro(a).' },
    { instrucao: CERTA, opcoes: ["Raj aren't English. He's Indian.", "Raj isn't English. He's Indian.", "Raj isn't English. He're Indian."], certa: 1, traducao: 'O Raj não é inglês. Ele é indiano.' }
  ]
});
</script>
