/* Class 15 · Fala (revisão)
   Alinhado ao slide "Class 15: Review Classes 1-12" — Talking Point (fazer e responder as
   perguntas pessoais). Conteúdo NOVO e mais difícil: perguntas e respostas mais longas, com

DysePratica.iniciar({
  course: 'ativ-a1', aula: 15, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "What's your name?", dica: 0, traducao: 'Qual é o seu nome?' },
    { frase: 'Where are you from?', dica: 0, traducao: 'De onde você é?' },
    { frase: "How old are you? I'm twenty-five.", dica: 0, traducao: 'Quantos anos você tem? Eu tenho vinte e cinco.', nota: 'Idade é com to be: I am twenty-five.' },
    { frase: 'How do you spell your last name?', dica: 0, traducao: 'Como você soletra o seu sobrenome?' },
    { frase: "What's in your bag? I have a wallet and a phone.", dica: 0, traducao: 'O que tem na sua bolsa? Eu tenho uma carteira e um celular.' },
    { frase: 'How much is a cup of coffee?', dica: 0, traducao: 'Quanto custa uma xícara de café?' },
    { frase: "It's three pounds fifty.", dica: 0, traducao: 'Custa três libras e cinquenta.' },
    { frase: "What's your favorite food?", dica: 0, traducao: 'Qual é a sua comida favorita?' },
    { frase: 'My favorite TV show is Friends.', dica: 0, traducao: 'Minha série favorita é Friends.' },
    { frase: 'Who is in your family?', dica: 0, traducao: 'Quem está na sua família?' },
    { frase: "My sister's name is Julia.", dica: 0, traducao: 'O nome da minha irmã é Julia.' },
    { frase: "My phone is new, but it isn't expensive.", dica: 0, traducao: 'Meu celular é novo, mas não é caro.' },
    { frase: 'What do you have for breakfast?', dica: 0, traducao: 'O que você come no café da manhã?' },
    { frase: 'I have eggs and coffee for breakfast.', dica: 0, traducao: 'Eu como ovos e tomo café no café da manhã.' },
    { frase: "What's your favorite day of the week?", dica: 0, traducao: 'Qual é o seu dia favorito da semana?' },
    { frase: 'My favorite day is Friday.', dica: 0, traducao: 'Meu dia favorito é sexta.' },
    { frase: 'What time do you start work?', dica: 0, traducao: 'A que horas você começa a trabalhar?' },
    { frase: 'I start work at half past eight.', dica: 0, traducao: 'Eu começo a trabalhar às oito e meia.' },
    { frase: "My mom gets up at six o'clock and has a shower.", dica: 0, traducao: 'Minha mãe levanta às seis horas e toma banho.' },
    { frase: "Is your teacher from Brazil? No, she isn't.", dica: 0, traducao: 'Sua professora é do Brasil? Não, ela não é.' }
  ]
});
</script>
