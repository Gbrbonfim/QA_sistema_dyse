/* Class 43 · Fala (revisão geral)
   Alinhado ao slide "Class 43: Review" — Talking Point "Can you...?": compromissos (esta semana,

DysePratica.iniciar({
  course: 'ativ-a1', aula: 43, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "This week, I'm going to the dentist on Thursday.", dica: 0, traducao: 'Esta semana, vou ao dentista na quinta.' },
    { frase: "Next month, I'm doing an English course.", dica: 0, traducao: 'No mês que vem, vou fazer um curso de inglês.' },
    { frase: "Next year, I'm traveling to Canada.", dica: 0, traducao: 'Ano que vem, vou viajar para o Canadá.' },
    { frase: "I'm going to Salvador on the tenth of January.", dica: 0, traducao: 'Vou para Salvador no dia dez de janeiro.' },
    { frase: "I'm going with my wife and my children.", dica: 0, traducao: 'Vou com a minha esposa e os meus filhos.' },
    { frase: "We're staying in a hotel near the beach.", dica: 0, traducao: 'Vamos ficar num hotel perto da praia.' },
    { frase: "We're traveling there by plane.", dica: 0, traducao: 'Vamos para lá de avião.' },
    { frase: 'Do you like your job?', dica: 0, traducao: 'Você gosta do seu trabalho?' },
    { frase: 'Are you happy today?', dica: 0, traducao: 'Você está feliz hoje?' },
    { frase: 'Can you cook?', dica: 0, traducao: 'Você sabe cozinhar?' },
    { frase: 'Were you at work yesterday?', dica: 0, traducao: 'Você estava no trabalho ontem?' },
    { frase: 'Did you watch TV last night?', dica: 0, traducao: 'Você assistiu TV ontem à noite?' },
    { frase: 'Could you swim when you were a child?', dica: 0, traducao: 'Você sabia nadar quando era criança?' },

  ]
});
