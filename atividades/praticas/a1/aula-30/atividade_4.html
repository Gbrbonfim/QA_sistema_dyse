/* Class 30 · Fala (revisão)
   Alinhado ao slide "Class 30: Review Classes 14-26" — Talking Point (perguntas e respostas) e as
   tarefas em dupla (can de habilidade e de regra, tempo, barista, roupas, cidade). Pronúncia
   revisada: s da 3ª pessoa, can x can't, -ing, I'll. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1', aula: 30, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'How often do you use your phone?', dica: 0, traducao: 'Com que frequência você usa o celular?' },
    { frase: 'I always check my messages in the morning.', dica: 0, traducao: 'Eu sempre confiro as mensagens de manhã.' },
    { frase: "What's your job? I'm a nurse.", dica: 0, traducao: 'Qual é a sua profissão? Eu sou enfermeira.' },
    { frase: "Does she work at weekends? No, she doesn't.", dica: 0, traducao: 'Ela trabalha nos fins de semana? Não, não trabalha.' },
    { frase: "I think cooking is fun. What about you?", dica: 0, traducao: 'Eu acho que cozinhar é divertido. E você?' },
    { frase: "Look at the teacher. Don't close the door.", dica: 0, traducao: 'Olhe para o professor. Não feche a porta.' },
    { frase: 'I like Bruno Mars. I listen to him every day.', dica: 0, traducao: 'Eu gosto do Bruno Mars. Eu ouço ele todo dia.' },
    { frase: "I'll start with the soup, and then I'll have the chicken.", dica: 0, traducao: 'Vou começar com a sopa e depois vou querer o frango.' },
    { frase: 'Can you do twenty jacks?', dica: 0, traducao: 'Você consegue fazer vinte polichinelos?' },
    { frase: "No, I can't. But I can run.", dica: 0, traducao: 'Não, não consigo. Mas eu consigo correr.' },
    { frase: 'Can you use your phone at work? Only at break.', dica: 0, traducao: 'Você pode usar o celular no trabalho? Só no intervalo.' },
    { frase: "What's the weather like in your city today?", dica: 0, traducao: 'Como está o tempo na sua cidade hoje?' },
    { frase: "It's cloudy and cold.", dica: 0, traducao: 'Está nublado e frio.' },
    { frase: 'Can I have a medium latte with almond milk, please?', dica: 0, traducao: 'Posso pedir um latte médio com leite de amêndoas, por favor?' },
    { frase: "I'm wearing a hoodie, jeans and sneakers.", dica: 0, traducao: 'Eu estou usando um moletom, calça jeans e tênis.' },
    { frase: "When it's sunny, I go to the beach.", dica: 0, traducao: 'Quando está ensolarado, eu vou à praia.' },
    { frase: "When it's raining, I go to the cinema.", dica: 0, traducao: 'Quando está chovendo, eu vou ao cinema.' },
    { frase: 'My sister usually takes the bus, but today she is walking.', dica: 0, traducao: 'Minha irmã geralmente pega ônibus, mas hoje ela está andando.' },
    { frase: 'What do you do in your free time?', dica: 0, traducao: 'O que você faz no seu tempo livre?' },
    { frase: 'Who is the best cook in your family?', dica: 0, traducao: 'Quem cozinha melhor na sua família?' }
  ]
});
</script>
