<script>
/* Class 17 · Escuta
   Alinhado ao slide "Class 16 and 17: How Often Do You Use Your Phone?" (parte Class 17) —
   Grammar Point: Interrogative and Short Answers (Do you...? Yes, I do. / Does he...? No, he
   doesn't.; question word antes do do / does) e Speaking (perguntas sobre o celular). Conteúdo
   NOVO e mais difícil: mistura perguntas com to be (Are you...? Yes, I am.). 24 questões:
   12 respostas curtas + 12 perguntas com question word. */
const op = (...ls) => ls.map(l => ({ label: l, icon: 'chat' }));
const WH = 'Listen to the question and choose the best answer';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 16, num: 6, tipo: 'imagem',
  instrucao: 'Listen to the question and choose the short answer',
  itens: [
    { audioTexto: 'Do you use Instagram?', opcoes: op('Yes, I do.', 'Yes, I am.', 'Yes, I does.', 'Yes, it is.'), certa: 0 },
    { audioTexto: 'Does he take photos?', opcoes: op('Yes, he do.', 'Yes, he does.', 'Yes, he is.', 'Yes, I do.'), certa: 1 },
    { audioTexto: 'Does she have an iPhone?', opcoes: op("No, she don't.", "No, she isn't.", "No, she doesn't.", "No, I don't."), certa: 2 },
    { audioTexto: 'Does it charge fast?', opcoes: op('Yes, it is.', 'Yes, it do.', 'Yes, he does.', 'Yes, it does.'), certa: 3 },
    { audioTexto: 'Do we have an internet connection?', opcoes: op('Yes, we do.', 'Yes, we are.', 'Yes, we does.', 'Yes, they does.'), certa: 0 },
    { audioTexto: 'Do they check emails?', opcoes: op("No, they doesn't.", "No, they don't.", "No, they aren't.", "No, we doesn't."), certa: 1 },
    { audioTexto: 'Are you a morning person?', opcoes: op('Yes, I do.', 'Yes, I does.', 'Yes, I am.', 'Yes, you are.'), certa: 2 },
    { audioTexto: 'Is your phone new?', opcoes: op('Yes, it does.', 'Yes, it do.', 'Yes, he is.', 'Yes, it is.'), certa: 3 },
    { audioTexto: 'Do your parents send voice messages?', opcoes: op('Yes, they do.', 'Yes, they are.', 'Yes, they does.', 'Yes, we do.'), certa: 0 },
    { audioTexto: 'Does your sister post stories?', opcoes: op('No, she not.', "No, she doesn't.", "No, she isn't.", "No, they don't."), certa: 1 },
    { audioTexto: 'Is she on Instagram?', opcoes: op('Yes, she does.', 'Yes, she do.', 'Yes, she is.', 'Yes, he is.'), certa: 2 },
    { audioTexto: 'Does your dad watch TV?', opcoes: op('Yes, he watch.', 'Yes, he is.', 'Yes, she does.', 'Yes, he does.'), certa: 3 },
    { instrucao: WH, audioTexto: 'How often do you use WhatsApp?', opcoes: op('Every day.', 'On my phone.', 'Yes, I do.', 'WhatsApp.'), certa: 0 },
    { instrucao: WH, audioTexto: 'What phone do you have?', opcoes: op('Yes, I have.', 'An iPhone.', 'Every day.', 'At night.'), certa: 1 },
    { instrucao: WH, audioTexto: 'Where does she live?', opcoes: op('She lives.', 'Yes, she does.', 'In London.', 'At eight.'), certa: 2 },
    { instrucao: WH, audioTexto: 'What time do they go to bed?', opcoes: op('In bed.', 'Yes, they do.', 'Every day.', "At eleven o'clock."), certa: 3 },
    { instrucao: WH, audioTexto: 'How often does he go to the gym?', opcoes: op('Three times a week.', 'At the gym.', 'Yes, he does.', 'He goes.'), certa: 0 },
    { instrucao: WH, audioTexto: 'What app do you use to listen to music?', opcoes: op('Music.', 'Spotify.', 'Yes, I do.', 'Every day.'), certa: 1 },
    { instrucao: WH, audioTexto: 'When do you answer messages?', opcoes: op('Messages.', 'Yes, I do.', 'In the evening.', 'WhatsApp.'), certa: 2 },
    { instrucao: WH, audioTexto: 'What kind of car does John have?', opcoes: op('Yes, he does.', 'John.', 'He has.', 'A small Italian car.'), certa: 3 },
    { instrucao: WH, audioTexto: 'Do you like Instagram?', opcoes: op('Yes, I do. I love it!', 'Yes, I am.', 'Yes, I like.', 'Yes, it does.'), certa: 0 },
    { instrucao: WH, audioTexto: 'Do you have a favorite app?', opcoes: op('Yes, I have.', "Yes, I do. It's Spotify.", 'Yes, I am.', 'Yes, it is.'), certa: 1 },
    { instrucao: WH, audioTexto: 'Does your mother read books on her phone?', opcoes: op("No, she isn't.", "No, she don't.", "No, she doesn't.", 'No, she reads.'), certa: 2 },
    { instrucao: WH, audioTexto: 'How often do you check messages?', opcoes: op('Yes, I do.', 'On my phone.', 'Messages.', 'Thirty times a day!'), certa: 3 }
  ]
});
</script>
