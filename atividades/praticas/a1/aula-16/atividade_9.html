/* Class 17 · Fala
   Alinhado ao slide "Class 16 and 17: How Often Do You Use Your Phone?" (parte Class 17) —
   Grammar Point (Do you...? / Does he...? + short answers) e Speaking and Writing (perguntas
   a–o). Conteúdo NOVO: outras perguntas. Na fala rápida "do you" vira quase "d'you"; aqui
   treinamos a forma inteira. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1', aula: 16, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Do you use Instagram?', dica: 0, traducao: 'Você usa o Instagram?' },
    { frase: 'Yes, I do.', dica: 0, traducao: 'Sim, uso.' },
    { frase: 'Does she have an iPhone?', dica: 0, traducao: 'Ela tem um iPhone?' },
    { frase: "No, she doesn't.", dica: 0, traducao: 'Não, ela não tem.' },
    { frase: 'How often do you use your phone?', dica: 0, traducao: 'Com que frequência você usa o celular?' },
    { frase: 'What do you play on your phone?', dica: 0, traducao: 'O que você joga no celular?' },
    { frase: 'Where does she live?', dica: 0, traducao: 'Onde ela mora?' },
    { frase: 'How often do you check messages?', dica: 0, traducao: 'Com que frequência você confere as mensagens?' },
    { frase: 'Does he take photos? Yes, he does.', dica: 0, traducao: 'Ele tira fotos? Sim, tira.' },
    { frase: "Do they check emails? No, they don't.", dica: 0, traducao: 'Eles conferem e-mails? Não, não conferem.' },
    { frase: 'What time do you go to bed?', dica: 0, traducao: 'A que horas você vai dormir?' },
    { frase: 'How often does your mother watch TV?', dica: 0, traducao: 'Com que frequência a sua mãe assiste TV?' },
    { frase: 'Do you send voice messages on WhatsApp?', dica: 0, traducao: 'Você manda mensagens de voz no WhatsApp?' },
    { frase: 'What app do you use to listen to music?', dica: 0, traducao: 'Que aplicativo você usa para ouvir música?' },
    { frase: 'Does it charge fast? Yes, it does.', dica: 0, traducao: 'Ele carrega rápido? Sim, carrega.' },
    { frase: 'Do you have a favorite app?', dica: 0, traducao: 'Você tem um aplicativo favorito?' },
    { frase: "What's your favorite app?", dica: 0, traducao: 'Qual é o seu aplicativo favorito?' },
    { frase: 'Where does your brother work?', dica: 0, traducao: 'Onde o seu irmão trabalha?' },
    { frase: 'Are you on Instagram? Yes, I am.', dica: 0, traducao: 'Você está no Instagram? Sim, estou.' },
    { frase: 'How often do you post stories on Instagram?', dica: 0, traducao: 'Com que frequência você posta stories no Instagram?' }
  ]
});
