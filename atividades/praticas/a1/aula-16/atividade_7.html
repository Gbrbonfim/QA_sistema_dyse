<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · A1 · Aula 17 · Do or does?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Class 17 · Escrita
   Alinhado ao slide "Class 16 and 17: How Often Do You Use Your Phone?" (parte Class 17) —
   Grammar Point (do / does + verbo sem s; question word antes do auxiliar) e Let's practice 2
   (ordenar as perguntas). Conteúdo NOVO: outras perguntas e respostas curtas. O contexto traz a
   frase em português. A isca é o auxiliar errado ou o verbo com s depois de does. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 16, num: 7, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('Ela joga no celular?'), palavras: ['Does', 'she', 'play', 'games', 'on', 'her', 'phone'], isca: ['plays'], fim: '?', traducao: 'Ela joga no celular?' },
    { contexto: M('Você usa o Instagram?'), palavras: ['Do', 'you', 'use', 'Instagram'], isca: ['Does'], fim: '?', traducao: 'Você usa o Instagram?' },
    { contexto: M('Eles têm um celular novo?'), palavras: ['Do', 'they', 'have', 'a', 'new', 'phone'], isca: ['has'], fim: '?', traducao: 'Eles têm um celular novo?' },
    { contexto: M('Com que frequência a sua mãe assiste TV?'), palavras: ['How', 'often', 'does', 'your', 'mother', 'watch', 'TV'], isca: ['watches'], fim: '?', traducao: 'Com que frequência a sua mãe assiste TV?' },
    { contexto: M('Onde ele trabalha?'), palavras: ['Where', 'does', 'he', 'work'], isca: ['works'], fim: '?', traducao: 'Onde ele trabalha?' },
    { contexto: M('A que horas eles vão dormir?'), palavras: ['What', 'time', 'do', 'they', 'go', 'to', 'bed'], isca: ['does'], fim: '?', traducao: 'A que horas eles vão dormir?' },
    { contexto: M('Ele toma banho de manhã?'), palavras: ['Does', 'he', 'have', 'a', 'shower', 'in', 'the', 'morning'], isca: ['has'], fim: '?', traducao: 'Ele toma banho de manhã?' },
    { contexto: M('Quando você responde as mensagens?'), palavras: ['When', 'do', 'you', 'answer', 'messages'], isca: ['are'], fim: '?', traducao: 'Quando você responde as mensagens?' },
    { contexto: M('Que tipo de celular a Ana tem?'), palavras: ['What', 'kind', 'of', 'phone', 'does', 'Ana', 'have'], isca: ['has'], fim: '?', traducao: 'Que tipo de celular a Ana tem?' },
    { contexto: M('Com que frequência você vai à academia?'), palavras: ['How', 'often', 'do', 'you', 'go', 'to', 'the', 'gym'], isca: ['does'], fim: '?', traducao: 'Com que frequência você vai à academia?' },
    { contexto: M('Sim, eu uso.'), palavras: ['Yes,', 'I', 'do'], isca: ['am'], fim: '.', traducao: 'Sim, eu uso.' },
    { contexto: M('Não, ela não joga.'), palavras: ['No,', 'she', "doesn't"], isca: ["don't"], fim: '.', traducao: 'Não, ela não joga.' },
    { contexto: M('Sim, eles têm.'), palavras: ['Yes,', 'they', 'do'], isca: ['does'], fim: '.', traducao: 'Sim, eles têm.' },
    { contexto: M('Não, nós não temos.'), palavras: ['No,', 'we', "don't"], isca: ["doesn't"], fim: '.', traducao: 'Não, nós não temos.' },
    { contexto: M('Que aplicativo você usa para ouvir música?'), palavras: ['What', 'app', 'do', 'you', 'use', 'to', 'listen', 'to', 'music'], isca: ['does'], fim: '?', traducao: 'Que aplicativo você usa para ouvir música?' },
    { contexto: M('O seu irmão manda mensagens de voz?'), palavras: ['Does', 'your', 'brother', 'send', 'voice', 'messages'], isca: ['sends'], fim: '?', traducao: 'O seu irmão manda mensagens de voz?' },
    { contexto: M('Onde a sua irmã mora?'), palavras: ['Where', 'does', 'your', 'sister', 'live'], isca: ['lives'], fim: '?', traducao: 'Onde a sua irmã mora?' },
    { contexto: M('Você é de Portugal?'), palavras: ['Are', 'you', 'from', 'Portugal'], isca: ['Do'], fim: '?', traducao: 'Você é de Portugal?' },
    { contexto: M('O celular carrega rápido?'), palavras: ['Does', 'the', 'phone', 'charge', 'fast'], isca: ['charges'], fim: '?', traducao: 'O celular carrega rápido?' },
    { contexto: M('Com que frequência você posta stories no Instagram?'), palavras: ['How', 'often', 'do', 'you', 'post', 'stories', 'on', 'Instagram'], isca: ['posts'], fim: '?', traducao: 'Com que frequência você posta stories no Instagram?' }
  ]
});
</script>
</body>
</html>
