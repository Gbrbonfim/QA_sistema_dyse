<script>
/* Class 16 · Leitura
   Alinhado ao slide "Class 16 and 17: How Often Do You Use Your Phone?" (parte Class 16) — Warm
   Up ("My phone & routine") e Talking Point ("I always have breakfast in the morning. And
   you?"). Conteúdo NOVO: Lucas e Bia falam do que fazem no celular. As perguntas de compreensão
   pedem o advérbio certo. 20 questões: 12 de "próxima fala" + 8 de compreensão. */
const D = [
  ['Bia', 'Lucas, you are always on your phone!'],
  ['Lucas', 'Ha ha! Yes, I am. I usually play games after school.'],
  ['Bia', 'I never play games. I often watch series.'],
  ['Lucas', 'Cool! I sometimes watch series on Saturday.'],
  ['Bia', 'And Instagram? Are you on Instagram?'],
  ['Lucas', 'Yes, I am. I always post stories in the evening.'],
  ['Bia', 'I sometimes post stories. I usually take photos with my friends.'],
  ['Lucas', 'Nice! And emails? I never check emails.'],
  ['Bia', 'My mom always checks her emails in the morning.'],
  ['Lucas', 'My dad often listens to the news on his phone.'],
  ['Bia', 'My grandmother sometimes sends voice messages. They are very long!'],
  ['Lucas', 'Ha ha! My grandfather never uses his phone.'],
  ['Bia', 'Never? Wow!'],
  ['Lucas', "Yes! He's never on the internet. He's always in the garden."]
];
const lado = q => q === 'Bia' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a1', aula: 16, num: 3, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ['Ha ha! Yes, I am. I usually play games after school.', 'Ha ha! Yes, I am. I play usually games after school.', 'Never? Wow!'], 0, 'Haha! Sim, estou. Eu geralmente jogo depois da escola.'),
    prox(2, ['I play never games. I often watch series.', 'I never play games. I often watch series.', "He's always in the garden."], 1, 'Eu nunca jogo. Eu frequentemente assisto séries.'),
    prox(3, ['Never? Wow!', 'Cool! I watch sometimes series on Saturday.', 'Cool! I sometimes watch series on Saturday.'], 2, 'Legal! Eu às vezes assisto séries no sábado.'),
    prox(4, ['And Instagram? Are you on Instagram?', 'And Instagram? Is you on Instagram?', 'My dad often listens to the news.'], 0, 'E o Instagram? Você está no Instagram?'),
    prox(5, ['Yes, I am. I post always stories in the evening.', 'Yes, I am. I always post stories in the evening.', 'Yes, I is. I always post stories in the evening.'], 1, 'Sim. Eu sempre posto stories à noite.'),
    prox(6, ['Ha ha!', 'Never? Wow!', 'I sometimes post stories. I usually take photos with my friends.'], 2, 'Eu às vezes posto stories. Eu geralmente tiro fotos com meus amigos.'),
    prox(7, ['Nice! And emails? I never check emails.', 'Nice! And emails? I check never emails.', 'Lucas, you are always on your phone!'], 0, 'Legal! E e-mails? Eu nunca confiro e-mails.'),
    prox(8, ['My mom always check her emails in the morning.', 'My mom always checks her emails in the morning.', 'My mom checks always her emails in the morning.'], 1, 'Minha mãe sempre confere os e-mails de manhã.'),
    prox(9, ['Never? Wow!', 'I never play games.', 'My dad often listens to the news on his phone.'], 2, 'Meu pai frequentemente ouve as notícias no celular.'),
    prox(10, ['My grandmother sometimes sends voice messages. They are very long!', 'My grandmother sometimes send voice messages. They are very long!', 'Cool!'], 0, 'Minha avó às vezes manda mensagens de voz. Elas são muito longas!'),
    prox(11, ['My grandfather uses never his phone.', 'Ha ha! My grandfather never uses his phone.', 'And Instagram?'], 1, 'Haha! Meu avô nunca usa o celular.'),
    prox(12, ['Yes, I am.', 'Cool! I sometimes watch series.', 'Never? Wow!'], 2, 'Nunca? Nossa!'),
    { instrucao: 'What does Lucas do after school?', frase: 'He ___ plays games after school.', opcoes: ['usually', 'never', 'sometimes'], certa: 0, traducao: 'Ele geralmente joga depois da escola.' },
    { instrucao: 'Bia and games:', frase: 'She ___ plays games.', opcoes: ['often', 'never', 'always'], certa: 1, traducao: 'Ela nunca joga.' },
    { instrucao: 'Bia and series:', frase: 'She ___ watches series.', opcoes: ['never', 'sometimes', 'often'], certa: 2, traducao: 'Ela frequentemente assiste séries.' },
    { instrucao: 'Lucas and stories:', frase: 'He ___ posts stories in the evening.', opcoes: ['always', 'sometimes', 'never'], certa: 0, traducao: 'Ele sempre posta stories à noite.' },
    { instrucao: "Bia's mom:", frase: 'She always ___ her emails.', opcoes: ['check', 'checks', 'checkes'], certa: 1, traducao: 'Ela sempre confere os e-mails.' },
    { instrucao: "Lucas's dad:", frase: 'He often listens to the ___.', opcoes: ['music', 'series', 'news'], certa: 2, traducao: 'Ele frequentemente ouve as notícias.' },
    { instrucao: "Bia's grandmother:", frase: 'She sometimes sends ___.', opcoes: ['voice messages', 'emails', 'photos'], certa: 0, traducao: 'Ela às vezes manda mensagens de voz.' },
    { instrucao: "Lucas's grandfather:", frase: "He's ___ on the internet.", opcoes: ['always', 'never', 'usually'], certa: 1, traducao: 'Ele nunca está na internet.' }
  ]
});
</script>
