/* Class 16 · Fala
   Alinhado ao slide "Class 16 and 17: How Often Do You Use Your Phone?" (parte Class 16) —
   Grammar Point (advérbios de frequência) e Talking Point ("Say the frequency you do these
   things"). Conteúdo NOVO: outras frases. Foco em "usually" (YU-zhu-li, três sílabas). 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 16, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'always', traducao: 'sempre', nota: 'Soa como "ÓL-ueiz".' },
    { instrucao: PAL, frase: 'usually', traducao: 'geralmente', nota: 'Fale rápido, em três sílabas: YU-zhu-li.' },
    { instrucao: PAL, frase: 'often', traducao: 'frequentemente', nota: 'O "t" quase não se fala: Ó-fen.' },
    { instrucao: PAL, frase: 'sometimes', traducao: 'às vezes' },
    { instrucao: PAL, frase: 'never', traducao: 'nunca' },
    { instrucao: PAL, frase: 'download', traducao: 'baixar' },
    { instrucao: PAL, frase: 'photos', traducao: 'fotos' },
    { instrucao: PAL, frase: 'messages', traducao: 'mensagens', nota: 'Soa como "MÉ-si-djiz".' },
    { instrucao: PAL, frase: 'weather', traducao: 'tempo (clima)' },
    { instrucao: PAL, frase: 'news', traducao: 'notícias', nota: 'Soa como "NIUZ".' },
    { frase: 'I always have breakfast in the morning.', dica: 0, traducao: 'Eu sempre tomo café da manhã de manhã.' },
    { frase: 'I usually play games after school.', dica: 0, traducao: 'Eu geralmente jogo depois da escola.' },
    { frase: 'She never downloads games.', dica: 0, traducao: 'Ela nunca baixa jogos.' },
    { frase: 'We sometimes take photos with our friends.', dica: 0, traducao: 'Nós às vezes tiramos fotos com nossos amigos.' },
    { frase: 'He often listens to music on the bus.', dica: 0, traducao: 'Ele frequentemente ouve música no ônibus.' },
    { frase: 'My sister is always on her phone.', dica: 0, traducao: 'Minha irmã está sempre no celular.' },
    { frase: 'Lucio is always late for class.', dica: 0, traducao: 'O Lucio sempre está atrasado para a aula.' },
    { frase: 'My mom usually checks her emails in the morning.', dica: 0, traducao: 'Minha mãe geralmente confere os e-mails de manhã.' },
    { frase: 'I never watch series in the afternoon.', dica: 0, traducao: 'Eu nunca assisto séries à tarde.' },
    { frase: 'I always have breakfast in the morning. And you?', dica: 0, traducao: 'Eu sempre tomo café da manhã de manhã. E você?' }
  ]
});
</script>
