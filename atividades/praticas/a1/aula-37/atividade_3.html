<script>
/* Class 37 · Leitura
   Alinhado ao slide "Class 37 and 38: Let's Celebrate" (parte Class 37) — Watching and Listening
   (a mãe que organiza uma festa barata, "a budget party", para a filha bebê: decoração, flores,
   bolo, cupcakes, quanto gastou) e Grammar Point (irregulares no passado). Conteúdo NOVO: o Leo
   conta para a Nina como organizou a festa de 5 anos do filho. 20 questões: 12 de "próxima
   fala" + 8 de compreensão. */
const D = [
  ['Nina', 'Hi, Leo! How was your son\'s party?'],
  ['Leo', 'It was great! He\'s five now.'],
  ['Nina', 'Was it an expensive party?'],
  ['Leo', 'No, it was a budget party. We spent only $100.'],
  ['Nina', 'Wow! Did you buy a cake?'],
  ['Leo', 'No, I didn\'t. I made the cake and the cupcakes.'],
  ['Nina', 'Cool! What did you use to decorate the house?'],
  ['Leo', 'Balloons and paper butterflies. I found them at a cheap store.'],
  ['Nina', 'What did the children eat?'],
  ['Leo', 'They ate pizza and sweets, and they drank juice.'],
  ['Nina', 'Did your parents go?'],
  ['Leo', 'My mom went, but my dad couldn\'t go. He was at work.'],
  ['Nina', 'Oh! Did your son get a lot of presents?'],
  ['Leo', 'Yes! My mom gave him a bike. He loved it!']
];
const lado = q => q === 'Nina' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a1', aula: 37, num: 3, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ["It was great! He's five now.", "It is great! He's five now.", "It were great! He five now."], 0, 'Foi ótima! Ele tem cinco anos agora.'),
    prox(2, ['Did it an expensive party?', 'Was it an expensive party?', 'Were it an expensive party?'], 1, 'Foi uma festa cara?'),
    prox(3, ['No, it was a budget party. We spend only $100 last week.', 'No, it was a budget party. We spended only $100.', 'No, it was a budget party. We spent only $100.'], 2, 'Não, foi uma festa econômica. Nós gastamos só 100 dólares.'),
    prox(4, ['Wow! Did you buy a cake?', 'Wow! Did you bought a cake?', 'Wow! You did buy a cake?'], 0, 'Nossa! Você comprou um bolo?'),
    prox(5, ["No, I didn't. I make the cake yesterday.", "No, I didn't. I made the cake and the cupcakes.", "No, I didn't made the cake."], 1, 'Não. Eu fiz o bolo e os cupcakes.'),
    prox(6, ['Cool! What you used to decorate the house?', 'Cool! What did you used to decorate the house?', 'Cool! What did you use to decorate the house?'], 2, 'Legal! O que você usou para decorar a casa?'),
    prox(7, ['Balloons and paper butterflies. I found them at a cheap store.', 'Balloons and paper butterflies. I finded them at a cheap store.', 'Balloons and paper butterflies. I find them yesterday.'], 0, 'Balões e borboletas de papel. Eu encontrei numa loja barata.'),
    prox(8, ['What did the children ate?', 'What did the children eat?', 'What the children ate?'], 1, 'O que as crianças comeram?'),
    prox(9, ['They eated pizza and sweets.', 'They eat pizza and sweets last night.', 'They ate pizza and sweets, and they drank juice.'], 2, 'Eles comeram pizza e doces, e beberam suco.'),
    prox(10, ['Did your parents go?', 'Did your parents went?', 'Do your parents went?'], 0, 'Os seus pais foram?'),
    prox(11, ["My mom went, but my dad didn't could go.", "My mom went, but my dad couldn't go. He was at work.", "My mom goed, but my dad couldn't go."], 1, 'A minha mãe foi, mas o meu pai não pôde ir. Ele estava no trabalho.'),
    prox(12, ['Oh! Did your son got a lot of presents?', 'Oh! Your son did get a lot of presents?', 'Oh! Did your son get a lot of presents?'], 2, 'Ah! O seu filho ganhou muitos presentes?'),
    { instrucao: 'How old is Leo\'s son now?', frase: 'He\'s ___.', opcoes: ['five', 'one', 'ten'], certa: 0, traducao: 'Ele tem cinco anos.' },
    { instrucao: 'How much did Leo spend?', frase: '$___.', opcoes: ['150', '100', '50'], certa: 1, completa: 'one hundred dollars', traducao: '100 dólares.' },
    { instrucao: 'Who made the cake?', frase: '___ made it.', opcoes: ['Nina', 'His mom', 'Leo'], certa: 2, traducao: 'O Leo fez.' },
    { instrucao: 'Where did Leo find the decorations?', frase: 'At a cheap ___.', opcoes: ['store', 'school', 'restaurant'], certa: 0, traducao: 'Numa loja barata.' },
    { instrucao: 'What did the children drink?', frase: 'They drank ___.', opcoes: ['soda', 'juice', 'water'], certa: 1, traducao: 'Eles beberam suco.' },
    { instrucao: 'Why couldn\'t Leo\'s dad go?', frase: 'He was at ___.', opcoes: ['home', 'school', 'work'], certa: 2, traducao: 'Ele estava no trabalho.' },
    { instrucao: 'Who gave the boy a bike?', frase: 'His ___.', opcoes: ['grandma', 'dad', 'sister'], certa: 0, completa: "Leo's mom, his grandma.", traducao: 'A avó dele (a mãe do Leo).' },
    { instrucao: 'Was it an expensive party?', frase: 'No, it ___.', opcoes: ["didn't", "wasn't", "weren't"], certa: 1, traducao: 'Não, não foi.' }
  ]
});
</script>
