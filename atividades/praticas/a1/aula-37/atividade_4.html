<script>
/* Class 37 · Fala
   Alinhado ao slide "Class 37 and 38: Let's Celebrate" (parte Class 37) — Grammar Point: listen
   and repeat das formas irregulares (/faʊnd/, /ˈkʊdnt/, /meɪd/, /spɛnt/, /hæd/, /dɪd/, /ɡeɪv/,
   /eɪt/, /dræŋk/, /kʊd/) e frases com expressões de tempo. Conteúdo NOVO. 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 37, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'found', traducao: 'encontrou', nota: '/faʊnd/: FÁUND.' },
    { instrucao: PAL, frase: 'made', traducao: 'fez (preparou)', nota: '/meɪd/: MÊID.' },
    { instrucao: PAL, frase: 'spent', traducao: 'gastou, passou (tempo)', nota: '/spɛnt/: SPÉNT.' },
    { instrucao: PAL, frase: 'gave', traducao: 'deu', nota: '/ɡeɪv/: GUÊIV.' },
    { instrucao: PAL, frase: 'ate', traducao: 'comeu', nota: '/eɪt/: ÊIT (igual a "eight").', aceita: { eight: 'ate' } },
    { instrucao: PAL, frase: 'drank', traducao: 'bebeu', nota: '/dræŋk/: DRÉNK.' },
    { instrucao: PAL, frase: 'could', traducao: 'podia, conseguia', nota: '/kʊd/: o "l" não se fala: KUD.' },
    { instrucao: PAL, frase: "couldn't", traducao: 'não podia, não conseguia', nota: '/ˈkʊdnt/: KÚDNT, sem o "l".' },
    { frase: 'I found my keys yesterday.', dica: 0, traducao: 'Eu encontrei as minhas chaves ontem.' },
    { frase: 'I ate pizza last night.', dica: 0, traducao: 'Eu comi pizza ontem à noite.' },
    { frase: 'I made coffee this morning.', dica: 0, traducao: 'Eu fiz café hoje de manhã.' },
    { frase: 'We spent the day with our family.', dica: 0, traducao: 'Nós passamos o dia com a nossa família.' },
    { frase: 'She gave her mother a present.', dica: 0, traducao: 'Ela deu um presente para a mãe dela.' },
    { frase: 'They had lunch at a restaurant.', dica: 0, traducao: 'Eles almoçaram num restaurante.' },
    { frase: 'He did his homework last night.', dica: 0, traducao: 'Ele fez a lição de casa ontem à noite.' },
    { frase: 'We went to the park and drank juice.', dica: 0, traducao: 'Nós fomos ao parque e bebemos suco.' },
    { frase: "I didn't go to the party.", dica: 0, traducao: 'Eu não fui à festa.' },
    { frase: "I couldn't find my phone.", dica: 0, traducao: 'Eu não consegui encontrar o meu celular.' },
    { frase: 'Did you get a lot of presents?', dica: 0, traducao: 'Você ganhou muitos presentes?' },
    { frase: 'Could you help me, please?', dica: 0, traducao: 'Você pode me ajudar, por favor?' }
  ]
});
</script>
