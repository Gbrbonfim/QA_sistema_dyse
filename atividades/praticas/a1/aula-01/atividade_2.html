<script>
/* Class 01 · Escrita
   Alinhado ao slide "Class 01 and 02: The World of English" — cumprimentos, "What's your name?",
   "Where are you from?", "I'm from…", "Nice to meet you (too)", "See you later".
   Conteúdo NOVO: outras pessoas (Sofia, Diego, Mia, Sam, Emma, Lucas) e outros países. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1', aula: 1, num: 2, tipo: 'montar',
  instrucao: 'Clique nas palavras e monte a frase (uma palavra sobra)',
  itens: [
    { palavras: ['Hi!', "I'm", 'Sofia'], isca: ['is'], fim: '.', traducao: 'Oi! Eu sou a Sofia.' },
    { palavras: ["What's", 'your', 'name'], isca: ['are'], fim: '?', traducao: 'Qual é o seu nome?' },
    { palavras: ['My', 'name', 'is', 'Diego'], isca: ['am'], fim: '.', traducao: 'Meu nome é Diego.' },
    { palavras: ['Nice', 'to', 'meet', 'you,', 'Mia'], isca: ['see'], fim: '.', traducao: 'Prazer em te conhecer, Mia.' },
    { palavras: ['Where', 'are', 'you', 'from,', 'Sam'], isca: ['is'], fim: '?', traducao: 'De onde você é, Sam?' },
    { palavras: ["I'm", 'from', 'Australia.', 'And', 'you'], isca: ['are'], fim: '?', traducao: 'Eu sou da Austrália. E você?' },
    { palavras: ["I'm", 'from', 'Ireland'], isca: ['my'], fim: '.', traducao: 'Eu sou da Irlanda.' },
    { palavras: ['Oh,', 'Ireland', 'is', 'beautiful'], isca: ['are'], fim: '!', traducao: 'Ah, a Irlanda é linda!' },
    { palavras: ['Thank', 'you!', 'Australia', 'is', 'nice', 'too'], isca: ['am'], fim: '.', traducao: 'Obrigado! A Austrália também é legal.' },
    { palavras: ['See', 'you', 'later,', 'Sofia'], isca: ['meet'], fim: '!', traducao: 'Até mais, Sofia!' },
    { palavras: ['Bye,', 'Diego'], isca: ['Hi'], fim: '!', traducao: 'Tchau, Diego!' },
    { palavras: ['Hi!', 'My', 'name', 'is', 'Emma'], isca: ['are'], fim: '.', traducao: 'Oi! Meu nome é Emma.' },
    { palavras: ['Nice', 'to', 'meet', 'you', 'too,', 'Lucas'], isca: ['later'], fim: '.', traducao: 'Prazer em te conhecer também, Lucas.' },
    { palavras: ["I'm", 'from', 'Colombia.', 'And', 'you'], isca: ['is'], fim: '?', traducao: 'Eu sou da Colômbia. E você?' },
    { palavras: ['Mexico', 'is', 'beautiful'], isca: ['are'], fim: '.', traducao: 'O México é lindo.' },
    { palavras: ['Where', 'are', 'you', 'from'], isca: ['am'], fim: '?', traducao: 'De onde você é?' },
    { palavras: ["I'm", 'from', 'Peru.', 'Nice', 'to', 'meet', 'you'], isca: ['name'], fim: '!', traducao: 'Eu sou do Peru. Prazer em te conhecer!' },
    { palavras: ['Yes,', 'it', 'is.', 'See', 'you', 'later'], isca: ['too'], fim: '!', traducao: 'Sim, é. Até mais!' },
    { palavras: ['Hello!', "I'm", 'Mia'], isca: ['my'], fim: '.', traducao: 'Olá! Eu sou a Mia.' },
    { palavras: ['Thank', 'you!', 'Chile', 'is', 'nice', 'too'], isca: ['are'], fim: '.', traducao: 'Obrigada! O Chile também é legal.' }
  ]
});
</script>
</body>
</html>
