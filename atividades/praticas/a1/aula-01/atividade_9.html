<script>
/* Class 02 · Fala
   Alinhado ao slide "Class 01 and 02: The World of English" — Writing and Speaking ("make a
   presentation to the class" sobre famosos), Role-Play e to be + subject pronouns.
   Conteúdo NOVO: outros famosos (fatos verdadeiros), outras pessoas e países. 20 questões.
   "aceita": nomes que o reconhecimento de voz costuma escrever diferente. */
const CONTR = 'Contração: fale tudo junto, sem pausa entre o pronome e o verbo.';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 1, num: 9, tipo: 'fala',
  instrucao: 'Escute e grave a frase inteira',
  itens: [
    { frase: "She's Shakira. She's from Colombia.", dica: 1, traducao: 'Ela é a Shakira. Ela é da Colômbia.', aceita: { columbia: 'colombia' } },
    { frase: "He's Lionel Messi. He's from Argentina.", dica: 1, traducao: 'Ele é o Lionel Messi. Ele é da Argentina.', aceita: { messy: 'messi', leonel: 'lionel' } },
    { frase: "He's Cristiano Ronaldo.", dica: 1, traducao: 'Ele é o Cristiano Ronaldo.', nota: CONTR },
    { frase: "He's from Portugal.", dica: 2, traducao: 'Ele é de Portugal.' },
    { frase: "She's Taylor Swift.", dica: 1, traducao: 'Ela é a Taylor Swift.', aceita: { tailor: 'taylor' } },
    { frase: "She's from the USA.", dica: 2, traducao: 'Ela é dos Estados Unidos.', aceita: { usa: 'usa', us: 'usa' } },
    { frase: "He's Ed Sheeran. He's from England.", dica: 3, traducao: 'Ele é o Ed Sheeran. Ele é da Inglaterra.', aceita: { add: 'ed', sharon: 'sheeran', shearan: 'sheeran' } },
    { frase: "They're from South Korea.", dica: 2, traducao: 'Eles (o BTS) são da Coreia do Sul.', nota: CONTR },
    { frase: "He's Justin Bieber. He's from Canada.", dica: 1, traducao: 'Ele é o Justin Bieber. Ele é do Canadá.', aceita: { beiber: 'bieber', beaver: 'bieber' } },
    { frase: "She's Anitta. She's from Brazil.", dica: 3, traducao: 'Ela é a Anitta. Ela é do Brasil.', aceita: { anita: 'anitta' } },
    { frase: "Hi! I'm Sofia. I'm from Argentina.", dica: 0, traducao: 'Oi! Eu sou a Sofia. Eu sou da Argentina.', aceita: { sophia: 'sofia' } },
    { frase: "My name is Diego. I'm from Mexico.", dica: 1, traducao: 'Meu nome é Diego. Eu sou do México.' },
    { frase: "We're from Chile.", dica: 1, traducao: 'Nós somos do Chile.', aceita: { chilly: 'chile', chili: 'chile', chilli: 'chile' }, nota: CONTR },
    { frase: "They're from Greece.", dica: 1, traducao: 'Eles são da Grécia.', aceita: { grease: 'greece', grace: 'greece' } },
    { frase: "You're from Peru.", dica: 1, traducao: 'Você é do Peru.' },
    { frase: "Sweden? It's beautiful!", dica: 0, traducao: 'A Suécia? É linda!' },
    { frase: 'Mia and I are from Ireland.', dica: 0, traducao: 'Eu e a Mia somos da Irlanda.' },
    { frase: 'Sofia and Leo are from Argentina.', dica: 1, traducao: 'Sofia e Leo são da Argentina.', aceita: { sophia: 'sofia' } },
    { frase: 'Oh, Australia is beautiful!', dica: 0, traducao: 'Ah, a Austrália é linda!' },
    { frase: 'Nice to meet you too, Sam.', dica: 0, traducao: 'Prazer em te conhecer também, Sam.', aceita: { two: 'too' } }
  ]
});
</script>
</body>
</html>
