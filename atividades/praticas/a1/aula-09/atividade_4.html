<script>
/* Class 09 · Fala
   Alinhado ao slide "Class 9: What's your Favorite?" — Vocabulary (listen and repeat), Grammar
   Point (listen and repeat: His name is... / Her name is...) e Speaking ("present your
   favorites to the class"). Conteúdo NOVO: outras frases, mais longas no fim. 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 9, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'favorite', traducao: 'favorito', nota: 'São três sílabas e a força fica no começo: FAY-vo-rit.' },
    { instrucao: PAL, frase: 'color', traducao: 'cor' },
    { instrucao: PAL, frase: 'animal', traducao: 'animal', nota: 'A força fica no começo: A-ni-mal.' },
    { instrucao: PAL, frase: 'number', traducao: 'número' },
    { instrucao: PAL, frase: 'artist', traducao: 'artista' },
    { instrucao: PAL, frase: 'hobby', traducao: 'hobby, passatempo' },
    { instrucao: PAL, frase: 'object', traducao: 'objeto', nota: 'A força fica no começo: OB-ject.' },
    { instrucao: PAL, frase: 'purple', traducao: 'roxo' },
    { instrucao: PAL, frase: 'rabbit', traducao: 'coelho' },
    { instrucao: PAL, frase: 'song', traducao: 'música, canção' },
    { frase: "What's your favorite color?", dica: 0, traducao: 'Qual é a sua cor favorita?' },
    { frase: 'My favorite color is purple.', dica: 0, traducao: 'Minha cor favorita é roxo.' },
    { frase: 'His favorite food is pasta.', dica: 0, traducao: 'A comida favorita dele é macarrão.', nota: 'His tem o "i" curto: HIZ.' },
    { frase: 'Her favorite drink is tea.', dica: 0, traducao: 'A bebida favorita dela é chá.', nota: 'Her soa como "RR" com a boca meio aberta: HER.' },
    { frase: 'Their names are Anna and Tom.', dica: 0, traducao: 'Os nomes deles são Anna e Tom.', aceita: { there: 'their' } },
    { frase: 'Our teacher is from England.', dica: 0, traducao: 'Nosso professor é da Inglaterra.', aceita: { hour: 'our' } },
    { frase: 'Is your favorite number seven?', dica: 0, traducao: 'O seu número favorito é sete?' },
    { frase: "What's her favorite song?", dica: 0, traducao: 'Qual é a música favorita dela?' },
    { frase: 'My partner is Carol. Her favorite animal is the cat.', dica: 0, traducao: 'Minha dupla é a Carol. O animal favorito dela é o gato.' },
    { frase: 'His name is Lucas and his favorite hobby is video games.', dica: 0, traducao: 'O nome dele é Lucas e o hobby favorito dele é videogame.' }
  ]
});
</script>
