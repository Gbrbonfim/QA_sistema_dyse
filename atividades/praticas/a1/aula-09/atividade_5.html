<script>
/* Class 09 · Gramática
   Alinhado ao slide "Class 9: What's your Favorite?" — Grammar Point (I → my, he → his, she →
   her, it → its, we → our, they → their) e exercícios 3 e 7 (subject pronoun ou possessive?).
   Conteúdo NOVO e mais difícil: distratores com a contração (He's, It's, They're) e com There.
   24 questões: 10 no contexto + 6 pronome ou posse + 5 pares + 3 frase correta. */
const PAR = 'Qual é a palavra de posse?';
const CERTA = 'Qual frase está correta?';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 9, num: 5, tipo: 'escolha',
  instrucao: 'Complete a frase',
  itens: [
    { frase: 'I am Julia. ___ favorite color is pink.', opcoes: ['I', 'My', "I'm"], certa: 1, traducao: 'Eu sou a Julia. Minha cor favorita é rosa.' },
    { frase: 'He is Mark. ___ jacket is green.', opcoes: ['His', 'He', "He's"], certa: 0, traducao: 'Ele é o Mark. A jaqueta dele é verde.' },
    { frase: 'She is famous. ___ name is Millie.', opcoes: ['She', "She's", 'Her'], certa: 2, traducao: 'Ela é famosa. O nome dela é Millie.' },
    { frase: 'It is a rabbit. ___ eyes are red.', opcoes: ["It's", 'Its', 'It'], certa: 1, traducao: 'É um coelho. Os olhos dele são vermelhos.' },
    { frase: 'We are Brazilian. ___ surname is Mendes.', opcoes: ['Our', 'We', "We're"], certa: 0, traducao: 'Nós somos brasileiros. Nosso sobrenome é Mendes.' },
    { frase: 'They are from England. ___ names are Julie and Amanda.', opcoes: ['They', "They're", 'Their'], certa: 2, traducao: 'Elas são da Inglaterra. Os nomes delas são Julie e Amanda.' },
    { frase: 'You are my classmate. ___ desk is here.', opcoes: ["You're", 'Your', 'You'], certa: 1, traducao: 'Você é meu colega de turma. A sua mesa é aqui.' },
    { frase: 'Is ___ name Augusto?', opcoes: ['your', 'you', "you're"], certa: 0, traducao: 'O seu nome é Augusto?' },
    { frase: 'Anna and Tom are my friends. ___ favorite food is pizza.', opcoes: ['There', 'They', 'Their'], certa: 2, traducao: 'Anna e Tom são meus amigos. A comida favorita deles é pizza.' },
    { frase: 'Lionel Messi is from Argentina. ___ surname is Messi.', opcoes: ['He', 'His', "He's"], certa: 1, traducao: 'O Lionel Messi é da Argentina. O sobrenome dele é Messi.' },
    { frase: '___ is my teacher. Her name is Anna.', opcoes: ['She', 'Her'], certa: 0, traducao: 'Ela é a minha professora. O nome dela é Anna.' },
    { frase: '___ are from Canada.', opcoes: ['Their', 'They'], certa: 1, traducao: 'Eles são do Canadá.' },
    { frase: 'I have a dog. ___ name is Toby.', opcoes: ['Its', "It's"], certa: 0, traducao: 'Eu tenho um cachorro. O nome dele é Toby.' },
    { frase: '___ a good restaurant.', opcoes: ['Its', "It's"], certa: 1, traducao: 'É um bom restaurante.' },
    { frase: 'Hello! ___ name is Sandra.', opcoes: ['My', 'I'], certa: 0, traducao: 'Olá! Meu nome é Sandra.' },
    { frase: "___ from Brazil.", opcoes: ['My', "I'm"], certa: 1, traducao: 'Eu sou do Brasil.' },
    { instrucao: PAR, frase: 'he → ___', opcoes: ['her', 'his', 'its'], certa: 1, traducao: 'ele → dele' },
    { instrucao: PAR, frase: 'she → ___', opcoes: ['her', 'his', 'their'], certa: 0, traducao: 'ela → dela' },
    { instrucao: PAR, frase: 'they → ___', opcoes: ['there', 'our', 'their'], certa: 2, traducao: 'eles → deles' },
    { instrucao: PAR, frase: 'we → ___', opcoes: ['your', 'our', 'their'], certa: 1, traducao: 'nós → nosso' },
    { instrucao: PAR, frase: 'it → ___', opcoes: ['its', "it's", 'his'], certa: 0, traducao: 'ele / ela (coisa ou animal) → dele / dela' },
    { instrucao: CERTA, opcoes: ['She favorite color is blue.', 'Her favorite color is blue.', "She's favorite color is blue."], certa: 1, traducao: 'A cor favorita dela é azul.' },
    { instrucao: CERTA, opcoes: ['Their bags are here.', 'They bags are here.', 'There bags are here.'], certa: 0, traducao: 'As bolsas deles estão aqui.' },
    { instrucao: CERTA, opcoes: ['He name is Lionel Messi. He is from Argentina.', 'His name is Lionel Messi. His is from Argentina.', 'His name is Lionel Messi. He is from Argentina.'], certa: 2, traducao: 'O nome dele é Lionel Messi. Ele é da Argentina.' }
  ]
});
</script>
</body>
</html>
