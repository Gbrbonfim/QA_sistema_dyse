/* Class 19 · Fala
   Alinhado ao slide "Class 19 and 20: Starting a New Hobby" (parte Class 19) — Vocabulary (listen
   and repeat) e Talking Point (opinião com ênfase no adjetivo: "I think doing crochet is FUN").
   Conteúdo NOVO: outras frases. 20 questões. */
const PAL = 'Listen and record the words';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 19, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'painting', traducao: 'pintura' },
    { instrucao: PAL, frase: 'gardening', traducao: 'jardinagem' },
    { instrucao: PAL, frase: 'climbing', traducao: 'escalada', nota: 'O "b" não se fala: CLAI-ming.' },
    { instrucao: PAL, frase: 'drawing', traducao: 'desenho' },
    { instrucao: PAL, frase: 'cooking', traducao: 'culinária, cozinhar' },
    { instrucao: PAL, frase: 'making cakes', traducao: 'fazer bolos' },
    { instrucao: PAL, frase: 'relaxing', traducao: 'relaxante' },
    { instrucao: PAL, frase: 'boring', traducao: 'chato' },
    { instrucao: PAL, frase: 'difficult', traducao: 'difícil', nota: 'A força fica no começo: DI-fi-cult.' },
    { instrucao: PAL, frase: 'easy', traducao: 'fácil' },
    { frase: 'I think doing crochet is fun.', dica: 0, traducao: 'Eu acho que fazer crochê é divertido.', nota: 'Dê ênfase ao adjetivo: is FUN.' },
    { frase: "I think drawing is relaxing. And you?", dica: 0, traducao: 'Eu acho que desenhar é relaxante. E você?' },
    { frase: 'I like reading and painting.', dica: 0, traducao: 'Eu gosto de ler e de pintar.' },
    { frase: 'She likes cooking.', dica: 0, traducao: 'Ela gosta de cozinhar.' },
    { frase: 'I want to try a new hobby.', dica: 0, traducao: 'Eu quero experimentar um hobby novo.' },
    { frase: "Doing crochet isn't easy.", dica: 0, traducao: 'Fazer crochê não é fácil.' },
    { frase: 'Climbing is difficult, but it is fun.', dica: 0, traducao: 'Escalar é difícil, mas é divertido.' },
    { frase: 'My brother likes playing video games.', dica: 0, traducao: 'Meu irmão gosta de jogar videogame.' },
    { frase: 'I want to make videos.', dica: 0, traducao: 'Eu quero fazer vídeos.' },
    { frase: "I think gardening is boring. What about you?", dica: 0, traducao: 'Eu acho que jardinagem é chato. E você?' }
  ]
});
</script>
