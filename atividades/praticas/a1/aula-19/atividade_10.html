<script>
/* Class 20 · Gramática
   Alinhado ao slide "Class 19 and 20: Starting a New Hobby" (parte Class 20) — exercício 5
   (complete as perguntas com is / are / do / does) e Study the rules (to be x outros verbos).
   Conteúdo NOVO e mais difícil: o aluno decide sozinho entre to be e do / does em 18 perguntas
   e reconhece a pergunta certa em 6. 24 questões. */
const CERTA = 'Which question is correct?';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 19, num: 10, tipo: 'escolha',
  instrucao: 'Complete the question',
  itens: [
    { frase: 'Where ___ you from?', opcoes: ['are', 'do', 'is'], certa: 0, traducao: 'De onde você é?' },
    { frase: 'How old ___ you?', opcoes: ['do', 'are', 'does'], certa: 1, traducao: 'Quantos anos você tem?' },
    { frase: '___ you have a big family?', opcoes: ['Are', 'Does', 'Do'], certa: 2, traducao: 'Você tem uma família grande?' },
    { frase: "What ___ your mother's name?", opcoes: ['is', 'does', 'are'], certa: 0, traducao: 'Qual é o nome da sua mãe?' },
    { frase: '___ you have any brothers and sisters?', opcoes: ['Are', 'Do', 'Is'], certa: 1, traducao: 'Você tem irmãos?' },
    { frase: 'What ___ their names?', opcoes: ['is', 'do', 'are'], certa: 2, traducao: 'Quais são os nomes deles?' },
    { frase: 'What ___ you do?', opcoes: ['do', 'are', 'does'], certa: 0, traducao: 'O que você faz?' },
    { frase: '___ you like your job?', opcoes: ['Are', 'Do', 'Does'], certa: 1, traducao: 'Você gosta do seu trabalho?' },
    { frase: 'What ___ your best friend do?', opcoes: ['is', 'do', 'does'], certa: 2, traducao: 'O que o seu melhor amigo faz?' },
    { frase: 'Where ___ your parents now?', opcoes: ['are', 'do', 'does'], certa: 0, traducao: 'Onde os seus pais estão agora?' },
    { frase: '___ your teacher speak English?', opcoes: ['Is', 'Does', 'Do'], certa: 1, traducao: 'O seu professor fala inglês?' },
    { frase: 'What time ___ you finish school?', opcoes: ['are', 'does', 'do'], certa: 2, traducao: 'A que horas você termina a escola?' },
    { frase: '___ you hungry at the end of the day?', opcoes: ['Are', 'Do', 'Does'], certa: 0, traducao: 'Você está com fome no fim do dia?' },
    { frase: '___ gardening fun?', opcoes: ['Does', 'Is', 'Do'], certa: 1, traducao: 'Jardinagem é divertido?' },
    { frase: '___ he like cooking?', opcoes: ['Is', 'Do', 'Does'], certa: 2, traducao: 'Ele gosta de cozinhar?' },
    { frase: 'When ___ she study English?', opcoes: ['does', 'is', 'do'], certa: 0, traducao: 'Quando ela estuda inglês?' },
    { frase: 'What ___ her favorite hobby?', opcoes: ['does', 'is', 'are'], certa: 1, traducao: 'Qual é o hobby favorito dela?' },
    { frase: '___ they students?', opcoes: ['Do', 'Is', 'Are'], certa: 2, traducao: 'Eles são estudantes?' },
    { instrucao: CERTA, opcoes: ['Is he like cooking?', 'Does he like cooking?', 'Does he likes cooking?'], certa: 1, traducao: 'Ele gosta de cozinhar?' },
    { instrucao: CERTA, opcoes: ['Where do you go on Saturdays?', 'Where you go on Saturdays?', 'Where are you go on Saturdays?'], certa: 0, traducao: 'Aonde você vai aos sábados?' },
    { instrucao: CERTA, opcoes: ['What does your favorite hobby?', 'What your favorite hobby is?', 'What is your favorite hobby?'], certa: 2, traducao: 'Qual é o seu hobby favorito?' },
    { instrucao: CERTA, opcoes: ['Do they students?', 'Are they students?', 'Is they students?'], certa: 1, traducao: 'Eles são estudantes?' },
    { instrucao: CERTA, opcoes: ['Does the course good?', 'Is good the course?', 'Is the course good?'], certa: 2, traducao: 'O curso é bom?' },
    { instrucao: CERTA, opcoes: ['What does he do?', 'What he does?', 'What is he do?'], certa: 0, traducao: 'O que ele faz?' }
  ]
});
</script>
