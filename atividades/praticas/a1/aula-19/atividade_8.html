<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Class 20 · Leitura
   Alinhado ao slide "Class 19 and 20: Starting a New Hobby" (parte Class 20) — exercício 5
   ("Complete the questions. Then interview your partner") e 7 ("Tell the class about your
   partner"). Conteúdo NOVO: a Clara entrevista o Diego. As perguntas de compreensão pedem
   does / is na 3ª pessoa. 20 questões: 12 de "próxima fala" + 8 de compreensão. */
const D = [
  ['Clara', 'Hi, Diego! Where are you from?'],
  ['Diego', "I'm from Mexico. I'm Mexican."],
  ['Clara', 'How old are you?'],
  ['Diego', "I'm twenty-six."],
  ['Clara', 'Do you have a big family?'],
  ['Diego', 'Yes, I do. I have three sisters and a brother.'],
  ['Clara', 'Wow! What are their names?'],
  ['Diego', 'Rosa, Lupe, Ana and Carlos.'],
  ['Clara', 'What do you do?'],
  ['Diego', "I'm a cook. I work in a restaurant."],
  ['Clara', 'Do you like your job?'],
  ['Diego', 'Yes, I do! Cooking is my favorite hobby too.'],
  ['Clara', 'Is your job difficult?'],
  ['Diego', "Yes, it is. But it's fun!"]
];
const lado = q => q === 'Clara' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a1', aula: 19, num: 8, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ["I'm from Mexico. I'm Mexican.", "I'm from Mexican. I'm Mexico.", 'I do from Mexico.'], 0, 'Eu sou do México. Eu sou mexicano.'),
    prox(2, ['How old do you?', 'How old are you?', 'How old you are?'], 1, 'Quantos anos você tem?'),
    prox(3, ['I have twenty-six.', 'I have twenty-six years.', "I'm twenty-six."], 2, 'Eu tenho vinte e seis anos.'),
    prox(4, ['Do you have a big family?', 'Are you have a big family?', 'Does you have a big family?'], 0, 'Você tem uma família grande?'),
    prox(5, ['Yes, I am. I have three sisters.', 'Yes, I do. I have three sisters and a brother.', 'Yes, I do. I have three sister and a brother.'], 1, 'Sim, tenho. Eu tenho três irmãs e um irmão.'),
    prox(6, ['Wow! What is their names?', 'Wow! What do their names?', 'Wow! What are their names?'], 2, 'Nossa! Quais são os nomes deles?'),
    prox(7, ['Rosa, Lupe, Ana and Carlos.', 'Yes, they are.', "I'm a cook."], 0, 'Rosa, Lupe, Ana e Carlos.'),
    prox(8, ['What are you do?', 'What do you do?', 'What does you do?'], 1, 'O que você faz?'),
    prox(9, ["I'm cook. I works in a restaurant.", 'Yes, I do!', "I'm a cook. I work in a restaurant."], 2, 'Eu sou cozinheiro. Eu trabalho num restaurante.'),
    prox(10, ['Do you like your job?', 'Are you like your job?', 'Do you like you job?'], 0, 'Você gosta do seu trabalho?'),
    prox(11, ['Yes, I am! Cooking is my favorite hobby too.', 'Yes, I do! Cooking is my favorite hobby too.', 'Yes, I do! Cook is my favorite hobby too.'], 1, 'Sim, gosto! Cozinhar também é o meu hobby favorito.'),
    prox(12, ['Does your job difficult?', 'Is difficult your job?', 'Is your job difficult?'], 2, 'O seu trabalho é difícil?'),
    { instrucao: 'Where is Diego from?', frase: "He's from ___.", opcoes: ['Mexico', 'Chile', 'Spain'], certa: 0, traducao: 'Ele é do México.' },
    { instrucao: 'How old is Diego?', frase: "He's ___.", opcoes: ['twenty', 'twenty-six', 'sixty-two'], certa: 1, traducao: 'Ele tem vinte e seis anos.' },
    { instrucao: 'Does Diego have a big family?', frase: 'Yes, he ___.', opcoes: ['is', 'do', 'does'], certa: 2, traducao: 'Sim, ele tem.' },
    { instrucao: 'How many sisters does Diego have?', frase: 'He has ___ sisters.', opcoes: ['three', 'two', 'four'], certa: 0, traducao: 'Ele tem três irmãs.' },
    { instrucao: 'What does Diego do?', frase: "He's a ___.", opcoes: ['teacher', 'cook', 'student'], certa: 1, traducao: 'Ele é cozinheiro.' },
    { instrucao: 'Where does Diego work?', frase: 'In a ___.', opcoes: ['school', 'hospital', 'restaurant'], certa: 2, traducao: 'Num restaurante.' },
    { instrucao: 'Does Diego like his job?', frase: 'Yes, he ___.', opcoes: ['does', 'is', 'likes'], certa: 0, traducao: 'Sim, ele gosta.' },
    { instrucao: "Is Diego's job difficult?", frase: 'Yes, it ___.', opcoes: ['does', 'is', 'are'], certa: 1, traducao: 'Sim, é.' }
  ]
});
</script>
