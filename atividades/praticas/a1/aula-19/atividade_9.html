    { frase: 'Do you have any brothers and sisters?', dica: 0, traducao: 'Você tem irmãos?' },
    { frase: 'What are their names?', dica: 0, traducao: 'Quais são os nomes deles?' },
    { frase: 'What do you do?', dica: 0, traducao: 'O que você faz? (profissão)' },
    { frase: 'Do you like your job?', dica: 0, traducao: 'Você gosta do seu trabalho?' },
    { frase: 'Do you have a hobby? What is it?', dica: 0, traducao: 'Você tem um hobby? Qual é?' },

    { frase: 'What does your best friend do?', dica: 0, traducao: 'O que o seu melhor amigo faz?' },
    { frase: 'Where are your parents now?', dica: 0, traducao: 'Onde os seus pais estão agora?' },
    { frase: 'Does your teacher speak English?', dica: 0, traducao: 'O seu professor fala inglês?' },
    { frase: 'What time do you finish work?', dica: 0, traducao: 'A que horas você termina o trabalho?' },

    { frase: 'Does he like cooking?', dica: 0, traducao: 'Ele gosta de cozinhar?' },
    { frase: 'Where do you go on Saturdays?', dica: 0, traducao: 'Aonde você vai aos sábados?' },
    { frase: 'When does he study English?', dica: 0, traducao: 'Quando ele estuda inglês?' },
