<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>DYSE · A1 · Aula 20 · Make the question</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Class 20 · Escrita
   Alinhado ao slide "Class 19 and 20: Starting a New Hobby" (parte Class 20) — exercício 4
   (ordenar as perguntas) e Study the rules (to be x do / does). Conteúdo NOVO: outras perguntas.
   O contexto traz a pergunta em português. A isca é o auxiliar errado (is no lugar de does, do no
   lugar de are) ou o verbo com s. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 19, num: 7, tipo: 'montar',
  instrucao: 'Click the words and make the question (one word is extra)',
  itens: [
    { contexto: M('Qual é o seu hobby favorito?'), palavras: ['What', 'is', 'your', 'favorite', 'hobby'], isca: ['are'], fim: '?', traducao: 'Qual é o seu hobby favorito?' },
    { contexto: M('O que você cozinha aos sábados?'), palavras: ['What', 'do', 'you', 'cook', 'on', 'Saturdays'], isca: ['does'], fim: '?', traducao: 'O que você cozinha aos sábados?' },
    { contexto: M('O curso é bom?'), palavras: ['Is', 'the', 'course', 'good'], isca: ['Does'], fim: '?', traducao: 'O curso é bom?' },
    { contexto: M('A sua irmã tem um hobby?'), palavras: ['Does', 'your', 'sister', 'have', 'a', 'hobby'], isca: ['has'], fim: '?', traducao: 'A sua irmã tem um hobby?' },
    { contexto: M('Crochê e jardinagem são hobbies difíceis?'), palavras: ['Are', 'crochet', 'and', 'gardening', 'difficult', 'hobbies'], isca: ['Is'], fim: '?', traducao: 'Crochê e jardinagem são hobbies difíceis?' },
    { contexto: M('Onde estão os seus amigos?'), palavras: ['Where', 'are', 'your', 'friends'], isca: ['is'], fim: '?', traducao: 'Onde estão os seus amigos?' },
    { contexto: M('Você tem uma família grande?'), palavras: ['Do', 'you', 'have', 'a', 'big', 'family'], isca: ['Are'], fim: '?', traducao: 'Você tem uma família grande?' },
    { contexto: M('Qual é o nome da sua mãe?'), palavras: ['What', 'is', 'your', "mother's", 'name'], isca: ['are'], fim: '?', traducao: 'Qual é o nome da sua mãe?' },
    { contexto: M('O que você faz? (profissão)'), palavras: ['What', 'do', 'you', 'do'], isca: ['are'], fim: '?', traducao: 'O que você faz?' },
    { contexto: M('Você gosta do seu trabalho?'), palavras: ['Do', 'you', 'like', 'your', 'job'], isca: ['Are'], fim: '?', traducao: 'Você gosta do seu trabalho?' },
    { contexto: M('Qual é a sua comida favorita?'), palavras: ['What', 'is', 'your', 'favorite', 'food'], isca: ['does'], fim: '?', traducao: 'Qual é a sua comida favorita?' },
    { contexto: M('O que ele faz? (profissão)'), palavras: ['What', 'does', 'he', 'do'], isca: ['is'], fim: '?', traducao: 'O que ele faz?' },
    { contexto: M('O seu professor fala inglês?'), palavras: ['Does', 'your', 'teacher', 'speak', 'English'], isca: ['speaks'], fim: '?', traducao: 'O seu professor fala inglês?' },
    { contexto: M('A que horas você termina a escola?'), palavras: ['What', 'time', 'do', 'you', 'finish', 'school'], isca: ['does'], fim: '?', traducao: 'A que horas você termina a escola?' },
    { contexto: M('Você está com fome no fim do dia?'), palavras: ['Are', 'you', 'hungry', 'at', 'the', 'end', 'of', 'the', 'day'], isca: ['Do'], fim: '?', traducao: 'Você está com fome no fim do dia?' },
    { contexto: M('Pintar é relaxante?'), palavras: ['Is', 'painting', 'relaxing'], isca: ['Does'], fim: '?', traducao: 'Pintar é relaxante?' },
    { contexto: M('Eles gostam de escalar?'), palavras: ['Do', 'they', 'like', 'climbing'], isca: ['Are'], fim: '?', traducao: 'Eles gostam de escalar?' },
    { contexto: M('Quando ela estuda inglês?'), palavras: ['When', 'does', 'she', 'study', 'English'], isca: ['studies'], fim: '?', traducao: 'Quando ela estuda inglês?' },
    { contexto: M('Quais são os nomes deles?'), palavras: ['What', 'are', 'their', 'names'], isca: ['is'], fim: '?', traducao: 'Quais são os nomes deles?' },
    { contexto: M('Onde os seus pais estão agora?'), palavras: ['Where', 'are', 'your', 'parents', 'now'], isca: ['do'], fim: '?', traducao: 'Onde os seus pais estão agora?' }
  ]
});
</script>
</body>
</html>
