/* Class 36 · Escuta
   Alinhado ao slide "Class 35 and 36: My Last Vacation" (parte Class 36) — Pronunciation of -ed
   endings: /t/ depois de p, k, s, f, sh, ch (worked, washed); /d/ depois de vogal e da maioria das
   consoantes (played, called); /ɪd/ só depois de t ou d (wanted, decided). Conteúdo NOVO: outros
   verbos. 24 questões, todas de ouvido. */
const SONS = ['/t/  (like worked)', '/d/  (like played)', '/ɪd/  (like wanted)'];
const op = () => SONS.map(l => ({ label: l, icon: 'record_voice_over' }));
const T = 0, D = 1, ID = 2;
const v = (palavra, som) => ({ audioTexto: palavra, opcoes: op(), certa: som });
DysePratica.iniciar({
  course: 'ativ-a1', aula: 35, num: 6, tipo: 'imagem',
  instrucao: 'Listen to the verb. How does the -ed sound?',
  itens: [
    v('worked', T), v('played', D), v('wanted', ID), v('booked', T),
    v('arrived', D), v('decided', ID), v('packed', T), v('traveled', D),
    v('waited', ID), v('talked', T), v('loved', D), v('boarded', ID),
    v('watched', T), v('returned', D), v('landed', ID), v('stopped', T),
    v('stayed', D), v('visited', ID), v('washed', T), v('called', D),
    v('needed', ID), v('liked', T), v('cried', D), v('started', ID)
  ]
});
</script>
