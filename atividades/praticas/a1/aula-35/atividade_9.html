/* Class 36 · Fala
   Alinhado ao slide "Class 35 and 36: My Last Vacation" (parte Class 36) — Pronunciation of -ed

const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 35, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'worked', traducao: 'trabalhou', nota: '-ed com som de /t/: WÂRKT (uma sílaba).' },
    { instrucao: PAL, frase: 'packed', traducao: 'arrumou (as malas)', nota: '/t/: PÉKT.' },
    { instrucao: PAL, frase: 'played', traducao: 'jogou', nota: '/d/: PLEID (uma sílaba).' },
    { instrucao: PAL, frase: 'traveled', traducao: 'viajou', nota: '/d/: TRÉ-veld.' },
    { instrucao: PAL, frase: 'wanted', traducao: 'quis, queria', nota: '/ɪd/: UÓN-tid (duas sílabas).' },
    { instrucao: PAL, frase: 'decided', traducao: 'decidiu', nota: '/ɪd/: di-SAI-did.' },
    { instrucao: PAL, frase: 'visited', traducao: 'visitou', nota: '/ɪd/: VI-zi-tid.' },
    { instrucao: PAL, frase: 'stayed', traducao: 'ficou', nota: '/d/: STEID.' },
    { frase: 'She packed her bags last night.', dica: 0, traducao: 'Ela arrumou as malas ontem à noite.' },
    { frase: 'We booked our flights online.', dica: 0, traducao: 'Nós reservamos os nossos voos online.' },
    { frase: 'They stayed in a hotel near the beach.', dica: 0, traducao: 'Eles ficaram num hotel perto da praia.' },
    { frase: 'I walked around the city and visited a lot of places.', dica: 0, traducao: 'Eu andei pela cidade e visitei muitos lugares.' },
    { frase: 'We enjoyed the trip.', dica: 0, traducao: 'Nós aproveitamos a viagem.' },
    { frase: 'I wanted to eat pizza.', dica: 0, traducao: 'Eu queria comer pizza.' },
    { frase: 'Where did you travel on your last vacation?', dica: 0, traducao: 'Para onde você viajou nas suas últimas férias?' },
    { frase: 'When did you pack your bags?', dica: 0, traducao: 'Quando você arrumou as malas?' },
    { frase: 'What places did you visit?', dica: 0, traducao: 'Que lugares você visitou?' },
    { frase: "What didn't you like there?", dica: 0, traducao: 'Do que você não gostou lá?' },
    { frase: 'We decided to travel and we loved it!', dica: 0, traducao: 'Nós decidimos viajar e amamos!' },
    { frase: 'We returned home and looked at the photos.', dica: 0, traducao: 'Nós voltamos para casa e olhamos as fotos.' }
  ]
});
