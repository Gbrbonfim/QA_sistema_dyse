/* Class 35 · Fala
   Alinhado ao slide "Class 35 and 36: My Last Vacation" (parte Class 35) — a história de férias
   ("Look at the pictures. Tell the story.") e Grammar Point (afirmativa, negativa e pergunta).
   Só verbos regulares. Conteúdo NOVO: outras frases. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1', aula: 35, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'We decided to travel to Paris in July.', dica: 0, traducao: 'Nós decidimos viajar para Paris em julho.' },
    { frase: 'My husband booked the tickets online.', dica: 0, traducao: 'Meu marido reservou as passagens online.' },
    { frase: 'We packed our bags the weekend before.', dica: 0, traducao: 'Nós arrumamos as malas no fim de semana anterior.' },
    { frase: 'We arrived at the airport early.', dica: 0, traducao: 'Nós chegamos cedo ao aeroporto.' },
    { frase: 'We waited at the gate and boarded the plane.', dica: 0, traducao: 'Nós esperamos no portão e embarcamos no avião.' },
    { frase: 'Our plane landed in the morning.', dica: 0, traducao: 'O nosso avião pousou de manhã.' },
    { frase: 'We loved everything.', dica: 0, traducao: 'Nós amamos tudo.' },
    { frase: 'We returned home after ten days.', dica: 0, traducao: 'Nós voltamos para casa depois de dez dias.' },
    { frase: 'She worked in a school.', dica: 0, traducao: 'Ela trabalhou numa escola.' },
    { frase: 'The children watched TV.', dica: 0, traducao: 'As crianças assistiram TV.' },
    { frase: 'The bus stopped in the center.', dica: 0, traducao: 'O ônibus parou no centro.' },
    { frase: 'I studied computer science.', dica: 0, traducao: 'Eu estudei ciência da computação.' },
    { frase: "I didn't travel by plane.", dica: 0, traducao: 'Eu não viajei de avião.' },
    { frase: 'Did you play football last week?', dica: 0, traducao: 'Você jogou futebol semana passada?' },
    { frase: 'Yes, I played it last Monday.', dica: 0, traducao: 'Sim, eu joguei segunda passada.' },
    { frase: "Did the children finish their homework? No, they didn't.", dica: 0, traducao: 'As crianças terminaram a lição? Não.' },
    { frase: 'What time did you arrive home last night?', dica: 0, traducao: 'A que horas você chegou em casa ontem à noite?' },
    { frase: 'Where did you travel on your last vacation?', dica: 0, traducao: 'Para onde você viajou nas suas últimas férias?' },
    { frase: 'Did you book a hotel in Paris?', dica: 0, traducao: 'Você reservou um hotel em Paris?' },
    { frase: "No, it was very expensive. I booked a small flat.", dica: 0, traducao: 'Não, era muito caro. Eu reservei um apartamento pequeno.' }
  ]
});
</script>
