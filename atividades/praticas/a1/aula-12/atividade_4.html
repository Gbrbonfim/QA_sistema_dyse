<script>
/* Class 12 · Fala
   Alinhado ao slide "Class 12: Breakfast, lunch and dinner" — Vocabulary (listen and repeat),
   Grammar Point (listen and repeat: I have... / He has..., com o som de /z/ no final de has) e
   Talking Point (o seu menu da semana). Conteúdo NOVO: outras frases. 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 12, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'breakfast', traducao: 'café da manhã', nota: 'Soa como "BRÉK-fast".' },
    { instrucao: PAL, frase: 'lunch', traducao: 'almoço' },
    { instrucao: PAL, frase: 'dinner', traducao: 'jantar' },
    { instrucao: PAL, frase: 'yoghurt', traducao: 'iogurte', aceita: { yogurt: 'yoghurt' } },
    { instrucao: PAL, frase: 'juice', traducao: 'suco', nota: 'Soa como "DJUS".' },
    { instrucao: PAL, frase: 'cereal', traducao: 'cereal', aceita: { serial: 'cereal' } },
    { instrucao: PAL, frase: 'watermelon', traducao: 'melancia' },
    { instrucao: PAL, frase: 'sandwich', traducao: 'sanduíche' },
    { instrucao: PAL, frase: 'Wednesday', traducao: 'quarta-feira', nota: 'O primeiro "d" não se fala: WENZ-dei.' },
    { instrucao: PAL, frase: 'Thursday', traducao: 'quinta-feira', nota: 'O "th" é com a língua entre os dentes.' },
    { frase: 'I have bread and coffee for breakfast.', dica: 0, traducao: 'Eu como pão e tomo café no café da manhã.' },
    { frase: 'She has eggs and papaya for breakfast.', dica: 0, traducao: 'Ela come ovos e mamão no café da manhã.', nota: 'Has termina com som de "z": HAZ.' },
    { frase: 'He has pasta for lunch.', dica: 0, traducao: 'Ele come macarrão no almoço.' },
    { frase: 'We have soup and salad for dinner.', dica: 0, traducao: 'Nós tomamos sopa e comemos salada no jantar.' },
    { frase: 'They have fish and rice for dinner.', dica: 0, traducao: 'Eles comem peixe e arroz no jantar.' },
    { frase: 'My mom has a snack in the afternoon.', dica: 0, traducao: 'Minha mãe faz um lanche à tarde.' },
    { frase: 'On Monday, I have chicken and rice for lunch.', dica: 0, traducao: 'Na segunda, eu como frango e arroz no almoço.' },
    { frase: 'What do you have for breakfast?', dica: 0, traducao: 'O que você come no café da manhã?' },
    { frase: 'The children have cookies at school.', dica: 0, traducao: 'As crianças comem biscoitos na escola.' },
    { frase: 'On Friday, we have pizza for dinner.', dica: 0, traducao: 'Na sexta, nós comemos pizza no jantar.' }
  ]
});
</script>
