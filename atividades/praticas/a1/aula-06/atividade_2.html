<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Class 06 · Escrita
   Alinhado ao slide "Class 06: In a Hotel" — Listening and Speaking (perguntas do formulário do
   hotel: first name, last name, address, phone number, e-mail; How do you spell...?; Could you
   repeat, please?; Enjoy your stay; You're welcome). Conteúdo NOVO: outras respostas e frases.
   A isca é sempre uma palavra que não cabe em nenhuma posição. 20 questões. */
const P = 'Monte a pergunta da recepção:';
const R = 'Monte a resposta do hóspede:';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 6, num: 2, tipo: 'montar',
  instrucao: 'Clique nas palavras e monte a frase (uma palavra sobra)',
  itens: [
    { contexto: P, palavras: ["What's", 'your', 'first', 'name'], isca: ['you'], fim: '?', traducao: 'Qual é o seu primeiro nome?' },
    { contexto: P, palavras: ["What's", 'your', 'last', 'name'], isca: ['you'], fim: '?', traducao: 'Qual é o seu sobrenome?' },
    { contexto: P, palavras: ['Where', 'are', 'you', 'from'], isca: ['is'], fim: '?', traducao: 'De onde você é?' },
    { contexto: P, palavras: ["What's", 'your', 'address'], isca: ['you'], fim: '?', traducao: 'Qual é o seu endereço?' },
    { contexto: P, palavras: ["What's", 'your', 'phone', 'number'], isca: ['you'], fim: '?', traducao: 'Qual é o seu número de telefone?' },
    { contexto: P, palavras: ["What's", 'your', 'e-mail'], isca: ['you'], fim: '?', traducao: 'Qual é o seu e-mail?' },
    { contexto: P, palavras: ['How', 'do', 'you', 'spell', 'your', 'last', 'name'], isca: ['are'], fim: '?', traducao: 'Como você soletra o seu sobrenome?' },
    { contexto: P, palavras: ['Could', 'you', 'repeat,', 'please'], isca: ['your'], fim: '?', traducao: 'Você poderia repetir, por favor?' },
    { contexto: P, palavras: ['Enjoy', 'your', 'stay'], isca: ['you'], fim: '!', traducao: 'Aproveite a sua estadia!' },
    { contexto: P, palavras: ['Your', 'room', 'is', 'number', 'eight'], isca: ['are'], fim: '.', traducao: 'O seu quarto é o número oito.' },
    { contexto: R, palavras: ['My', 'first', 'name', 'is', 'Laura'], isca: ['are'], fim: '.', traducao: 'Meu primeiro nome é Laura.' },
    { contexto: R, palavras: ['My', 'last', 'name', 'is', 'Costa'], isca: ['am'], fim: '.', traducao: 'Meu sobrenome é Costa.' },
    { contexto: R, palavras: ["I'm", 'from', 'Brazil'], isca: ['is'], fim: '.', traducao: 'Eu sou do Brasil.' },
    { contexto: R, palavras: ["You're", 'welcome'], isca: ['Your'], fim: '.', traducao: 'De nada.' },
    { contexto: R, palavras: ['Sure.', 'C-O-S-T-A'], isca: ['Are'], fim: '.', traducao: 'Claro. C-O-S-T-A.' },
    { contexto: 'Monte a pergunta do hóspede:', palavras: ['Where', 'is', 'the', 'gym'], isca: ['are'], fim: '?', traducao: 'Onde fica a academia?' },
    { contexto: 'Monte a pergunta do hóspede:', palavras: ['Where', 'are', 'the', 'towels'], isca: ['is'], fim: '?', traducao: 'Onde estão as toalhas?' },
    { contexto: 'Monte a pergunta do hóspede:', palavras: ['Is', 'it', 'a', 'double', 'bed'], isca: ['an'], fim: '?', traducao: 'É uma cama de casal?' },
    { contexto: 'Monte a resposta da recepção:', palavras: ['No,', "it's", 'a', 'single', 'bed'], isca: ['an'], fim: '.', traducao: 'Não, é uma cama de solteiro.' },
    { contexto: 'Monte a pergunta do hóspede:', palavras: ['Is', 'breakfast', 'in', 'the', 'bar'], isca: ['Are'], fim: '?', traducao: 'O café da manhã é no bar?' }
  ]
});
</script>
</body>
</html>
