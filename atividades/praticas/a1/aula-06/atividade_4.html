<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="/atividades/praticas/catalogo.js"></script>

<script>
/* Class 06 · Fala
   Alinhado ao slide "Class 06: In a Hotel" — Vocabulary (listen and repeat) e Listening and
   Speaking (repeat questions and answers). Conteúdo NOVO: outras frases. Sem números em
   algarismo (o reconhecimento de voz escreve "7" e daria erro injusto). 20 questões. */
const PAL = 'Listen and record the word';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 6, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { instrucao: PAL, frase: 'single bed', traducao: 'cama de solteiro' },
    { instrucao: PAL, frase: 'double bed', traducao: 'cama de casal' },
    { instrucao: PAL, frase: 'shower', traducao: 'chuveiro' },
    { instrucao: PAL, frase: 'towels', traducao: 'toalhas', nota: 'Fala-se "TÁU-els".' },
    { instrucao: PAL, frase: 'pillows', traducao: 'travesseiros' },
    { instrucao: PAL, frase: 'breakfast', traducao: 'café da manhã', nota: 'Fala-se "BRÉK-fast".' },
    { instrucao: PAL, frase: 'remote control', traducao: 'controle remoto' },
    { instrucao: PAL, frase: 'toiletries', traducao: 'produtos de higiene' },
    { instrucao: PAL, frase: 'gym', traducao: 'academia', aceita: { jim: 'gym' } },
    { instrucao: PAL, frase: 'swimming pool', traducao: 'piscina' },
    { frase: "What's your first name?", dica: 0, traducao: 'Qual é o seu primeiro nome?' },
    { frase: "What's your last name?", dica: 0, traducao: 'Qual é o seu sobrenome?' },
    { frase: 'How do you spell your last name?', dica: 0, traducao: 'Como você soletra o seu sobrenome?' },
    { frase: 'Could you repeat, please?', dica: 0, traducao: 'Você poderia repetir, por favor?' },
    { frase: "What's your phone number?", dica: 0, traducao: 'Qual é o seu número de telefone?' },
    { frase: "What's your e-mail?", dica: 0, traducao: 'Qual é o seu e-mail?' },
    { frase: 'Enjoy your stay!', dica: 0, traducao: 'Aproveite a sua estadia!' },
    { frase: "You're welcome.", dica: 0, traducao: 'De nada.' },
    { frase: 'Where is the gym?', dica: 0, traducao: 'Onde fica a academia?', aceita: { jim: 'gym' } },
    { frase: 'Good afternoon! Welcome to the hotel.', dica: 0, traducao: 'Boa tarde! Bem-vindo ao hotel.' }
  ]
});
</script>
