/* Class 42 · Fala
   Alinhado ao slide "Class 42: Let's Travel" — os planos da semana antes da viagem, Role-Play
   ("I'm visiting Paris. I'm taking some sneakers, a jacket and a sweater...") e Writing (dream

DysePratica.iniciar({
  course: 'ativ-a1', aula: 42, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "On Monday, I'm paying my bills.", dica: 0, traducao: 'Na segunda, vou pagar as minhas contas.' },
    { frase: "On Tuesday, I'm going shopping for clothes.", dica: 0, traducao: 'Na terça, vou comprar roupas.' },
    { frase: "On Wednesday, I'm buying sunscreen.", dica: 0, traducao: 'Na quarta, vou comprar protetor solar.' },
    { frase: "On Thursday, I'm packing my bags.", dica: 0, traducao: 'Na quinta, vou arrumar as malas.' },
    { frase: "On Friday, I'm exchanging money.", dica: 0, traducao: 'Na sexta, vou trocar dinheiro.' },
    { frase: "On Saturday, I'm going to the hairdresser.", dica: 0, traducao: 'No sábado, vou ao cabeleireiro.' },
    { frase: "On Sunday, I'm going to the airport!", dica: 0, traducao: 'No domingo, vou para o aeroporto!' },
    { frase: 'Where are you going?', dica: 0, traducao: 'Para onde você vai?' },
    { frase: 'How are you traveling?', dica: 0, traducao: 'Como você vai viajar?' },
    { frase: 'Who are you going with?', dica: 0, traducao: 'Com quem você vai?' },
    { frase: 'Where are you staying?', dica: 0, traducao: 'Onde você vai ficar?' },
    { frase: 'What are you packing?', dica: 0, traducao: 'O que você vai levar na mala?' },
    { frase: "I'm visiting Tokyo in October.", dica: 0, traducao: 'Vou visitar Tóquio em outubro.' },
    { frase: "I'm traveling by plane with my husband.", dica: 0, traducao: 'Vou de avião com o meu marido.' },
    { frase: "We're staying in a hotel near the center.", dica: 0, traducao: 'Vamos ficar num hotel perto do centro.' },
    { frase: "I'm taking a jacket, a sweater and my camera.", dica: 0, traducao: 'Vou levar uma jaqueta, um suéter e a minha câmera.' },
    { frase: "We're visiting temples and eating sushi.", dica: 0, traducao: 'Vamos visitar templos e comer sushi.' },
    { frase: "My friends are going to Rio. They're taking their swimsuits.", dica: 0, traducao: 'Os meus amigos vão para o Rio. Vão levar roupa de banho.' },
    { frase: "They're going to the beach and eating local food.", dica: 0, traducao: 'Eles vão à praia e vão comer comida local.' },
    { frase: "I'm so excited! I can't wait!", dica: 0, traducao: 'Estou tão animado! Mal posso esperar!' }
  ]
});
</script>
