<title>DYSE · A1 · Aula 31 · There is, there are</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* Class 31 · Escrita
   Alinhado ao slide "Class 31: Is there a kitchen?" — Grammar Point (There's / There are; There
   isn't / There aren't any; Is there...? Are there any...? + short answers; some na afirmativa,
   any na negativa e na pergunta) e exercícios 4 e 5. Conteúdo NOVO: outra casa. O contexto traz a
   frase em português. A isca é is / are trocado ou some / any trocado. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a1', aula: 31, num: 2, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('Tem uma mesa na cozinha.'), palavras: ["There's", 'a', 'table', 'in', 'the', 'kitchen'], isca: ['are'], fim: '.', traducao: 'Tem uma mesa na cozinha.' },
    { contexto: M('Tem dois sofás na sala de estar.'), palavras: ['There', 'are', 'two', 'sofas', 'in', 'the', 'living', 'room'], isca: ['is'], fim: '.', traducao: 'Tem dois sofás na sala de estar.' },
    { contexto: M('Tem algumas plantas no corredor.'), palavras: ['There', 'are', 'some', 'plants', 'in', 'the', 'hall'], isca: ['any'], fim: '.', traducao: 'Tem algumas plantas no corredor.' },
    { contexto: M('Não tem poltrona no quarto.'), palavras: ['There', "isn't", 'an', 'armchair', 'in', 'the', 'bedroom'], isca: ["aren't"], fim: '.', traducao: 'Não tem poltrona no quarto.' },
    { contexto: M('Não tem nenhum livro nas prateleiras.'), palavras: ['There', "aren't", 'any', 'books', 'on', 'the', 'shelves'], isca: ['some'], fim: '.', traducao: 'Não tem nenhum livro nas prateleiras.' },
    { contexto: M('Tem um carro na garagem?'), palavras: ['Is', 'there', 'a', 'car', 'in', 'the', 'garage'], isca: ['Are'], fim: '?', traducao: 'Tem um carro na garagem?' },
    { contexto: M('Sim, tem.'), palavras: ['Yes,', 'there', 'is'], isca: ['are'], fim: '.', traducao: 'Sim, tem.' },
    { contexto: M('Tem plantas na sala de estar?'), palavras: ['Are', 'there', 'any', 'plants', 'in', 'the', 'living', 'room'], isca: ['some'], fim: '?', traducao: 'Tem plantas na sala de estar?' },
    { contexto: M('Não, não tem.'), palavras: ['No,', 'there', "aren't"], isca: ["isn't"], fim: '.', traducao: 'Não, não tem.' },
    { contexto: M('Tem um fogão.'), palavras: ["There's", 'a', 'stove'], isca: ['an'], fim: '.', traducao: 'Tem um fogão.' },
    { contexto: M('Não tem nenhuma poltrona.'), palavras: ['There', "aren't", 'any', 'armchairs'], isca: ["isn't"], fim: '.', traducao: 'Não tem nenhuma poltrona.' },
    { contexto: M('Tem alguns armários.'), palavras: ['There', 'are', 'some', 'cabinets'], isca: ['any'], fim: '.', traducao: 'Tem alguns armários.' },
    { contexto: M('Tem um vaso com flores.'), palavras: ["There's", 'a', 'vase', 'with', 'flowers'], isca: ['are'], fim: '.', traducao: 'Tem um vaso com flores.' },
    { contexto: M('Não tem espelho.'), palavras: ['There', "isn't", 'a', 'mirror'], isca: ["aren't"], fim: '.', traducao: 'Não tem espelho.' },
    { contexto: M('Tem uma escrivaninha no quarto?'), palavras: ['Is', 'there', 'a', 'desk', 'in', 'the', 'bedroom'], isca: ['any'], fim: '?', traducao: 'Tem uma escrivaninha no quarto?' },
    { contexto: M('Tem armários no banheiro?'), palavras: ['Are', 'there', 'any', 'cabinets', 'in', 'the', 'bathroom'], isca: ['Is'], fim: '?', traducao: 'Tem armários no banheiro?' },
    { contexto: M('Tem uma TV na cozinha?'), palavras: ['Is', 'there', 'a', 'TV', 'in', 'the', 'kitchen'], isca: ['Are'], fim: '?', traducao: 'Tem uma TV na cozinha?' },
    { contexto: M('Tem abajures no escritório?'), palavras: ['Are', 'there', 'any', 'lamps', 'in', 'the', 'study'], isca: ['some'], fim: '?', traducao: 'Tem abajures no escritório?' },
    { contexto: M('Tem três quartos e dois banheiros na minha casa.'), palavras: ['There', 'are', 'three', 'bedrooms', 'and', 'two', 'bathrooms', 'in', 'my', 'house'], isca: ['is'], fim: '.', traducao: 'Tem três quartos e dois banheiros na minha casa.' },
    { contexto: M('Não tem garagem, mas tem um jardim pequeno.'), palavras: ['There', "isn't", 'a', 'garage,', 'but', "there's", 'a', 'small', 'garden'], isca: ['any'], fim: '.', traducao: 'Não tem garagem, mas tem um jardim pequeno.' }
  ]
});
</script>
</body>
</html>
