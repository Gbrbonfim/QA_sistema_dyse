    { instrucao: PAL, frase: 'bathroom', traducao: 'banheiro' },
    { instrucao: PAL, frase: 'garage', traducao: 'garagem', nota: 'Soa como "ga-RÁJ" (americano).' },
    { instrucao: PAL, frase: 'armchair', traducao: 'poltrona' },
    { instrucao: PAL, frase: 'closet', traducao: 'armário embutido, closet' },
    { instrucao: PAL, frase: 'shelves', traducao: 'prateleiras' },
    { instrucao: PAL, frase: 'stove', traducao: 'fogão' },
    { frase: "There's a table in the kitchen.", dica: 0, traducao: 'Tem uma mesa na cozinha.', nota: "There's soa como \"DÉRZ\"." },
    { frase: 'There are two sofas in the living room.', dica: 0, traducao: 'Tem dois sofás na sala de estar.' },
    { frase: 'There are some plants in the hall.', dica: 0, traducao: 'Tem algumas plantas no corredor.' },
    { frase: "There isn't an armchair in the bedroom.", dica: 0, traducao: 'Não tem poltrona no quarto.' },
    { frase: "There aren't any books on the shelves.", dica: 0, traducao: 'Não tem nenhum livro nas prateleiras.' },
    { frase: 'Is there a car in the garage?', dica: 0, traducao: 'Tem um carro na garagem?' },
    { frase: "Yes, there is.", dica: 0, traducao: 'Sim, tem.' },
    { frase: 'Are there any plants in the living room?', dica: 0, traducao: 'Tem plantas na sala de estar?' },
    { frase: "No, there aren't.", dica: 0, traducao: 'Não, não tem.' },
    { frase: 'In my house, there are three bedrooms and two bathrooms.', dica: 0, traducao: 'Na minha casa, tem três quartos e dois banheiros.' },
    { frase: "There isn't a garage, but there's a small garden.", dica: 0, traducao: 'Não tem garagem, mas tem um jardim pequeno.' },

  ]
