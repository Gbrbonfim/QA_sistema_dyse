/* Class 14 · Escuta
   Alinhado ao slide "Class 13 and 14: Morning People" (parte Class 14) — Vocabulary: Saying the

const ROT = 'Listen to the sentence and choose the time';

  instrucao: 'Listen and choose the time',

    { audioTexto: "It's seven o'clock.", opcoes: op('7:00', '11:00', '7:30', '6:00'), certa: 0 },
    { audioTexto: "It's half past three.", opcoes: op('3:00', '3:30', '2:30', '3:15'), certa: 1 },
    { audioTexto: "It's a quarter past eleven.", opcoes: op('11:45', '10:15', '11:15', '11:30'), certa: 2 },
    { audioTexto: "It's a quarter to six.", opcoes: op('6:15', '6:45', '5:15', '5:45'), certa: 3 },

    { audioTexto: "It's ten to two.", opcoes: op('2:10', '10:02', '1:10', '1:50'), certa: 3 },
    { audioTexto: "It's five past eight.", opcoes: op('8:05', '5:08', '8:55', '7:55'), certa: 0 },
    { audioTexto: "It's twenty-five to nine.", opcoes: op('9:25', '8:35', '8:25', '9:35'), certa: 1 },
    { audioTexto: "It's a quarter past two.", opcoes: op('2:45', '1:45', '2:15', '3:15'), certa: 2 },
    { audioTexto: "It's half past twelve.", opcoes: op('12:15', '11:30', '6:00', '12:30'), certa: 3 },
