<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · A2 BLACK · Aula 7 · Adverbs in sentences</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/atividades/praticas/praticas.css">
</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 BLACK · Class 07 · Escrita (Queen Charlotte)
   Alinhado ao "Grammar Point - Adverbs" (descrevem como as pessoas fazem as ações; normalmente
   vêm depois do verbo; modificam verbos, adjetivos e outros advérbios: We know our characters
   extremely well. / Don't take things so seriously.) e ao exercício 3 (The duchess learns
   quickly... / She speaks English and French very well...). Conteúdo NOVO. A isca é o
   adjetivo no lugar do advérbio. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 7, num: 3, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('A rainha aprende rápido.'), palavras: ['The', 'queen', 'learns', 'quickly'], isca: ['quick'], fim: '.', traducao: 'A rainha aprende rápido.' },
    { contexto: M('Ela fala inglês muito bem.'), palavras: ['She', 'speaks', 'English', 'very', 'well'], isca: ['good'], fim: '.', traducao: 'Ela fala inglês muito bem.' },
    { contexto: M('Eu assisto a séries regularmente.'), palavras: ['I', 'watch', 'series', 'regularly'], isca: ['regular'], fim: '.', traducao: 'Assisto a séries regularmente.' },
    { contexto: M('Eu assisto com atenção para entender a história.'), palavras: ['I', 'watch', 'carefully', 'to', 'understand', 'the', 'story'], isca: ['careful'], fim: '.', traducao: 'Assisto com atenção para entender a história.' },
    { contexto: M('Nós conhecemos as nossas personagens extremamente bem.'), palavras: ['We', 'know', 'our', 'characters', 'extremely', 'well'], isca: ['extreme'], fim: '.', traducao: 'Conhecemos as nossas personagens extremamente bem.' },
    { contexto: M('Não leve as coisas tão a sério.'), palavras: ["Don't", 'take', 'things', 'so', 'seriously'], isca: ['serious'], fim: '.', traducao: 'Não leve as coisas tão a sério.' },
    { contexto: M('Ela come de forma saudável.'), palavras: ['She', 'eats', 'healthily'], isca: ['healthy'], fim: '.', traducao: 'Ela come de forma saudável.' },
    { contexto: M('Ele dirige devagar.'), palavras: ['He', 'drives', 'slowly'], isca: ['slow'], fim: '.', traducao: 'Ele dirige devagar.' },
    { contexto: M('Eu resolvo problemas facilmente.'), palavras: ['I', 'solve', 'problems', 'easily'], isca: ['easy'], fim: '.', traducao: 'Resolvo problemas facilmente.' },
    { contexto: M('Ela trabalha muito.'), palavras: ['She', 'works', 'hard'], isca: ['hardly'], fim: '.', traducao: 'Ela trabalha muito.' },
    { contexto: M('O cavalo corre rápido.'), palavras: ['The', 'horse', 'runs', 'fast'], isca: ['fastly'], fim: '.', traducao: 'O cavalo corre rápido.' },
    { contexto: M('Eu canto mal.'), palavras: ['I', 'sing', 'badly'], isca: ['bad'], fim: '.', traducao: 'Canto mal.' },
    { contexto: M('A série nos transporta magicamente para um mundo de fantasia.'), palavras: ['The', 'series', 'transports', 'us', 'magically', 'to', 'a', 'world', 'of', 'fantasy'], isca: ['magical'], fim: '.', traducao: 'A série nos transporta magicamente para um mundo de fantasia.' },
    { contexto: M('Eu leio calmamente à noite.'), palavras: ['I', 'read', 'calmly', 'at', 'night'], isca: ['calm'], fim: '.', traducao: 'Leio calmamente à noite.' },
    { contexto: M('Ela dança lindamente nos bailes.'), palavras: ['She', 'dances', 'beautifully', 'at', 'balls'], isca: ['beautiful'], fim: '.', traducao: 'Ela dança lindamente nos bailes.' },
    { contexto: M('Eu viajo com frequência.'), palavras: ['I', 'travel', 'frequently'], isca: ['frequent'], fim: '.', traducao: 'Viajo com frequência.' },
    { contexto: M('O rei fala educadamente com todos.'), palavras: ['The', 'king', 'speaks', 'politely', 'to', 'everyone'], isca: ['polite'], fim: '.', traducao: 'O rei fala educadamente com todos.' },
    { contexto: M('Eu cozinho bem.'), palavras: ['I', 'cook', 'well'], isca: ['good'], fim: '.', traducao: 'Cozinho bem.' },
    { contexto: M('Ela sorri com alegria.'), palavras: ['She', 'smiles', 'happily'], isca: ['happy'], fim: '.', traducao: 'Ela sorri com alegria.' },
    { contexto: M('Obviamente, a rainha é muito importante.'), palavras: ['Obviously,', 'the', 'queen', 'is', 'very', 'important'], isca: ['obvious'], fim: '.', traducao: 'Obviamente, a rainha é muito importante.' }
  ]
});
</script>
</body>
</html>
