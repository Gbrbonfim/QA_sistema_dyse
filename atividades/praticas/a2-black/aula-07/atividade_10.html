<script>
/* A2 BLACK · Class 07 · Gramática (Queen Charlotte)
   Alinhado ao Grammar Point do slide: advérbios descrevem como as pessoas fazem as ações,
   normalmente vêm depois do verbo e modificam verbos, adjetivos e outros advérbios; e ao
   vocabulário (formal x informal, resilience, youth, beauty, skirt). Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 7, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'In "We know our characters extremely well", "extremely" and "well" are ___.', opcoes: ['adverbs', 'adjectives', 'verbs'], certa: 0, traducao: '"Extremely" e "well" são advérbios.' },
    { frase: 'We use adverbs to describe ___.', opcoes: ['only nouns', 'how people do actions', 'only names'], certa: 1, traducao: 'Usamos advérbios para descrever como as pessoas fazem as ações.' },
    { frase: 'Normally, the adverb comes ___ the verb.', opcoes: ['before', 'instead of', 'after'], certa: 2, traducao: 'Normalmente, o advérbio vem depois do verbo.' },
    { frase: 'Adverbs can modify verbs, adjectives and ___.', opcoes: ['other adverbs', 'only nouns', 'pronouns'], certa: 0, traducao: 'Advérbios podem modificar verbos, adjetivos e outros advérbios.' },
    { instrucao: 'Where is the adverb? Choose the correct sentence.', frase: '___', opcoes: ['She quickly learns quickly.', 'She learns quickly.', 'Quickly she learns quickly.'], certa: 1, traducao: 'Ela aprende rápido.' },
    { instrucao: 'Where is the adverb? Choose the correct sentence.', frase: '___', opcoes: ['He well speaks French.', 'He speaks well French.', 'He speaks French well.'], certa: 2, traducao: 'Ele fala francês bem.' },
    { frase: 'In "She is extremely beautiful", "extremely" modifies ___.', opcoes: ['an adjective', 'a verb', 'a noun'], certa: 0, traducao: 'Em "She is extremely beautiful", "extremely" modifica um adjetivo.' },
    { frase: 'In "He runs really fast", "really" modifies ___.', opcoes: ['a noun', 'another adverb', 'a person'], certa: 1, traducao: 'Em "He runs really fast", "really" modifica outro advérbio.' },
    { frase: '"Let\'s get acquainted" is ___ English.', opcoes: ['informal', 'wrong', 'formal'], certa: 2, traducao: '"Let\'s get acquainted" é inglês formal.' },
    { frase: '"Hide" is ___ English. ("Tuck away" is formal.)', opcoes: ['informal', 'formal', 'wrong'], certa: 0, traducao: '"Hide" é inglês informal.' },
    { frase: 'The formal word for "handbag" is ___.', opcoes: ['tipple', 'reticule', 'skirt'], certa: 1, traducao: 'A palavra formal para "handbag" é "reticule".' },
    { frase: 'The formal word for "alcoholic drinks" is ___.', opcoes: ['reticule', 'youth', 'tipple'], certa: 2, traducao: 'A palavra formal para "alcoholic drinks" é "tipple".' },
    { frase: 'The period between being a child and an adult is ___.', opcoes: ['youth', 'beauty', 'resilience'], certa: 0, traducao: 'O período entre ser criança e adulto é a juventude.' },
    { frase: 'Being beautiful and attractive is ___.', opcoes: ['youth', 'beauty', 'resilience'], certa: 1, traducao: 'Ser bonito e atraente é beleza.' },
    { frase: 'The ability to be happy and successful after something difficult is ___.', opcoes: ['beauty', 'youth', 'resilience'], certa: 2, traducao: 'A capacidade de ser feliz e ter sucesso depois de algo difícil é resiliência.' },
    { frase: 'Women wore long ___ and dresses at royal balls.', opcoes: ['skirts', 'reticules', 'tipples'], certa: 0, traducao: 'As mulheres usavam saias e vestidos longos nos bailes reais.' },
    { frase: 'Would you trust her with a royal secret? — ___ She is my best friend!', opcoes: ['Of course not.', 'Absolutely.', 'Hide it.'], certa: 1, traducao: 'Você confiaria um segredo real a ela? — Com certeza. Ela é a minha melhor amiga!' },
    { frase: 'Would you trust him with a royal secret? — ___ He talks too much!', opcoes: ['Absolutely.', 'Happily.', 'Of course not.'], certa: 2, traducao: 'Você confiaria um segredo real a ele? — Claro que não. Ele fala demais!' },
    { frase: '"You will survive and thrive" is a piece of ___.', opcoes: ['advice', 'clothes', 'food'], certa: 0, traducao: '"Você vai sobreviver e prosperar" é um conselho.' },
    { frase: 'Queen Charlotte was the wife of King ___.', opcoes: ['Henry VIII', 'George III', 'Charles III'], certa: 1, traducao: 'A Rainha Charlotte foi esposa do Rei George III.' },
    { frase: 'Queen Charlotte is a series from the world of ___.', opcoes: ['Toy Story', 'Stranger Things', 'Bridgerton'], certa: 2, traducao: 'Queen Charlotte é uma série do universo de Bridgerton.' },
    { frase: 'Tell us about something you do ___. — I read books calmly.', opcoes: ['calmly', 'calm', 'calmy'], certa: 0, traducao: 'Conte algo que você faz calmamente. — Leio livros calmamente.' },
    { frase: 'Tell us about something you do ___. — I go to the gym four times a week.', opcoes: ['badly', 'frequently', 'slowly'], certa: 1, traducao: 'Conte algo que você faz com frequência. — Vou à academia quatro vezes por semana.' },
    { frase: 'Tell us about something you do ___. — I play the guitar very well.', opcoes: ['badly', 'slowly', 'well'], certa: 2, traducao: 'Conte algo que você faz bem. — Toco violão muito bem.' }
  ]
});
</script>
