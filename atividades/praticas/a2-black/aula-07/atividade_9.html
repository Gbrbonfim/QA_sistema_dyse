<script>
/* A2 BLACK · Class 07 · Gramática (Queen Charlotte)
   Alinhado ao exercício 2 do slide (Transform the adjectives into adverbs: -ly → slowly,
   quickly, badly; consoante + y → -ily: healthily, easily; irregulares: good → well, fast →
   fast, hard → hard) e ao exercício 3 (quickly, magically, well, regularly, carefully).
   Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 7, num: 9, tipo: 'escolha',
  instrucao: 'Choose the right adverb',
  itens: [
    { frase: 'slow → ___', opcoes: ['slowly', 'slowily', 'slowlly'], certa: 0, traducao: 'devagar' },
    { frase: 'quick → ___', opcoes: ['quickily', 'quickly', 'quick'], certa: 1, traducao: 'rapidamente' },
    { frase: 'bad → ___', opcoes: ['bad', 'badily', 'badly'], certa: 2, traducao: 'mal' },
    { frase: 'healthy → ___', opcoes: ['healthily', 'healthyly', 'healthly'], certa: 0, traducao: 'de forma saudável' },
    { frase: 'easy → ___', opcoes: ['easyly', 'easily', 'easly'], certa: 1, traducao: 'facilmente' },
    { frase: 'good → ___', opcoes: ['goodly', 'goodily', 'well'], certa: 2, traducao: 'bem' },
    { frase: 'fast → ___', opcoes: ['fast', 'fastly', 'fastily'], certa: 0, traducao: 'rápido' },
    { frase: 'hard → ___ (muito, com esforço)', opcoes: ['hardly', 'hard', 'hardily'], certa: 1, traducao: 'muito, com esforço' },
    { frase: 'happy → ___', opcoes: ['happyly', 'happly', 'happily'], certa: 2, traducao: 'alegremente' },
    { frase: 'careful → ___', opcoes: ['carefully', 'carefuly', 'carefullly'], certa: 0, traducao: 'com cuidado' },
    { frase: 'regular → ___', opcoes: ['regulary', 'regularly', 'regularily'], certa: 1, traducao: 'regularmente' },
    { frase: 'magical → ___', opcoes: ['magicaly', 'magically', 'magicalily'], certa: 1, traducao: 'magicamente' },
    { frase: 'The duchess learns ___ how to manage her duties.', opcoes: ['quick', 'quickly', 'quickily'], certa: 1, traducao: 'A duquesa aprende rápido a cuidar das obrigações.' },
    { frase: 'The stories transport us ___ to a world of fantasy.', opcoes: ['magical', 'magic', 'magically'], certa: 2, traducao: 'As histórias nos transportam magicamente para um mundo de fantasia.' },
    { frase: 'She speaks English and French very ___.', opcoes: ['well', 'good', 'goodly'], certa: 0, traducao: 'Ela fala inglês e francês muito bem.' },
    { frase: 'I like to watch series ___.', opcoes: ['regular', 'regularly', 'regulary'], certa: 1, traducao: 'Gosto de assistir a séries regularmente.' },
    { frase: 'I always watch series ___ to understand the story.', opcoes: ['careful', 'carefuly', 'carefully'], certa: 2, traducao: 'Sempre assisto às séries com atenção para entender a história.' },
    { frase: 'We know our characters ___ well.', opcoes: ['extremely', 'extreme', 'extremly'], certa: 0, traducao: 'Conhecemos as nossas personagens extremamente bem.' },
    { frase: "Don't take things so ___.", opcoes: ['serious', 'seriously', 'seriosly'], certa: 1, traducao: 'Não leve as coisas tão a sério.' },
    { frase: 'She is a ___ dancer.', opcoes: ['beautifully', 'beautifuly', 'beautiful'], certa: 2, traducao: 'Ela é uma dançarina linda.' },
    { frase: 'She dances ___.', opcoes: ['beautifully', 'beautiful', 'beautifuly'], certa: 0, traducao: 'Ela dança lindamente.' },
    { frase: 'He is a ___ cook.', opcoes: ['well', 'good', 'goodly'], certa: 1, traducao: 'Ele é um bom cozinheiro.' },
    { frase: 'He cooks ___.', opcoes: ['good', 'goodly', 'well'], certa: 2, traducao: 'Ele cozinha bem.' },
    { frase: 'The test is ___.', opcoes: ['easy', 'easily', 'easyly'], certa: 0, traducao: 'A prova é fácil.' }
  ]
});
</script>
