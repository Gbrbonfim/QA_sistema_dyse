<script>
/* A2 BLACK · Class 06 · Gramática (You've Got a Friend in Me)
   As regras do slide: in (dentro), under (embaixo), on (em cima, tocando a superfície), next to
   (ao lado, à esquerda ou à direita), behind (atrás). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 6, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'The toys are ___ the box. (dentro)', opcoes: ['in', 'on', 'under'], certa: 0, traducao: 'Os brinquedos estão dentro da caixa.' },
    { frase: 'The shoes are ___ the bed. (embaixo)', opcoes: ['on', 'under', 'behind'], certa: 1, traducao: 'Os sapatos estão embaixo da cama.' },
    { frase: 'The lamp is ___ the desk. (em cima)', opcoes: ['in', 'under', 'on'], certa: 2, traducao: 'A luminária está em cima da escrivaninha.' },
    { frase: 'Woody is ___ Buzz. (ao lado)', opcoes: ['next to', 'in', 'under'], certa: 0, traducao: 'O Woody está ao lado do Buzz.' },
    { frase: 'The ball is ___ the door. (atrás)', opcoes: ['on', 'behind', 'in'], certa: 1, traducao: 'A bola está atrás da porta.' },
    { frase: 'The poster is ___ the wall.', opcoes: ['in', 'under', 'on'], certa: 2, traducao: 'O pôster está na parede.' },
    { frase: 'My clothes are ___ the dresser.', opcoes: ['in', 'on', 'next'], certa: 0, traducao: 'As minhas roupas estão na cômoda.' },
    { frase: 'The cat is ___ the books. You can only see its tail.', opcoes: ['on', 'behind', 'next'], certa: 1, traducao: 'O gato está atrás dos livros. Só dá para ver o rabo.' },
    { frase: 'The rug is ___ the bed.', opcoes: ['in', 'behind of', 'under'], certa: 2, traducao: 'O tapete está embaixo da cama.' },
    { frase: 'The chair is ___ the desk.', opcoes: ['next to', 'next', 'next of'], certa: 0, traducao: 'A cadeira está ao lado da escrivaninha.' },
    { frase: 'The teddy bear is ___ the pillow.', opcoes: ['in', 'on', 'behind of'], certa: 1, traducao: 'O ursinho está no travesseiro.' },
    { frase: 'The aliens are ___ the toy box.', opcoes: ['on of', 'next', 'in'], certa: 2, traducao: 'Os alienígenas estão na caixa de brinquedos.' },
    { frase: 'Use ___ when something is inside another thing.', opcoes: ['in', 'on', 'behind'], certa: 0, traducao: 'Use "in" quando algo está dentro de outra coisa.' },
    { frase: 'Use ___ when something is below another thing.', opcoes: ['on', 'under', 'next to'], certa: 1, traducao: 'Use "under" quando algo está embaixo de outra coisa.' },
    { frase: 'Use ___ when something is touching the top surface.', opcoes: ['under', 'behind', 'on'], certa: 2, traducao: 'Use "on" quando algo está tocando a superfície de cima.' },
    { frase: 'Use ___ when something is beside something.', opcoes: ['next to', 'in', 'under'], certa: 0, traducao: 'Use "next to" quando algo está ao lado de outra coisa.' },
    { frase: 'Use ___ when something is at the back of another thing.', opcoes: ['on', 'behind', 'in'], certa: 1, traducao: 'Use "behind" quando algo está atrás de outra coisa.' },
    { frase: 'The robot ___ under the bed.', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'O robô está embaixo da cama.' },
    { frase: 'The soldiers ___ in the box.', opcoes: ['are', 'is', 'am'], certa: 0, traducao: 'Os soldadinhos estão na caixa.' },
    { frase: 'Where ___ my toys?', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'Onde estão os meus brinquedos?' },
    { frase: 'Where ___ my teddy bear?', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'Onde está o meu ursinho?' },
    { frase: 'There ___ a lamp on my desk.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'Tem uma luminária na minha escrivaninha.' },
    { frase: 'There ___ two windows in my bedroom.', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'Tem duas janelas no meu quarto.' },
    { instrucao: '"The snake and the robot are under the bed." Where are they?', frase: '___', opcoes: ['On the bed', 'Behind the bed', 'Below the bed'], certa: 2, traducao: 'A cobra e o robô estão embaixo da cama.' }
  ]
});
</script>
