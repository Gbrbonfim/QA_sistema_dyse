/* A2 BLACK · Class 01 · Fala (Who am I?)
   Alinhado ao "presentation model" do slide (Hi, I'm... but you can call me... / I was born
   on..., which makes me... / I have always been interested in... / I also enjoy... / In the
   future, I want to... / I guess that's me!). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 1, num: 7, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "Hi, I'm Gabriela, but you can call me Gabi.", dica: 0, traducao: 'Oi, sou a Gabriela, mas pode me chamar de Gabi.' },
    { frase: 'I was born on March tenth.', dica: 0, traducao: 'Nasci em 10 de março.' },
    { frase: 'That makes me a Pisces.', dica: 0, traducao: 'Isso me faz ser de Peixes.' },
    { frase: "I'm seventeen years old and from Recife.", dica: 0, traducao: 'Tenho dezessete anos e sou de Recife.' },
    { frase: 'I have always been interested in music.', dica: 0, traducao: 'Sempre me interessei por música.' },
    { frase: 'I also enjoy cooking and drawing.', dica: 0, traducao: 'Também gosto de cozinhar e desenhar.' },
    { frase: 'I love reading because it helps me relax.', dica: 0, traducao: 'Amo ler porque me ajuda a relaxar.' },
    { frase: 'I also explore different hobbies, like photography.', dica: 0, traducao: 'Também exploro hobbies diferentes, como fotografia.' },
    { frase: 'In the future, I want to help people.', dica: 0, traducao: 'No futuro, quero ajudar as pessoas.' },
    { frase: "I guess that's me!", dica: 0, traducao: 'Acho que essa sou eu!' },
    { frase: "That's all you need to know for now.", dica: 0, traducao: 'É tudo o que você precisa saber por enquanto.' },
    { frase: "I'm a student. I study gastronomy.", dica: 0, traducao: 'Sou estudante. Estudo gastronomia.' },
    { frase: 'I work in a hospital.', dica: 0, traducao: 'Trabalho num hospital.' },
    { frase: 'My hobbies are playing tennis and painting.', dica: 0, traducao: 'Os meus hobbies são jogar tênis e pintar.' },
    { frase: 'I love mangas and books.', dica: 0, traducao: 'Adoro mangás e livros.' },
    { frase: 'In addition to that, I play the guitar.', dica: 0, traducao: 'Além disso, toco violão.' },
    { frase: 'I was born in November, so I am a Scorpio.', dica: 0, traducao: 'Nasci em novembro, então sou de Escorpião.' },
    { frase: 'I live in Curitiba with my family.', dica: 0, traducao: 'Moro em Curitiba com a minha família.' },
    { frase: 'In the future, I want to travel the world.', dica: 0, traducao: 'No futuro, quero viajar pelo mundo.' },
    { frase: 'The rest? Well, that is for you to find out.', dica: 0, traducao: 'O resto? Bem, isso é para você descobrir.' }
  ]
});
</script>
