<script>
/* A2 BLACK · Class 01 · Escuta (Who am I?)
   Alinhado ao arquivo do slide (Birth date: January 26, 2007) e ao vocabulário Months / Dates
   (November, 1st March). Conteúdo NOVO: o aluno ouve a data e escolhe a escrita certa. As iscas
   trocam o mês ou o dia (third x thirtieth, fifth x fifteenth...). 24 questões. */
let n = 0;
const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 4;
  const ns = iscas.slice(0, 3);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(c => ({ label: c, icon: 'event' })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 1, num: 2, tipo: 'imagem',
  instrucao: 'Listen and choose the date',
  itens: [
    q('I was born on March first.', 'March 1st', ['March 3rd', 'May 1st', 'March 21st']),
    q('I was born on January twenty-sixth.', 'January 26th', ['January 6th', 'June 26th', 'January 16th']),
    q('My birthday is on November third.', 'November 3rd', ['November 30th', 'December 3rd', 'November 13th']),
    q('I was born on May fifteenth.', 'May 15th', ['May 5th', 'March 15th', 'May 50th']),
    q('My birthday is on August twelfth.', 'August 12th', ['August 20th', 'April 12th', 'August 2nd']),
    q('I was born on July thirtieth.', 'July 30th', ['July 13th', 'June 30th', 'July 3rd']),
    q('My birthday is on October second.', 'October 2nd', ['October 22nd', 'October 20th', 'December 2nd']),
    q('I was born on February fourteenth.', 'February 14th', ['February 4th', 'February 40th', 'November 14th']),
    q('My birthday is on September ninth.', 'September 9th', ['September 19th', 'December 9th', 'September 29th']),
    q('I was born on April twenty-first.', 'April 21st', ['April 1st', 'August 21st', 'April 20th']),
    q('My birthday is on June eighteenth.', 'June 18th', ['June 8th', 'July 18th', 'June 80th']),
    q('I was born on December thirty-first.', 'December 31st', ['December 13th', 'December 3rd', 'November 31st']),
    q('My birthday is on March eleventh.', 'March 11th', ['March 7th', 'May 11th', 'March 1st']),
    q('I was born on January seventeenth.', 'January 17th', ['January 7th', 'January 70th', 'June 17th']),
    q('My birthday is on November twenty-fifth.', 'November 25th', ['November 5th', 'September 25th', 'November 15th']),
    q('I was born on August sixth.', 'August 6th', ['August 16th', 'April 6th', 'August 60th']),
    q('My birthday is on July fourth.', 'July 4th', ['July 14th', 'June 4th', 'July 40th']),
    q('I was born on October twentieth.', 'October 20th', ['October 2nd', 'October 12th', 'October 22nd']),
    q('My birthday is on February twenty-eighth.', 'February 28th', ['February 8th', 'February 18th', 'November 28th']),
    q('I was born on May third.', 'May 3rd', ['March 3rd', 'May 30th', 'May 13th']),
    q('My birthday is on September first.', 'September 1st', ['December 1st', 'September 21st', 'September 3rd']),
    q('I was born on April nineteenth.', 'April 19th', ['April 9th', 'April 90th', 'August 19th']),
    q('My birthday is on June twenty-second.', 'June 22nd', ['June 2nd', 'January 22nd', 'June 12th']),
    q('I was born on December fifth.', 'December 5th', ['December 15th', 'December 50th', 'November 5th'])
  ]
});
</script>
