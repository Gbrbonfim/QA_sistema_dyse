<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · A2 BLACK · Aula 4 · Do you...? Does she...?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/atividades/praticas/praticas.css">
</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 BLACK · Class 04 and 05 · Escrita (A Celebrity's Routine)
   Alinhado ao "Question" do slide (Do you cry when you listen to Rihanna? / Does she listen to
   any other pop diva?) e ao exercício 3 (Does she play basketball...? / Do they go...?).
   Conteúdo NOVO. A isca é o auxiliar errado ou o verbo com -s depois de does. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 4, num: 4, tipo: 'montar',
  instrucao: 'Click the words and make the question (one word is extra)',
  itens: [
    { contexto: M('Você toma café da manhã todos os dias?'), palavras: ['Do', 'you', 'have', 'breakfast', 'every', 'day'], isca: ['Does'], fim: '?', traducao: 'Você toma café da manhã todos os dias?' },
    { contexto: M('Ela bebe muita água?'), palavras: ['Does', 'she', 'drink', 'a', 'lot', 'of', 'water'], isca: ['drinks'], fim: '?', traducao: 'Ela bebe muita água?' },
    { contexto: M('Eles vão à academia?'), palavras: ['Do', 'they', 'go', 'to', 'the', 'gym'], isca: ['Does'], fim: '?', traducao: 'Eles vão à academia?' },
    { contexto: M('Ele trabalha cedo?'), palavras: ['Does', 'he', 'work', 'early'], isca: ['works'], fim: '?', traducao: 'Ele trabalha cedo?' },
    { contexto: M('Você passa tempo com a sua família?'), palavras: ['Do', 'you', 'spend', 'time', 'with', 'your', 'family'], isca: ['Are'], fim: '?', traducao: 'Você passa tempo com a sua família?' },
    { contexto: M('A cantora come legumes?'), palavras: ['Does', 'the', 'singer', 'eat', 'vegetables'], isca: ['Do'], fim: '?', traducao: 'A cantora come legumes?' },
    { contexto: M('O que você janta?'), palavras: ['What', 'do', 'you', 'have', 'for', 'dinner'], isca: ['does'], fim: '?', traducao: 'O que você janta?' },
    { contexto: M('A que horas ela almoça?'), palavras: ['What', 'time', 'does', 'she', 'have', 'lunch'], isca: ['has'], fim: '?', traducao: 'A que horas ela almoça?' },
    { contexto: M('Com que frequência eles limpam a casa?'), palavras: ['How', 'often', 'do', 'they', 'clean', 'the', 'house'], isca: ['does'], fim: '?', traducao: 'Com que frequência eles limpam a casa?' },
    { contexto: M('Você se sente sobrecarregado às vezes?'), palavras: ['Do', 'you', 'feel', 'overwhelmed', 'sometimes'], isca: ['Are'], fim: '?', traducao: 'Você se sente sobrecarregado às vezes?' },
    { contexto: M('Ela joga basquete todas as manhãs?'), palavras: ['Does', 'she', 'play', 'basketball', 'every', 'morning'], isca: ['plays'], fim: '?', traducao: 'Ela joga basquete todas as manhãs?' },
    { contexto: M('Eles vão à cidade uma vez por semana?'), palavras: ['Do', 'they', 'go', 'to', 'the', 'city', 'once', 'a', 'week'], isca: ['goes'], fim: '?', traducao: 'Eles vão à cidade uma vez por semana?' },
    { contexto: M('Sim, eles vão.'), palavras: ['Yes,', 'they', 'do'], isca: ['does'], fim: '.', traducao: 'Sim.' },
    { contexto: M('Não, ela não joga.'), palavras: ['No,', 'she', "doesn't"], isca: ["don't"], fim: '.', traducao: 'Não.' },
    { contexto: M('Onde ele mora?'), palavras: ['Where', 'does', 'he', 'live'], isca: ['lives'], fim: '?', traducao: 'Onde ele mora?' },
    { contexto: M('O seu pai cozinha?'), palavras: ['Does', 'your', 'dad', 'cook'], isca: ['cooks'], fim: '?', traducao: 'O seu pai cozinha?' },
    { contexto: M('Que tipo de música você ouve?'), palavras: ['What', 'music', 'do', 'you', 'listen', 'to'], isca: ['does'], fim: '?', traducao: 'Que música você ouve?' },
    { contexto: M('Ela posta no Instagram todos os dias?'), palavras: ['Does', 'she', 'post', 'on', 'Instagram', 'every', 'day'], isca: ['posts'], fim: '?', traducao: 'Ela posta no Instagram todos os dias?' },
    { contexto: M('Vocês bebem café?'), palavras: ['Do', 'you', 'drink', 'coffee'], isca: ['Does'], fim: '?', traducao: 'Vocês bebem café?' },
    { contexto: M('Ele ouve outras divas pop?'), palavras: ['Does', 'he', 'listen', 'to', 'other', 'pop', 'divas'], isca: ['listens'], fim: '?', traducao: 'Ele ouve outras divas pop?' }
  ]
});
</script>
</body>
</html>
