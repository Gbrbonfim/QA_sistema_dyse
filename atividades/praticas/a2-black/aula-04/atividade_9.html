<script>
/* A2 BLACK · Class 04 and 05 · Gramática (A Celebrity's Routine)
   Alinhado ao exercício 3 do slide (Fill in the gaps with the Present Simple: shines / don't
   want / feels / Does ... play / doesn't work / Do ... go / visits / don't eat): afirmativa,
   negativa e pergunta. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 4, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'The sun ___ in the summer. (shine)', opcoes: ['shines', 'shine', 'shining'], certa: 0, traducao: 'O sol brilha no verão.' },
    { frase: 'I ___ to think about it. (not want)', opcoes: ["doesn't want", "don't want", "don't wants"], certa: 1, traducao: 'Não quero pensar nisso.' },
    { frase: 'It ___ so good! (feel)', opcoes: ['feel', 'feeling', 'feels'], certa: 2, traducao: 'É tão bom!' },
    { frase: '___ she play tennis every morning?', opcoes: ['Does', 'Do', 'Is'], certa: 0, traducao: 'Ela joga tênis todas as manhãs?' },
    { frase: 'Does she ___ tennis every morning?', opcoes: ['plays', 'play', 'playing'], certa: 1, traducao: 'Ela joga tênis todas as manhãs?' },
    { frase: 'Tom ___ on weekends. (not work)', opcoes: ["don't work", "doesn't works", "doesn't work"], certa: 2, traducao: 'O Tom não trabalha nos fins de semana.' },
    { frase: '___ they go to the beach once a month?', opcoes: ['Do', 'Does', 'Are'], certa: 0, traducao: 'Eles vão à praia uma vez por mês?' },
    { frase: "You ___ the piano very well. (not play)", opcoes: ["doesn't play", "don't play", "don't plays"], certa: 1, traducao: 'Você não toca piano muito bem.' },
    { frase: 'She never ___ her grandparents. (visit)', opcoes: ['visit', 'visiting', 'visits'], certa: 2, traducao: 'Ela nunca visita os avós.' },
    { frase: 'Tim and Kate ___ TV at night. (watch)', opcoes: ['watch', 'watches', 'watching'], certa: 0, traducao: 'O Tim e a Kate assistem TV à noite.' },
    { frase: 'Lucas and Clara ___ meat. (not eat)', opcoes: ["doesn't eat", "don't eat", "don't eats"], certa: 1, traducao: 'O Lucas e a Clara não comem carne.' },
    { frase: 'I usually ___ to school by bike. (go)', opcoes: ['goes', 'going', 'go'], certa: 2, traducao: 'Normalmente vou à escola de bicicleta.' },
    { frase: 'She ___ fish for dinner. (have)', opcoes: ['has', 'have', 'haves'], certa: 0, traducao: 'Ela come peixe no jantar.' },
    { frase: 'He ___ vegetables. (not like)', opcoes: ["don't like", "doesn't like", "doesn't likes"], certa: 1, traducao: 'Ele não gosta de legumes.' },
    { frase: 'They ___ us often. (not visit)', opcoes: ["doesn't visit", "don't visits", "don't visit"], certa: 2, traducao: 'Eles não nos visitam com frequência.' },
    { frase: '___ you drink water at work?', opcoes: ['Do', 'Does', 'Are'], certa: 0, traducao: 'Você bebe água no trabalho?' },
    { frase: '___ your brother clean the house?', opcoes: ['Do', 'Does', 'Is'], certa: 1, traducao: 'O seu irmão limpa a casa?' },
    { frase: 'What time ___ you have lunch?', opcoes: ['does', 'are', 'do'], certa: 2, traducao: 'A que horas você almoça?' },
    { frase: 'Where ___ Rihanna come from?', opcoes: ['does', 'do', 'is'], certa: 0, traducao: 'De onde a Rihanna é?' },
    { frase: 'Does he work early? — Yes, he ___.', opcoes: ['do', 'does', 'is'], certa: 1, traducao: 'Ele trabalha cedo? — Sim.' },
    { frase: "Do you eat snacks? — No, I ___.", opcoes: ["doesn't", "'m not", "don't"], certa: 2, traducao: 'Você come besteiras? — Não.' },
    { frase: "Does she feel overwhelmed? — Yes, she ___.", opcoes: ['does', 'do', 'feels'], certa: 0, traducao: 'Ela se sente sobrecarregada? — Sim.' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ["She don't eats meat.", "She doesn't eat meat.", "She doesn't eats meat."], certa: 1, traducao: 'Ela não come carne.' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Does she listens to pop?', 'Do she listen to pop?', 'Does she listen to pop?'], certa: 2, traducao: 'Ela ouve pop?' }
  ]
});
</script>
