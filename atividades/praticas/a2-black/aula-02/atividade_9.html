/* A2 BLACK · Class 02 · Gramática (I Want It That Way - Backstreet Boys)
   "Grammar - Verb To Be" do slide: I am / he, she, it is / you, we, they are, com bandas e
   cantores (fatos verdadeiros), e contrações ('m, 's, 're). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 2, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I ___ a singer.', opcoes: ['am', 'is', 'are'], certa: 0, traducao: 'Sou cantor.' },
    { frase: 'She ___ very smart.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'Ela é muito inteligente.' },
    { frase: 'We ___ great students.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'Somos ótimos alunos.' },
    { frase: 'The Beatles ___ from Liverpool.', opcoes: ['are', 'is', 'am'], certa: 0, traducao: 'Os Beatles são de Liverpool.' },
    { frase: 'Adele ___ from London.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'A Adele é de Londres.' },
    { frase: 'Shakira and Bruno Mars ___ famous singers.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'A Shakira e o Bruno Mars são cantores famosos.' },
    { frase: 'The song ___ still very popular.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'A música ainda é muito popular.' },
    { frase: 'Nick Carter ___ the youngest in the Backstreet Boys.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O Nick Carter é o mais novo do Backstreet Boys.' },
    { frase: 'You ___ my favourite singer!', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'Você é o meu cantor favorito!' },
    { frase: 'It ___ too late.', opcoes: ["'s", "'re", "'m"], certa: 0, traducao: 'É tarde demais.' },
    { frase: 'They___ an American boy band.', opcoes: ["'s", "'re", "'m"], certa: 1, traducao: 'Eles são uma boy band americana.' },
    { frase: 'I___ a big fan of the band.', opcoes: ["'s", "'re", "'m"], certa: 2, traducao: 'Sou muito fã da banda.' },
    { frase: '___ I your favourite singer?', opcoes: ['Am', 'Is', 'Are'], certa: 0, traducao: 'Sou o seu cantor favorito?' },
    { frase: '___ the band from the USA?', opcoes: ['Are', 'Is', 'Am'], certa: 1, traducao: 'A banda é dos Estados Unidos?' },
    { frase: '___ the singers American?', opcoes: ['Is', 'Am', 'Are'], certa: 2, traducao: 'Os cantores são americanos?' },
    { frase: 'Is Bruno Mars from Hawaii? — Yes, he ___.', opcoes: ['is', 'are', "'s"], certa: 0, traducao: 'O Bruno Mars é do Havaí? — Sim.' },
    { frase: 'Are the Beatles American? — No, they ___.', opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Os Beatles são americanos? — Não.' },
    { frase: 'Is Shakira from Spain? — No, she ___.', opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'A Shakira é da Espanha? — Não.' },
    { frase: "U2 ___ British. It's from Ireland.", opcoes: ["isn't", "aren't", "'m not"], certa: 0, traducao: 'O U2 não é britânico. É da Irlanda.' },
    { frase: "BTS ___ from Japan. They're from South Korea.", opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'O BTS não é do Japão. Eles são da Coreia do Sul.' },
    { frase: 'I ___ a good dancer.', opcoes: ["isn't", "aren't", "'m not"], certa: 2, traducao: 'Não sou um bom dançarino.' },
    { frase: 'Where ___ Adele from?', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'De onde é a Adele?' },
    { frase: 'Who ___ the singers in the band?', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'Quem são os cantores da banda?' },
    { frase: "What ___ your favourite song?", opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'Qual é a sua música favorita?' }
  ]
});
</script>
