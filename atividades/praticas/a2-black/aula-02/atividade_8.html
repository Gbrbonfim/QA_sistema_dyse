/* A2 BLACK · Class 02 · Fala (I Want It That Way - Backstreet Boys)
   Alinhado ao vocabulário e à pronúncia do slide (world /wɜːld/, heartache, mistake, fire,
   desire, hear, heart, apart, say, way) e às rimas. Conteúdo NOVO: frases curtas com as
   palavras da aula. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 2, num: 8, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'World.', dica: 0, traducao: 'Mundo.' },
    { frase: 'Music is my world.', dica: 0, traducao: 'A música é o meu mundo.' },
    { frase: 'This band is famous all over the world.', dica: 0, traducao: 'Esta banda é famosa no mundo todo.' },
    { frase: 'Heartache and mistake rhyme.', dica: 0, traducao: 'Heartache e mistake rimam.' },
    { frase: 'Fire and desire rhyme.', dica: 0, traducao: 'Fire e desire rimam.' },
    { frase: 'Heart and apart rhyme.', dica: 0, traducao: 'Heart e apart rimam.' },
    { frase: 'Way and say rhyme.', dica: 0, traducao: 'Way e say rimam.' },
    { frase: "It's my mistake.", dica: 0, traducao: 'O erro é meu.' },
    { frase: 'This song is about a heartache.', dica: 0, traducao: 'Esta música é sobre uma desilusão amorosa.' },
    { frase: 'You are always in my heart.', dica: 0, traducao: 'Você está sempre no meu coração.' },
    { frase: "I can't hear the music.", dica: 0, traducao: 'Não consigo ouvir a música.' },
    { frase: 'What do you say?', dica: 0, traducao: 'O que você diz?' },
    { frase: 'I like it that way.', dica: 0, traducao: 'Gosto assim.' },
    { frase: 'We are two worlds apart.', dica: 0, traducao: 'Somos dois mundos distantes.' },
    { frase: 'My biggest desire is to sing.', dica: 0, traducao: 'O meu maior desejo é cantar.' },
    { frase: 'The singer has a lot of fire.', dica: 0, traducao: 'O cantor tem muita energia.' },
    { frase: 'Day and play rhyme.', dica: 0, traducao: 'Day e play rimam.' },
    { frase: 'Night and light rhyme.', dica: 0, traducao: 'Night e light rimam.' },
    { frase: 'You and blue rhyme.', dica: 0, traducao: 'You e blue rimam.' },
    { frase: 'Is it too late?', dica: 0, traducao: 'É tarde demais?' }
  ]
});
</script>
