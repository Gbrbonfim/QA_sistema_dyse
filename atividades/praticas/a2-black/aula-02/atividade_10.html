<script>
/* A2 BLACK · Class 02 · Gramática (I Want It That Way - Backstreet Boys)
   Vocabulário da aula (heartache, mistake, world, fire, hear, desire, heart, apart, say, way)
   em frases novas, rimas e a ordem das perguntas com to be (verb to be + subject +
   complement). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2-black', aula: 2, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right word',
  itens: [
    { frase: 'A sad feeling when love ends is a ___.', opcoes: ['heartache', 'mistake', 'world'], certa: 0, traducao: 'Um sentimento triste quando o amor acaba é uma desilusão (heartache).' },
    { frase: "Sorry, it's my ___. The answer is wrong.", opcoes: ['heart', 'mistake', 'fire'], certa: 1, traducao: 'Desculpe, é erro meu. A resposta está errada.' },
    { frase: 'This band is famous all over the ___.', opcoes: ['way', 'heart', 'world'], certa: 2, traducao: 'Esta banda é famosa no mundo todo.' },
    { frase: 'Turn up the music! I want to ___ it.', opcoes: ['hear', 'say', 'desire'], certa: 0, traducao: 'Aumenta a música! Quero ouvi-la.' },
    { frase: 'Call the firefighters! There is a ___!', opcoes: ['desire', 'fire', 'heartache'], certa: 1, traducao: 'Chamem os bombeiros! Tem um incêndio!' },
    { frase: 'We live in different countries. We are far ___.', opcoes: ['way', 'heart', 'apart'], certa: 2, traducao: 'Moramos em países diferentes. Estamos longe um do outro.' },
    { frase: 'Is this the ___ to the stadium?', opcoes: ['way', 'say', 'world'], certa: 0, traducao: 'Este é o caminho para o estádio?' },
    { frase: 'What did you ___? I can\'t hear you.', opcoes: ['way', 'say', 'heart'], certa: 1, traducao: 'O que você disse? Não consigo te ouvir.' },
    { frase: 'Fire rhymes with ___.', opcoes: ['heart', 'way', 'desire'], certa: 2, traducao: 'Fire rima com desire.' },
    { frase: 'Mistake rhymes with ___.', opcoes: ['heartache', 'apart', 'say'], certa: 0, traducao: 'Mistake rima com heartache.' },
    { frase: 'Heart rhymes with ___.', opcoes: ['hear', 'apart', 'world'], certa: 1, traducao: 'Heart rima com apart.' },
    { frase: 'Way rhymes with ___.', opcoes: ['world', 'fire', 'say'], certa: 2, traducao: 'Way rima com say.' },
    { frase: 'Night rhymes with ___.', opcoes: ['light', 'day', 'heart'], certa: 0, traducao: 'Night rima com light.' },
    { frase: 'You rhymes with ___.', opcoes: ['me', 'blue', 'way'], certa: 1, traducao: 'You rima com blue.' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Your fire am I?', 'I am your fire?', 'Am I your fire?'], certa: 2, traducao: 'Eu sou o seu fogo?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Is the song popular?', 'The song popular is?', 'Popular is the song?'], certa: 0, traducao: 'A música é popular?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['They are from Orlando?', 'Are they from Orlando?', 'Are from they Orlando?'], certa: 1, traducao: 'Eles são de Orlando?' },
    { instrucao: 'How do we make questions with the verb to be?', frase: '___', opcoes: ['subject + verb to be + complement', 'complement + subject + verb to be', 'verb to be + subject + complement'], certa: 2, traducao: 'Verbo to be + sujeito + complemento.' },
    { frase: 'My favourite music is from the ___. (anos 90)', opcoes: ['nineties', 'ninety', 'nineteens'], certa: 0, traducao: 'A minha música favorita é dos anos 90.' },
    { frase: 'A group of singers is a ___.', opcoes: ['song', 'band', 'stage'], certa: 1, traducao: 'Um grupo de cantores é uma banda.' },
    { frase: 'A band with only young men is a ___ band.', opcoes: ['girl', 'rock', 'boy'], certa: 2, traducao: 'Uma banda só de rapazes é uma boy band.' },
    { frase: 'The Backstreet Boys are an ___ boy band.', opcoes: ['American', 'British', 'Irish'], certa: 0, traducao: 'Os Backstreet Boys são uma boy band americana.' },
    { frase: 'The Beatles are a ___ band.', opcoes: ['American', 'British', 'Brazilian'], certa: 1, traducao: 'Os Beatles são uma banda britânica.' },
    { frase: 'BTS are a ___ band.', opcoes: ['Japanese', 'Chinese', 'South Korean'], certa: 2, traducao: 'O BTS é uma banda sul-coreana.' }
  ]
});
</script>
