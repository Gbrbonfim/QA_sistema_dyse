/* A2 BLACK · Class 02 · Fala (I Want It That Way - Backstreet Boys)

  course: 'ativ-a2-black', aula: 2, num: 7, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',

    { frase: 'My favourite band is Coldplay.', dica: 0, traducao: 'A minha banda favorita é o Coldplay.' },
    { frase: 'They are from London.', dica: 0, traducao: 'Eles são de Londres.' },
    { frase: 'The song is very beautiful.', dica: 0, traducao: 'A música é muito bonita.' },
    { frase: 'My favourite singer is Adele.', dica: 0, traducao: 'A minha cantora favorita é a Adele.' },
    { frase: 'She is from London, too.', dica: 0, traducao: 'Ela também é de Londres.' },
    { frase: 'The Backstreet Boys are an American boy band.', dica: 0, traducao: 'Os Backstreet Boys são uma boy band americana.' },
    { frase: 'They are from Orlando, Florida.', dica: 0, traducao: 'Eles são de Orlando, na Flórida.' },
    { frase: 'Nick Carter is the youngest.', dica: 0, traducao: 'O Nick Carter é o mais novo.' },
    { frase: 'The Beatles are from Liverpool.', dica: 0, traducao: 'Os Beatles são de Liverpool.' },
    { frase: 'Shakira is from Colombia.', dica: 0, traducao: 'A Shakira é da Colômbia.' },
    { frase: 'Bruno Mars is from Hawaii.', dica: 0, traducao: 'O Bruno Mars é do Havaí.' },
    { frase: 'BTS are from South Korea.', dica: 0, traducao: 'O BTS é da Coreia do Sul.' },
    { frase: "I'm a big fan of pop music.", dica: 0, traducao: 'Sou muito fã de música pop.' },
    { frase: "They aren't from the USA.", dica: 0, traducao: 'Eles não são dos Estados Unidos.' },
    { frase: "She isn't British. She's American.", dica: 0, traducao: 'Ela não é britânica. É americana.' },
    { frase: 'Is your favourite singer Brazilian?', dica: 0, traducao: 'O seu cantor favorito é brasileiro?' },
    { frase: 'Are they a famous band?', dica: 0, traducao: 'Eles são uma banda famosa?' },
    { frase: 'Am I late for the concert?', dica: 0, traducao: 'Estou atrasado para o show?' },
    { frase: 'This song is still very popular.', dica: 0, traducao: 'Esta música ainda é muito popular.' },
    { frase: 'My favourite music is from the nineties.', dica: 0, traducao: 'A minha música favorita é dos anos noventa.' }
  ]
});
