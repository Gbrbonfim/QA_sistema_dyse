<title>DYSE · A2 · Aula 3 · Dream bedrooms</title>
<meta name="robots" content="noindex">

<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 · Class 03 · Escrita (Famous Bedrooms)
   Alinhado ao slide "Reading" — descrever quartos (cores, móveis, pillows, blanket, shelves,
   cupboard, balcony, platform, small and dusty, not a typical bedroom) com be / have / has.
   Conteúdo NOVO. A isca é a forma errada (is x are, has x have...). 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 3, num: 2, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('O quarto dela é rosa e roxo.'), palavras: ['Her', 'bedroom', 'is', 'pink', 'and', 'purple'], isca: ['She'], fim: '.', traducao: 'O quarto dela é rosa e roxo.' },
    { contexto: M('A cama fica numa plataforma.'), palavras: ['The', 'bed', 'is', 'on', 'a', 'platform'], isca: ['are'], fim: '.', traducao: 'A cama fica numa plataforma.' },
    { contexto: M('O quarto tem uma varanda.'), palavras: ['The', 'bedroom', 'has', 'a', 'balcony'], isca: ['have'], fim: '.', traducao: 'O quarto tem uma varanda.' },
    { contexto: M('Os travesseiros são de cores vivas.'), palavras: ['The', 'pillows', 'are', 'bright'], isca: ['is'], fim: '.', traducao: 'Os travesseiros são de cores vivas.' },
    { contexto: M('O meu quarto é pequeno, mas confortável.'), palavras: ['My', 'bedroom', 'is', 'small,', 'but', 'comfortable'], isca: ['I'], fim: '.', traducao: 'O meu quarto é pequeno, mas confortável.' },
    { contexto: M('As paredes têm muitos pôsteres.'), palavras: ['The', 'walls', 'have', 'a', 'lot', 'of', 'posters'], isca: ['has'], fim: '.', traducao: 'As paredes têm muitos pôsteres.' },
    { contexto: M('Os livros dele estão nas prateleiras.'), palavras: ['His', 'books', 'are', 'on', 'the', 'shelves'], isca: ['is'], fim: '.', traducao: 'Os livros dele estão nas prateleiras.' },
    { contexto: M('A minha escrivaninha é branca e moderna.'), palavras: ['My', 'desk', 'is', 'white', 'and', 'modern'], isca: ['are'], fim: '.', traducao: 'A minha escrivaninha é branca e moderna.' },
    { contexto: M('O quarto do Harry era pequeno e empoeirado.'), palavras: ["Harry's", 'room', 'was', 'small', 'and', 'dusty'], isca: ['were'], fim: '.', traducao: 'O quarto do Harry era pequeno e empoeirado.' },
    { contexto: M('O sofá do meu quarto é laranja.'), palavras: ['The', 'sofa', 'in', 'my', 'bedroom', 'is', 'orange'], isca: ['are'], fim: '.', traducao: 'O sofá do meu quarto é laranja.' },
    { contexto: M('O espelho é muito grande.'), palavras: ['The', 'mirror', 'is', 'very', 'big'], isca: ['are'], fim: '.', traducao: 'O espelho é muito grande.' },
    { contexto: M('Eu tenho dois abajures no meu quarto.'), palavras: ['I', 'have', 'two', 'lamps', 'in', 'my', 'bedroom'], isca: ['has'], fim: '.', traducao: 'Eu tenho dois abajures no meu quarto.' },
    { contexto: M('O cobertor é azul e quente.'), palavras: ['The', 'blanket', 'is', 'blue', 'and', 'warm'], isca: ['are'], fim: '.', traducao: 'O cobertor é azul e quente.' },
    { contexto: M('O armário dela está cheio de roupas.'), palavras: ['Her', 'cupboard', 'is', 'full', 'of', 'clothes'], isca: ['She'], fim: '.', traducao: 'O armário dela está cheio de roupas.' },
    { contexto: M('O quarto do meu irmão é muito legal.'), palavras: ['My', "brother's", 'bedroom', 'is', 'very', 'cool'], isca: ['brother'], fim: '.', traducao: 'O quarto do meu irmão é muito legal.' },
    { contexto: M('Você gosta do seu quarto?'), palavras: ['Do', 'you', 'like', 'your', 'bedroom'], isca: ['Are'], fim: '?', traducao: 'Você gosta do seu quarto?' },
    { contexto: M('De qual quarto você gosta?'), palavras: ['Which', 'bedroom', 'do', 'you', 'like'], isca: ['are'], fim: '?', traducao: 'De qual quarto você gosta?' },
    { contexto: M('O meu quarto tem uma janela grande.'), palavras: ['My', 'bedroom', 'has', 'a', 'big', 'window'], isca: ['have'], fim: '.', traducao: 'O meu quarto tem uma janela grande.' },
    { contexto: M('Os travesseiros e o cobertor estão na cama.'), palavras: ['The', 'pillows', 'and', 'the', 'blanket', 'are', 'on', 'the', 'bed'], isca: ['is'], fim: '.', traducao: 'Os travesseiros e o cobertor estão na cama.' },
    { contexto: M('Não é um quarto típico.'), palavras: ['It', "isn't", 'a', 'typical', 'bedroom'], isca: ["aren't"], fim: '.', traducao: 'Não é um quarto típico.' }
  ]
});
</script>
</body>
</html>
