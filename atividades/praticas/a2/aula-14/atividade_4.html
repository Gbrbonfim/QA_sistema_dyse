<script>
/* A2 · Class 14 · Fala (Exams Be Like)
   Alinhado ao slide "Speaking: interview your partner" (at work, at school / university, at
   home) — perguntas e respostas com can / can't e as expressões "I have no idea how to..." e
   "There's no way I can...". Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 14, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Can you have a break when you want to?', dica: 0, traducao: 'Você pode fazer uma pausa quando quer?' },
    { frase: 'Sure! I can have a break in the afternoon.', dica: 0, traducao: 'Claro! Posso fazer uma pausa à tarde.' },
    { frase: 'Can you use your personal phone at work?', dica: 0, traducao: 'Você pode usar o seu celular no trabalho?' },
    { frase: "No, I can't use it at work.", dica: 0, traducao: 'Não, não posso usá-lo no trabalho.' },
    { frase: 'Can you work flexible hours?', dica: 0, traducao: 'Você pode trabalhar em horário flexível?' },
    { frase: 'Can you speak any other languages?', dica: 0, traducao: 'Você fala outras línguas?' },
    { frase: 'I can speak Portuguese and a little Spanish.', dica: 0, traducao: 'Falo português e um pouco de espanhol.' },
    { frase: 'Can you ask the teacher for help?', dica: 0, traducao: 'Você pode pedir ajuda ao professor?' },
    { frase: 'Can you use a calculator in your exams?', dica: 0, traducao: 'Você pode usar calculadora nas provas?' },
    { frase: 'Can you give presentations in English?', dica: 0, traducao: 'Você consegue fazer apresentações em inglês?' },
    { frase: 'Can you make dinner for your family?', dica: 0, traducao: 'Você consegue fazer o jantar para a sua família?' },
    { frase: "I can cook pasta, but I can't make cakes.", dica: 0, traducao: 'Sei fazer macarrão, mas não sei fazer bolo.' },
    { frase: 'Can you do all the housework without help?', dica: 0, traducao: 'Você consegue fazer todas as tarefas da casa sem ajuda?' },
    { frase: 'Can you lend me a pen, please?', dica: 0, traducao: 'Você pode me emprestar uma caneta, por favor?' },
    { frase: 'Can we start the exam now?', dica: 0, traducao: 'Podemos começar a prova agora?' },
    { frase: 'I have no idea how to use this formula.', dica: 0, traducao: 'Não faço ideia de como usar esta fórmula.' },
    { frase: "There's no way I can finish it in five minutes.", dica: 0, traducao: 'Não tem como eu terminar em cinco minutos.' },
    { frase: "I'm good at history, but I'm bad at math.", dica: 0, traducao: 'Sou bom em história, mas ruim em matemática.' },
    { frase: 'My favorite school subject is biology.', dica: 0, traducao: 'A minha matéria favorita é biologia.' },
    { frase: 'I go to bed early the night before an exam.', dica: 0, traducao: 'Vou dormir cedo na noite antes de uma prova.' }
  ]
});
</script>
