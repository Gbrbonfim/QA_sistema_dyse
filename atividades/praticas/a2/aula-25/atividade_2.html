<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · A2 · Aula 25 · I was walking when...</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 · Class 25 · Escrita (A Childhood Story)
   Alinhado ao "Grammar Point" — past continuous (was/were + -ing), negativa (wasn't /
   weren't), perguntas (Was she...? What were you doing...?), ação interrompida com when /
   while, e "Time Sequencers" (then, after that, the next day, years later). Conteúdo NOVO.
   A isca é a forma errada. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 25, num: 2, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('Eu estava dormindo às dez horas.'), palavras: ['I', 'was', 'sleeping', 'at', 'ten', "o'clock"], isca: ['were'], fim: '.', traducao: 'Eu estava dormindo às dez horas.' },
    { contexto: M('Eles estavam limpando a praia.'), palavras: ['They', 'were', 'cleaning', 'the', 'beach'], isca: ['was'], fim: '.', traducao: 'Eles estavam limpando a praia.' },
    { contexto: M('O sol estava brilhando.'), palavras: ['The', 'sun', 'was', 'shining'], isca: ['shine'], fim: '.', traducao: 'O sol estava brilhando.' },
    { contexto: M('Os pássaros estavam cantando.'), palavras: ['The', 'birds', 'were', 'singing'], isca: ['sing'], fim: '.', traducao: 'Os pássaros estavam cantando.' },
    { contexto: M('Ela não estava estudando.'), palavras: ['She', "wasn't", 'studying'], isca: ["weren't"], fim: '.', traducao: 'Ela não estava estudando.' },
    { contexto: M('Nós não estávamos conversando.'), palavras: ['We', "weren't", 'talking'], isca: ["wasn't"], fim: '.', traducao: 'Nós não estávamos conversando.' },
    { contexto: M('Ela estava dormindo?'), palavras: ['Was', 'she', 'sleeping'], isca: ['Did'], fim: '?', traducao: 'Ela estava dormindo?' },
    { contexto: M('O que você estava fazendo às nove da noite?'), palavras: ['What', 'were', 'you', 'doing', 'at', '9', 'p.m.'], isca: ['did'], fim: '?', traducao: 'O que você estava fazendo às 21h?' },
    { contexto: M('Estava chovendo quando você acordou?'), palavras: ['Was', 'it', 'raining', 'when', 'you', 'woke', 'up'], isca: ['Did'], fim: '?', traducao: 'Estava chovendo quando você acordou?' },
    { contexto: M('Eles estavam cavando na areia quando viram a garrafa.'), palavras: ['They', 'were', 'digging', 'in', 'the', 'sand', 'when', 'they', 'saw', 'the', 'bottle'], isca: ['seeing'], fim: '.', traducao: 'Eles estavam cavando na areia quando viram a garrafa.' },
    { contexto: M('Eu estava andando na praia quando encontrei uma concha.'), palavras: ['I', 'was', 'walking', 'on', 'the', 'beach', 'when', 'I', 'found', 'a', 'shell'], isca: ['finding'], fim: '.', traducao: 'Eu estava andando na praia quando encontrei uma concha.' },
    { contexto: M('O telefone tocou enquanto ela estava cozinhando.'), palavras: ['The', 'phone', 'rang', 'while', 'she', 'was', 'cooking'], isca: ['ringing'], fim: '.', traducao: 'O telefone tocou enquanto ela estava cozinhando.' },
    { contexto: M('Enquanto nós estávamos nadando, começou a chover.'), palavras: ['While', 'we', 'were', 'swimming,', 'it', 'started', 'to', 'rain'], isca: ['was'], fim: '.', traducao: 'Enquanto estávamos nadando, começou a chover.' },
    { contexto: M('Ele não estava procurando a garrafa.'), palavras: ['He', "wasn't", 'looking', 'for', 'the', 'bottle'], isca: ["didn't"], fim: '.', traducao: 'Ele não estava procurando a garrafa.' },
    { contexto: M('Eu escrevi a carta. Depois, coloquei dentro da garrafa.'), palavras: ['I', 'wrote', 'the', 'letter.', 'Then,', 'I', 'put', 'it', 'in', 'the', 'bottle'], isca: ['After'], fim: '.', traducao: 'Escrevi a carta. Depois, coloquei na garrafa.' },
    { contexto: M('Depois disso, nós a jogamos no rio.'), palavras: ['After', 'that,', 'we', 'threw', 'it', 'into', 'the', 'river'], isca: ['throwed'], fim: '.', traducao: 'Depois disso, jogamos no rio.' },
    { contexto: M('No dia seguinte, nós nos esquecemos dela.'), palavras: ['The', 'next', 'day,', 'we', 'forgot', 'about', 'it'], isca: ['forgetted'], fim: '.', traducao: 'No dia seguinte, nos esquecemos dela.' },
    { contexto: M('Anos depois, um homem encontrou a garrafa.'), palavras: ['Years', 'later,', 'a', 'man', 'found', 'the', 'bottle'], isca: ['ago,'], fim: '.', traducao: 'Anos depois, um homem encontrou a garrafa.' },
    { contexto: M('Ele nunca pensou nela de novo.'), palavras: ['He', 'never', 'thought', 'about', 'it', 'again'], isca: ['thinked'], fim: '.', traducao: 'Ele nunca mais pensou nela.' },
    { contexto: M('A garrafa estava boiando devagar na água.'), palavras: ['The', 'bottle', 'was', 'floating', 'slowly', 'in', 'the', 'water'], isca: ['were'], fim: '.', traducao: 'A garrafa estava boiando devagar na água.' }
  ]
});
</script>
</body>
</html>
