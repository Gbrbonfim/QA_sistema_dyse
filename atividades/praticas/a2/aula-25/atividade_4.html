/* A2 · Class 25 · Fala (A Childhood Story)
   Alinhado ao "Grammar Point - Answer the questions" (What were you doing at 8 p.m.
   yesterday? Were you studying English last night? Was it raining when you woke up?) e aos
   time sequencers da história. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 25, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'At eight yesterday, I was having dinner.', dica: 0, traducao: 'Às oito ontem, eu estava jantando.' },
    { frase: 'I was studying English last night.', dica: 0, traducao: 'Eu estava estudando inglês ontem à noite.' },
    { frase: 'It was raining when I woke up.', dica: 0, traducao: 'Estava chovendo quando acordei.' },
    { frase: 'My parents were watching TV.', dica: 0, traducao: 'Os meus pais estavam vendo TV.' },
    { frase: "I wasn't doing my homework.", dica: 0, traducao: 'Eu não estava fazendo a lição de casa.' },
    { frase: "We weren't sleeping.", dica: 0, traducao: 'Nós não estávamos dormindo.' },
    { frase: 'What were you doing at nine?', dica: 0, traducao: 'O que você estava fazendo às nove?' },
    { frase: 'Was she working yesterday?', dica: 0, traducao: 'Ela estava trabalhando ontem?' },
    { frase: 'Were they playing in the park?', dica: 0, traducao: 'Eles estavam brincando no parque?' },
    { frase: 'I was walking home when I saw my friend.', dica: 0, traducao: 'Eu estava indo a pé para casa quando vi o meu amigo.' },
    { frase: 'She was cooking when the phone rang.', dica: 0, traducao: 'Ela estava cozinhando quando o telefone tocou.' },
    { frase: 'While we were swimming, it started to rain.', dica: 0, traducao: 'Enquanto nadávamos, começou a chover.' },
    { frase: 'The sun was shining and the birds were singing.', dica: 0, traducao: 'O sol estava brilhando e os pássaros estavam cantando.' },
    { frase: 'When I was ten, I wrote a letter.', dica: 0, traducao: 'Quando eu tinha dez anos, escrevi uma carta.' },
    { frase: 'Then I put it in a bottle.', dica: 0, traducao: 'Depois, coloquei numa garrafa.' },
    { frase: 'After that, I threw it into the sea.', dica: 0, traducao: 'Depois disso, joguei no mar.' },
    { frase: 'The next day, I forgot about it.', dica: 0, traducao: 'No dia seguinte, esqueci dela.' },
    { frase: 'Years later, a woman found it.', dica: 0, traducao: 'Anos depois, uma mulher a encontrou.' },
    { frase: 'She was cleaning the beach.', dica: 0, traducao: 'Ela estava limpando a praia.' },
    { frase: 'I never thought about it again.', dica: 0, traducao: 'Nunca mais pensei nela.' }
  ]
});
</script>
