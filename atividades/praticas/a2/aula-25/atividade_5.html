<script>
/* A2 · Class 25 · Gramática (A Childhood Story)
   Alinhado ao "Grammar Point" (past continuous: was/were + -ing, negativa, perguntas,
   interrompida pelo past simple com when/while, cena de fundo) e ao "Vocabulary: Time
   Sequencers" (when, while, then, after that — nunca só "after" —, the next day, years later,
   again, two years before). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 25, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'The children ___ a message near the river.', opcoes: ['were writing', 'was writing', 'were write'], certa: 0, traducao: 'As crianças estavam escrevendo uma mensagem perto do rio.' },
    { frase: 'At that moment, the bottle ___ slowly in the water.', opcoes: ['were floating', 'was floating', 'floating'], certa: 1, traducao: 'Naquele momento, a garrafa estava boiando devagar na água.' },
    { frase: 'She ___ for the bottle. She found it by accident.', opcoes: ["weren't looking", "didn't looking", "wasn't looking"], certa: 2, traducao: 'Ela não estava procurando a garrafa. Achou por acaso.' },
    { frase: 'They ___ in the river when the bottle went away.', opcoes: ["weren't swimming", "wasn't swimming", "not swimming"], certa: 0, traducao: 'Eles não estavam nadando no rio quando a garrafa foi embora.' },
    { frase: '___ she reading the message when you arrived?', opcoes: ['Were', 'Was', 'Did'], certa: 1, traducao: 'Ela estava lendo a mensagem quando você chegou?' },
    { frase: '___ you looking for the bottle when you saw it?', opcoes: ['Was', 'Did', 'Were'], certa: 2, traducao: 'Você estava procurando a garrafa quando a viu?' },
    { frase: 'What ___ you doing at 8 p.m. yesterday?', opcoes: ['were', 'did', 'was'], certa: 0, traducao: 'O que você estava fazendo às 20h ontem?' },
    { frase: 'Were you studying last night? No, I ___.', opcoes: ["weren't", "wasn't", "didn't"], certa: 1, traducao: 'Você estava estudando ontem à noite? Não.' },
    { frase: 'The man was walking on the beach when he ___ the bottle.', opcoes: ['was seeing', 'sees', 'saw'], certa: 2, traducao: 'O homem estava andando na praia quando viu a garrafa.' },
    { frase: 'I was taking a shower when the phone ___.', opcoes: ['rang', 'was ringing', 'ring'], certa: 0, traducao: 'Eu estava tomando banho quando o telefone tocou.' },
    { frase: 'We ___ dinner when the lights went out.', opcoes: ['had', 'were having', 'have'], certa: 1, traducao: 'Estávamos jantando quando a luz acabou.' },
    { frase: 'It ___ when I woke up this morning.', opcoes: ['rains', 'were raining', 'was raining'], certa: 2, traducao: 'Estava chovendo quando acordei hoje de manhã.' },
    { frase: 'The past continuous is was / were + verb + ___.', opcoes: ['-ing', '-ed', '-s'], certa: 0, traducao: 'O past continuous é was / were + verbo + -ing.' },
    { frase: 'We use the past continuous for an action in ___ at a moment in the past.', opcoes: ['the future', 'progress', 'the present'], certa: 1, traducao: 'Usamos o past continuous para uma ação em andamento num momento do passado.' },
    { frase: 'I was cooking ___ my friend called.', opcoes: ['while', 'then', 'when'], certa: 2, traducao: 'Eu estava cozinhando quando o meu amigo ligou.' },
    { frase: 'My friend called ___ I was cooking.', opcoes: ['while', 'then', 'after that'], certa: 0, traducao: 'O meu amigo ligou enquanto eu estava cozinhando.' },
    { frase: 'I wrote the letter. ___, I put it in the bottle.', opcoes: ['After', 'Then', 'While'], certa: 1, traducao: 'Escrevi a carta. Depois, coloquei na garrafa.' },
    { frase: 'We threw the bottle into the river. ___, we went home.', opcoes: ['While', 'When', 'After that'], certa: 2, traducao: 'Jogamos a garrafa no rio. Depois disso, fomos para casa.' },
    { frase: 'They threw the bottle on Monday. ___, on Tuesday, they forgot about it.', opcoes: ['The next day', 'Years before', 'While'], certa: 0, traducao: 'Eles jogaram a garrafa na segunda. No dia seguinte, na terça, esqueceram dela.' },
    { frase: 'They wrote the note in 1995. Twenty-seven years ___, a man found it.', opcoes: ['ago', 'later', 'before'], certa: 1, traducao: 'Escreveram o bilhete em 1995. Vinte e sete anos depois, um homem o encontrou.' },
    { frase: "He didn't think about the bottle ___. He forgot about it.", opcoes: ['then', 'when', 'again'], certa: 2, traducao: 'Ele não pensou mais na garrafa. Esqueceu dela.' },
    { frase: 'The bottle only traveled two ___ from the original place.', opcoes: ['miles', 'days', 'years'], certa: 0, traducao: 'A garrafa viajou só duas milhas do lugar original.' },
    { frase: 'Terry found Brian ___ Facebook.', opcoes: ['in', 'on', 'at'], certa: 1, traducao: 'O Terry encontrou o Brian no Facebook.' },
    { frase: 'The sun ___ and the birds were singing.', opcoes: ['were shining', 'shining', 'was shining'], certa: 2, traducao: 'O sol estava brilhando e os pássaros estavam cantando.' }
  ]
});
</script>
