<script>
/* A2 · Class 26 · Gramática (Photos That Tell Stories)
   Alinhado ao "Grammar Point: Past Simple x Past Continuous" (ação longa x curta; when x
   while), à leitura (Bangkok, o Jubileu da Rainha Elizabeth II, Londres, Paraty) e às palavras
   de ligação do "Describing a photo" (because, but, how, always, on, in). Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 26, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I ___ on the beach when I saw a beautiful sunset.', opcoes: ['was walking', 'walked', 'walking'], certa: 0, traducao: 'Eu estava andando na praia quando vi um pôr do sol lindo.' },
    { frase: 'While my brother was taking a picture of me, a dog ___ into the shot.', opcoes: ['was running', 'ran', 'runned'], certa: 1, traducao: 'Enquanto o meu irmão tirava uma foto minha, um cachorro entrou correndo na foto.' },
    { frase: 'We found a funny picture while we ___ at some old photos.', opcoes: ['looked', 'was looking', 'were looking'], certa: 2, traducao: 'Achamos uma foto engraçada enquanto olhávamos umas fotos antigas.' },
    { frase: 'She was smiling for the camera when the wind ___ her hat away.', opcoes: ['blew', 'was blowing', 'blowed'], certa: 0, traducao: 'Ela estava sorrindo para a câmera quando o vento levou o chapéu dela.' },
    { frase: 'They ___ photos on the beach when it started to rain.', opcoes: ['took', 'were taking', 'was taking'], certa: 1, traducao: 'Eles estavam tirando fotos na praia quando começou a chover.' },
    { frase: 'While we were trying to take a group photo, someone ___, "Say cheese!"', opcoes: ['was shouting', 'shout', 'shouted'], certa: 2, traducao: 'Enquanto tentávamos tirar uma foto em grupo, alguém gritou: "Digam xis!"' },
    { frase: 'I was taking a photo of the beach ___ a man walked past with his dog.', opcoes: ['when', 'while', 'then'], certa: 0, traducao: 'Eu estava tirando uma foto da praia quando um homem passou com o cachorro.' },
    { frase: '___ they were exploring the old town, they found a beautiful mural.', opcoes: ['Then', 'While', 'After that'], certa: 1, traducao: 'Enquanto exploravam o centro histórico, encontraram um mural lindo.' },
    { frase: '___ I was taking pictures, my friend was drawing the landscape.', opcoes: ['Then', 'After that', 'While'], certa: 2, traducao: 'Enquanto eu tirava fotos, o meu amigo desenhava a paisagem.' },
    { frase: 'The kids were playing on the beach ___ I took their picture.', opcoes: ['when', 'while', 'then'], certa: 0, traducao: 'As crianças estavam brincando na praia quando tirei a foto delas.' },
    { frase: 'We use "when" with the past simple for the action that ___ the longer action.', opcoes: ['continues', 'interrupts', 'repeats'], certa: 1, traducao: 'Usamos "when" com o past simple para a ação que interrompe a ação mais longa.' },
    { frase: 'In "I was reading when he called", the longer action is ___.', opcoes: ['called', 'he called', 'was reading'], certa: 2, traducao: 'Em "I was reading when he called", a ação mais longa é "was reading".' },
    { frase: 'The photographer was walking in London when he ___ a couple saying goodbye.', opcoes: ['saw', 'was seeing', 'sees'], certa: 0, traducao: 'O fotógrafo estava andando em Londres quando viu um casal se despedindo.' },
    { frase: 'In Bangkok, some participants ___ rock-paper-scissors when he took the photo.', opcoes: ['played', 'were playing', 'was playing'], certa: 1, traducao: 'Em Bangkok, alguns participantes estavam jogando pedra-papel-tesoura quando ele tirou a foto.' },
    { frase: 'In 2022, people ___ Queen Elizabeth II\'s 70 years as queen.', opcoes: ['was celebrating', 'celebrate', 'were celebrating'], certa: 2, traducao: 'Em 2022, as pessoas estavam comemorando os 70 anos da Rainha Elizabeth II no trono.' },
    { frase: 'Paraty is a small colonial town in the state of ___.', opcoes: ['Rio de Janeiro', 'Bahia', 'Minas Gerais'], certa: 0, traducao: 'Paraty é uma pequena cidade colonial no estado do Rio de Janeiro.' },
    { frase: 'My brother took the photo when we were ___ a hiking trip.', opcoes: ['in', 'on', 'at'], certa: 1, traducao: 'O meu irmão tirou a foto quando estávamos numa trilha.' },
    { frase: 'We stayed in a small cabin ___ Switzerland.', opcoes: ['on', 'at', 'in'], certa: 2, traducao: 'Ficamos numa cabana pequena na Suíça.' },
    { frase: 'It was very cold, ___ the view was beautiful.', opcoes: ['but', 'because', 'how'], certa: 0, traducao: 'Estava muito frio, mas a vista era linda.' },
    { frase: 'I love sunrises ___ they are calm and colorful.', opcoes: ['but', 'because', 'always'], certa: 1, traducao: 'Amo o nascer do sol porque é calmo e colorido.' },
    { frase: 'The photo reminds me of ___ beautiful nature can be.', opcoes: ['what', 'because', 'how'], certa: 2, traducao: 'A foto me lembra como a natureza pode ser linda.' },
    { frase: 'It ___ makes me smile when I see it.', opcoes: ['always', 'how', 'but'], certa: 0, traducao: 'Ela sempre me faz sorrir quando a vejo.' },
    { frase: 'A photo of yourself, taken by you, is a ___.', opcoes: ['sunset', 'selfie', 'mural'], certa: 1, traducao: 'Uma foto de você mesmo, tirada por você, é uma selfie.' },
    { frase: '___ were you doing when you took this photo?', opcoes: ['Who', 'Where', 'What'], certa: 2, traducao: 'O que você estava fazendo quando tirou esta foto?' }
  ]
});
</script>
