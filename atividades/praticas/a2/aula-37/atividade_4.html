  course: 'ativ-a2', aula: 37, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [

    { frase: 'I have a smartwatch.', dica: 0, traducao: 'Tenho um smartwatch.' },

    { frase: 'A smart fridge is very expensive.', dica: 0, traducao: 'Uma geladeira inteligente é muito cara.' },
    { frase: 'I ask my voice assistant to play music.', dica: 0, traducao: 'Peço ao meu assistente de voz para tocar música.' },
    { frase: 'My smartwatch checks my steps.', dica: 0, traducao: 'O meu smartwatch conta os meus passos.' },
    { frase: 'Smart homes save time.', dica: 0, traducao: 'Casas inteligentes economizam tempo.' },
    { frase: 'People use the internet everywhere.', dica: 0, traducao: 'As pessoas usam a internet em todo lugar.' },
    { frase: 'I bought a laptop. The laptop is very fast.', dica: 0, traducao: 'Comprei um notebook. O notebook é muito rápido.' },
    { frase: 'I usually work at home.', dica: 0, traducao: 'Geralmente trabalho em casa.' },
    { frase: 'I go to work by bus.', dica: 0, traducao: 'Vou para o trabalho de ônibus.' },
    { frase: 'We had a meeting on Zoom.', dica: 0, traducao: 'Tivemos uma reunião no Zoom.' },

    { frase: 'The update is ready.', dica: 0, traducao: 'A atualização está pronta.' },
    { frase: 'The email is from my boss.', dica: 0, traducao: 'O e-mail é do meu chefe.' },
    { frase: 'The Wi-Fi stopped working.', dica: 0, traducao: 'O Wi-Fi parou de funcionar.' },
    { frase: 'I think smart homes are a good idea.', dica: 0, traducao: 'Acho que casas inteligentes são uma boa ideia.' }
  ]
