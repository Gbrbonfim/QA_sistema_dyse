<script>
/* A2 · Class 06 · Fala (How do you feel? What do you eat?)
   Alinhado ao slide "Speaking: A: I'm stressed... B: Don't be stressed. Let's study together!"
   — dizer como se sente e responder com imperativos (Be / Don't) e sugestões (Let's / Let's
   not). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 6, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "I'm stressed because I have a lot of work.", dica: 0, traducao: 'Estou estressada porque tenho muito trabalho.' },
    { frase: "Don't be stressed. I can help you.", dica: 0, traducao: 'Não fique estressada. Posso te ajudar.' },
    { frase: "I'm bored. There's nothing to do.", dica: 0, traducao: 'Estou entediada. Não há nada para fazer.' },
    { frase: "Let's go to the movies!", dica: 0, traducao: 'Vamos ao cinema!' },
    { frase: "I'm worried about my English test.", dica: 0, traducao: 'Estou preocupada com a minha prova de inglês.' },
    { frase: "Don't worry. You're a great student!", dica: 0, traducao: 'Não se preocupe. Você é uma ótima aluna!' },
    { frase: "I'm really hungry.", dica: 0, traducao: 'Estou com muita fome.' },
    { frase: "Let's make some pasta.", dica: 0, traducao: 'Vamos fazer um macarrão.' },
    { frase: "I'm excited about my trip to Chile!", dica: 0, traducao: 'Estou animada com a minha viagem ao Chile!' },
    { frase: "I'm disappointed with my new phone.", dica: 0, traducao: 'Estou decepcionada com o meu celular novo.' },
    { frase: "I'm angry with my brother.", dica: 0, traducao: 'Estou brava com o meu irmão.' },
    { frase: "Don't be angry. Talk to him.", dica: 0, traducao: 'Não fique brava. Fale com ele.' },
    { frase: 'Be positive!', dica: 0, traducao: 'Seja positiva!' },
    { frase: 'Close the door, please.', dica: 0, traducao: 'Feche a porta, por favor.' },
    { frase: "Don't forget your keys!", dica: 0, traducao: 'Não esqueça as suas chaves!' },
    { frase: "Let's not eat cake today.", dica: 0, traducao: 'Não vamos comer bolo hoje.' },
    { frase: 'When I feel anxious, I eat sweets.', dica: 0, traducao: 'Quando fico ansiosa, como doces.' },
    { frase: 'I usually eat popcorn when I watch a movie.', dica: 0, traducao: 'Normalmente como pipoca quando assisto a um filme.' },
    { frase: 'Am I really hungry?', dica: 0, traducao: 'Eu estou realmente com fome?' },
    { frase: "It's Friday night and I'm relaxed.", dica: 0, traducao: 'É sexta à noite e estou relaxada.' }
  ]
});
</script>
