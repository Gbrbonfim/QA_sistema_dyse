/* A2 · Class 16 · Fala (Holidays in Spain)
   Alinhado aos slides "Talking Point" e "Speaking: complete the questions and interview your
   partner" — perguntas e respostas sobre férias com present simple (usually) e present
   continuous (right now, this week, this summer). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 16, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Where do you usually go on holiday?', dica: 0, traducao: 'Para onde você normalmente vai nas férias?' },
    { frase: 'I usually go to the beach with my family.', dica: 0, traducao: 'Normalmente vou à praia com a minha família.' },
    { frase: 'What activities do you do during your holidays?', dica: 0, traducao: 'Que atividades você faz nas férias?' },
    { frase: 'I go hiking and I try local food.', dica: 0, traducao: 'Faço trilha e experimento a comida local.' },
    { frase: 'Are you planning a holiday right now?', dica: 0, traducao: 'Você está planejando uma viagem agora?' },
    { frase: "Yes, I'm planning a trip to Chile.", dica: 0, traducao: 'Sim, estou planejando uma viagem ao Chile.' },
    { frase: 'What kind of place do you prefer to stay in?', dica: 0, traducao: 'Que tipo de lugar você prefere para se hospedar?' },
    { frase: 'I prefer to stay in small hotels.', dica: 0, traducao: 'Prefiro ficar em hotéis pequenos.' },
    { frase: 'Do you like to try local food when you travel?', dica: 0, traducao: 'Você gosta de experimentar a comida local quando viaja?' },
    { frase: 'I pack my bags a week before the trip.', dica: 0, traducao: 'Faço as malas uma semana antes da viagem.' },
    { frase: 'I prefer to go by plane.', dica: 0, traducao: 'Prefiro ir de avião.' },
    { frase: 'I usually wear comfortable clothes when I travel.', dica: 0, traducao: 'Normalmente uso roupas confortáveis quando viajo.' },
    { frase: 'I love going sightseeing in big cities.', dica: 0, traducao: 'Adoro fazer turismo em cidades grandes.' },
    { frase: 'I never buy souvenirs. I save money.', dica: 0, traducao: 'Nunca compro lembrancinhas. Economizo dinheiro.' },
    { frase: 'What are you doing at work this week?', dica: 0, traducao: 'O que você está fazendo no trabalho esta semana?' },
    { frase: "I'm working on a new project this week.", dica: 0, traducao: 'Estou trabalhando num projeto novo esta semana.' },
    { frase: 'Are you watching any TV shows right now?', dica: 0, traducao: 'Você está assistindo a alguma série agora?' },
    { frase: "I'm reading a great book at the moment.", dica: 0, traducao: 'Estou lendo um livro ótimo no momento.' },
    { frase: 'I normally use this computer, but today I\'m using my laptop.', dica: 0, traducao: 'Normalmente uso este computador, mas hoje estou usando o meu notebook.' },
    { frase: "We usually stay at home, but this summer we're going to Spain.", dica: 0, traducao: 'Normalmente ficamos em casa, mas neste verão vamos para a Espanha.' }
  ]
});
</script>
