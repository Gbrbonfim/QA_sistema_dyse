/* A2 · Class 43 · Fala (Review Classes 34-43)
   Alinhado ao "Talking Point" da revisão: lugares famosos com superlativos; o que vai fazer
   no próximo fim de semana / mês / ano; um sonho, algo que quer aprender, algo que gostaria
   de fazer hoje; tecnologia do dia a dia; pedido educado com Could...?; Have you ever...?; e
   perguntas com Do / Did / Are you...? Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 43, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'The Burj Khalifa is the tallest building in the world.', dica: 0, traducao: 'O Burj Khalifa é o prédio mais alto do mundo.' },
    { frase: 'Machu Picchu is one of the most beautiful places of all.', dica: 0, traducao: 'Machu Picchu é um dos lugares mais lindos de todos.' },
    { frase: "Next weekend, I'm going to visit my family.", dica: 0, traducao: 'No próximo fim de semana, vou visitar a minha família.' },
    { frase: "Next month, I'm going to start a new course.", dica: 0, traducao: 'No mês que vem, vou começar um curso novo.' },
    { frase: "Next year, I'm going to travel to Chile.", dica: 0, traducao: 'No ano que vem, vou viajar para o Chile.' },
    { frase: 'My dream is to live by the beach.', dica: 0, traducao: 'O meu sonho é morar perto da praia.' },
    { frase: 'I want to learn to cook.', dica: 0, traducao: 'Quero aprender a cozinhar.' },
    { frase: "Today, I'd like to watch a movie.", dica: 0, traducao: 'Hoje, eu gostaria de ver um filme.' },
    { frase: 'I use social media every day.', dica: 0, traducao: 'Uso redes sociais todo dia.' },
    { frase: 'I ask my voice assistant to play music.', dica: 0, traducao: 'Peço ao assistente de voz para tocar música.' },
    { frase: 'Could you help me, please?', dica: 0, traducao: 'Você poderia me ajudar, por favor?' },
    { frase: 'Could I have the menu, please?', dica: 0, traducao: 'Eu poderia ver o cardápio, por favor?' },
    { frase: 'Have you ever been to another country?', dica: 0, traducao: 'Você já foi a outro país?' },
    { frase: "Yes, I have. I went to Argentina in 2022.", dica: 0, traducao: 'Sim. Fui à Argentina em 2022.' },
    { frase: 'Have you ever eaten Japanese food?', dica: 0, traducao: 'Você já comeu comida japonesa?' },
    { frase: "No, I haven't, but I would like to.", dica: 0, traducao: 'Não, mas eu gostaria.' },
    { frase: 'Do you like your job?', dica: 0, traducao: 'Você gosta do seu trabalho?' },
    { frase: 'Did you go out last night?', dica: 0, traducao: 'Você saiu ontem à noite?' },
    { frase: 'Are you happy with your English?', dica: 0, traducao: 'Você está feliz com o seu inglês?' },
    { frase: "Yes, I am! I've learned a lot this year.", dica: 0, traducao: 'Sim! Aprendi muito este ano.' }
  ]
});
</script>
