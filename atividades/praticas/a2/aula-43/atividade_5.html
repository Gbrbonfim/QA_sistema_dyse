<script>
/* A2 · Class 43 · Gramática (Review Classes 34-43)
   Revisão das aulas 34 a 43: superlativos, be going to, verbo + to, artigos, Could...?,
   present perfect (ever / never, particípios) x past simple, been x gone e perguntas com Do /
   Did / Are. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 43, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'The Burj Khalifa is ___ building in the world.', opcoes: ['the tallest', 'taller', 'the most tall'], certa: 0, traducao: 'O Burj Khalifa é o prédio mais alto do mundo.' },
    { frase: 'That was ___ view from a tall building!', opcoes: ['the baddest', 'the worst', 'worse'], certa: 1, traducao: 'Essa foi a pior vista de um prédio alto!' },
    { frase: 'Machu Picchu is one of ___ places of all.', opcoes: ['the beautifulest', 'more beautiful', 'the most beautiful'], certa: 2, traducao: 'Machu Picchu é um dos lugares mais lindos de todos.' },
    { frase: 'I ___ going to visit my aunt next weekend.', opcoes: ['am', 'is', 'are'], certa: 0, traducao: 'Vou visitar a minha tia no próximo fim de semana.' },
    { frase: 'Look at those clouds! It ___ rain.', opcoes: ['is going', "'s going to", 'going to'], certa: 1, traducao: 'Olha essas nuvens! Vai chover.' },
    { frase: 'What ___ you going to do next year?', opcoes: ['do', 'is', 'are'], certa: 2, traducao: 'O que você vai fazer no ano que vem?' },
    { frase: "I'd like ___ a new language.", opcoes: ['to learn', 'learning', 'learn'], certa: 0, traducao: 'Eu gostaria de aprender uma língua nova.' },
    { frase: 'She decided ___ a bucket list.', opcoes: ['making', 'to make', 'make'], certa: 1, traducao: 'Ela decidiu fazer uma bucket list.' },
    { frase: 'I like ___ with my friends. (I enjoy it in general)', opcoes: ['to traveling', 'travel', 'traveling'], certa: 2, traducao: 'Gosto de viajar com os meus amigos. (gosto em geral)' },
    { frase: 'People use ___ internet everywhere.', opcoes: ['the', 'a', 'an'], certa: 0, traducao: 'As pessoas usam a internet em todo lugar.' },
    { frase: 'I go to work by ___ bus.', opcoes: ['the', '– (no article)', 'a'], certa: 1, traducao: 'Vou trabalhar de ônibus.' },
    { frase: 'I bought a laptop. ___ laptop is very fast.', opcoes: ['A', 'An', 'The'], certa: 2, traducao: 'Comprei um notebook. O notebook é muito rápido.' },
    { frase: '___ you help me with my homework, please?', opcoes: ['Could', 'Did', 'Are'], certa: 0, traducao: 'Você poderia me ajudar com a lição, por favor?' },
    { frase: 'Have you ever ___ to Japan?', opcoes: ['went', 'been', 'gone'], certa: 1, traducao: 'Você já foi ao Japão?' },
    { frase: "I've never ___ a car in another country.", opcoes: ['drove', 'drive', 'driven'], certa: 2, traducao: 'Nunca dirigi em outro país.' },
    { frase: 'Have you ever eaten sushi? Yes, I ___.', opcoes: ['have', 'did', 'ate'], certa: 0, traducao: 'Você já comeu sushi? Sim.' },
    { frase: 'I ___ to Italy in 2019.', opcoes: ['have been', 'went', 'have gone'], certa: 1, traducao: 'Fui à Itália em 2019.' },
    { frase: 'My friend ___ a snack yesterday.', opcoes: ['has bought', 'have bought', 'bought'], certa: 2, traducao: 'O meu amigo comprou um lanche ontem.' },
    { frase: "My mom isn't home. She's ___ to the bank.", opcoes: ['gone', 'been', 'went'], certa: 0, traducao: 'A minha mãe não está em casa. Ela foi ao banco.' },
    { frase: "I've ___ to that restaurant. It was great!", opcoes: ['gone', 'been', 'go'], certa: 1, traducao: 'Já fui àquele restaurante. Foi ótimo!' },
    { frase: '___ you like coffee? Yes, I love it.', opcoes: ['Are', 'Did', 'Do'], certa: 2, traducao: 'Você gosta de café? Sim, adoro.' },
    { frase: '___ you see the game last night?', opcoes: ['Did', 'Do', 'Are'], certa: 0, traducao: 'Você viu o jogo ontem à noite?' },
    { frase: '___ you tired today?', opcoes: ['Do', 'Are', 'Did'], certa: 1, traducao: 'Você está cansado hoje?' },
    { frase: 'We use "Could you...?" to make a ___ request.', opcoes: ['rude', 'past', 'polite'], certa: 2, traducao: 'Usamos "Could you...?" para fazer um pedido educado.' }
  ]
});
</script>
