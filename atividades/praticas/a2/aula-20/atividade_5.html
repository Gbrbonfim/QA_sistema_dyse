<script>
/* A2 · Class 20 · Gramática (They Were Fantastic!)
   Alinhado ao "Grammar Point" e ao "HOMEWORK" — was / were, wasn't / weren't, perguntas e
   respostas curtas, "was born", e presente x passado do be (is / are x was / were) com
   expressões de tempo. Conteúdo NOVO, fatos verdadeiros. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 20, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'Agatha Christie ___ a famous writer.', opcoes: ['was', 'were', 'is'], certa: 0, traducao: 'A Agatha Christie foi uma escritora famosa.' },
    { frase: 'Rosa Parks and Harriet Tubman ___ activists.', opcoes: ['was', 'were', 'is'], certa: 1, traducao: 'A Rosa Parks e a Harriet Tubman foram ativistas.' },
    { frase: "She ___ a doctor. She was a nurse.", opcoes: ['was', "weren't", "wasn't"], certa: 2, traducao: 'Ela não era médica. Era enfermeira.' },
    { frase: "They ___ at the meeting. They were on holiday.", opcoes: ["weren't", "wasn't", 'were'], certa: 0, traducao: 'Eles não estavam na reunião. Estavam de férias.' },
    { frase: '___ she a chemist? Yes, she was.', opcoes: ['Were', 'Was', 'Is'], certa: 1, traducao: 'Ela era química? Sim, era.' },
    { frase: '___ they scientists? Yes, they were.', opcoes: ['Was', 'Did', 'Were'], certa: 2, traducao: 'Eles eram cientistas? Sim, eram.' },
    { frase: 'Was Amelia Earhart a pilot? Yes, she ___.', opcoes: ['was', 'were', 'did'], certa: 0, traducao: 'A Amelia Earhart era piloto? Sim, era.' },
    { frase: "Were you at home last night? No, I ___.", opcoes: ["weren't", "wasn't", "didn't"], certa: 1, traducao: 'Você estava em casa ontem à noite? Não.' },
    { frase: 'My grandma ___ born in Japan in 1940.', opcoes: ['is', 'were', 'was'], certa: 2, traducao: 'A minha avó nasceu no Japão em 1940.' },
    { frase: 'Where ___ you born?', opcoes: ['were', 'was', 'are'], certa: 0, traducao: 'Onde você nasceu?' },
    { frase: 'What day ___ it today?', opcoes: ['was', 'is', 'were'], certa: 1, traducao: 'Que dia é hoje?' },
    { frase: 'Yesterday ___ Tuesday.', opcoes: ['is', 'were', 'was'], certa: 2, traducao: 'Ontem foi terça.' },
    { frase: '___ your mother at home now?', opcoes: ['Is', 'Was', 'Were'], certa: 0, traducao: 'A sua mãe está em casa agora?' },
    { frase: "She ___ here in the morning, but now she's at work.", opcoes: ['is', 'was', 'were'], certa: 1, traducao: 'Ela estava aqui de manhã, mas agora está no trabalho.' },
    { frase: "I can't find my books. Where ___ they?", opcoes: ['was', 'is', 'are'], certa: 2, traducao: 'Não acho os meus livros. Onde eles estão?' },
    { frase: 'They ___ on your desk in the afternoon.', opcoes: ['were', 'was', 'are'], certa: 0, traducao: 'Eles estavam na sua mesa à tarde.' },
    { frase: 'The new teacher ___ born in England.', opcoes: ['were', 'was', 'is'], certa: 1, traducao: 'O professor novo nasceu na Inglaterra.' },
    { frase: 'His parents ___ born in Singapore.', opcoes: ['was', 'is', 'were'], certa: 2, traducao: 'Os pais dele nasceram em Singapura.' },
    { frase: 'Why ___ your mom angry this morning?', opcoes: ['was', 'were', 'is'], certa: 0, traducao: 'Por que a sua mãe estava brava hoje de manhã?' },
    { frase: 'Because I ___ late for school.', opcoes: ['were', 'was', 'am'], certa: 1, traducao: 'Porque eu estava atrasado para a escola.' },
    { frase: 'Marie Curie ___ born in 1867.', opcoes: ['is', 'were', 'was'], certa: 2, traducao: 'A Marie Curie nasceu em 1867.' },
    { frase: 'Coco Chanel ___ a French fashion designer.', opcoes: ['was', 'were', 'are'], certa: 0, traducao: 'A Coco Chanel foi uma estilista francesa.' },
    { frase: 'We ___ at the museum last Saturday.', opcoes: ['was', 'were', 'are'], certa: 1, traducao: 'Estávamos no museu no sábado passado.' },
    { frase: "It ___ sunny yesterday. It was rainy.", opcoes: ['was', "weren't", "wasn't"], certa: 2, traducao: 'Ontem não estava ensolarado. Estava chuvoso.' }
  ]
});
</script>
