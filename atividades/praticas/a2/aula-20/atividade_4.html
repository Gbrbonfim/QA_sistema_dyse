<script>
/* A2 · Class 20 · Fala (They Were Fantastic!)
   Alinhado ao "Grammar Point: answer the questions about you" (Where were you born? Where were
   you last weekend? Were you tired yesterday evening?) e aos fatos sobre mulheres da história,
   com was / were. Conteúdo NOVO e verdadeiro. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 20, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Where were you born?', dica: 0, traducao: 'Onde você nasceu?' },
    { frase: 'I was born in Brazil.', dica: 0, traducao: 'Nasci no Brasil.' },
    { frase: 'Where were you last weekend?', dica: 0, traducao: 'Onde você estava no fim de semana passado?' },
    { frase: 'I was at the beach with my family.', dica: 0, traducao: 'Eu estava na praia com a minha família.' },
    { frase: 'Were you at home this morning?', dica: 0, traducao: 'Você estava em casa hoje de manhã?' },
    { frase: "No, I wasn't. I was at work.", dica: 0, traducao: 'Não. Eu estava no trabalho.' },
    { frase: 'Were you tired yesterday evening?', dica: 0, traducao: 'Você estava cansado ontem à noite?' },
    { frase: 'Yes, I was. I was very tired.', dica: 0, traducao: 'Sim. Estava muito cansado.' },
    { frase: 'My parents were born in nineteen seventy.', dica: 0, traducao: 'Os meus pais nasceram em 1970.' },
    { frase: "We weren't at school yesterday.", dica: 0, traducao: 'Não estávamos na escola ontem.' },
    { frase: 'Marie Curie was a famous scientist.', dica: 0, traducao: 'A Marie Curie foi uma cientista famosa.' },
    { frase: 'She was born in Poland.', dica: 0, traducao: 'Ela nasceu na Polônia.' },
    { frase: 'Amelia Earhart was an American pilot.', dica: 0, traducao: 'A Amelia Earhart foi uma piloto americana.' },
    { frase: 'Ada Lovelace was the first computer programmer.', dica: 0, traducao: 'A Ada Lovelace foi a primeira programadora de computador.' },
    { frase: 'Was she a writer?', dica: 0, traducao: 'Ela era escritora?' },
    { frase: "No, she wasn't. She was a mathematician.", dica: 0, traducao: 'Não. Ela era matemática.' },
    { frase: 'Were they astronauts?', dica: 0, traducao: 'Elas eram astronautas?' },
    { frase: 'Yes, they were.', dica: 0, traducao: 'Sim, eram.' },
    { frase: 'Yesterday was Monday and today is Tuesday.', dica: 0, traducao: 'Ontem foi segunda e hoje é terça.' },
    { frase: 'The test was easy, but I was nervous.', dica: 0, traducao: 'A prova foi fácil, mas eu estava nervoso.' }
  ]
});
</script>
