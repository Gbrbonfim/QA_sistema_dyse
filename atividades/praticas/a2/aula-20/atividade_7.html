<html lang="pt-BR">
<head>

<title>DYSE · A2 · Aula 21 · Write her biography</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 · Class 21 · Escrita (They Were Fantastic!)
   Alinhado às biografias do "Reading And Vocabulary" (was born in..., she was a famous...,
   today she is...) e às profissões com -er / -or / -ist / -ian. Conteúdo NOVO, com fatos
   verdadeiros (Tarsila do Amaral, Marta, Agatha Christie, Serena Williams...). A isca é a forma
   errada (is x was, painting x painter...). 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 20, num: 7, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('A Tarsila do Amaral nasceu em 1886.'), palavras: ['Tarsila', 'do', 'Amaral', 'was', 'born', 'in', '1886'], isca: ['is'], fim: '.', traducao: 'A Tarsila do Amaral nasceu em 1886.' },
    { contexto: M('Ela foi uma pintora brasileira famosa.'), palavras: ['She', 'was', 'a', 'famous', 'Brazilian', 'painter'], isca: ['paint'], fim: '.', traducao: 'Ela foi uma pintora brasileira famosa.' },
    { contexto: M('A Marta é jogadora de futebol.'), palavras: ['Marta', 'is', 'a', 'football', 'player'], isca: ['play'], fim: '.', traducao: 'A Marta é jogadora de futebol.' },
    { contexto: M('Ela nasceu em Alagoas, no Brasil.'), palavras: ['She', 'was', 'born', 'in', 'Alagoas,', 'Brazil'], isca: ['were'], fim: '.', traducao: 'Ela nasceu em Alagoas, no Brasil.' },
    { contexto: M('A Agatha Christie foi uma escritora inglesa.'), palavras: ['Agatha', 'Christie', 'was', 'an', 'English', 'writer'], isca: ['a'], fim: '.', traducao: 'A Agatha Christie foi uma escritora inglesa.' },
    { contexto: M('Os livros dela ainda são populares hoje.'), palavras: ['Her', 'books', 'are', 'still', 'popular', 'today'], isca: ['were'], fim: '.', traducao: 'Os livros dela ainda são populares hoje.' },
    { contexto: M('A Marie Curie foi física e química.'), palavras: ['Marie', 'Curie', 'was', 'a', 'physicist', 'and', 'a', 'chemist'], isca: ['physics'], fim: '.', traducao: 'A Marie Curie foi física e química.' },
    { contexto: M('A Serena Williams é uma tenista americana.'), palavras: ['Serena', 'Williams', 'is', 'an', 'American', 'tennis', 'player'], isca: ['was'], fim: '.', traducao: 'A Serena Williams é uma tenista americana.' },
    { contexto: M('A Rosa Parks foi uma ativista.'), palavras: ['Rosa', 'Parks', 'was', 'an', 'activist'], isca: ['activism'], fim: '.', traducao: 'A Rosa Parks foi uma ativista.' },
    { contexto: M('A Hedy Lamarr foi atriz e inventora.'), palavras: ['Hedy', 'Lamarr', 'was', 'an', 'actress', 'and', 'an', 'inventor'], isca: ['invent'], fim: '.', traducao: 'A Hedy Lamarr foi atriz e inventora.' },
    { contexto: M('A Ada Lovelace foi matemática.'), palavras: ['Ada', 'Lovelace', 'was', 'a', 'mathematician'], isca: ['math'], fim: '.', traducao: 'A Ada Lovelace foi matemática.' },
    { contexto: M('A Coco Chanel foi uma estilista francesa.'), palavras: ['Coco', 'Chanel', 'was', 'a', 'French', 'fashion', 'designer'], isca: ['design'], fim: '.', traducao: 'A Coco Chanel foi uma estilista francesa.' },
    { contexto: M('A minha mãe é professora.'), palavras: ['My', 'mother', 'is', 'a', 'teacher'], isca: ['teach'], fim: '.', traducao: 'A minha mãe é professora.' },
    { contexto: M('O meu avô era político.'), palavras: ['My', 'grandfather', 'was', 'a', 'politician'], isca: ['politics'], fim: '.', traducao: 'O meu avô era político.' },
    { contexto: M('A irmã dela é cantora e dançarina.'), palavras: ['Her', 'sister', 'is', 'a', 'singer', 'and', 'a', 'dancer'], isca: ['dance'], fim: '.', traducao: 'A irmã dela é cantora e dançarina.' },
    { contexto: M('Ele é artista e cientista.'), palavras: ["He's", 'an', 'artist', 'and', 'a', 'scientist'], isca: ['science'], fim: '.', traducao: 'Ele é artista e cientista.' },
    { contexto: M('Ela ainda é famosa no mundo todo.'), palavras: ['She', 'is', 'still', 'famous', 'all', 'over', 'the', 'world'], isca: ['was'], fim: '.', traducao: 'Ela ainda é famosa no mundo todo.' },
    { contexto: M('As pinturas dela estão em museus.'), palavras: ['Her', 'paintings', 'are', 'in', 'museums'], isca: ['painters'], fim: '.', traducao: 'As pinturas dela estão em museus.' },
    { contexto: M('Quem foi a Frida Kahlo?'), palavras: ['Who', 'was', 'Frida', 'Kahlo'], isca: ['were'], fim: '?', traducao: 'Quem foi a Frida Kahlo?' },
    { contexto: M('Quando ela nasceu?'), palavras: ['When', 'was', 'she', 'born'], isca: ['did'], fim: '?', traducao: 'Quando ela nasceu?' }
  ]
});
</script>
</body>
</html>
