/* A2 · Class 22 · Fala (My Holiday Disaster)
   Alinhado ao "Writing And Speaking: prepare to tell a story of a holiday disaster... use the
   simple past" e ao "Warm Up" (Where do you like to go on holiday? How long? With family or
   friends?). Conteúdo NOVO, com verbos regulares no passado. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 22, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Last year, we decided to go to the beach.', dica: 0, traducao: 'No ano passado, decidimos ir à praia.' },
    { frase: 'We booked a hotel near the sea.', dica: 0, traducao: 'Reservamos um hotel perto do mar.' },
    { frase: 'We arrived at the airport early.', dica: 0, traducao: 'Chegamos cedo ao aeroporto.' },
    { frase: 'But our flight was late.', dica: 0, traducao: 'Mas o nosso voo atrasou.' },
    { frase: 'We waited for five hours.', dica: 0, traducao: 'Esperamos por cinco horas.' },
    { frase: 'It rained every day.', dica: 0, traducao: 'Choveu todos os dias.' },
    { frase: 'We stayed in the hotel and played cards.', dica: 0, traducao: 'Ficamos no hotel e jogamos cartas.' },
    { frase: "We didn't visit the island.", dica: 0, traducao: 'Não visitamos a ilha.' },
    { frase: "I didn't like the food at the hotel.", dica: 0, traducao: 'Não gostei da comida do hotel.' },
    { frase: 'My friend recommended a great restaurant.', dica: 0, traducao: 'O meu amigo recomendou um restaurante ótimo.' },
    { frase: 'We loved the beaches.', dica: 0, traducao: 'Amamos as praias.' },
    { frase: 'Did you book a hotel?', dica: 0, traducao: 'Você reservou um hotel?' },
    { frase: "Yes, I did. No, I didn't.", dica: 0, traducao: 'Sim, reservei. Não, não reservei.' },
    { frase: 'Did they enjoy the trip?', dica: 0, traducao: 'Eles curtiram a viagem?' },
    { frase: 'I usually go on holiday with my family.', dica: 0, traducao: 'Normalmente viajo de férias com a minha família.' },
    { frase: 'In the USA, people say vacation, not holiday.', dica: 0, traducao: 'Nos EUA, as pessoas dizem vacation, não holiday.' },
    { frase: 'There was a lot of traffic.', dica: 0, traducao: 'Tinha muito trânsito.' },
    { frase: "My driver's license was expired.", dica: 0, traducao: 'A minha carteira de motorista estava vencida.' },
    { frase: 'We tried to rent a car.', dica: 0, traducao: 'Tentamos alugar um carro.' },
    { frase: 'It was a disaster, but now it is a funny story!', dica: 0, traducao: 'Foi um desastre, mas agora é uma história engraçada!' }
  ]
});
</script>
