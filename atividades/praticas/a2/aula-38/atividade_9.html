  course: 'ativ-a2', aula: 38, num: 9, tipo: 'fala',

  itens: [
    { frase: 'Have you ever been to an Asian country?', dica: 0, traducao: 'Você já foi a um país asiático?' },
    { frase: 'Have you ever seen a famous landmark?', dica: 0, traducao: 'Você já viu um lugar famoso?' },

    { frase: 'Have you ever booked a flight online?', dica: 0, traducao: 'Você já reservou um voo pela internet?' },
    { frase: 'Have you ever stayed in a hostel?', dica: 0, traducao: 'Você já ficou num hostel?' },
    { frase: 'Have you ever made new friends on a trip?', dica: 0, traducao: 'Você já fez amigos numa viagem?' },
    { frase: "Yes, I have. No, I haven't.", dica: 0, traducao: 'Sim, já. Não, nunca.' },
    { frase: 'When? Where? Who did you go with?', dica: 0, traducao: 'Quando? Onde? Com quem você foi?' },
    { frase: 'How was it?', dica: 0, traducao: 'Como foi?' },
    { frase: 'Would you like to? Why or why not?', dica: 0, traducao: 'Você gostaria? Por quê?' },
    { frase: "I've been to Argentina.", dica: 0, traducao: 'Já fui à Argentina.' },
    { frase: 'I went there in 2023 with my family.', dica: 0, traducao: 'Fui lá em 2023 com a minha família.' },
    { frase: "I've never driven a car in another country.", dica: 0, traducao: 'Nunca dirigi em outro país.' },
    { frase: "I've taken a lot of photos of the mountains.", dica: 0, traducao: 'Tirei muitas fotos das montanhas.' },
    { frase: "I've bought a souvenir for my mother.", dica: 0, traducao: 'Comprei uma lembrancinha para a minha mãe.' },
    { frase: "I've never seen snow.", dica: 0, traducao: 'Nunca vi neve.' },
    { frase: "We've had a great time.", dica: 0, traducao: 'Nós nos divertimos muito.' },
    { frase: "She's gone on holiday.", dica: 0, traducao: 'Ela saiu de férias.' },
    { frase: "I've walked for hours in Paris.", dica: 0, traducao: 'Andei por horas em Paris.' },
    { frase: "I've had a problem with my luggage.", dica: 0, traducao: 'Tive um problema com a minha bagagem.' }
  ]
});
