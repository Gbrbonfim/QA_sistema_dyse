<script>
/* A2 · Class 38 · Gramática (Family on Tour)
   Alinhado ao "Grammar Point" (present perfect: have / has + particípio; uso sem dizer quando,
   experiências com ever / never, eventos recentes; contrações; perguntas e respostas curtas) e
   ao vídeo da família Goy (15 meses, 50 países, 16 cartões de crédito, livros em PDF nos
   iPads, menos de 70 mil dólares, muito pacientes). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 38, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'We ___ visited many countries.', opcoes: ['have', 'has', 'are'], certa: 0, traducao: 'Visitamos muitos países.' },
    { frase: 'She ___ planned the trip.', opcoes: ['have', 'has', 'is'], certa: 1, traducao: 'Ela planejou a viagem.' },
    { frase: 'They ___ packed their clothes.', opcoes: ["hasn't", "didn't", "haven't"], certa: 2, traducao: 'Eles não arrumaram as roupas.' },
    { frase: 'He ___ called the hotel.', opcoes: ["hasn't", "haven't", "isn't"], certa: 0, traducao: 'Ele não ligou para o hotel.' },
    { frase: '___ they arrived in Canada?', opcoes: ['Has', 'Have', 'Did'], certa: 1, traducao: 'Eles chegaram ao Canadá?' },
    { frase: '___ he scanned the books?', opcoes: ['Have', 'Is', 'Has'], certa: 2, traducao: 'Ele escaneou os livros?' },
    { frase: 'Have you visited Sri Lanka? Yes, I ___.', opcoes: ['have', 'did', 'has'], certa: 0, traducao: 'Você já visitou o Sri Lanka? Sim.' },
    { frase: "Have they arrived in Japan? No, they ___.", opcoes: ["didn't", "haven't", "hasn't"], certa: 1, traducao: 'Eles chegaram ao Japão? Não.' },
    { frase: 'I have already ___ all the tickets.', opcoes: ['book', 'booking', 'booked'], certa: 2, traducao: 'Já reservei todas as passagens.' },
    { frase: "We've = we ___.", opcoes: ['have', 'are', 'were'], certa: 0, traducao: "We've = we have." },
    { frase: "He's visited 50 countries. 's = ___.", opcoes: ['is', 'has', 'was'], certa: 1, traducao: "Ele visitou 50 países. 's = has." },
    { frase: 'We use the present perfect when we ___ say when things happened.', opcoes: ['always', 'often', "don't"], certa: 2, traducao: 'Usamos o present perfect quando não dizemos quando as coisas aconteceram.' },
    { frase: 'We sold the house ___. (we say when)', opcoes: ['two years ago', 'already', 'ever'], certa: 0, traducao: 'Vendemos a casa há dois anos. (dizemos quando)' },
    { frase: "I've lost my keys. This means I ___ them now.", opcoes: ['have', "don't have", 'found'], certa: 1, traducao: 'Perdi as minhas chaves. Isso significa que não estou com elas agora.' },
    { frase: 'For regular verbs, the past participle is ___ the past simple.', opcoes: ['different from', 'shorter than', 'the same as'], certa: 2, traducao: 'Nos verbos regulares, o particípio é igual ao past simple.' },
    { frase: 'want → wanted → ___', opcoes: ['wanted', 'wanten', 'want'], certa: 0, traducao: 'querer → quis → querido' },
    { frase: 'The Goys are traveling for ___ months.', opcoes: ['five', 'fifteen', 'fifty'], certa: 1, traducao: 'Os Goy estão viajando por quinze meses.' },
    { frase: 'They are visiting ___ countries.', opcoes: ['fifteen', 'twelve', 'fifty'], certa: 2, traducao: 'Eles estão visitando cinquenta países.' },
    { frase: 'They are a ___ family: they have different nationalities.', opcoes: ['diverse', 'small', 'rich'], certa: 0, traducao: 'Eles são uma família diversa: têm nacionalidades diferentes.' },
    { frase: 'They got a million miles points from ___ credit cards.', opcoes: ['one', '16', '6'], certa: 1, traducao: 'Eles juntaram um milhão de pontos em milhas com 16 cartões de crédito.' },
    { frase: 'The children study with books in PDF on their ___.', opcoes: ['TVs', 'notebooks', 'iPads'], certa: 2, traducao: 'As crianças estudam com livros em PDF nos iPads.' },
    { frase: 'They are going to spend ___ than $70,000.', opcoes: ['less', 'more', 'much'], certa: 0, traducao: 'Eles vão gastar menos de 70 mil dólares.' },
    { frase: 'The mother teaches Math and ___ to the kids.', opcoes: ['History', 'French', 'Music'], certa: 1, traducao: 'A mãe ensina Matemática e Francês às crianças.' },
    { frase: 'The Goys are very ___ with the kids.', opcoes: ['impatient', 'angry', 'patient'], certa: 2, traducao: 'Os Goy são muito pacientes com as crianças.' }
  ]
});
</script>
