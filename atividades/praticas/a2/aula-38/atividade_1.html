<script>
/* A2 · Class 38 · Escuta (Family on Tour)
   Alinhado ao "Grammar Point" — present perfect (passado sem dizer quando; experiências;
   eventos recentes) x past simple (sabemos quando) x present continuous (agora / este
   período). Conteúdo NOVO sobre viagens em família: o aluno ouve e escolhe. 24 questões. */
const IC = { 'Past simple (we know when)': 'event', 'Present perfect (we don\'t say when)': 'done_all', 'Present continuous (now)': 'schedule' };
const T = Object.keys(IC);
const op = () => T.map(c => ({ label: c, icon: IC[c] }));
const q = (audioTexto, certa) => ({ audioTexto, opcoes: op(), certa });
DysePratica.iniciar({
  course: 'ativ-a2', aula: 38, num: 1, tipo: 'imagem',
  instrucao: 'Listen: which tense is it?',
  itens: [
    q('We visited Japan last year.', 0),
    q("We've visited fifty countries.", 1),
    q('We are traveling around the world.', 2),
    q('I booked the tickets yesterday.', 0),
    q("I've already booked all the tickets.", 1),
    q('The kids are studying on their iPads now.', 2),
    q('She started a travel blog in 2023.', 0),
    q("She's started a travel blog.", 1),
    q('They are staying at a hotel this week.', 2),
    q('We sold our house two years ago.', 0),
    q('We have sold everything.', 1),
    q('My dad is driving to the airport right now.', 2),
    q('He lost his keys this morning.', 0),
    q("Oh no! I've lost my keys.", 1),
    q('Look! The plane is landing.', 2),
    q('They arrived in Canada on Monday.', 0),
    q('Have they arrived in Canada?', 1),
    q('We are visiting our grandparents this month.', 2),
    q('I went to Italy in 2019.', 0),
    q("I've never been to Italy.", 1),
    q('Is she packing her suitcase?', 2),
    q('Did you see the Eiffel Tower last summer?', 0),
    q('Have you ever seen the Eiffel Tower?', 1),
    q('What are you doing at the moment?', 2)
  ]
});
</script>
