<script>
/* A2 · Class 23 · Gramática (Did You Like the Music?)
   Alinhado ao "Grammar Point" — past simple irregular (formas a memorizar), didn't +
   infinitivo, Did / Wh- + did, could / couldn't (passado de can) e o vocabulário de
   festivais. Conteúdo NOVO. 24 questões. */
const PAST = 'Choose the past simple';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 23, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { instrucao: PAST, frase: 'go → ___', opcoes: ['went', 'goed', 'gone'], certa: 0, traducao: 'ir → foi' },
    { instrucao: PAST, frase: 'buy → ___', opcoes: ['buyed', 'bought', 'buyied'], certa: 1, traducao: 'comprar → comprou' },
    { instrucao: PAST, frase: 'see → ___', opcoes: ['seed', 'seen', 'saw'], certa: 2, traducao: 'ver → viu' },
    { instrucao: PAST, frase: 'wear → ___', opcoes: ['wore', 'weared', 'worn'], certa: 0, traducao: 'vestir → vestiu' },
    { instrucao: PAST, frase: 'drink → ___', opcoes: ['drinked', 'drank', 'drunked'], certa: 1, traducao: 'beber → bebeu' },
    { instrucao: PAST, frase: 'feel → ___', opcoes: ['feeled', 'feelt', 'felt'], certa: 2, traducao: 'sentir → sentiu' },
    { instrucao: PAST, frase: 'say → ___', opcoes: ['said', 'sayed', 'sayd'], certa: 0, traducao: 'dizer → disse' },
    { instrucao: PAST, frase: 'can → ___', opcoes: ['canned', 'could', 'cans'], certa: 1, traducao: 'poder/conseguir → podia/conseguiu' },
    { frase: 'They ___ tickets early because the festival was very popular.', opcoes: ['buy', 'buys', 'bought'], certa: 2, traducao: 'Eles compraram ingressos cedo porque o festival era muito concorrido.' },
    { frase: 'We ___ a good view of the stage. It was too crowded.', opcoes: ["didn't have", "didn't had", "don't had"], certa: 0, traducao: 'Não tivemos uma boa visão do palco. Estava cheio demais.' },
    { frase: 'Lucy was hungry because she ___ snacks.', opcoes: ["didn't took", "didn't take", "not took"], certa: 1, traducao: 'A Lucy estava com fome porque não levou lanches.' },
    { frase: 'Did you ___ the tickets online?', opcoes: ['bought', 'buys', 'buy'], certa: 2, traducao: 'Você comprou os ingressos pela internet?' },
    { frase: 'Did you go to the festival? Yes, I ___.', opcoes: ['did', 'went', 'was'], certa: 0, traducao: 'Você foi ao festival? Sim.' },
    { frase: 'What time did you ___ home?', opcoes: ['got', 'get', 'gets'], certa: 1, traducao: 'A que horas você chegou em casa?' },
    { frase: '___ did you go with? With my friends.', opcoes: ['What', 'Where', 'Who'], certa: 2, traducao: 'Com quem você foi? Com os meus amigos.' },
    { frase: '___ did you buy the tickets? Last weekend.', opcoes: ['When', 'Who', 'What'], certa: 0, traducao: 'Quando você comprou os ingressos? No fim de semana passado.' },
    { frase: 'I ___ hear the music from my house last night. It was very loud!', opcoes: ['can', 'could', 'did'], certa: 1, traducao: 'Eu conseguia ouvir a música da minha casa ontem à noite. Estava muito alta!' },
    { frase: 'The man said the band ___ come. The singer was sick.', opcoes: ["didn't could", "can't", "couldn't"], certa: 2, traducao: 'O homem disse que a banda não podia vir. O cantor estava doente.' },
    { frase: "___ you see the stage? No, I couldn't.", opcoes: ['Could', 'Can', 'Did'], certa: 0, traducao: 'Você conseguia ver o palco? Não.' },
    { frase: 'I need a toilet. Where are the ___?', opcoes: ['tents', 'restrooms', 'exits'], certa: 1, traducao: 'Preciso de um banheiro. Onde ficam os banheiros?' },
    { frase: "I lost my bag. Let's go to the ___.", opcoes: ['lineup', 'entrance', 'lost & found'], certa: 2, traducao: 'Perdi a minha bolsa. Vamos ao achados e perdidos.' },
    { frase: 'The ___ is the list of bands and artists at a festival.', opcoes: ['lineup', 'security', 'tent'], certa: 0, traducao: 'O lineup é a lista de bandas e artistas de um festival.' },
    { frase: 'The ___ is the way out.', opcoes: ['entrance', 'exit', 'tent'], certa: 1, traducao: 'A saída é o caminho para fora.' },
    { frase: 'Irregular verbs have different past forms, so you need to ___ them.', opcoes: ['add -ed to', 'forget', 'memorize'], certa: 2, traducao: 'Os verbos irregulares têm passados diferentes, então é preciso memorizá-los.' }
  ]
});
</script>
