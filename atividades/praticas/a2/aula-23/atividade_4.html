<script>
/* A2 · Class 23 · Fala (Did You Like the Music?)
   Alinhado ao "Speaking And Writing" (contar a ida a um festival/show com o past simple) e ao
   "Warm Up" (festivais no Brasil, tipo de música). Conteúdo NOVO, com verbos irregulares e
   could. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 23, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'I went to Rock in Rio last September.', dica: 0, traducao: 'Fui ao Rock in Rio em setembro passado.' },
    { frase: 'I bought the tickets online.', dica: 0, traducao: 'Comprei os ingressos pela internet.' },
    { frase: 'I went with my best friend.', dica: 0, traducao: 'Fui com o meu melhor amigo.' },
    { frase: 'We got there by bus.', dica: 0, traducao: 'Chegamos lá de ônibus.' },
    { frase: 'We saw six bands.', dica: 0, traducao: 'Vimos seis bandas.' },
    { frase: 'I wore a T-shirt and jeans.', dica: 0, traducao: 'Usei camiseta e calça jeans.' },
    { frase: 'I ate a burger and drank a lot of water.', dica: 0, traducao: 'Comi um hambúrguer e bebi muita água.' },
    { frase: 'I took a lot of pictures.', dica: 0, traducao: 'Tirei muitas fotos.' },
    { frase: 'We had a lot of fun!', dica: 0, traducao: 'Nós nos divertimos muito!' },
    { frase: "I didn't see my favorite singer.", dica: 0, traducao: 'Não vi o meu cantor favorito.' },
    { frase: "We couldn't find a good place.", dica: 0, traducao: 'Não conseguimos achar um bom lugar.' },
    { frase: 'I could hear the music very well.', dica: 0, traducao: 'Eu conseguia ouvir a música muito bem.' },
    { frase: 'I got home at two in the morning.', dica: 0, traducao: 'Cheguei em casa às duas da manhã.' },
    { frase: 'I felt tired, but happy.', dica: 0, traducao: 'Eu me senti cansado, mas feliz.' },
    { frase: 'What festival did you go to?', dica: 0, traducao: 'A que festival você foi?' },
    { frase: 'Who did you go with?', dica: 0, traducao: 'Com quem você foi?' },
    { frase: 'Did you have any problems?', dica: 0, traducao: 'Você teve algum problema?' },
    { frase: 'Where are the restrooms?', dica: 0, traducao: 'Onde ficam os banheiros?' },
    { frase: 'Is my favorite band on the lineup?', dica: 0, traducao: 'A minha banda favorita está na programação?' },
    { frase: 'I really like rock music.', dica: 0, traducao: 'Eu gosto muito de rock.' }
  ]
});
</script>
