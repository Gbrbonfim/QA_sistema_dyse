    { frase: "We're at the airport.", dica: 0, traducao: 'Estamos no aeroporto.' },
    { frase: 'I usually read on the train.', dica: 0, traducao: 'Normalmente leio no trem.' },
    { frase: "She's in her car.", dica: 0, traducao: 'Ela está no carro dela.' },
    { frase: 'They are in a hotel in New York.', dica: 0, traducao: 'Eles estão num hotel em Nova York.' },
    { frase: 'The keys are on the table.', dica: 0, traducao: 'As chaves estão na mesa.' },
    { frase: "Let's have lunch in the garden.", dica: 0, traducao: 'Vamos almoçar no jardim.' },

    { frase: 'The capital of Australia is Canberra.', dica: 0, traducao: 'A capital da Austrália é Canberra.' },
    { frase: 'Who painted the Mona Lisa?', dica: 0, traducao: 'Quem pintou a Mona Lisa?' },
    { frase: 'Where is the Eiffel Tower?', dica: 0, traducao: 'Onde fica a Torre Eiffel?' },
    { frase: "It's in Paris, in France.", dica: 0, traducao: 'Fica em Paris, na França.' }
  ]
