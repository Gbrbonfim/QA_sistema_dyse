<script>
/* A2 · Class 10 · Gramática (What is the answer?)
   Alinhado ao "Grammar Point" — IN para países, cidades, cômodos, prédios, parque, jardim e
   carro (in a car, não on a car); ON para transporte e superfícies; AT para home, work, school,
   university, the airport, the bus station; e "right or wrong". Conteúdo NOVO. 24 questões. */
const OK = 'Which sentence is correct?';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 9, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'My uncle lives ___ Japan.', opcoes: ['in', 'on', 'at'], certa: 0, traducao: 'O meu tio mora no Japão.' },
    { frase: "I can't talk now. I'm ___ the train.", opcoes: ['at', 'on', 'in a'], certa: 1, traducao: 'Não posso falar agora. Estou no trem.' },
    { frase: 'She works ___ home on Fridays.', opcoes: ['in', 'on', 'at'], certa: 2, traducao: 'Ela trabalha em casa às sextas.' },
    { frase: "Joan and Annie are ___ a hotel in Rio.", opcoes: ['in', 'on', 'at the'], certa: 0, traducao: 'A Joan e a Annie estão num hotel no Rio.' },
    { frase: 'There are some books ___ the shelf.', opcoes: ['at', 'on', 'in the'], certa: 1, traducao: 'Tem alguns livros na prateleira.' },
    { frase: 'We need to be ___ the airport at 6 a.m.', opcoes: ['on', 'in a', 'at'], certa: 2, traducao: 'Precisamos estar no aeroporto às 6h.' },
    { frase: "Dad is ___ his car. He's driving to work.", opcoes: ['in', 'on', 'at'], certa: 0, traducao: 'O papai está no carro dele. Está dirigindo para o trabalho.' },
    { frase: 'They give instructions to people ___ the ship.', opcoes: ['at', 'on', 'in a'], certa: 1, traducao: 'Eles dão instruções às pessoas no navio.' },
    { frase: "The kids aren't ___ school today. It's a holiday.", opcoes: ['on', 'in a', 'at'], certa: 2, traducao: 'As crianças não estão na escola hoje. É feriado.' },
    { frase: 'I usually arrive ___ Recife at noon.', opcoes: ['in', 'on', 'at the'], certa: 0, traducao: 'Normalmente chego em Recife ao meio-dia.' },
    { frase: "There's a big clock ___ the wall.", opcoes: ['at', 'on', 'in a'], certa: 1, traducao: 'Tem um relógio grande na parede.' },
    { frase: "Let's meet ___ the bus station at ten.", opcoes: ['on', 'in a', 'at'], certa: 2, traducao: 'Vamos nos encontrar na rodoviária às dez.' },
    { frase: 'The children are playing ___ the garden.', opcoes: ['in', 'on', 'at a'], certa: 0, traducao: 'As crianças estão brincando no jardim.' },
    { frase: 'Can you sleep ___ a bus?', opcoes: ['at', 'on', 'in the'], certa: 1, traducao: 'Você consegue dormir num ônibus?' },
    { frase: 'My sister is a student. She studies ___ university.', opcoes: ['on', 'in a', 'at'], certa: 2, traducao: 'A minha irmã é estudante. Ela estuda na universidade.' },
    { frase: "Are you hungry? There's pizza ___ the kitchen.", opcoes: ['in', 'on', 'at'], certa: 0, traducao: 'Está com fome? Tem pizza na cozinha.' },
    { frase: 'Your phone is ___ the bed.', opcoes: ['at', 'on', 'in a'], certa: 1, traducao: 'O seu celular está na cama.' },
    { frase: "I'm not ___ work today. I'm on vacation.", opcoes: ['on', 'in', 'at'], certa: 2, traducao: 'Não estou no trabalho hoje. Estou de férias.' },
    { instrucao: OK, frase: '___', opcoes: ['My family is from Brazil, but we live in the USA.', 'My family is from Brazil, but we live at the USA.', 'My family is from Brazil, but we live on the USA.'], certa: 0, traducao: 'A minha família é do Brasil, mas moramos nos EUA.' },
    { instrucao: OK, frase: '___', opcoes: ['She is on her car, driving to work.', 'She is in her car, driving to work.', 'She is at her car, driving to work.'], certa: 1, traducao: 'Ela está no carro, dirigindo para o trabalho.' },
    { instrucao: OK, frase: '___', opcoes: ["I'm in home right now.", "I'm on home right now.", "I'm at home right now."], certa: 2, traducao: 'Estou em casa agora.' },
    { instrucao: OK, frase: '___', opcoes: ['We read a lot on the plane.', 'We read a lot at the plane.', 'We read a lot in plane.'], certa: 0, traducao: 'Lemos muito no avião.' },
    { instrucao: OK, frase: '___', opcoes: ['Lisa is on the bathroom.', 'Lisa is in the bathroom.', 'Lisa is at the bathroom.'], certa: 1, traducao: 'A Lisa está no banheiro.' },
    { instrucao: OK, frase: '___', opcoes: ['The children are on school today.', 'The children are in the school today at.', 'The children are at school today.'], certa: 2, traducao: 'As crianças estão na escola hoje.' }
  ]
});
</script>
