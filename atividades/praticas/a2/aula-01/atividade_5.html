<script>
/* A2 · Class 01 · Gramática (Welcome Class)
   Alinhado ao slide "How Much Do You Remember?" + "Talking Point" — revisão diagnóstica da
   gramática do A1: Do / Does, am / is / are (be e present continuous), can / could, was / were,
   did / didn't + forma base, have / has. Conteúdo NOVO. 24 questões. */
const AUX = 'Choose the right word to complete the question';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 1, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { instrucao: AUX, frase: '___ you live near here?', opcoes: ['Do', 'Are', 'Does'], certa: 0, traducao: 'Você mora perto daqui?' },
    { instrucao: AUX, frase: '___ your sister work at weekends?', opcoes: ['Do', 'Does', 'Is'], certa: 1, traducao: 'A sua irmã trabalha nos fins de semana?' },
    { instrucao: AUX, frase: 'What ___ you doing at the moment?', opcoes: ['do', 'did', 'are'], certa: 2, traducao: 'O que você está fazendo no momento?' },
    { instrucao: AUX, frase: '___ you swim? Yes, I can.', opcoes: ['Can', 'Are', 'Were'], certa: 0, traducao: 'Você sabe nadar? Sim, sei.' },
    { instrucao: AUX, frase: 'Where ___ you yesterday afternoon?', opcoes: ['did', 'were', 'are'], certa: 1, traducao: 'Onde você estava ontem à tarde?' },
    { instrucao: AUX, frase: 'What ___ you eat for dinner last night?', opcoes: ['were', 'do', 'did'], certa: 2, traducao: 'O que você comeu no jantar ontem à noite?' },
    { instrucao: AUX, frase: 'How often ___ you meet your friends?', opcoes: ['do', 'are', 'does'], certa: 0, traducao: 'Com que frequência você encontra os seus amigos?' },
    { instrucao: AUX, frase: 'When ___ your birthday?', opcoes: ['does', 'is', 'are'], certa: 1, traducao: 'Quando é o seu aniversário?' },
    { frase: 'She ___ up at five every day.', opcoes: ['wake', 'waking', 'wakes'], certa: 2, traducao: 'Ela acorda às cinco todo dia.' },
    { frase: 'Look! The children ___ in the garden.', opcoes: ['are playing', 'play', 'played'], certa: 0, traducao: 'Olha! As crianças estão brincando no jardim.' },
    { frase: 'I ___ a pizza with my friends last Friday.', opcoes: ['have', 'had', 'am having'], certa: 1, traducao: 'Comi uma pizza com os meus amigos na sexta passada.' },
    { frase: 'We ___ at the beach last weekend.', opcoes: ['are', 'was', 'were'], certa: 2, traducao: 'Nós estávamos na praia no fim de semana passado.' },
    { frase: 'My father ___ cook. He always orders food.', opcoes: ["can't", "doesn't can", "isn't"], certa: 0, traducao: 'O meu pai não sabe cozinhar. Ele sempre pede comida.' },
    { frase: 'They ___ like spicy food.', opcoes: ["doesn't", "don't", "aren't"], certa: 1, traducao: 'Eles não gostam de comida apimentada.' },
    { frase: "I ___ watch the game yesterday. I was at work.", opcoes: ["don't", "wasn't", "didn't"], certa: 2, traducao: 'Eu não assisti ao jogo ontem. Eu estava no trabalho.' },
    { frase: 'He ___ at home last night. He was at a party.', opcoes: ["wasn't", "weren't", "didn't"], certa: 0, traducao: 'Ele não estava em casa ontem à noite. Estava numa festa.' },
    { frase: 'Our apartment ___ two bedrooms.', opcoes: ['have', 'has', 'is'], certa: 1, traducao: 'O nosso apartamento tem dois quartos.' },
    { frase: 'I usually ___ a uniform at work.', opcoes: ['wears', 'wearing', 'wear'], certa: 2, traducao: 'Eu normalmente uso uniforme no trabalho.' },
    { frase: 'Look! Today she ___ a beautiful red dress.', opcoes: ['is wearing', 'wears', 'wear'], certa: 0, traducao: 'Olha! Hoje ela está usando um vestido vermelho lindo.' },
    { frase: 'It usually ___ a lot in London in winter.', opcoes: ['rain', 'rains', 'is raining'], certa: 1, traducao: 'Normalmente chove muito em Londres no inverno.' },
    { frase: 'When I was a child, I ___ ride a horse.', opcoes: ['can', 'did', 'could'], certa: 2, traducao: 'Quando eu era criança, eu sabia andar a cavalo.' },
    { instrucao: AUX, frase: '___ you at work yesterday at 3 p.m.?', opcoes: ['Were', 'Did', 'Was'], certa: 0, traducao: 'Você estava no trabalho ontem às 3 da tarde?' },
    { instrucao: AUX, frase: 'What time ___ the bakery open?', opcoes: ['do', 'does', 'is'], certa: 1, traducao: 'A que horas a padaria abre?' },
    { frase: 'My last birthday ___ fantastic!', opcoes: ['were', 'is', 'was'], certa: 2, traducao: 'O meu último aniversário foi fantástico!' }
  ]
});
</script>
