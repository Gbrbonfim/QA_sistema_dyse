<script>
/* A2 · Class 01 · Fala (Welcome Class)
   Alinhado ao slide "Talking Point" — respostas da entrevista pessoal (família, casa, trabalho,
   hobby, rotina, comida, amigos, esportes, roupa, tempo, fim de semana, can, casa, ontem,
   aniversário). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 1, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'My family is from the south of Brazil.', dica: 0, traducao: 'A minha família é do sul do Brasil.' },
    { frase: 'I live in a small apartment near the beach.', dica: 0, traducao: 'Moro num apartamento pequeno perto da praia.' },
    { frase: "I'm a nurse and I love my job.", dica: 0, traducao: 'Sou enfermeira e amo o meu trabalho.' },
    { frase: 'My favorite hobby is playing video games.', dica: 0, traducao: 'O meu hobby favorito é jogar videogame.' },
    { frase: 'I wake up at half past six on weekdays.', dica: 0, traducao: 'Acordo às seis e meia nos dias de semana.' },
    { frase: 'On a typical day, I work, study and cook dinner.', dica: 0, traducao: 'Num dia comum, eu trabalho, estudo e faço o jantar.' },
    { frase: 'My favorite food is pizza and my favorite drink is lemonade.', dica: 0, traducao: 'A minha comida favorita é pizza e a minha bebida favorita é limonada.' },
    { frase: 'I meet my friends every weekend.', dica: 0, traducao: 'Encontro os meus amigos todo fim de semana.' },
    { frase: 'I go running in the park three times a week.', dica: 0, traducao: 'Corro no parque três vezes por semana.' },
    { frase: 'I usually wear a shirt and pants to work.', dica: 0, traducao: 'Normalmente uso camisa e calça para trabalhar.' },
    { frase: "Today I'm wearing jeans and a black T-shirt.", dica: 0, traducao: 'Hoje estou usando jeans e uma camiseta preta.' },
    { frase: "I love the weather in my city because it's always sunny.", dica: 0, traducao: 'Amo o tempo na minha cidade porque está sempre ensolarado.' },
    { frase: 'At weekends, I usually go to the movies with my family.', dica: 0, traducao: 'Nos fins de semana, normalmente vou ao cinema com a minha família.' },
    { frase: "I can play the guitar, but I can't paint.", dica: 0, traducao: 'Sei tocar violão, mas não sei pintar.' },
    { frase: 'My favorite part of the house is the kitchen.', dica: 0, traducao: 'A minha parte favorita da casa é a cozinha.' },
    { frase: 'Yesterday at this time, I was at work.', dica: 0, traducao: 'Ontem a esta hora, eu estava no trabalho.' },
    { frase: 'Yesterday I studied English and watched a series.', dica: 0, traducao: 'Ontem estudei inglês e assisti a uma série.' },
    { frase: 'My birthday is on the twelfth of May.', dica: 0, traducao: 'O meu aniversário é no dia doze de maio.' },
    { frase: 'My last birthday was great. I had a party with my friends.', dica: 0, traducao: 'O meu último aniversário foi ótimo. Fiz uma festa com os meus amigos.' },
    { frase: 'How often do you meet your friends?', dica: 0, traducao: 'Com que frequência você encontra os seus amigos?' }
  ]
});
</script>
