<script>
/* A2 · Class 36 · Gramática (What Is Your Dream?)
   Alinhado ao "Grammar Point" (verbo + to + infinitivo: would like, want, need, learn,
   decide, plan, hope, promise, expect, forget; 'd = would; would like to x like + -ing) e à
   história da Emma (wanted, decided, planned, needed, learned, hoped, promised, forgot; Itália
   primeiro, depois seis países). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 36, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I want ___ to many countries before I turn 40.', opcoes: ['to travel', 'traveling', 'travel'], certa: 0, traducao: 'Quero viajar para muitos países antes dos 40.' },
    { frase: 'Would you like ___ a new language in the future?', opcoes: ['learning', 'to learn', 'learn'], certa: 1, traducao: 'Você gostaria de aprender uma língua nova no futuro?' },
    { frase: 'We plan ___ our grandparents during the holidays.', opcoes: ['visiting', 'visit', 'to visit'], certa: 2, traducao: 'Planejamos visitar os nossos avós nas festas.' },
    { frase: 'She promised ___ me with my homework.', opcoes: ['to help', 'help', 'helping'], certa: 0, traducao: 'Ela prometeu me ajudar com a lição.' },
    { frase: 'He decided ___ his own business next year.', opcoes: ['starting', 'to start', 'start'], certa: 1, traducao: 'Ele decidiu abrir o próprio negócio no ano que vem.' },
    { frase: 'They hope ___ a new house next year.', opcoes: ['buy', 'buying', 'to buy'], certa: 2, traducao: 'Eles esperam comprar uma casa nova no ano que vem.' },
    { frase: 'I need ___ money for my dream vacation.', opcoes: ['to save', 'saving', 'save'], certa: 0, traducao: 'Preciso economizar para as férias dos sonhos.' },
    { frase: 'She hopes ___ a famous singer in the future.', opcoes: ['being', 'to be', 'be'], certa: 1, traducao: 'Ela espera ser uma cantora famosa no futuro.' },
    { frase: "I'd like to visit Australia. 'd means ___.", opcoes: ['did', 'had', 'would'], certa: 2, traducao: "Eu gostaria de visitar a Austrália. 'd significa would." },
    { frase: '"I\'d like to travel" means "I ___ to travel."', opcoes: ['want', 'enjoy', 'traveled'], certa: 0, traducao: '"I\'d like to travel" significa "quero viajar".' },
    { frase: '"I like traveling" means I ___ it in general.', opcoes: ['want', 'enjoy', 'need'], certa: 1, traducao: '"I like traveling" significa que gosto disso em geral.' },
    { frase: 'I ___ like to live far from my family. I love them!', opcoes: ["don't", "didn't", "wouldn't"], certa: 2, traducao: 'Eu não gostaria de morar longe da minha família. Eu os amo!' },
    { frase: 'I like ___ in the sea. It is my favorite thing in summer.', opcoes: ['swimming', 'to swimming', 'swim'], certa: 0, traducao: 'Gosto de nadar no mar. É a minha coisa favorita no verão.' },
    { frase: 'I expect ___ beautiful places on my trip.', opcoes: ['seeing', 'to see', 'see'], certa: 1, traducao: 'Espero ver lugares lindos na viagem.' },
    { frase: 'They promised ___ me when they arrive in New York.', opcoes: ['calling', 'call', 'to call'], certa: 2, traducao: 'Eles prometeram me ligar quando chegarem a Nova York.' },
    { frase: 'Ever since she was a child, Emma ___ to travel the world.', opcoes: ['wanted', 'forgot', 'needed'], certa: 0, traducao: 'Desde criança, a Emma queria viajar pelo mundo.' },
    { frase: 'When she was 18, she ___ to make a bucket list.', opcoes: ['forgot', 'decided', 'promised'], certa: 1, traducao: 'Aos 18 anos, ela decidiu fazer uma bucket list.' },
    { frase: 'First, she ___ to save money, so she worked at a café.', opcoes: ['forgot', 'hated', 'needed'], certa: 2, traducao: 'Primeiro, ela precisou economizar, então trabalhou num café.' },
    { frase: 'She ___ to speak Spanish because she hoped to visit Spain.', opcoes: ['learned', 'forgot', 'promised'], certa: 0, traducao: 'Ela aprendeu a falar espanhol porque esperava visitar a Espanha.' },
    { frase: 'Her first plane ticket was to ___.', opcoes: ['Spain', 'Italy', 'Japan'], certa: 1, traducao: 'A primeira passagem dela foi para a Itália.' },
    { frase: 'She almost ___ to take pictures because she was busy enjoying the moment.', opcoes: ['decided', 'wanted', 'forgot'], certa: 2, traducao: 'Ela quase esqueceu de tirar fotos porque estava curtindo o momento.' },
    { frase: 'Emma saw the Northern Lights in ___.', opcoes: ['Norway', 'Brazil', 'Italy'], certa: 0, traducao: 'A Emma viu a aurora boreal na Noruega.' },
    { frase: 'A list of things you want to do in your life is a ___.', opcoes: ['shopping list', 'bucket list', 'menu'], certa: 1, traducao: 'Uma lista de coisas que você quer fazer na vida é uma bucket list.' },
    { frase: 'Bucket lists are usually about ___, not things.', opcoes: ['money', 'clothes', 'experiences'], certa: 2, traducao: 'As bucket lists geralmente são sobre experiências, não coisas.' }
  ]
});
</script>
