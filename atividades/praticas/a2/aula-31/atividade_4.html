/* A2 · Class 31 · Fala (Travelers' Culture Shocks)

  course: 'ativ-a2', aula: 31, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'In Brazil, people greet each other warmly.', dica: 0, traducao: 'No Brasil, as pessoas se cumprimentam calorosamente.' },
    { frase: 'People hug their friends happily.', dica: 0, traducao: 'As pessoas abraçam os amigos com alegria.' },

    { frase: 'Please cross the street carefully.', dica: 0, traducao: 'Por favor, atravesse a rua com cuidado.' },
    { frase: 'My neighbors talk really loudly.', dica: 0, traducao: 'Os meus vizinhos falam muito alto.' },
    { frase: 'In Japan, people speak quietly on the train.', dica: 0, traducao: 'No Japão, as pessoas falam baixo no trem.' },
    { frase: 'She speaks English perfectly.', dica: 0, traducao: 'Ela fala inglês perfeitamente.' },
    { frase: 'He plays soccer very well.', dica: 0, traducao: 'Ele joga futebol muito bem.' },
    { frase: 'I work hard during the week.', dica: 0, traducao: 'Trabalho muito durante a semana.' },
    { frase: 'The train moves incredibly fast.', dica: 0, traducao: 'O trem anda incrivelmente rápido.' },
    { frase: 'On Sundays, we have lunch slowly with the family.', dica: 0, traducao: 'Aos domingos, almoçamos devagar com a família.' },
    { frase: 'You can find fresh fruit easily.', dica: 0, traducao: 'Dá para achar fruta fresca facilmente.' },
    { frase: 'The food here is quite spicy.', dica: 0, traducao: 'A comida aqui é bem apimentada.' },
    { frase: 'People here are very friendly.', dica: 0, traducao: 'As pessoas aqui são muito simpáticas.' },
    { frase: 'He is a careful driver.', dica: 0, traducao: 'Ele é um motorista cuidadoso.' },
    { frase: 'He drives carefully.', dica: 0, traducao: 'Ele dirige com cuidado.' },
    { frase: 'Surprisingly, people have dinner very late.', dica: 0, traducao: 'Surpreendentemente, as pessoas jantam muito tarde.' },
    { frase: 'The waiter answered politely.', dica: 0, traducao: 'O garçom respondeu educadamente.' },
    { frase: 'I cook really badly.', dica: 0, traducao: 'Cozinho muito mal.' },
    { frase: 'Children here walk to school independently.', dica: 0, traducao: 'As crianças aqui vão a pé para a escola sozinhas.' }
  ]
});
