<script>
/* A2 · Class 31 · Gramática (Travelers' Culture Shocks)
   Adjetivo (descreve substantivo) x advérbio (descreve verbo, adjetivo ou advérbio);
   formação com -ly; irregulares fast, hard, well; modifiers very, quite, really antes do
   adjetivo/advérbio; friendly é adjetivo. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 31, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'In Japan, people speak ___ on the subway.', opcoes: ['quietly', 'quiet', 'quietlly'], certa: 0, traducao: 'No Japão, as pessoas falam baixo no metrô.' },
    { frase: 'My grandfather is a ___ driver.', opcoes: ['carefully', 'careful', 'carefuly'], certa: 1, traducao: 'O meu avô é um motorista cuidadoso.' },
    { frase: 'My grandfather drives ___.', opcoes: ['careful', 'carefuly', 'carefully'], certa: 2, traducao: 'O meu avô dirige com cuidado.' },
    { frase: 'She speaks French very ___.', opcoes: ['well', 'good', 'goodly'], certa: 0, traducao: 'Ela fala francês muito bem.' },
    { frase: 'This is a ___ restaurant.', opcoes: ['well', 'good', 'goodly'], certa: 1, traducao: 'Este é um restaurante bom.' },
    { frase: 'The trains in China go really ___.', opcoes: ['fastly', 'fastlly', 'fast'], certa: 2, traducao: 'Os trens na China andam muito rápido.' },
    { frase: 'Nurses work very ___.', opcoes: ['hard', 'hardly', 'hardlly'], certa: 0, traducao: 'Os enfermeiros trabalham muito.' },
    { frase: 'The waiter answered ___.', opcoes: ['polite', 'politely', 'politly'], certa: 1, traducao: 'O garçom respondeu educadamente.' },
    { frase: 'Our tour guide was very ___.', opcoes: ['politely', 'friendlily', 'friendly'], certa: 2, traducao: 'O nosso guia era muito simpático.' },
    { frase: 'In Mexico, some dishes are ___ spicy.', opcoes: ['really', 'real', 'reallly'], certa: 0, traducao: 'No México, alguns pratos são muito apimentados.' },
    { frase: 'The streets are ___ in the afternoon.', opcoes: ['quietly', 'quiet', 'quietlly'], certa: 1, traducao: 'As ruas ficam tranquilas à tarde.' },
    { frase: 'People in my city drive ___.', opcoes: ['dangerous', 'dangerousily', 'dangerously'], certa: 2, traducao: 'As pessoas na minha cidade dirigem perigosamente.' },
    { frase: 'I can do this exercise ___. It is simple.', opcoes: ['easily', 'easy', 'easyly'], certa: 0, traducao: 'Consigo fazer este exercício facilmente. É simples.' },
    { frase: 'The test was ___.', opcoes: ['easily', 'easy', 'easyly'], certa: 1, traducao: 'A prova foi fácil.' },
    { frase: 'My sister sings ___. Nobody likes her singing!', opcoes: ['well', 'bad', 'badly'], certa: 2, traducao: 'A minha irmã canta mal. Ninguém gosta de ouvi-la cantar!' },
    { frase: 'He finished the race ___.', opcoes: ['quickly', 'quick', 'quicklly'], certa: 0, traducao: 'Ele terminou a corrida rapidamente.' },
    { frase: 'Where does the modifier go? In Spain, people eat dinner ___.', opcoes: ['late really', 'really late', 'lately really'], certa: 1, traducao: 'Na Espanha, as pessoas jantam muito tarde.' },
    { frase: 'Where does the adverb go? ___.', opcoes: ['She slowly eats her lunch slowly', 'She eats slowly her lunch', 'She eats her lunch slowly'], certa: 2, traducao: 'Ela almoça devagar.' },
    { frase: 'The kids are playing ___ in the park.', opcoes: ['happily', 'happy', 'happyly'], certa: 0, traducao: 'As crianças estão brincando felizes no parque.' },
    { frase: 'Your English is ___ good!', opcoes: ['incredible', 'incredibly', 'incrediblely'], certa: 1, traducao: 'O seu inglês é incrivelmente bom!' },
    { frase: 'The fans sang ___ at the stadium.', opcoes: ['loudily', 'loudlly', 'loudly'], certa: 2, traducao: 'Os torcedores cantaram alto no estádio.' },
    { frase: 'It was a ___ trip. Everything was perfect!', opcoes: ['wonderful', 'wonderfully', 'wonderfullly'], certa: 0, traducao: 'Foi uma viagem maravilhosa. Tudo foi perfeito!' },
    { frase: 'She dances ___.', opcoes: ['beautiful', 'beautifully', 'beautifuly'], certa: 1, traducao: 'Ela dança lindamente.' },
    { frase: 'Adverbs of manner describe ___.', opcoes: ['nouns', 'people', 'how we do things'], certa: 2, traducao: 'Os advérbios de modo descrevem como fazemos as coisas.' }
  ]
});
</script>
