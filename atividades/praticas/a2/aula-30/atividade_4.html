  course: 'ativ-a2', aula: 30, num: 4, tipo: 'fala',

  itens: [
    { frase: 'How much milk do you drink every day?', dica: 0, traducao: 'Quanto leite você bebe por dia?' },

    { frase: 'I eat a few cookies on the weekend.', dica: 0, traducao: 'Como alguns biscoitos no fim de semana.' },
    { frase: 'I put a little sugar in my coffee.', dica: 0, traducao: 'Coloco um pouco de açúcar no café.' },
    { frase: "I don't eat much bread.", dica: 0, traducao: 'Não como muito pão.' },

    { frase: "I don't drink any soda.", dica: 0, traducao: 'Não bebo refrigerante nenhum.' },
    { frase: 'I think I eat too much sugar.', dica: 0, traducao: 'Acho que como açúcar demais.' },
    { frase: 'Yesterday, I had a slice of pizza and a can of soda.', dica: 0, traducao: 'Ontem, comi uma fatia de pizza e tomei uma lata de refrigerante.' },

});
