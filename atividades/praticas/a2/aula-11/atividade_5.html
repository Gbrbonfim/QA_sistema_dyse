<script>
/* A2 · Class 11 · Gramática (Housework and Exercise)
   Alinhado ao "Grammar Point" — posição dos advérbios de frequência (antes do verbo, depois do
   be, entre don't / doesn't e o verbo), expressões (once, twice, three times a week, every
   month) e as tarefas (do the laundry, make the bed, do homework...). Conteúdo NOVO. 24
   questões. */
const OK = 'Which sentence is correct?';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 11, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { instrucao: OK, frase: '___', opcoes: ['He sometimes irons clothes.', 'He irons sometimes clothes.', 'Sometimes he irons clothes sometimes.'], certa: 0, traducao: 'Ele às vezes passa roupa.' },
    { instrucao: OK, frase: '___', opcoes: ["I'm stressed hardly ever.", "I'm hardly ever stressed.", "I hardly ever am stressed."], certa: 1, traducao: 'Eu quase nunca estou estressado.' },
    { instrucao: OK, frase: '___', opcoes: ['Do usually you sweep the floor?', 'Do you sweep usually the floor?', 'Do you usually sweep the floor?'], certa: 2, traducao: 'Você normalmente varre o chão?' },
    { instrucao: OK, frase: '___', opcoes: ["She doesn't often clean the kitchen.", "She often doesn't cleans the kitchen.", "She doesn't clean often the kitchen."], certa: 0, traducao: 'Ela não limpa a cozinha com frequência.' },
    { instrucao: OK, frase: '___', opcoes: ['My sister usually is here in the morning.', 'My sister is usually here in the morning.', 'Usually my sister is here usually.'], certa: 1, traducao: 'A minha irmã normalmente está aqui de manhã.' },
    { instrucao: OK, frase: '___', opcoes: ['We go always to the gym.', 'We go to the gym always.', 'We always go to the gym.'], certa: 2, traducao: 'Nós sempre vamos à academia.' },
    { instrucao: OK, frase: '___', opcoes: ['He cleans the kitchen twice a week.', 'He cleans twice a week the kitchen.', 'He twice a week cleans the kitchen.'], certa: 0, traducao: 'Ele limpa a cozinha duas vezes por semana.' },
    { frase: 'I mop the floor ___ a week, on Wednesdays and Fridays.', opcoes: ['once', 'twice', 'three times'], certa: 1, traducao: 'Passo pano no chão duas vezes por semana, às quartas e sextas.' },
    { frase: 'I iron clothes ___ a week, only on Thursdays.', opcoes: ['twice', 'three times', 'once'], certa: 2, traducao: 'Passo roupa uma vez por semana, só às quintas.' },
    { frase: 'He ___ does housework. His mom does everything.', opcoes: ['never', 'always', 'usually'], certa: 0, traducao: 'Ele nunca faz tarefas domésticas. A mãe dele faz tudo.' },
    { frase: 'She ___ finishes work at 6, but on Fridays she finishes at 5.', opcoes: ['never', 'usually', 'hardly ever'], certa: 1, traducao: 'Ela normalmente termina o trabalho às 6, mas às sextas termina às 5.' },
    { frase: 'They work from home ___ a month: in the first, second and last weeks.', opcoes: ['once', 'twice', 'three times'], certa: 2, traducao: 'Eles trabalham de casa três vezes por mês.' },
    { frase: 'I go running on Mondays, Tuesdays, Wednesdays, Thursdays, Fridays, Saturdays and Sundays. I run ___.', opcoes: ['every day', 'once a week', 'every month'], certa: 0, traducao: 'Corro todos os dias.' },
    { frase: 'We pay the rent ___, on the 5th.', opcoes: ['every day', 'every month', 'twice a day'], certa: 1, traducao: 'Pagamos o aluguel todo mês, no dia 5.' },
    { frase: 'My clothes are dirty. I need to ___ the laundry.', opcoes: ['make', 'clean', 'do'], certa: 2, traducao: 'As minhas roupas estão sujas. Preciso lavar a roupa.' },
    { frase: 'I ___ my bed every morning.', opcoes: ['make', 'do', 'clean'], certa: 0, traducao: 'Arrumo a minha cama todas as manhãs.' },
    { frase: 'The children ___ their homework after school.', opcoes: ['make', 'do', 'go'], certa: 1, traducao: 'As crianças fazem a lição depois da escola.' },
    { frase: 'He goes to the gym. He ___ exercise every day.', opcoes: ['makes', 'plays', 'does'], certa: 2, traducao: 'Ele vai à academia. Faz exercício todo dia.' },
    { frase: 'The floor is dirty. Can you ___ it, please?', opcoes: ['sweep', 'iron', 'load'], certa: 0, traducao: 'O chão está sujo. Você pode varrê-lo, por favor?' },
    { frase: 'My shirt is clean, but I need to ___ it.', opcoes: ['unload', 'iron', 'mop'], certa: 1, traducao: 'A minha camisa está limpa, mas preciso passá-la.' },
    { frase: "We're home from the supermarket. Let's ___ the car.", opcoes: ['mop', 'iron', 'unload'], certa: 2, traducao: 'Chegamos do supermercado. Vamos descarregar o carro.' },
    { frase: 'Your clothes are on the bed. Put them ___, please.', opcoes: ['away', 'under', 'between'], certa: 0, traducao: 'As suas roupas estão na cama. Guarde-as, por favor.' },
    { frase: 'How ___ do you clean the bathroom?', opcoes: ['many', 'often', 'much times'], certa: 1, traducao: 'Com que frequência você limpa o banheiro?' },
    { frase: 'Why ___ you always angry?', opcoes: ['do', 'does', 'are'], certa: 2, traducao: 'Por que você está sempre bravo?' }
  ]
});
</script>
