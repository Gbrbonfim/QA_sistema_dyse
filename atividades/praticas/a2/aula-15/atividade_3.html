<script>
/* A2 · Class 15 · Leitura (We're Working From Home)
   Alinhado ao tema do slide (problemas de quem trabalha de casa) e ao present continuous nas
   três formas. Conteúdo NOVO: a Laura trabalha de casa e liga para o colega Tom, que está no
   escritório. 20 questões: 12 de "próxima fala" + 8 de compreensão. */
const D = [
  ['Tom', 'Hi, Laura! Are you working from home today?'],
  ['Laura', "Yes, I am. But it isn't easy! The children are making a lot of noise."],
  ['Tom', 'Oh no! What are they doing?'],
  ['Laura', "They're playing video games in the living room."],
  ['Tom', 'And where are you?'],
  ['Laura', "I'm in the study. I'm writing the report for Mr. Brown."],
  ['Tom', 'Great! Is the internet working well?'],
  ['Laura', "No, it isn't. My husband is watching a movie online, and the Wi-Fi is slow."],
  ['Tom', 'What is that noise? Is the dog barking?'],
  ['Laura', 'Yes, it is! The neighbors are cutting the plants in the garden.'],
  ['Tom', "Ha ha! Here at the office it's very quiet. Everybody is working."],
  ['Laura', 'Lucky you! Are you having lunch now?'],
  ['Tom', "No, I'm not. I'm preparing a presentation for a meeting."],
  ['Laura', "OK. I'm finishing the report now."],
  ['Tom', 'Perfect. Thanks, Laura!'],
  ['Laura', 'Bye, Tom! Oh no, now the baby is crying!']
];
const lado = q => q === 'Tom' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a2', aula: 15, num: 3, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ["Yes, I am. But it isn't easy! The children are making a lot of noise.", "Yes, I do. But it isn't easy! The children is making a lot of noise.", "Yes, I am. But it isn't easy! The children are makeing a lot of noise."], 0, 'Sim. Mas não é fácil! As crianças estão fazendo muito barulho.'),
    prox(2, ['Oh no! What do they doing?', 'Oh no! What are they doing?', 'Oh no! What they are doing?'], 1, 'Ah, não! O que elas estão fazendo?'),
    prox(3, ["They playing video games in the living room.", "They're play video games in the living room.", "They're playing video games in the living room."], 2, 'Estão jogando videogame na sala.'),
    prox(5, ["I'm in the study. I'm writing the report for Mr. Brown.", "I'm in the study. I'm writeing the report for Mr. Brown.", "I'm in the study. I writing the report for Mr. Brown."], 0, 'Estou no escritório. Estou escrevendo o relatório para o Sr. Brown.'),
    prox(6, ['Great! Are the internet working well?', 'Great! Is the internet working well?', 'Great! Does the internet working well?'], 1, 'Ótimo! A internet está funcionando bem?'),
    prox(7, ["No, it isn't. My husband are watching a movie online.", "No, it don't. My husband is watching a movie online.", "No, it isn't. My husband is watching a movie online, and the Wi-Fi is slow."], 2, 'Não. O meu marido está assistindo a um filme online, e o Wi-Fi está lento.'),
    prox(8, ['What is that noise? Is the dog barking?', 'What is that noise? Is the dog bark?', 'What is that noise? Are the dog barking?'], 0, 'Que barulho é esse? O cachorro está latindo?'),
    prox(9, ['Yes, it does! The neighbors are cuting the plants in the garden.', 'Yes, it is! The neighbors are cutting the plants in the garden.', 'Yes, it is! The neighbors is cutting the plants in the garden.'], 1, 'Sim! Os vizinhos estão cortando as plantas no jardim.'),
    prox(10, ["Ha ha! Here at the office it's very quiet. Everybody are working.", "Ha ha! Here at the office it's very quiet. Everybody working.", "Ha ha! Here at the office it's very quiet. Everybody is working."], 2, 'Ha ha! Aqui no escritório está muito tranquilo. Todo mundo está trabalhando.'),
    prox(11, ['Lucky you! Are you having lunch now?', 'Lucky you! Are you haveing lunch now?', 'Lucky you! Do you having lunch now?'], 0, 'Sorte sua! Você está almoçando agora?'),
    prox(12, ["No, I amn't. I'm preparing a presentation for a meeting.", "No, I'm not. I'm preparing a presentation for a meeting.", "No, I don't. I preparing a presentation for a meeting."], 1, 'Não. Estou preparando uma apresentação para uma reunião.'),
    prox(13, ["OK. I'm finish the report now.", "OK. I finishing the report now.", "OK. I'm finishing the report now."], 2, 'Certo. Estou terminando o relatório agora.'),
    { instrucao: 'Where is Laura working today?', frase: 'At ___.', opcoes: ['home', 'the office', 'school'], certa: 0, traducao: 'Em casa.' },
    { instrucao: 'Where are the children playing?', frase: 'In the ___.', opcoes: ['garden', 'living room', 'study'], certa: 1, traducao: 'Na sala.' },
    { instrucao: 'What is Laura writing?', frase: 'The ___ for Mr. Brown.', opcoes: ['email', 'book', 'report'], certa: 2, traducao: 'O relatório para o Sr. Brown.' },
    { instrucao: 'Why is the Wi-Fi slow?', frase: 'Her husband is watching a ___ online.', opcoes: ['movie', 'class', 'game'], certa: 0, traducao: 'O marido dela está assistindo a um filme online.' },
    { instrucao: 'Why is the dog barking?', frase: 'The neighbors are cutting the ___.', opcoes: ['trees in the street', 'plants in the garden', 'grass in the park'], certa: 1, traducao: 'Os vizinhos estão cortando as plantas no jardim.' },
    { instrucao: 'How is the office?', frase: 'It is very ___.', opcoes: ['noisy', 'busy', 'quiet'], certa: 2, traducao: 'Muito tranquilo.' },
    { instrucao: 'Is Tom having lunch now?', frase: '___. He is preparing a presentation.', opcoes: ["No, he isn't", "Yes, he is", "No, he doesn't"], certa: 0, traducao: 'Não. Ele está preparando uma apresentação.' },
    { instrucao: 'Who is crying at the end?', frase: 'The ___.', opcoes: ['dog', 'baby', 'husband'], certa: 1, traducao: 'O bebê.' }
  ]
});
</script>
