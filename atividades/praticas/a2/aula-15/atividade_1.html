<title>DYSE · A2 · Aula 15 · Where are they?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 · Class 15 · Escuta (We're Working From Home)
   Alinhado ao listening do slide (conversas em casa: bedroom, living room, garage, study,
   bathroom) e ao present continuous. Conteúdo NOVO: o aluno ouve o que a pessoa está fazendo
   agora e escolhe o cômodo. As iscas nunca são um lugar possível para a ação. 24 questões. */
const IC = { 'bedroom': 'bed', 'living room': 'weekend', 'garage': 'garage', 'study': 'desk', 'bathroom': 'bathtub', 'kitchen': 'kitchen' };
let n = 0;
const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 4;
  const nomes = iscas.slice(0, 3);
  nomes.splice(pos, 0, certa);
  return { audioTexto, opcoes: nomes.map(c => ({ label: c, icon: IC[c] })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-a2', aula: 15, num: 1, tipo: 'imagem',
  instrucao: 'Listen: where is the person?',
  itens: [
    q("I'm taking a shower. I can't talk now!", 'bathroom', ['kitchen', 'garage', 'study']),
    q("Dad is fixing the car. He's using a lot of tools.", 'garage', ['bedroom', 'bathroom', 'study']),
    q("I'm making dinner. The pasta is almost ready.", 'kitchen', ['bathroom', 'garage', 'bedroom']),
    q("The kids are sleeping. They're in bed.", 'bedroom', ['kitchen', 'garage', 'bathroom']),
    q("We're watching a movie on the sofa.", 'living room', ['bathroom', 'garage', 'kitchen']),
    q("I'm brushing my teeth.", 'bathroom', ['living room', 'garage', 'study']),
    q("She's washing the dishes after lunch.", 'kitchen', ['bedroom', 'garage', 'study']),
    q("I'm working at my desk. I'm writing a report on my computer.", 'study', ['bathroom', 'garage', 'kitchen']),
    q("He's parking the car.", 'garage', ['bedroom', 'kitchen', 'study']),
    q("My sister is getting dressed for work. Her clothes are on the bed.", 'bedroom', ['garage', 'kitchen', 'study']),
    q("I'm having a video call with my boss. My books and my computer are here.", 'study', ['bathroom', 'garage', 'kitchen']),
    q("The family is sitting on the sofa and talking.", 'living room', ['bathroom', 'garage', 'kitchen']),
    q("I'm washing my hair.", 'bathroom', ['kitchen', 'study', 'living room']),
    q("Mom is cooking eggs for breakfast.", 'kitchen', ['bathroom', 'bedroom', 'garage']),
    q("I'm not working now. I'm sleeping!", 'bedroom', ['kitchen', 'garage', 'study']),
    q("Grandpa is watching the news on TV, on his big sofa.", 'living room', ['bathroom', 'garage', 'kitchen']),
    q("We're cleaning the car before our trip.", 'garage', ['bedroom', 'bathroom', 'study']),
    q("I'm reading emails at my desk. It's my home office.", 'study', ['bathroom', 'garage', 'kitchen']),
    q("He's making coffee and toast.", 'kitchen', ['bathroom', 'bedroom', 'garage']),
    q("The baby is having a bath.", 'bathroom', ['kitchen', 'garage', 'study']),
    q("They're playing video games on the big TV, next to the sofa.", 'living room', ['bathroom', 'garage', 'kitchen']),
    q("I'm putting my bike next to the car.", 'garage', ['bedroom', 'bathroom', 'kitchen']),
    q("She's getting up. She's sitting on her bed.", 'bedroom', ['kitchen', 'garage', 'study']),
    q("I'm studying for a test at my desk, with my books.", 'study', ['bathroom', 'garage', 'kitchen'])
  ]
});
</script>
</body>
</html>
