<script>
/* A2 · Class 15 · Fala (We're Working From Home)
   Alinhado ao information gap do slide (descrever o que as pessoas estão fazendo numa casa) e
   ao foco fonético da aula: terminação -ing sem vogal final e contrações I'm, she's, they're.
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 15, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "I'm working from home today.", dica: 0, traducao: 'Estou trabalhando de casa hoje.' },
    { frase: "She's talking to her boss on the phone.", dica: 0, traducao: 'Ela está falando com o chefe ao telefone.' },
    { frase: "They're watching TV in the living room.", dica: 0, traducao: 'Eles estão vendo TV na sala.' },
    { frase: 'The dog is playing with the boy.', dica: 0, traducao: 'O cachorro está brincando com o menino.' },
    { frase: "In my house, the woman is reading a book.", dica: 0, traducao: 'Na minha casa, a mulher está lendo um livro.' },
    { frase: "That's different. In my house, she's sleeping.", dica: 0, traducao: 'Isso é diferente. Na minha casa, ela está dormindo.' },
    { frase: "I'm not listening to music.", dica: 0, traducao: 'Não estou ouvindo música.' },
    { frase: "The internet isn't working.", dica: 0, traducao: 'A internet não está funcionando.' },
    { frase: 'Are you working in the office today?', dica: 0, traducao: 'Você está trabalhando no escritório hoje?' },
    { frase: "Yes, I am. I'm having a lot of meetings.", dica: 0, traducao: 'Sim. Estou tendo muitas reuniões.' },
    { frase: 'Is the baby sleeping?', dica: 0, traducao: 'O bebê está dormindo?' },
    { frase: "No, she isn't. She's crying.", dica: 0, traducao: 'Não. Ela está chorando.' },
    { frase: "We're making dinner in the kitchen.", dica: 0, traducao: 'Estamos fazendo o jantar na cozinha.' },
    { frase: "He's running in the park.", dica: 0, traducao: 'Ele está correndo no parque.' },
    { frase: "The children are swimming in the pool.", dica: 0, traducao: 'As crianças estão nadando na piscina.' },
    { frase: "My neighbors are making a lot of noise.", dica: 0, traducao: 'Os meus vizinhos estão fazendo muito barulho.' },
    { frase: "I'm getting a lot of distractions here.", dica: 0, traducao: 'Estou tendo muitas distrações aqui.' },
    { frase: 'What are you doing right now?', dica: 0, traducao: 'O que você está fazendo agora?' },
    { frase: "I'm studying English and drinking coffee.", dica: 0, traducao: 'Estou estudando inglês e tomando café.' },
    { frase: "My husband is washing the car in the garage.", dica: 0, traducao: 'O meu marido está lavando o carro na garagem.' }
  ]
});
</script>
