<script>
/* A2 · Class 15 · Gramática (We're Working From Home)
   Present continuous: am/is/are certo para cada sujeito, negativa (isn't / aren't / 'm not),
   perguntas (Am / Is / Are), short answers e ortografia do -ing (making, getting, running,
   swimming, stopping, planning). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 15, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I ___ working from home this week.', opcoes: ['am', 'is', 'are'], certa: 0, traducao: 'Estou trabalhando de casa esta semana.' },
    { frase: 'My brother ___ playing the guitar in his bedroom.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O meu irmão está tocando violão no quarto dele.' },
    { frase: 'The kids ___ watching cartoons.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'As crianças estão vendo desenho.' },
    { frase: "Shh! The baby is ___.", opcoes: ['sleeping', 'sleep', 'sleeps'], certa: 0, traducao: 'Shh! O bebê está dormindo.' },
    { frase: 'She is ___ a cake for the party.', opcoes: ['makeing', 'making', 'makking'], certa: 1, traducao: 'Ela está fazendo um bolo para a festa.' },
    { frase: 'He is ___ a letter to his grandmother.', opcoes: ['writting', 'writeing', 'writing'], certa: 2, traducao: 'Ele está escrevendo uma carta para a avó.' },
    { frase: "We're ___ in the sea.", opcoes: ['swimming', 'swiming', 'swimmming'], certa: 0, traducao: 'Estamos nadando no mar.' },
    { frase: 'Look! The cat is ___ after the bird.', opcoes: ['runing', 'running', 'runeing'], certa: 1, traducao: 'Olha! O gato está correndo atrás do passarinho.' },
    { frase: "I'm ___ ready for work.", opcoes: ['geting', 'getteing', 'getting'], certa: 2, traducao: 'Estou me arrumando para o trabalho.' },
    { frase: 'They are ___ their next trip.', opcoes: ['planning', 'planing', 'planeing'], certa: 0, traducao: 'Eles estão planejando a próxima viagem.' },
    { frase: 'Why are you ___ the car here?', opcoes: ['stoping', 'stopping', 'stopeing'], certa: 1, traducao: 'Por que você está parando o carro aqui?' },
    { frase: 'He is ___ his bills online.', opcoes: ['paiing', 'payying', 'paying'], certa: 2, traducao: 'Ele está pagando as contas online.' },
    { frase: "Sorry, I ___ listening. Can you repeat?", opcoes: ['am not', "isn't", "aren't"], certa: 0, traducao: 'Desculpa, não estou prestando atenção. Pode repetir?' },
    { frase: "The printer ___ working.", opcoes: ["aren't", "isn't", 'am not'], certa: 1, traducao: 'A impressora não está funcionando.' },
    { frase: "We ___ using the Wi-Fi right now.", opcoes: ["isn't", 'am not', "aren't"], certa: 2, traducao: 'Não estamos usando o Wi-Fi agora.' },
    { frase: '___ you having a video call?', opcoes: ['Are', 'Is', 'Do'], certa: 0, traducao: 'Você está numa videochamada?' },
    { frase: '___ your dad cooking dinner right now?', opcoes: ['Are', 'Is', 'Does'], certa: 1, traducao: 'O seu pai está fazendo o jantar agora?' },
    { frase: '___ I using the right password?', opcoes: ['Is', 'Are', 'Am'], certa: 2, traducao: 'Estou usando a senha certa?' },
    { frase: 'What ___ the neighbors doing?', opcoes: ['are', 'is', 'do'], certa: 0, traducao: 'O que os vizinhos estão fazendo?' },
    { frase: 'Are your parents traveling this week? — Yes, they ___.', opcoes: ['do', 'are', 'is'], certa: 1, traducao: 'Os seus pais estão viajando esta semana? — Sim.' },
    { frase: "Is Julia having lunch? — No, she ___.", opcoes: ["doesn't", "aren't", "isn't"], certa: 2, traducao: 'A Julia está almoçando? — Não.' },
    { frase: "Are you studying? — Yes, I ___.", opcoes: ['am', 'are', 'do'], certa: 0, traducao: 'Você está estudando? — Sim.' },
    { frase: 'Sarah ___ to her boss on the phone at the moment.', opcoes: ['talking', 'is talking', 'are talking'], certa: 1, traducao: 'A Sarah está falando com o chefe ao telefone no momento.' },
    { frase: 'Some people ___ the plants in the garden.', opcoes: ['is cutting', 'are cuting', 'are cutting'], certa: 2, traducao: 'Algumas pessoas estão cortando as plantas do jardim.' }
  ]
});
</script>
