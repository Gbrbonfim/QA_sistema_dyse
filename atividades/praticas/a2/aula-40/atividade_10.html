<script>
/* A2 · Class 41 · Gramática (Grab and Go!)
   Alinhado ao "Grammar Point" (present perfect sem tempo definido x past simple com
   yesterday / last week / in 2023; nada de present perfect com yesterday; been x gone) e aos
   exercícios 5, 6 e 7 da aula. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 40, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: '___ to an Amazon Go store?', opcoes: ['Have you ever been', 'Did you ever been', 'Have you ever went'], certa: 0, traducao: 'Você já foi a uma loja Amazon Go?' },
    { frase: 'My friend ___ a snack at Amazon Go yesterday.', opcoes: ['has bought', 'bought', 'have bought'], certa: 1, traducao: 'O meu amigo comprou um lanche na Amazon Go ontem.' },
    { frase: 'We ___ the app to enter the store that morning.', opcoes: ['have used', 'has used', 'used'], certa: 2, traducao: 'Usamos o app para entrar na loja naquela manhã.' },
    { frase: '___ something you didn\'t like?', opcoes: ['Have you ever returned', 'Did you ever returned', 'Have you ever return'], certa: 0, traducao: 'Você já devolveu algo de que não gostou?' },
    { frase: 'My brother ___ to Amazon Go. He is shopping there now.', opcoes: ['has been', 'has gone', 'went yesterday'], certa: 1, traducao: 'O meu irmão foi à Amazon Go. Está fazendo compras lá agora.' },
    { frase: "Let's try Amazon Go. I've never ___ there.", opcoes: ['gone', 'went', 'been'], certa: 2, traducao: 'Vamos experimentar a Amazon Go. Nunca fui lá.' },
    { frase: "My dad isn't home. He's ___ to the supermarket.", opcoes: ['gone', 'been', 'went'], certa: 0, traducao: 'O meu pai não está em casa. Ele foi ao supermercado.' },
    { frase: "I've never ___ to a store with no checkout.", opcoes: ['gone', 'been', 'go'], certa: 1, traducao: 'Nunca fui a uma loja sem caixa.' },
    { frase: "My sister isn't in the house. She's ___ shopping.", opcoes: ['been', 'go', 'gone'], certa: 2, traducao: 'A minha irmã não está em casa. Saiu para fazer compras.' },
    { frase: "We have lots of snacks because we've ___ to the store.", opcoes: ['been', 'gone', 'go'], certa: 0, traducao: 'Temos muitos lanches porque fomos à loja.' },
    { frase: 'Have you ever been to an Amazon Go store? No, but I ___ to a similar store in Chicago last year.', opcoes: ['have gone', 'went', 'have been'], certa: 1, traducao: 'Você já foi a uma Amazon Go? Não, mas fui a uma loja parecida em Chicago no ano passado.' },
    { frase: 'Yes, I have. I ___ some clothes last month.', opcoes: ['have ordered', 'order', 'ordered'], certa: 2, traducao: 'Sim. Pedi umas roupas no mês passado.' },
    { frase: '___ it go well?', opcoes: ['Did', 'Has', 'Have'], certa: 0, traducao: 'Deu tudo certo?' },
    { frase: 'The company ___ me the wrong color.', opcoes: ['has sent', 'sent', 'sended'], certa: 1, traducao: 'A empresa me mandou a cor errada.' },
    { frase: '___ you shopped on Amazon before?', opcoes: ['Did', 'Has', 'Have'], certa: 2, traducao: 'Você já comprou na Amazon antes?' },
    { frase: 'A package ___ late last week, but everything else was fine.', opcoes: ['arrived', 'has arrived', 'arrive'], certa: 0, traducao: 'Um pacote chegou atrasado semana passada, mas o resto deu certo.' },
    { frase: 'We use the past simple with words like ___.', opcoes: ['ever and never', 'yesterday and last week', 'already'], certa: 1, traducao: 'Usamos o past simple com palavras como yesterday e last week.' },
    { frase: '"I\'ve bought a snack yesterday" is ___.', opcoes: ['correct', 'very formal', 'wrong'], certa: 2, traducao: '"I\'ve bought a snack yesterday" está errado.' },
    { frase: '"Been" means you went and ___.', opcoes: ['came back', 'are still there', 'never went'], certa: 0, traducao: '"Been" significa que você foi e voltou.' },
    { frase: '"He\'s gone to Amazon Go" means he is ___ now.', opcoes: ['at home', 'there', 'back'], certa: 1, traducao: '"He\'s gone to Amazon Go" significa que ele está lá agora.' },
    { frase: 'Have you ever bought second-hand clothes? Yes, I ___.', opcoes: ['did', 'bought', 'have'], certa: 2, traducao: 'Você já comprou roupas usadas? Sim.' },
    { frase: 'Have you ever forgotten to pay for something? No, I ___.', opcoes: ["haven't", "didn't", "don't"], certa: 0, traducao: 'Você já esqueceu de pagar algo? Não.' },
    { frase: 'When ___ you go to the new mall?', opcoes: ['have', 'did', 'has'], certa: 1, traducao: 'Quando você foi ao shopping novo?' },
    { frase: "I haven't ___ my receipt, so I can't return the shirt.", opcoes: ['find', 'founded', 'found'], certa: 2, traducao: 'Não achei o meu recibo, então não posso devolver a camisa.' }
  ]
});
</script>
