DysePratica.iniciar({

  itens: [
    { frase: 'I sometimes buy things on Amazon.', dica: 0, traducao: 'Às vezes compro coisas na Amazon.' },
    { frase: 'I prefer buying things in physical stores.', dica: 0, traducao: 'Prefiro comprar em lojas físicas.' },

    { frase: 'I put things back when they are too expensive.', dica: 0, traducao: 'Coloco as coisas de volta quando estão caras demais.' },
    { frase: 'Use the app to enter the store.', dica: 0, traducao: 'Use o app para entrar na loja.' },
    { frase: 'Grab what you want and put it in your bag.', dica: 0, traducao: 'Pegue o que quiser e coloque na bolsa.' },
    { frase: 'If you change your mind, just put it back.', dica: 0, traducao: 'Se mudar de ideia, é só colocar de volta.' },
    { frase: 'Then just walk out.', dica: 0, traducao: 'Depois é só sair.' },
    { frase: 'No lines, no checkout, no problem.', dica: 0, traducao: 'Sem filas, sem caixa, sem problema.' },
    { frase: 'Excuse me, where are the fitting rooms?', dica: 0, traducao: 'Com licença, onde ficam os provadores?' },
    { frase: 'Can I have a shopping bag, please?', dica: 0, traducao: 'Pode me dar uma sacola, por favor?' },
    { frase: 'There was a long line at the checkout.', dica: 0, traducao: 'Tinha uma fila longa no caixa.' },
    { frase: 'Can I have the receipt, please?', dica: 0, traducao: 'Pode me dar o recibo, por favor?' },
    { frase: 'These shoes are on sale.', dica: 0, traducao: 'Estes sapatos estão em promoção.' },
    { frase: 'The shop assistant was very helpful.', dica: 0, traducao: 'O vendedor foi muito prestativo.' },
    { frase: 'I looked at the price tag and put it back.', dica: 0, traducao: 'Olhei a etiqueta de preço e coloquei de volta.' },
    { frase: 'My virtual cart is full!', dica: 0, traducao: 'O meu carrinho virtual está cheio!' },
    { frase: 'Shopping online is faster.', dica: 0, traducao: 'Comprar pela internet é mais rápido.' },
    { frase: 'I like talking to people when I shop.', dica: 0, traducao: 'Gosto de conversar com as pessoas quando faço compras.' }
  ]
