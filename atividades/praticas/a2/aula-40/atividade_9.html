/* A2 · Class 41 · Fala (Grab and Go!)
   Alinhado ao "Speaking" (Have you ever...? com respostas curtas e informação extra no past
   simple) e às regras de been x gone. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 40, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Have you ever bought something online?', dica: 0, traducao: 'Você já comprou algo pela internet?' },
    { frase: 'Yes, I have. I bought a phone last year.', dica: 0, traducao: 'Sim. Comprei um celular no ano passado.' },
    { frase: 'Have you ever had a problem with a delivery?', dica: 0, traducao: 'Você já teve problema com uma entrega?' },
    { frase: "No, I haven't.", dica: 0, traducao: 'Não, nunca.' },
    { frase: 'Have you ever taken something back to a store?', dica: 0, traducao: 'Você já devolveu algo numa loja?' },
    { frase: 'I took a shirt back last week.', dica: 0, traducao: 'Devolvi uma camisa semana passada.' },
    { frase: 'Have you ever bought the wrong size?', dica: 0, traducao: 'Você já comprou o tamanho errado?' },
    { frase: 'Have you ever spent too much money shopping?', dica: 0, traducao: 'Você já gastou dinheiro demais fazendo compras?' },
    { frase: 'Have you ever lost a receipt?', dica: 0, traducao: 'Você já perdeu um recibo?' },
    { frase: 'Have you ever bought a gift for someone?', dica: 0, traducao: 'Você já comprou um presente para alguém?' },
    { frase: 'I bought a gift for my mother on her birthday.', dica: 0, traducao: 'Comprei um presente para a minha mãe no aniversário dela.' },
    { frase: 'Have you ever used a shopping app on your phone?', dica: 0, traducao: 'Você já usou um app de compras no celular?' },
    { frase: 'Have you ever found something good on sale?', dica: 0, traducao: 'Você já achou algo bom em promoção?' },
    { frase: "I've been to an Amazon Go store.", dica: 0, traducao: 'Já fui a uma loja Amazon Go.' },
    { frase: 'I went there last weekend.', dica: 0, traducao: 'Fui lá no fim de semana passado.' },
    { frase: "My dad isn't home. He's gone to the supermarket.", dica: 0, traducao: 'O meu pai não está em casa. Ele foi ao supermercado.' },
    { frase: "I've never been to a store with no checkout.", dica: 0, traducao: 'Nunca fui a uma loja sem caixa.' },
    { frase: 'When did you go?', dica: 0, traducao: 'Quando você foi?' },
    { frase: 'I ordered food online yesterday.', dica: 0, traducao: 'Pedi comida pela internet ontem.' },
    { frase: 'Have you ever waited a long time in line to pay?', dica: 0, traducao: 'Você já esperou muito tempo na fila para pagar?' }
  ]
});
</script>
