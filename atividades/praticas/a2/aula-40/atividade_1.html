<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 · Class 40 · Escuta (Grab and Go!)
   Alinhado ao "Vocabulary: Shopping" (app, line, checkout, receipt, sales, basket, customers,
   shopping bag, fitting rooms, shop assistant, virtual cart, price tag). Conteúdo NOVO: o
   aluno ouve uma definição ou situação e escolhe a palavra. 24 questões. */
const IC = {
  app: 'smartphone', line: 'groups', checkout: 'point_of_sale', receipt: 'receipt_long', sales: 'sell',
  basket: 'shopping_basket', customers: 'person', 'shopping bag': 'shopping_bag', 'fitting rooms': 'checkroom',
  'shop assistant': 'support_agent', 'virtual cart': 'shopping_cart', 'price tag': 'label'
};
let n = 0;
const q = (audioTexto, certo, d1, d2) => {
  const pos = n++ % 3;
  const labels = [d1, d2];
  labels.splice(pos, 0, certo);
  return { audioTexto, opcoes: labels.map(label => ({ label, icon: IC[label] })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-a2', aula: 40, num: 1, tipo: 'imagem',
  instrucao: 'Listen and choose the right word',
  itens: [
    q('You pay for your things here.', 'checkout', 'fitting rooms', 'basket'),
    q('It is a small paper that shows what you bought and how much you paid.', 'receipt', 'price tag', 'app'),
    q('You try on clothes here before you buy them.', 'fitting rooms', 'checkout', 'line'),
    q('It shows the price of a product.', 'price tag', 'receipt', 'shopping bag'),
    q('People wait in it to pay.', 'line', 'basket', 'app'),
    q('You carry your things in it while you shop in the supermarket.', 'basket', 'receipt', 'customers'),
    q('The people who buy things in a store.', 'customers', 'shop assistant', 'sales'),
    q('This person works in the store and helps you.', 'shop assistant', 'customers', 'price tag'),
    q('Everything is fifty percent off this week!', 'sales', 'receipt', 'line'),
    q('You put your things in it to take them home.', 'shopping bag', 'fitting rooms', 'checkout'),
    q('When you shop online, your products go in it.', 'virtual cart', 'basket', 'shopping bag'),
    q('You download it on your phone to enter the store.', 'app', 'receipt', 'sales'),
    q("I want to return this shirt, but I can't find the paper from the store.", 'receipt', 'app', 'basket'),
    q('There were twenty people in front of me to pay!', 'line', 'customers', 'virtual cart'),
    q('Can I try on these jeans, please?', 'fitting rooms', 'checkout', 'price tag'),
    q("Excuse me, can you help me find a jacket in my size?", 'shop assistant', 'customers', 'app'),
    q("I didn't buy it. I looked at it and it was too expensive!", 'price tag', 'shopping bag', 'line'),
    q('The shoes were cheaper because the store had them on discount.', 'sales', 'checkout', 'basket'),
    q('At Amazon Go, the technology updates it instantly.', 'virtual cart', 'receipt', 'fitting rooms'),
    q('The store was full of people buying things.', 'customers', 'shop assistant', 'price tag'),
    q('Do you need a plastic one or do you have your own?', 'shopping bag', 'line', 'app'),
    q('At Amazon Go, there is no line and no place to pay.', 'checkout', 'basket', 'sales'),
    q('I only need three things, so I took a small one at the entrance.', 'basket', 'virtual cart', 'receipt'),
    q('Use it on your phone to enter the Amazon Go store.', 'app', 'shopping bag', 'customers')
  ]
});
</script>

</html>
