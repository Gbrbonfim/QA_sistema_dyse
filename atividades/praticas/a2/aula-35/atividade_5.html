<script>
/* A2 · Class 35 · Gramática (Study Abroad: How to Pack)
   Alinhado ao "Grammar Point" (be going to: am / is / are + going to + verbo; planos x
   previsões; perguntas), à leitura sobre a Workaway (Merilin: Costa Rica, centro de ioga,
   aulas de ioga grátis e 40% de desconto no restaurante, conversa pelo WhatsApp) e ao
   vocabulário de mala. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 35, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I ___ going to study in Canada next year.', opcoes: ['am', 'is', 'are'], certa: 0, traducao: 'Vou estudar no Canadá no ano que vem.' },
    { frase: 'Paulo ___ going to work in Japan soon.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O Paulo vai trabalhar no Japão em breve.' },
    { frase: 'Samantha and Joseph ___ going to live in Canada.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'A Samantha e o Joseph vão morar no Canadá.' },
    { frase: 'We are going to ___ Portuguese next semester.', opcoes: ['learn', 'learning', 'learned'], certa: 0, traducao: 'Vamos aprender português no próximo semestre.' },
    { frase: 'When ___ you going to leave for France?', opcoes: ['do', 'are', 'is'], certa: 1, traducao: 'Quando você vai partir para a França?' },
    { frase: '___ you going to speak French?', opcoes: ['Do', 'Is', 'Are'], certa: 2, traducao: 'Você vai falar francês?' },
    { frase: 'I ___ going to take a lot of clothes. Only two suitcases!', opcoes: ["'m not", "don't", "isn't"], certa: 0, traducao: 'Não vou levar muitas roupas. Só duas malas!' },
    { frase: '"I am going to work as a teacher" is a ___.', opcoes: ['prediction', 'plan', 'past action'], certa: 1, traducao: '"I am going to work as a teacher" é um plano.' },
    { frase: '"It\'s winter in Canada. We\'re going to feel cold" is a ___.', opcoes: ['plan', 'past action', 'prediction'], certa: 2, traducao: '"É inverno no Canadá. Vamos sentir frio" é uma previsão.' },
    { frase: 'Look at those clouds! It ___ rain.', opcoes: ["'s going to", "'re going to", 'going to'], certa: 0, traducao: 'Olha essas nuvens! Vai chover.' },
    { frase: 'A: What are you going to pack? B: I ___ some swimsuits.', opcoes: ['pack going to', "'m going to pack", 'going to pack'], certa: 1, traducao: 'A: O que você vai levar? B: Vou levar uns maiôs.' },
    { frase: 'Are you going to live with a family? Yes, I ___.', opcoes: ['do', 'going', 'am'], certa: 2, traducao: 'Você vai morar com uma família? Sim.' },
    { frase: 'The video recommends ___ suitcases.', opcoes: ['two', 'four', 'three'], certa: 0, traducao: 'O vídeo recomenda duas malas.' },
    { frase: 'Put your passport and tickets in your ___.', opcoes: ['main suitcase', 'hand luggage', 'jacket pocket'], certa: 1, traducao: 'Coloque o passaporte e as passagens na bagagem de mão.' },
    { frase: 'If you forget something, you can buy it in your ___ country.', opcoes: ['home', 'old', 'host'], certa: 2, traducao: 'Se esquecer algo, pode comprar no país de destino.' },
    { frase: 'Your laptop, money and phone are your ___.', opcoes: ['valuables', 'toiletries', 'footwear'], certa: 0, traducao: 'O notebook, o dinheiro e o celular são os seus objetos de valor.' },
    { frase: 'Shampoo, soap and a toothbrush are ___.', opcoes: ['valuables', 'toiletries', 'documents'], certa: 1, traducao: 'Xampu, sabonete e escova de dentes são itens de higiene.' },
    { frase: 'In Canada in winter, you need a ___ and gloves.', opcoes: ['swimsuit', 'shorts', 'hat'], certa: 2, traducao: 'No Canadá no inverno, você precisa de gorro e luvas.' },
    { frase: 'Workaway is a ___ program.', opcoes: ['volunteer', 'TV', 'school'], certa: 0, traducao: 'A Workaway é um programa de voluntariado.' },
    { frase: 'Merilin worked as a volunteer in ___.', opcoes: ['Mexico', 'Costa Rica', 'Peru'], certa: 1, traducao: 'A Merilin trabalhou como voluntária na Costa Rica.' },
    { frase: 'She worked at a ___ center.', opcoes: ['language', 'shopping', 'yoga'], certa: 2, traducao: 'Ela trabalhou num centro de ioga.' },
    { frase: 'She talked with the host on ___ before the trip.', opcoes: ['WhatsApp', 'TV', 'the radio'], certa: 0, traducao: 'Ela conversou com o anfitrião pelo WhatsApp antes da viagem.' },
    { frase: 'She got a ___ discount at the restaurant.', opcoes: ['10%', '40%', '50%'], certa: 1, traducao: 'Ela ganhou 40% de desconto no restaurante.' },
    { frase: 'Her work was about social media, writing, and the ___.', opcoes: ['kitchen', 'garden', 'website'], certa: 2, traducao: 'O trabalho dela era com redes sociais, textos e o site.' }
  ]
});
</script>
