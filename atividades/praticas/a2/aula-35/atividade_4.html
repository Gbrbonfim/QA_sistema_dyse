  course: 'ativ-a2', aula: 35, num: 4, tipo: 'fala',

  itens: [
    { frase: 'My cousin lives abroad.', dica: 0, traducao: 'O meu primo mora no exterior.' },
    { frase: 'Are you going to live abroad?', dica: 0, traducao: 'Você vai morar no exterior?' },

    { frase: 'What are you going to do after this class?', dica: 0, traducao: 'O que você vai fazer depois desta aula?' },
    { frase: "I'm going to have dinner with my friends.", dica: 0, traducao: 'Vou jantar com os meus amigos.' },
    { frase: 'What are you going to do on your next vacation?', dica: 0, traducao: 'O que você vai fazer nas próximas férias?' },
