<script>
/* A2 · Class 29 · Escuta (Eat as an Athlete)
   Alinhado ao "Grammar Point" — a / an com substantivos contáveis no singular (a banana, an
   apple), some com contáveis no plural e incontáveis (some eggs, some rice). Conteúdo NOVO:
   o aluno ouve o nome de uma comida/bebida e escolhe a palavra que vem antes. 24 questões. */
const IC = { 'a': 'looks_one', 'an': 'abc', 'some': 'more_horiz' };
const T = ['a', 'an', 'some'];
const op = () => T.map(c => ({ label: c, icon: IC[c] }));
const q = (audioTexto, certa) => ({ audioTexto, opcoes: op(), certa });
DysePratica.iniciar({
  course: 'ativ-a2', aula: 29, num: 1, tipo: 'imagem',
  instrucao: 'Listen to the food or drink: a, an or some?',
  itens: [
    q('banana', 0),
    q('apple', 1),
    q('rice', 2),
    q('sandwich', 0),
    q('orange', 1),
    q('strawberries', 2),
    q('protein bar', 0),
    q('egg', 1),
    q('oatmeal', 2),
    q('bagel', 0),
    q('avocado', 1),
    q('water', 2),
    q('tomato', 0),
    q('onion', 1),
    q('milk', 2),
    q('cookie', 0),
    q('egg sandwich', 1),
    q('nuts', 2),
    q('carrot', 0),
    q('avocado sandwich', 1),
    q('sugar', 2),
    q('potato', 0),
    q('bread', 2),
    q('pancakes', 2)
  ]
});
</script>
