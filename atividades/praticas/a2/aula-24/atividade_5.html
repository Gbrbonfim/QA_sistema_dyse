<script>
/* A2 · Class 24 · Gramática (Review Classes 14-23)
   Revisão das aulas 14 a 23: can/can't, present continuous, present simple x continuous,
   object pronouns, datas e ordinais, love/like/hate + -ing, was/were, profissões, past simple
   regular e irregular, could. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 24, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'You ___ use a calculator in the math exam. It is not allowed.', opcoes: ["can't", 'can', 'could'], certa: 0, traducao: 'Você não pode usar calculadora na prova de matemática. Não é permitido.' },
    { frase: '___ you speak Spanish? Yes, a little.', opcoes: ['Do', 'Can', 'Are'], certa: 1, traducao: 'Você sabe falar espanhol? Sim, um pouco.' },
    { frase: 'Listen! Somebody ___ at the door.', opcoes: ['knocks', 'knock', 'is knocking'], certa: 2, traducao: 'Escuta! Alguém está batendo na porta.' },
    { frase: 'I ___ to work by bus every day.', opcoes: ['go', 'am going', 'goes'], certa: 0, traducao: 'Vou ao trabalho de ônibus todo dia.' },
    { frase: 'She ___ a book at the moment.', opcoes: ['reads', 'is reading', 'read'], certa: 1, traducao: 'Ela está lendo um livro neste momento.' },
    { frase: 'What ___ you usually do on weekends?', opcoes: ['are', 'is', 'do'], certa: 2, traducao: 'O que você geralmente faz nos fins de semana?' },
    { frase: 'I love my grandparents. I visit ___ every Sunday.', opcoes: ['them', 'they', 'their'], certa: 0, traducao: 'Amo os meus avós. Visito eles todo domingo.' },
    { frase: 'This is my sister. Do you know ___?', opcoes: ['she', 'her', 'hers'], certa: 1, traducao: 'Esta é a minha irmã. Você a conhece?' },
    { frase: 'Christmas is ___ December 25th.', opcoes: ['in', 'at', 'on'], certa: 2, traducao: 'O Natal é em 25 de dezembro.' },
    { frase: 'My birthday is in ___, the second month of the year.', opcoes: ['February', 'March', 'January'], certa: 0, traducao: 'O meu aniversário é em fevereiro, o segundo mês do ano.' },
    { frase: 'I hate ___ up early on Saturdays.', opcoes: ['get', 'getting', 'gets'], certa: 1, traducao: 'Odeio acordar cedo aos sábados.' },
    { frase: 'Do you like ___?', opcoes: ['cook', 'cooks', 'cooking'], certa: 2, traducao: 'Você gosta de cozinhar?' },
    { frase: 'Marie Curie ___ a famous scientist.', opcoes: ['was', 'were', 'is'], certa: 0, traducao: 'Marie Curie foi uma cientista famosa.' },
    { frase: 'Where ___ you yesterday afternoon?', opcoes: ['was', 'were', 'did'], certa: 1, traducao: 'Onde você estava ontem à tarde?' },
    { frase: 'A person who plays the piano is a ___.', opcoes: ['pianer', 'pianor', 'pianist'], certa: 2, traducao: 'Uma pessoa que toca piano é um(a) pianista.' },
    { frase: 'A person who acts in movies is an ___.', opcoes: ['actor', 'actist', 'acter'], certa: 0, traducao: 'Uma pessoa que atua em filmes é um ator.' },
    { frase: 'We ___ a nice hotel near the beach last summer.', opcoes: ['book', 'booked', 'books'], certa: 1, traducao: 'Reservamos um hotel legal perto da praia no verão passado.' },
    { frase: 'The bus ___ in the middle of the road.', opcoes: ['stoped', 'stopt', 'stopped'], certa: 2, traducao: 'O ônibus parou no meio da estrada.' },
    { frase: 'I ___ my friends at the festival.', opcoes: ["didn't find", "didn't found", "not found"], certa: 0, traducao: 'Não encontrei os meus amigos no festival.' },
    { frase: 'Did you ___ any pictures?', opcoes: ['took', 'take', 'taked'], certa: 1, traducao: 'Você tirou alguma foto?' },
    { frase: 'She ___ a red dress to the party.', opcoes: ['weared', 'wear', 'wore'], certa: 2, traducao: 'Ela usou um vestido vermelho na festa.' },
    { frase: 'It was very crowded, so we ___ see the stage.', opcoes: ["couldn't", "can't", "didn't could"], certa: 0, traducao: 'Estava muito cheio, então não conseguimos ver o palco.' },
    { frase: 'Did you enjoy the concert? Yes, I ___.', opcoes: ['was', 'did', 'enjoyed'], certa: 1, traducao: 'Você curtiu o show? Sim.' },
    { frase: '___ did you go with? With my cousins.', opcoes: ['When', 'What', 'Who'], certa: 2, traducao: 'Com quem você foi? Com os meus primos.' }
  ]
});
</script>
