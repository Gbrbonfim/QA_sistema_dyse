/* A2 · Class 07 · Fala (It's my life)
   Alinhado ao slide "Talking Point: ask and answer the questions. Use prepositions." —
   perguntas e respostas sobre rotina com at / in / on / to. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 7, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'What do you do at weekends?', dica: 0, traducao: 'O que você faz nos fins de semana?' },
    { frase: 'I relax and hang out with my friends at weekends.', dica: 0, traducao: 'Relaxo e saio com os meus amigos nos fins de semana.' },
    { frase: 'Do you get up early on Mondays?', dica: 0, traducao: 'Você se levanta cedo às segundas?' },
    { frase: 'Yes, I get up at six on Mondays.', dica: 0, traducao: 'Sim, levanto às seis às segundas.' },
    { frase: 'Do you go to the gym in the morning?', dica: 0, traducao: 'Você vai à academia de manhã?' },
    { frase: 'No, I go to the gym in the evening.', dica: 0, traducao: 'Não, vou à academia à noite.' },
    { frase: 'Where do you go at Christmas?', dica: 0, traducao: 'Aonde você vai no Natal?' },
    { frase: 'I visit my family at Christmas.', dica: 0, traducao: 'Visito a minha família no Natal.' },
    { frase: 'Are you usually at home at midday?', dica: 0, traducao: 'Você normalmente está em casa ao meio-dia?' },
    { frase: "No, I'm at work at midday.", dica: 0, traducao: 'Não, estou no trabalho ao meio-dia.' },
    { frase: 'Is your English class on Monday?', dica: 0, traducao: 'A sua aula de inglês é na segunda?' },
    { frase: "No, it's on Thursday at seven.", dica: 0, traducao: 'Não, é na quinta às sete.' },
    { frase: 'What is there to do in your city in the summer?', dica: 0, traducao: 'O que há para fazer na sua cidade no verão?' },
    { frase: 'We go to the beach in the summer.', dica: 0, traducao: 'Vamos à praia no verão.' },
    { frase: 'I go to work by bus.', dica: 0, traducao: 'Vou para o trabalho de ônibus.' },
    { frase: 'I go home at six in the evening.', dica: 0, traducao: 'Vou para casa às seis da tarde.' },
    { frase: 'My birthday is on the tenth of April.', dica: 0, traducao: 'O meu aniversário é no dia dez de abril.' },
    { frase: "I'm really glad to be here.", dica: 0, traducao: 'Estou muito feliz de estar aqui.' },
    { frase: 'I really enjoy my English classes.', dica: 0, traducao: 'Gosto muito das minhas aulas de inglês.' },
    { frase: 'My city is pretty cool.', dica: 0, traducao: 'A minha cidade é bem legal.' }
  ]
});
</script>
