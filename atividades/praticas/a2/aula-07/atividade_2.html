<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYSE · A2 · Aula 7 · My weekly routine</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/atividades/praticas/praticas.css">
</head>
<body>
<div id="dyseAuthGate"><div class="dyse-spinner"></div><p>dyse</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/dyse-auth.js"></script>
<script src="/atividades/praticas/catalogo.js"></script>
<script src="/atividades/praticas/praticas.js"></script>
<script>
/* A2 · Class 07 · Escrita (It's my life)
   Alinhado aos slides "Grammar Point" e "Talking Point" — rotina (get up, have breakfast, go to
   work / school / the gym, go home, hang out) com at / in / on e go to (e "go home" sem to).
   Conteúdo NOVO. A isca é a preposição errada. 20 questões. */
const M = pt => 'Write it in English: "' + pt + '"';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 7, num: 2, tipo: 'montar',
  instrucao: 'Click the words and make the sentence (one word is extra)',
  itens: [
    { contexto: M('Eu me levanto às sete e meia.'), palavras: ['I', 'get', 'up', 'at', 'half', 'past', 'seven'], isca: ['in'], fim: '.', traducao: 'Eu me levanto às sete e meia.' },
    { contexto: M('Ela vai à academia de manhã.'), palavras: ['She', 'goes', 'to', 'the', 'gym', 'in', 'the', 'morning'], isca: ['on'], fim: '.', traducao: 'Ela vai à academia de manhã.' },
    { contexto: M('Nós temos aula de inglês às terças.'), palavras: ['We', 'have', 'English', 'class', 'on', 'Tuesdays'], isca: ['in'], fim: '.', traducao: 'Nós temos aula de inglês às terças.' },
    { contexto: M('Eu vou para casa à noite.'), palavras: ['I', 'go', 'home', 'in', 'the', 'evening'], isca: ['to'], fim: '.', traducao: 'Eu vou para casa à noite.' },
    { contexto: M('Ele trabalha nos fins de semana.'), palavras: ['He', 'works', 'at', 'the', 'weekend'], isca: ['in'], fim: '.', traducao: 'Ele trabalha nos fins de semana.' },
    { contexto: M('Eles vão à praia no verão.'), palavras: ['They', 'go', 'to', 'the', 'beach', 'in', 'the', 'summer'], isca: ['on'], fim: '.', traducao: 'Eles vão à praia no verão.' },
    { contexto: M('O meu aniversário é em julho.'), palavras: ['My', 'birthday', 'is', 'in', 'July'], isca: ['on'], fim: '.', traducao: 'O meu aniversário é em julho.' },
    { contexto: M('A festa é no dia 3 de julho.'), palavras: ['The', 'party', 'is', 'on', 'the', 'third', 'of', 'July'], isca: ['in'], fim: '.', traducao: 'A festa é no dia 3 de julho.' },
    { contexto: M('Eu tomo café da manhã ao meio-dia aos domingos.'), palavras: ['I', 'have', 'breakfast', 'at', 'midday', 'on', 'Sundays'], isca: ['in'], fim: '.', traducao: 'Eu tomo café da manhã ao meio-dia aos domingos.' },
    { contexto: M('Ela vai para a cama à meia-noite.'), palavras: ['She', 'goes', 'to', 'bed', 'at', 'midnight'], isca: ['in'], fim: '.', traducao: 'Ela vai para a cama à meia-noite.' },
    { contexto: M('Nós viajamos no Natal.'), palavras: ['We', 'travel', 'at', 'Christmas'], isca: ['on'], fim: '.', traducao: 'Nós viajamos no Natal.' },
    { contexto: M('Eu saio com os meus amigos nas sextas à noite.'), palavras: ['I', 'hang', 'out', 'with', 'my', 'friends', 'on', 'Friday', 'nights'], isca: ['in'], fim: '.', traducao: 'Eu saio com os meus amigos nas sextas à noite.' },
    { contexto: M('Você trabalha de manhã?'), palavras: ['Do', 'you', 'work', 'in', 'the', 'morning'], isca: ['at'], fim: '?', traducao: 'Você trabalha de manhã?' },
    { contexto: M('O que você faz nos fins de semana?'), palavras: ['What', 'do', 'you', 'do', 'at', 'weekends'], isca: ['in'], fim: '?', traducao: 'O que você faz nos fins de semana?' },
    { contexto: M('Você está normalmente em casa ao meio-dia?'), palavras: ['Are', 'you', 'usually', 'at', 'home', 'at', 'midday'], isca: ['Do'], fim: '?', traducao: 'Você está normalmente em casa ao meio-dia?' },
    { contexto: M('Aonde você vai no Natal?'), palavras: ['Where', 'do', 'you', 'go', 'at', 'Christmas'], isca: ['on'], fim: '?', traducao: 'Aonde você vai no Natal?' },
    { contexto: M('Eu fico feliz de estar aqui.'), palavras: ["I'm", 'glad', 'to', 'be', 'here'], isca: ['in'], fim: '.', traducao: 'Fico feliz de estar aqui.' },
    { contexto: M('Eu gosto muito das minhas aulas.'), palavras: ['I', 'really', 'enjoy', 'my', 'classes'], isca: ['enjoys'], fim: '.', traducao: 'Gosto muito das minhas aulas.' },
    { contexto: M('A universidade é bem legal.'), palavras: ['The', 'university', 'is', 'pretty', 'cool'], isca: ['are'], fim: '.', traducao: 'A universidade é bem legal.' },
    { contexto: M('Eu trabalho num projeto de pesquisa com o meu professor.'), palavras: ['I', 'work', 'on', 'a', 'research', 'project', 'with', 'my', 'professor'], isca: ['works'], fim: '.', traducao: 'Trabalho num projeto de pesquisa com o meu professor.' }
  ]
});
</script>
</body>
</html>
