<script>
/* A2 · Class 08 · Fala (It's my life)
   Alinhado ao texto da rotina de estudo e ao "Grammar Point" — Simple Present na 3ª pessoa
   (wakes, studies, watches, relaxes, has, goes, doesn't), perguntas com Do / Does e as
   perguntas do slide 5 sobre a rotina do aluno. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 7, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'She wakes up at six and goes running.', dica: 0, traducao: 'Ela acorda às seis e vai correr.' },
    { frase: 'She has yogurt and fruit for breakfast.', dica: 0, traducao: 'Ela come iogurte e fruta no café da manhã.' },
    { frase: 'She goes to the library at eight.', dica: 0, traducao: 'Ela vai à biblioteca às oito.' },
    { frase: 'She studies until midday.', dica: 0, traducao: 'Ela estuda até o meio-dia.' },
    { frase: "She doesn't listen to music when she studies.", dica: 0, traducao: 'Ela não ouve música quando estuda.' },
    { frase: 'She relaxes in the garden after lunch.', dica: 0, traducao: 'Ela relaxa no jardim depois do almoço.' },
    { frase: 'He watches a documentary in the evening.', dica: 0, traducao: 'Ele assiste a um documentário à noite.' },
    { frase: 'He finishes his classes at five.', dica: 0, traducao: 'Ele termina as aulas às cinco.' },
    { frase: "He doesn't like heavy food.", dica: 0, traducao: 'Ele não gosta de comida pesada.' },
    { frase: 'My sister teaches English at a school.', dica: 0, traducao: 'A minha irmã ensina inglês numa escola.' },
    { frase: "My roommate doesn't do the housework.", dica: 0, traducao: 'A minha colega de quarto não faz as tarefas da casa.' },
    { frase: "We don't have lessons on Saturdays.", dica: 0, traducao: 'Não temos aula aos sábados.' },
    { frase: 'Do you have a study routine?', dica: 0, traducao: 'Você tem uma rotina de estudo?' },
    { frase: 'Does your school open on Saturdays?', dica: 0, traducao: 'A sua escola abre aos sábados?' },
    { frase: 'Do your colleagues help you?', dica: 0, traducao: 'Os seus colegas te ajudam?' },
    { frase: 'Does your boss give you a lot of work?', dica: 0, traducao: 'O seu chefe te dá muito trabalho?' },
    { frase: 'Yes, she does.', dica: 0, traducao: 'Sim, ela faz.' },
    { frase: "No, he doesn't.", dica: 0, traducao: 'Não, ele não faz.' },
    { frase: 'I study English every evening.', dica: 0, traducao: 'Estudo inglês todas as noites.' },
    { frase: 'My brother plays for the university team.', dica: 0, traducao: 'O meu irmão joga no time da universidade.' }
  ]
});
</script>
