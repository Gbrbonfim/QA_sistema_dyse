<script>
/* A2 · Class 07 · Gramática (It's my life)
   Alinhado ao slide "Grammar Point" (quadro IN / ON / AT e GO TO) — at + horas, night,
   midday, midnight, the weekend, Christmas; in + partes do dia, meses, estações, anos; on +
   dias e datas; go to + lugar, mas "go home" sem to; e os sinônimos do texto. Conteúdo NOVO.
   24 questões. */
const SIN = 'Choose the word with the same meaning';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 7, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'The movie starts ___ 9:30.', opcoes: ['at', 'in', 'on'], certa: 0, traducao: 'O filme começa às 9:30.' },
    { frase: 'I read before bed ___ night.', opcoes: ['in', 'at', 'on'], certa: 1, traducao: 'Leio antes de dormir à noite.' },
    { frase: 'We have a meeting ___ Friday.', opcoes: ['at', 'in', 'on'], certa: 2, traducao: 'Temos uma reunião na sexta.' },
    { frase: 'They go on holiday ___ August.', opcoes: ['in', 'on', 'at'], certa: 0, traducao: 'Eles saem de férias em agosto.' },
    { frase: 'Her birthday is ___ the 3rd of July.', opcoes: ['in', 'on', 'at'], certa: 1, traducao: 'O aniversário dela é no dia 3 de julho.' },
    { frase: 'The flowers are beautiful ___ the spring.', opcoes: ['on', 'at', 'in'], certa: 2, traducao: 'As flores são lindas na primavera.' },
    { frase: 'I usually eat lunch ___ midday.', opcoes: ['at', 'in', 'on'], certa: 0, traducao: 'Normalmente almoço ao meio-dia.' },
    { frase: 'My grandfather was born ___ 1950.', opcoes: ['on', 'in', 'at'], certa: 1, traducao: 'O meu avô nasceu em 1950.' },
    { frase: 'We play tennis ___ Saturday mornings.', opcoes: ['in', 'at', 'on'], certa: 2, traducao: 'Jogamos tênis aos sábados de manhã.' },
    { frase: 'My mum always works ___ the weekend.', opcoes: ['at', 'on', 'in'], certa: 0, traducao: 'A minha mãe sempre trabalha no fim de semana.' },
    { frase: "Ana doesn't work ___ the afternoon.", opcoes: ['at', 'in', 'on'], certa: 1, traducao: 'A Ana não trabalha à tarde.' },
    { frase: 'The shops are open late ___ Christmas.', opcoes: ['in', 'on', 'at'], certa: 2, traducao: 'As lojas ficam abertas até tarde no Natal.' },
    { frase: 'She goes ___ the gym every morning.', opcoes: ['to', 'at', 'in'], certa: 0, traducao: 'Ela vai à academia toda manhã.' },
    { frase: "I'm tired. I want to go ___.", opcoes: ['to home', 'home', 'at home'], certa: 1, traducao: 'Estou cansado. Quero ir para casa.' },
    { frase: 'We go ___ school by bus.', opcoes: ['in', 'at', 'to'], certa: 2, traducao: 'Vamos para a escola de ônibus.' },
    { frase: 'She always goes to bed ___ midnight.', opcoes: ['at', 'in', 'on'], certa: 0, traducao: 'Ela sempre vai para a cama à meia-noite.' },
    { frase: 'We have English classes ___ Tuesdays and Thursdays.', opcoes: ['in', 'on', 'at'], certa: 1, traducao: 'Temos aula de inglês às terças e quintas.' },
    { frase: 'It\'s very cold here ___ the winter.', opcoes: ['at', 'on', 'in'], certa: 2, traducao: 'Faz muito frio aqui no inverno.' },
    { instrucao: SIN, frase: 'freshman = ___', opcoes: ['first-year student', 'teacher', 'old student'], certa: 0, traducao: 'calouro = aluno do primeiro ano' },
    { instrucao: SIN, frase: 'hang out = ___', opcoes: ['study', 'spend time', 'wake up'], certa: 1, traducao: 'sair, passar tempo juntos' },
    { instrucao: SIN, frase: 'glad = ___', opcoes: ['sad', 'tired', 'happy'], certa: 2, traducao: 'contente = feliz' },
    { instrucao: SIN, frase: 'enjoy = ___', opcoes: ['like', 'hate', 'finish'], certa: 0, traducao: 'aproveitar, gostar = gostar' },
    { instrucao: SIN, frase: 'pretty cool = ___', opcoes: ['very ugly', 'very nice', 'very old'], certa: 1, traducao: 'bem legal = muito bom' },
    { instrucao: SIN, frase: 'eat breakfast = ___', opcoes: ['have lunch', 'have dinner', 'have breakfast'], certa: 2, traducao: 'tomar café da manhã' }
  ]
});
</script>
