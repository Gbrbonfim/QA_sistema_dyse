<script>
/* A2 · Class 08 · Gramática (It's my life)
   Alinhado ao "Grammar Point" — regras de ortografia (-s, -es, -ies, has, does, goes),
   afirmativa, negativa (don't / doesn't + verbo base) e perguntas com Do / Does. Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 7, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'My uncle is a professor. He ___ at Harvard.', opcoes: ['teaches', 'teachs', 'teach'], certa: 0, traducao: 'O meu tio é professor. Ele dá aula em Harvard.' },
    { frase: 'Julia ___ to the gym in the evening.', opcoes: ['go', 'goes', 'gos'], certa: 1, traducao: 'A Julia vai à academia à noite.' },
    { frase: 'My brother ___ every night.', opcoes: ['studys', 'study', 'studies'], certa: 2, traducao: 'O meu irmão estuda toda noite.' },
    { frase: 'She ___ a new laptop.', opcoes: ['has', 'have', 'haves'], certa: 0, traducao: 'Ela tem um notebook novo.' },
    { frase: 'Tom ___ his homework after dinner.', opcoes: ['dos', 'does', 'do'], certa: 1, traducao: 'O Tom faz a lição depois do jantar.' },
    { frase: 'He ___ on the sofa after work.', opcoes: ['relaxs', 'relax', 'relaxes'], certa: 2, traducao: 'Ele relaxa no sofá depois do trabalho.' },
    { frase: 'Jim and Tony ___ to university in the morning.', opcoes: ['go', 'goes', 'going'], certa: 0, traducao: 'O Jim e o Tony vão à faculdade de manhã.' },
    { frase: 'I sometimes ___ other students with their essays.', opcoes: ['helps', 'help', 'helpes'], certa: 1, traducao: 'Às vezes ajudo outros alunos com as redações.' },
    { frase: 'The bird ___ to the tree every morning.', opcoes: ['flys', 'fly', 'flies'], certa: 2, traducao: 'O pássaro voa para a árvore toda manhã.' },
    { frase: 'She ___ her classes very late.', opcoes: ['finishes', 'finishs', 'finish'], certa: 0, traducao: 'Ela termina as aulas muito tarde.' },
    { frase: "She wants to be a doctor, but she ___ enough.", opcoes: ["don't study", "doesn't study", "doesn't studies"], certa: 1, traducao: 'Ela quer ser médica, mas não estuda o suficiente.' },
    { frase: "We ___ any exams tomorrow.", opcoes: ["doesn't have", "don't has", "don't have"], certa: 2, traducao: 'Não temos nenhuma prova amanhã.' },
    { frase: "Mark ___ research on Tuesdays.", opcoes: ["doesn't do", "don't do", "doesn't does"], certa: 0, traducao: 'O Mark não faz pesquisa às terças.' },
    { frase: "I ___ how to start my essay. Can you help me?", opcoes: ["doesn't know", "don't know", "not know"], certa: 1, traducao: 'Não sei como começar a minha redação. Pode me ajudar?' },
    { frase: "The students ___ lessons on Saturdays.", opcoes: ["doesn't have", "not have", "don't have"], certa: 2, traducao: 'Os alunos não têm aula aos sábados.' },
    { frase: '___ your school open on Saturdays?', opcoes: ['Does', 'Do', 'Is'], certa: 0, traducao: 'A sua escola abre aos sábados?' },
    { frase: '___ your classmates help you?', opcoes: ['Does', 'Do', 'Are'], certa: 1, traducao: 'Os seus colegas te ajudam?' },
    { frase: '___ your teacher give you a lot of homework?', opcoes: ['Do', 'Is', 'Does'], certa: 2, traducao: 'O seu professor te dá muita lição?' },
    { frase: 'Does she ___ in the library?', opcoes: ['study', 'studies', 'studying'], certa: 0, traducao: 'Ela estuda na biblioteca?' },
    { frase: 'Do you ___ a study routine?', opcoes: ['has', 'have', 'having'], certa: 1, traducao: 'Você tem uma rotina de estudo?' },
    { frase: 'Does your brother play football? Yes, he ___.', opcoes: ['is', 'do', 'does'], certa: 2, traducao: 'O seu irmão joga futebol? Sim, joga.' },
    { frase: "Do they live in Cambridge? No, they ___.", opcoes: ["don't", "doesn't", "aren't"], certa: 0, traducao: 'Eles moram em Cambridge? Não.' },
    { frase: "Where ___ he have lunch?", opcoes: ['do', 'does', 'is'], certa: 1, traducao: 'Onde ele almoça?' },
    { frase: "What time ___ you go to bed?", opcoes: ['does', 'are', 'do'], certa: 2, traducao: 'A que horas você vai dormir?' }
  ]
});
</script>
