<script>
/* A2 · Class 13 · Gramática (Review Classes 1-12, "Grammar part")
   Revisão de toda a gramática do bimestre: possessive adjectives, be, there's / its, artigos
   com adjetivos, modifiers, imperativos e Let's, at / in / on (tempo e lugar), present simple,
   perguntas, advérbios de frequência, genitivo 's e Whose. Conteúdo NOVO e misturado.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 13, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'This is my brother. ___ name is Felipe.', opcoes: ['His', "He's", 'Her'], certa: 0, traducao: 'Este é o meu irmão. O nome dele é Felipe.' },
    { frase: 'Our neighbors are nice. ___ dog is very friendly.', opcoes: ["They're", 'Their', 'There'], certa: 1, traducao: 'Os nossos vizinhos são legais. O cachorro deles é muito simpático.' },
    { frase: "I'm Mexican. I ___ Spanish.", opcoes: ["isn't", "aren't", "'m not"], certa: 2, traducao: 'Sou mexicano. Não sou espanhol.' },
    { frase: 'The plant is ___ the sofa and the TV.', opcoes: ['between', 'under', 'on'], certa: 0, traducao: 'A planta fica entre o sofá e a TV.' },
    { frase: 'My pictures are on the wall, ___ the bed.', opcoes: ['under', 'over', 'between'], certa: 1, traducao: 'Os meus quadros estão na parede, acima da cama.' },
    { frase: "He's ___ old man.", opcoes: ['a', 'the a', 'an'], certa: 2, traducao: 'Ele é um homem velho.' },
    { frase: 'They are ___ players.', opcoes: ['really fast', 'fasts', 'fast really'], certa: 0, traducao: 'Eles são jogadores muito rápidos.' },
    { frase: "I'm bored. ___ go to the park!", opcoes: ["Don't", "Let's", 'Be'], certa: 1, traducao: 'Estou entediado. Vamos ao parque!' },
    { frase: "___ worried. Everything is OK.", opcoes: ["Don't", 'Not be', "Don't be"], certa: 2, traducao: 'Não fique preocupado. Está tudo bem.' },
    { frase: 'The class starts ___ 7:30.', opcoes: ['at', 'on', 'in'], certa: 0, traducao: 'A aula começa às 7:30.' },
    { frase: 'We go to the beach ___ the summer.', opcoes: ['on', 'in', 'at'], certa: 1, traducao: 'Vamos à praia no verão.' },
    { frase: 'My birthday is ___ the 2nd of May.', opcoes: ['in', 'at', 'on'], certa: 2, traducao: 'O meu aniversário é no dia 2 de maio.' },
    { frase: "She's ___ the bus to work.", opcoes: ['on', 'at', 'in a'], certa: 0, traducao: 'Ela está no ônibus para o trabalho.' },
    { frase: 'My dad ___ in a hospital.', opcoes: ['work', 'works', 'working'], certa: 1, traducao: 'O meu pai trabalha num hospital.' },
    { frase: "My sister ___ like coffee.", opcoes: ["don't", "isn't", "doesn't"], certa: 2, traducao: 'A minha irmã não gosta de café.' },
    { frase: 'Where ___ your parents live?', opcoes: ['do', 'does', 'are'], certa: 0, traducao: 'Onde os seus pais moram?' },
    { frase: 'What ___ air made of?', opcoes: ['does', 'is', 'do'], certa: 1, traducao: 'Do que o ar é feito?' },
    { frase: 'How ___ cousins do you have?', opcoes: ['often', 'much', 'many'], certa: 2, traducao: 'Quantos primos você tem?' },
    { frase: 'I ___ my bed every morning.', opcoes: ['always make', 'make always', 'always do'], certa: 0, traducao: 'Sempre arrumo a minha cama de manhã.' },
    { frase: "He's ___ late for class.", opcoes: ['ever', 'never', 'one time'], certa: 1, traducao: 'Ele nunca se atrasa para a aula.' },
    { frase: 'I go to the gym three ___ a week.', opcoes: ['time', 'once', 'times'], certa: 2, traducao: 'Vou à academia três vezes por semana.' },
    { frase: "My mother's brother is my ___.", opcoes: ['uncle', 'cousin', 'grandfather'], certa: 0, traducao: 'O irmão da minha mãe é o meu tio.' },
    { frase: "This is my ___ room. They have two beds.", opcoes: ["brother's", "brothers'", "brothers"], certa: 1, traducao: 'Este é o quarto dos meus irmãos. Eles têm duas camas.' },
    { frase: '___ jacket is this? Is it yours?', opcoes: ["Who's", 'Who', 'Whose'], certa: 2, traducao: 'De quem é esta jaqueta? É sua?' }
  ]
});
</script>
