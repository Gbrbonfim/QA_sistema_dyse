<script>
/* A2 · Class 27 · Gramática (There's a Restaurant)
   Alinhado ao "Grammar Point" (there is + singular, there are + plural; a / an com there is;
   some na afirmativa, any na negativa e na pergunta; respostas curtas), ao vídeo do Gordon
   Ramsay (a cozinha comparada a uma Ferrari) e ao vocabulário do restaurante. Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 27, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: '___ any burgers on the menu today?', opcoes: ['Are there', 'Is there', 'There are'], certa: 0, traducao: 'Tem hambúrguer no cardápio hoje?' },
    { frase: '___ a dining room in this café?', opcoes: ['Are there', 'Is there', 'There is'], certa: 1, traducao: 'Tem salão neste café?' },
    { frase: '___ some seats outside on the balcony.', opcoes: ['Is there', 'Are there', 'There are'], certa: 2, traducao: 'Tem alguns lugares lá fora, na varanda.' },
    { frase: '___ a tray on the table.', opcoes: ["There's", 'There are', 'Is there'], certa: 0, traducao: 'Tem uma bandeja na mesa.' },
    { frase: 'There ___ twenty-five cooks in the kitchen.', opcoes: ['is', 'are', 'be'], certa: 1, traducao: 'Tem vinte e cinco cozinheiros na cozinha.' },
    { frase: 'There ___ a waiter near the door.', opcoes: ['are', 'have', 'is'], certa: 2, traducao: 'Tem um garçom perto da porta.' },
    { frase: "There isn't ___ oven in the café.", opcoes: ['an', 'a', 'some'], certa: 0, traducao: 'Não tem forno no café.' },
    { frase: 'There are ___ customers waiting outside.', opcoes: ['any', 'some', 'a'], certa: 1, traducao: 'Tem alguns clientes esperando lá fora.' },
    { frase: "There aren't ___ chairs in the kitchen.", opcoes: ['some', 'a', 'any'], certa: 2, traducao: 'Não tem cadeira na cozinha.' },
    { frase: 'Are there ___ free tables now?', opcoes: ['any', 'some', 'a'], certa: 0, traducao: 'Tem mesas livres agora?' },
    { frase: 'There are ___ clean plates in the kitchen.', opcoes: ['any', 'some', 'an'], certa: 1, traducao: 'Tem alguns pratos limpos na cozinha.' },
    { frase: 'Is there a glass on the table? Yes, ___.', opcoes: ['it is', 'there are', 'there is'], certa: 2, traducao: 'Tem um copo na mesa? Sim, tem.' },
    { frase: "Are there any spoons in the kitchen? No, ___.", opcoes: ["there aren't", "there isn't", "they aren't"], certa: 0, traducao: 'Tem colheres na cozinha? Não, não tem.' },
    { frase: 'We use "some" in ___ sentences.', opcoes: ['negative', 'positive', 'question'], certa: 1, traducao: 'Usamos "some" em frases afirmativas.' },
    { frase: 'We use "any" in negative sentences and in ___.', opcoes: ['positive sentences', 'answers', 'questions'], certa: 2, traducao: 'Usamos "any" em frases negativas e em perguntas.' },
    { frase: '"Some" means ___.', opcoes: ['not an exact number', 'one', 'zero'], certa: 0, traducao: '"Some" significa um número não exato.' },
    { frase: 'In the video, Gordon Ramsay compares his kitchen to a ___.', opcoes: ['rocket', 'Ferrari', 'plane'], certa: 1, traducao: 'No vídeo, Gordon Ramsay compara a cozinha dele a uma Ferrari.' },
    { frase: 'The person who brings your food is the ___.', opcoes: ['chef', 'customer', 'waiter'], certa: 2, traducao: 'A pessoa que traz a comida é o garçom.' },
    { frase: 'At the end of the meal, you ask for the ___.', opcoes: ['bill', 'menu', 'starters'], certa: 0, traducao: 'No fim da refeição, você pede a conta.' },
    { frase: 'You eat soup with a ___.', opcoes: ['fork', 'spoon', 'knife'], certa: 1, traducao: 'Você toma sopa com colher.' },
    { frase: 'Ice cream and cake are ___.', opcoes: ['starters', 'sauces', 'desserts'], certa: 2, traducao: 'Sorvete e bolo são sobremesas.' },
    { frase: 'The customers eat in the ___.', opcoes: ['dining room', 'kitchen', 'tray'], certa: 0, traducao: 'Os clientes comem no salão.' },
    { frase: 'The extra money you leave for the waiter is the ___.', opcoes: ['bill', 'tip', 'menu'], certa: 1, traducao: 'O dinheiro extra que você deixa para o garçom é a gorjeta.' },
    { frase: 'All the people who work in a restaurant are the ___.', opcoes: ['customers', 'seats', 'staff'], certa: 2, traducao: 'Todas as pessoas que trabalham num restaurante são a equipe.' }
  ]
});
</script>
