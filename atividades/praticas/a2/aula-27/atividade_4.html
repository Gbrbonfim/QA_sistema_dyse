/* A2 · Class 27 · Fala (There's a Restaurant)
   Alinhado ao "Writing" (descrever o restaurante ou café favorito: salão, cozinha, comida), ao
   "Speaking" (spot the differences: In picture 1, there isn't a napkin...) e ao "Role-Play".
   Conteúdo NOVO com there is / there are + a / some / any. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 27, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'My favorite restaurant is near my house.', dica: 0, traducao: 'O meu restaurante favorito fica perto da minha casa.' },
    { frase: 'There is a big dining room.', dica: 0, traducao: 'Tem um salão grande.' },
    { frase: 'There are some tables outside.', dica: 0, traducao: 'Tem algumas mesas do lado de fora.' },
    { frase: 'There are two chefs in the kitchen.', dica: 0, traducao: 'Tem dois chefs na cozinha.' },
    { frase: "There isn't a high chair for children.", dica: 0, traducao: 'Não tem cadeirinha para crianças.' },
    { frase: "There aren't any desserts today.", dica: 0, traducao: 'Não tem sobremesa hoje.' },
    { frase: 'Is there a table by the window?', dica: 0, traducao: 'Tem uma mesa perto da janela?' },
    { frase: 'Are there any vegetarian options?', dica: 0, traducao: 'Tem opções vegetarianas?' },
    { frase: 'Yes, there is.', dica: 0, traducao: 'Sim, tem.' },
    { frase: "No, there aren't.", dica: 0, traducao: 'Não, não tem.' },
    { frase: 'Can I see the menu, please?', dica: 0, traducao: 'Posso ver o cardápio, por favor?' },
    { frase: 'The bill, please.', dica: 0, traducao: 'A conta, por favor.' },
    { frase: 'Can I have a glass of water, please?', dica: 0, traducao: 'Pode me trazer um copo de água, por favor?' },
    { frase: "There isn't a napkin on my table.", dica: 0, traducao: 'Não tem guardanapo na minha mesa.' },
    { frase: 'In picture one, there are three glasses.', dica: 0, traducao: 'Na figura um, tem três copos.' },
    { frase: 'In picture two, there is a knife.', dica: 0, traducao: 'Na figura dois, tem uma faca.' },
    { frase: "I'm phoning about your restaurant.", dica: 0, traducao: 'Estou ligando sobre o seu restaurante.' },
    { frase: 'Are there any private rooms for parties?', dica: 0, traducao: 'Tem salas privativas para festas?' },
    { frase: 'How much is it?', dica: 0, traducao: 'Quanto custa?' },
    { frase: 'The waiters are very friendly.', dica: 0, traducao: 'Os garçons são muito simpáticos.' }
  ]
});
</script>
