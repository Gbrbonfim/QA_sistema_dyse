<script>
/* A2 · Class 19 · Gramática (I Love Cooking on This Day!)
   Alinhado ao "Grammar Point" e ao "HOMEWORK" — depois de love, like, enjoy, don't mind,
   prefer, hate o verbo vem com -ing; 3ª pessoa (loves, doesn't mind); e a ortografia do -ing
   (making, swimming, getting). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 18, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I love ___ the Christmas tree with my family.', opcoes: ['decorating', 'decorate', 'decorates'], certa: 0, traducao: 'Amo decorar a árvore de Natal com a minha família.' },
    { frase: 'She enjoys ___ fireworks on New Year\'s Eve.', opcoes: ['watch', 'watching', 'watches'], certa: 1, traducao: 'Ela adora ver fogos na véspera de Ano-Novo.' },
    { frase: 'We prefer ___ turkey on Thanksgiving.', opcoes: ['eat', 'eats', 'eating'], certa: 2, traducao: 'Preferimos comer peru no Dia de Ação de Graças.' },
    { frase: "He doesn't mind ___ pumpkins for Halloween.", opcoes: ['carving', 'carve', 'carves'], certa: 0, traducao: 'Ele não se importa de esculpir abóboras para o Halloween.' },
    { frase: 'They hate ___ up after the party.', opcoes: ['clean', 'cleaning', 'cleans'], certa: 1, traducao: 'Eles odeiam arrumar depois da festa.' },
    { frase: 'Jennifer ___ singing Christmas songs with friends.', opcoes: ['love', 'loving', 'loves'], certa: 2, traducao: 'A Jennifer adora cantar músicas de Natal com os amigos.' },
    { frase: "Matt ___ having family dinners. It's OK for him.", opcoes: ["doesn't mind", "don't mind", "doesn't minds"], certa: 0, traducao: 'O Matt não se importa com jantares em família. Para ele está OK.' },
    { frase: "She ___ celebrating New Year's Eve at home. She prefers big parties.", opcoes: ["don't like", "doesn't like", "doesn't likes"], certa: 1, traducao: 'Ela não gosta de comemorar o Ano-Novo em casa. Prefere festas grandes.' },
    { frase: 'I love ___ in the sea.', opcoes: ['swiming', 'swim', 'swimming'], certa: 2, traducao: 'Adoro nadar no mar.' },
    { frase: 'My mom likes ___ cakes.', opcoes: ['making', 'makeing', 'make'], certa: 0, traducao: 'A minha mãe gosta de fazer bolos.' },
    { frase: 'I hate ___ up early on holidays.', opcoes: ['geting', 'getting', 'get'], certa: 1, traducao: 'Odeio acordar cedo nos feriados.' },
    { frase: 'Do you like ___ in the snow?', opcoes: ['runing', 'run', 'running'], certa: 2, traducao: 'Você gosta de correr na neve?' },
    { frase: "It's a wonderful moment. We ___ decorating our tree.", opcoes: ['love', "don't mind", 'hate'], certa: 0, traducao: 'É um momento maravilhoso. Adoramos decorar a nossa árvore.' },
    { frase: "I ___ working on Christmas Day. It's okay for me.", opcoes: ['hate', "don't mind", 'love'], certa: 1, traducao: 'Não me importo de trabalhar no Natal. Para mim está tudo bem.' },
    { frase: 'We ___ getting socks as presents! They are so boring!', opcoes: ['love', 'enjoy', "don't like"], certa: 2, traducao: 'Não gostamos de ganhar meias de presente! São tão sem graça!' },
    { frase: 'The food is delicious. I ___ having Christmas dinner.', opcoes: ['like', 'hate', "don't like"], certa: 0, traducao: 'A comida é deliciosa. Gosto da ceia de Natal.' },
    { frase: 'Cleaning the house after the party is terrible. I ___ it!', opcoes: ['enjoy', 'hate', 'love'], certa: 1, traducao: 'Arrumar a casa depois da festa é horrível. Odeio!' },
    { frase: 'Does your father ___ cooking?', opcoes: ['likes', 'liking', 'like'], certa: 2, traducao: 'O seu pai gosta de cozinhar?' },
    { frase: 'In Australia, Christmas is in the ___.', opcoes: ['summer', 'winter', 'autumn'], certa: 0, traducao: 'Na Austrália, o Natal é no verão.' },
    { frase: 'Australians often eat ham and ___ on Christmas Day.', opcoes: ['pumpkins', 'prawns', 'candy'], certa: 1, traducao: 'Os australianos costumam comer presunto e camarão no Natal.' },
    { frase: 'Prawns are also known as ___.', opcoes: ['turkey', 'ham', 'shrimp'], certa: 2, traducao: 'Prawns também são chamados de shrimp (camarão).' },
    { frase: 'She ___ watching movies to going out.', opcoes: ['prefers', 'prefer', 'preferring'], certa: 0, traducao: 'Ela prefere ver filmes a sair.' },
    { frase: 'We really ___ spending time with our grandparents.', opcoes: ['enjoys', 'enjoy', 'enjoying'], certa: 1, traducao: 'Gostamos muito de passar tempo com os nossos avós.' },
    { frase: "My kids ___ eating vegetables. They never eat them!", opcoes: ['love', 'enjoy', 'hate'], certa: 2, traducao: 'Os meus filhos odeiam comer legumes. Nunca comem!' }
  ]
});
