DysePratica.iniciar({
  course: 'ativ-a2', aula: 18, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'I love decorating the Christmas tree.', dica: 0, traducao: 'Amo decorar a árvore de Natal.' },
    { frase: 'I like having family dinners on Christmas.', dica: 0, traducao: 'Gosto de jantares em família no Natal.' },
    { frase: "I don't mind cleaning up after a party.", dica: 0, traducao: 'Não me importo de arrumar depois de uma festa.' },

    { frase: 'I hate getting socks as presents!', dica: 0, traducao: 'Odeio ganhar meias de presente!' },
    { frase: 'I enjoy watching fireworks on New Year\'s Eve.', dica: 0, traducao: 'Adoro ver fogos na véspera de Ano-Novo.' },
    { frase: 'I prefer celebrating New Year\'s Eve at home.', dica: 0, traducao: 'Prefiro comemorar o Ano-Novo em casa.' },
    { frase: 'My mother loves cooking a lot of food.', dica: 0, traducao: 'A minha mãe ama cozinhar muita comida.' },
    { frase: "My father doesn't mind washing the dishes.", dica: 0, traducao: 'O meu pai não se importa de lavar a louça.' },
    { frase: 'My sister hates singing Christmas songs.', dica: 0, traducao: 'A minha irmã odeia cantar músicas de Natal.' },
    { frase: 'My children love opening presents.', dica: 0, traducao: 'Os meus filhos amam abrir presentes.' },
    { frase: 'We enjoy spending time together.', dica: 0, traducao: 'Gostamos muito de passar tempo juntos.' },
    { frase: 'Do you like dancing at parties?', dica: 0, traducao: 'Você gosta de dançar em festas?' },
    { frase: 'Does your brother like cooking?', dica: 0, traducao: 'O seu irmão gosta de cozinhar?' },
    { frase: 'In Australia, people love going to the beach at Christmas.', dica: 0, traducao: 'Na Austrália, as pessoas adoram ir à praia no Natal.' },
    { frase: 'They eat ham and prawns on Christmas Day.', dica: 0, traducao: 'Eles comem presunto e camarão no dia de Natal.' },
    { frase: "It's summer in Australia in December.", dica: 0, traducao: 'É verão na Austrália em dezembro.' },
    { frase: 'They wear funny little paper hats.', dica: 0, traducao: 'Eles usam chapeuzinhos de papel engraçados.' },
    { frase: 'I love cooking on this day!', dica: 0, traducao: 'Adoro cozinhar neste dia!' },
    { frase: 'What do you love doing on holidays?', dica: 0, traducao: 'O que você adora fazer nos feriados?' }
  ]
});
