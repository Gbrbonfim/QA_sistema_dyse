<script>
/* A2 · Class 02 · Fala (This is ME in a minute)
   Alinhado ao slide "Talking Point: complete with your information and present it" — falar de
   si e de outras pessoas com be (afirmativa e negativa) e possessive adjectives. Conteúdo
   NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 2, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "Hi! My name's Laura and I'm Brazilian.", dica: 0, traducao: 'Oi! O meu nome é Laura e sou brasileira.' },
    { frase: 'I studied graphic design at university.', dica: 0, traducao: 'Estudei design gráfico na faculdade.' },
    { frase: "I'm a teacher and my passion is music.", dica: 0, traducao: 'Sou professora e a minha paixão é música.' },
    { frase: 'My hobbies are dancing and playing video games.', dica: 0, traducao: 'Os meus hobbies são dançar e jogar videogame.' },
    { frase: "My favorite object is my phone.", dica: 0, traducao: 'O meu objeto favorito é o meu celular.' },
    { frase: "I can't function without a cup of coffee.", dica: 0, traducao: 'Não consigo funcionar sem uma xícara de café.' },
    { frase: "This is my brother. His name is Pedro.", dica: 0, traducao: 'Este é o meu irmão. O nome dele é Pedro.' },
    { frase: "He's a chef and his restaurant is in Lisbon.", dica: 0, traducao: 'Ele é chef e o restaurante dele fica em Lisboa.' },
    { frase: "This is my friend Julia. Her family is from Japan.", dica: 0, traducao: 'Esta é a minha amiga Julia. A família dela é do Japão.' },
    { frase: "These are my neighbors. Their dog is very big.", dica: 0, traducao: 'Estes são os meus vizinhos. O cachorro deles é muito grande.' },
    { frase: "We're students and our teacher is from Canada.", dica: 0, traducao: 'Somos alunos e o nosso professor é do Canadá.' },
    { frase: "I'm not American. I'm Brazilian.", dica: 0, traducao: 'Não sou americana. Sou brasileira.' },
    { frase: "He isn't a doctor. He's a nurse.", dica: 0, traducao: 'Ele não é médico. Ele é enfermeiro.' },
    { frase: "They aren't from Spain. They're from Mexico.", dica: 0, traducao: 'Eles não são da Espanha. São do México.' },
    { frase: "It isn't in China. It's in Japan.", dica: 0, traducao: 'Não fica na China. Fica no Japão.' },
    { frase: 'Is she your sister?', dica: 0, traducao: 'Ela é a sua irmã?' },
    { frase: 'Are they in your class?', dica: 0, traducao: 'Eles estão na sua turma?' },
    { frase: "What's his last name?", dica: 0, traducao: 'Qual é o sobrenome dele?' },
    { frase: 'How do you spell your name?', dica: 0, traducao: 'Como se soletra o seu nome?' },
    { frase: "Our cat is black. Its name is Shadow.", dica: 0, traducao: 'A nossa gata é preta. O nome dela é Shadow.' }
  ]
});
</script>
