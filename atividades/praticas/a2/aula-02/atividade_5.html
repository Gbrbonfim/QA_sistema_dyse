<script>
/* A2 · Class 02 · Gramática (This is ME in a minute)
   Alinhado aos slides "Grammar Point" — he's x his, verbo be (afirmativa, negativa curta,
   pergunta) e possessive adjectives (my, your, his, her, its, our, their). Conteúdo NOVO.
   24 questões. */
const POS = 'Choose the possessive adjective';
DysePratica.iniciar({
  course: 'ativ-a2', aula: 2, num: 5, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'This is Rafael. ___ a photographer.', opcoes: ["He's", 'His', 'Her'], certa: 0, traducao: 'Este é o Rafael. Ele é fotógrafo.' },
    { frase: 'This is Rafael. ___ camera is new.', opcoes: ["He's", 'His', 'Its'], certa: 1, traducao: 'Este é o Rafael. A câmera dele é nova.' },
    { instrucao: POS, frase: 'Monica is my colleague. ___ desk is near the window.', opcoes: ['His', 'She', 'Her'], certa: 2, traducao: 'A Monica é minha colega. A mesa dela fica perto da janela.' },
    { instrucao: POS, frase: 'We live in Recife. ___ apartment is near the beach.', opcoes: ['Our', 'We', 'Their'], certa: 0, traducao: 'Moramos em Recife. O nosso apartamento fica perto da praia.' },
    { instrucao: POS, frase: 'The children are in the garden. ___ toys are everywhere!', opcoes: ["They're", 'Their', 'There'], certa: 1, traducao: 'As crianças estão no jardim. Os brinquedos delas estão por toda parte!' },
    { instrucao: POS, frase: 'Japan is famous for ___ trains.', opcoes: ["it's", 'his', 'its'], certa: 2, traducao: 'O Japão é famoso pelos seus trens.' },
    { instrucao: POS, frase: "I'm from Curitiba. This is ___ address.", opcoes: ['my', 'me', 'I'], certa: 0, traducao: 'Sou de Curitiba. Este é o meu endereço.' },
    { instrucao: POS, frase: "Hi, Paula! Is this ___ bag?", opcoes: ["you're", 'your', 'you'], certa: 1, traducao: 'Oi, Paula! Esta é a sua bolsa?' },
    { frase: '___ from Argentina. Their names are Sofia and Juan.', opcoes: ['Their', 'There', "They're"], certa: 2, traducao: 'Eles são da Argentina. Os nomes deles são Sofia e Juan.' },
    { frase: "___ late! The class starts at eight.", opcoes: ["You're", 'Your', 'You'], certa: 0, traducao: 'Você está atrasado! A aula começa às oito.' },
    { frase: 'The cat is hungry. ___ food is in the kitchen.', opcoes: ["It's", 'Its', 'His'], certa: 1, traducao: 'O gato está com fome. A comida dele está na cozinha.' },
    { frase: "Is ___ name Carlos or Carla?", opcoes: ["she's", 'she', 'her'], certa: 2, traducao: 'O nome dela é Carlos ou Carla?' },
    { frase: "I'm Brazilian. I ___ Argentinian.", opcoes: ["'m not", "isn't", "aren't"], certa: 0, traducao: 'Sou brasileiro. Não sou argentino.' },
    { frase: "My parents ___ at home. They're at work.", opcoes: ["isn't", "aren't", "'m not"], certa: 1, traducao: 'Os meus pais não estão em casa. Estão no trabalho.' },
    { frase: "The restaurant ___ open today. It's Monday.", opcoes: ["aren't", "'m not", "isn't"], certa: 2, traducao: 'O restaurante não está aberto hoje. É segunda.' },
    { frase: "___ he your new teacher?", opcoes: ['Is', 'Are', 'Does'], certa: 0, traducao: 'Ele é o seu novo professor?' },
    { frase: '___ you and your sister twins?', opcoes: ['Is', 'Are', 'Do'], certa: 1, traducao: 'Você e a sua irmã são gêmeas?' },
    { frase: "What's ___ favorite hobby, Pedro?", opcoes: ['you', "you're", 'your'], certa: 2, traducao: 'Qual é o seu hobby favorito, Pedro?' },
    { frase: "Anna and I are in class 5. ___ teacher is Mr. Green.", opcoes: ['Our', 'We', 'Us'], certa: 0, traducao: 'A Anna e eu estamos na turma 5. O nosso professor é o Mr. Green.' },
    { frase: 'My brother lives in London. ___ wife is British.', opcoes: ['Her', 'His', "He's"], certa: 1, traducao: 'O meu irmão mora em Londres. A esposa dele é britânica.' },
    { frase: 'My sister is a doctor. ___ husband is a doctor too.', opcoes: ['His', "She's", 'Her'], certa: 2, traducao: 'A minha irmã é médica. O marido dela também é médico.' },
    { frase: 'They have a new car. ___ red.', opcoes: ["It's", 'Its', 'His'], certa: 0, traducao: 'Eles têm um carro novo. Ele é vermelho.' },
    { frase: "___ British? No, they're Irish.", opcoes: ['Is they', 'Are they', 'They are'], certa: 1, traducao: 'Eles são britânicos? Não, são irlandeses.' },
    { frase: "Excuse me, what's ___ name?", opcoes: ["you're", 'you', 'your'], certa: 2, traducao: 'Com licença, qual é o seu nome?' }
  ]
});
</script>
