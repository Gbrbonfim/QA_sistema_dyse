<script>
/* A2 · Class 12 · Fala (Family Stories)
   Alinhado aos slides "Speaking: Who is the woman? She's my sister." e "Vocabulary" — família
   com 's, Who / Whose. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 12, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Who is the woman in the photo?', dica: 0, traducao: 'Quem é a mulher na foto?' },
    { frase: "She's my sister.", dica: 0, traducao: 'Ela é a minha irmã.' },
    { frase: 'Who are the two boys?', dica: 0, traducao: 'Quem são os dois meninos?' },
    { frase: "They're my cousins.", dica: 0, traducao: 'São os meus primos.' },
    { frase: "My aunt is my father's sister.", dica: 0, traducao: 'A minha tia é a irmã do meu pai.' },
    { frase: "My uncle is my mother's brother.", dica: 0, traducao: 'O meu tio é o irmão da minha mãe.' },
    { frase: 'My grandparents live in a small town.', dica: 0, traducao: 'Os meus avós moram numa cidade pequena.' },
    { frase: "My mother-in-law is my husband's mother.", dica: 0, traducao: 'A minha sogra é a mãe do meu marido.' },
    { frase: 'I have a lot of relatives in Italy.', dica: 0, traducao: 'Tenho muitos parentes na Itália.' },
    { frase: "My brother's wife is a nurse.", dica: 0, traducao: 'A esposa do meu irmão é enfermeira.' },
    { frase: "This is my parents' house.", dica: 0, traducao: 'Esta é a casa dos meus pais.' },
    { frase: "That's the children's room.", dica: 0, traducao: 'Aquele é o quarto das crianças.' },
    { frase: "My great-grandparents were from Portugal.", dica: 0, traducao: 'Os meus bisavós eram de Portugal.' },
    { frase: 'Whose phone is this?', dica: 0, traducao: 'De quem é este celular?' },
    { frase: "It's my daughter's phone.", dica: 0, traducao: 'É o celular da minha filha.' },
    { frase: 'Whose car is that?', dica: 0, traducao: 'De quem é aquele carro?' },
    { frase: "It's my uncle's car.", dica: 0, traducao: 'É o carro do meu tio.' },
    { frase: "Who's your favorite relative?", dica: 0, traducao: 'Quem é o seu parente favorito?' },
    { frase: "My grandfather's ninety today!", dica: 0, traducao: 'O meu avô faz noventa anos hoje!' },
    { frase: "His name's Bernard and he's my cousin.", dica: 0, traducao: 'O nome dele é Bernard e ele é meu primo.' }
  ]
});
</script>
