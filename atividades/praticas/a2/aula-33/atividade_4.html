/* A2 · Class 33 · Fala (Review Classes 25-32)
   Alinhado ao "Talking point" da revisão (últimas férias com sequencers, o que fazia às 8 da
   noite, descrever uma foto, Is there / Are there num restaurante, there was / were na cidade,
   o que come num dia, how much / many, comparar pessoas da família e o jeito de dirigir).
   Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a2', aula: 33, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'On my last holiday, I went to the beach.', dica: 0, traducao: 'Nas minhas últimas férias, fui à praia.' },
    { frase: 'First, we visited a museum. Then we had lunch.', dica: 0, traducao: 'Primeiro, visitamos um museu. Depois almoçamos.' },
    { frase: 'After that, we walked in the park.', dica: 0, traducao: 'Depois disso, andamos no parque.' },
    { frase: 'At eight yesterday, I was studying English.', dica: 0, traducao: 'Às oito ontem, eu estava estudando inglês.' },
    { frase: 'My friend took this photo while we were on a trip.', dica: 0, traducao: 'O meu amigo tirou esta foto enquanto estávamos numa viagem.' },
    { frase: 'I love this photo because it makes me smile.', dica: 0, traducao: 'Amo esta foto porque ela me faz sorrir.' },
    { frase: 'Is there a table for two?', dica: 0, traducao: 'Tem uma mesa para dois?' },
    { frase: 'Are there any vegetarian dishes?', dica: 0, traducao: 'Tem pratos vegetarianos?' },
    { frase: 'In the past, there was a cinema in my city.', dica: 0, traducao: 'No passado, havia um cinema na minha cidade.' },
    { frase: "There weren't many cars.", dica: 0, traducao: 'Não havia muitos carros.' },
    { frase: 'For breakfast, I have some bread and a coffee.', dica: 0, traducao: 'No café da manhã, como pão e tomo um café.' },
    { frase: 'For lunch, I usually eat some rice and beans.', dica: 0, traducao: 'No almoço, geralmente como arroz e feijão.' },
    { frase: 'How much water do you drink?', dica: 0, traducao: 'Quanta água você bebe?' },
    { frase: 'How many cups of coffee do you have a day?', dica: 0, traducao: 'Quantas xícaras de café você toma por dia?' },
    { frase: "I don't eat many sweets.", dica: 0, traducao: 'Não como muitos doces.' },
    { frase: 'My brother is taller than my father.', dica: 0, traducao: 'O meu irmão é mais alto do que o meu pai.' },
    { frase: 'My mother is more patient than me.', dica: 0, traducao: 'A minha mãe é mais paciente do que eu.' },
    { frase: 'People drive faster here than in my city.', dica: 0, traducao: 'As pessoas dirigem mais rápido aqui do que na minha cidade.' },
    { frase: 'My dad drives more carefully than my mom.', dica: 0, traducao: 'O meu pai dirige com mais cuidado do que a minha mãe.' },
    { frase: 'I was surprised because the food was very different.', dica: 0, traducao: 'Fiquei surpreso porque a comida era muito diferente.' }
  ]
});
