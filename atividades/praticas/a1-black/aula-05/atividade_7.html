<script>
/* A1 BLACK · Class 05 and 06 · Fala (Buying Clothes at a Store)
   Alinhado às falas do cliente (Do you have it in...? / Can I try it on? / How much is it? /
   I'll take it.) e ao "I'm wearing a/an (color) (clothes)" do slide. Conteúdo NOVO.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 5, num: 7, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "I'm looking for a T-shirt.", dica: 0, traducao: 'Estou procurando uma camiseta.' },
    { frase: 'Do you have it in medium?', dica: 0, traducao: 'Vocês têm em médio?' },
    { frase: 'Do you have it in blue?', dica: 0, traducao: 'Vocês têm em azul?' },
    { frase: 'Do you have them in black?', dica: 0, traducao: 'Vocês têm elas em preto?' },
    { frase: 'This shirt is too small.', dica: 0, traducao: 'Esta camisa está pequena demais.' },
    { frase: 'These pants are too big.', dica: 0, traducao: 'Estas calças estão grandes demais.' },
    { frase: 'Can I try it on?', dica: 0, traducao: 'Posso provar?' },
    { frase: 'Can I try on these jeans?', dica: 0, traducao: 'Posso provar estes jeans?' },
    { frase: 'It fits well. I really like it.', dica: 0, traducao: 'Serve bem. Gostei muito.' },
    { frase: 'How much is it?', dica: 0, traducao: 'Quanto custa?' },
    { frase: 'How much are these sneakers?', dica: 0, traducao: 'Quanto custam estes tênis?' },
    { frase: "Perfect. I'll take it.", dica: 0, traducao: 'Perfeito. Vou levar.' },
    { frase: 'No, thank you.', dica: 0, traducao: 'Não, obrigado.' },
    { frase: "I don't like this color.", dica: 0, traducao: 'Não gosto desta cor.' },
    { frase: "I'm wearing a black T-shirt and blue jeans.", dica: 0, traducao: 'Estou usando uma camiseta preta e jeans azul.' },
    { frase: "I'm wearing a white shirt and gray pants.", dica: 0, traducao: 'Estou usando uma camisa branca e calça cinza.' },
    { frase: "I'm wearing a red dress and white sneakers.", dica: 0, traducao: 'Estou usando um vestido vermelho e tênis brancos.' },
    { frase: 'Excuse me. Do you have this in large?', dica: 0, traducao: 'Com licença. Vocês têm isto em grande?' },
    { frase: 'I would like a green jacket, size small.', dica: 0, traducao: 'Eu gostaria de uma jaqueta verde, tamanho pequeno.' },
    { frase: 'Great, thank you!', dica: 0, traducao: 'Ótimo, obrigado!' }
  ]
});
</script>
