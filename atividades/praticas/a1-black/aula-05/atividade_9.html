<script>
/* A1 BLACK · Class 05 and 06 · Gramática (Buying Clothes at a Store)
   It (uma peça: T-shirt, jacket, dress) x them (plural: pants, shorts, jeans, sneakers,
   leggings), this x these, is x are, too small / too big e os tamanhos do slide (XS, S, M, L,
   XL). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 5, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I like this T-shirt. Do you have ___ in blue?', opcoes: ['it', 'them', 'these'], certa: 0, traducao: 'Gosto desta camiseta. Vocês têm em azul?' },
    { frase: 'These pants are too small. Do you have ___ in large?', opcoes: ['it', 'them', 'this'], certa: 1, traducao: 'Estas calças estão pequenas demais. Vocês têm em grande?' },
    { frase: 'I love these sneakers. Can I try ___ on?', opcoes: ['it', 'this', 'them'], certa: 2, traducao: 'Adorei estes tênis. Posso provar?' },
    { frase: 'This dress is beautiful. How much is ___?', opcoes: ['it', 'they', 'them'], certa: 0, traducao: 'Este vestido é lindo. Quanto custa?' },
    { frase: 'How much ___ these shorts?', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'Quanto custam estes shorts?' },
    { frase: 'How much ___ this jacket?', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'Quanto custa esta jaqueta?' },
    { frase: '___ jeans are too big.', opcoes: ['These', 'This', 'It'], certa: 0, traducao: 'Estes jeans estão grandes demais.' },
    { frase: '___ shirt is too small.', opcoes: ['These', 'This', 'Them'], certa: 1, traducao: 'Esta camisa está pequena demais.' },
    { frase: 'The leggings ___ very nice.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'As leggings são muito bonitas.' },
    { frase: "I'll take ___. (os tênis)", opcoes: ['them', 'it', 'this'], certa: 0, traducao: 'Vou levar (os tênis).' },
    { frase: "I'll take ___. (a jaqueta)", opcoes: ['them', 'it', 'these'], certa: 1, traducao: 'Vou levar (a jaqueta).' },
    { frase: "Sorry, we don't have ___ in pink. (as calças)", opcoes: ['it', 'this', 'them'], certa: 2, traducao: 'Desculpe, não temos (as calças) em rosa.' },
    { frase: 'The shirt is too big. I need a ___ size.', opcoes: ['smaller', 'bigger', 'larger'], certa: 0, traducao: 'A camisa está grande demais. Preciso de um tamanho menor.' },
    { frase: 'The pants are too small. I need size ___.', opcoes: ['S', 'L', 'XS'], certa: 1, traducao: 'As calças estão pequenas demais. Preciso do tamanho G (L).' },
    { frase: 'XS = extra ___', opcoes: ['large', 'medium', 'small'], certa: 2, traducao: 'XS = extra pequeno.' },
    { frase: 'XL = extra ___', opcoes: ['large', 'small', 'medium'], certa: 0, traducao: 'XL = extra grande.' },
    { frase: 'M = ___', opcoes: ['small', 'medium', 'large'], certa: 1, traducao: 'M = médio.' },
    { frase: "I'm wearing ___ orange T-shirt.", opcoes: ['a', 'some', 'an'], certa: 2, traducao: 'Estou usando uma camiseta laranja.' },
    { frase: "I'm wearing ___ black jacket.", opcoes: ['a', 'an', '– (nothing)'], certa: 0, traducao: 'Estou usando uma jaqueta preta.' },
    { frase: "I'm wearing ___ blue jeans.", opcoes: ['a', '– (nothing)', 'an'], certa: 1, traducao: 'Estou usando jeans azul.' },
    { frase: 'Can I try ___ on?', opcoes: ['in it', 'on it', 'it'], certa: 2, traducao: 'Posso provar?' },
    { frase: "It ___ well. I really like it.", opcoes: ['fits', 'fit', 'fitting'], certa: 0, traducao: 'Serve bem. Gostei muito.' },
    { frase: 'They ___ well!', opcoes: ['fits', 'fit', 'is fit'], certa: 1, traducao: 'Serviram bem!' },
    { frase: 'Do you have this ___ medium?', opcoes: ['on', 'at', 'in'], certa: 2, traducao: 'Vocês têm isto em médio?' }
  ]
});
</script>
