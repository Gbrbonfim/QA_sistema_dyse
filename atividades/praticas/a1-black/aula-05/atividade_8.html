    { frase: 'Yes, we have it in black.', dica: 0, traducao: 'Sim, temos em preto.' },
    { frase: 'Of course. You can try it on.', dica: 0, traducao: 'Claro. Você pode provar.' },
    { frase: 'The fitting room is over there.', dica: 0, traducao: 'O provador é ali.' },
    { frase: 'The fitting room is next to the mirrors.', dica: 0, traducao: 'O provador é ao lado dos espelhos.' },
    { frase: 'How is the T-shirt?', dica: 0, traducao: 'Como ficou a camiseta?' },

    { frase: "It's nineteen ninety.", dica: 0, traducao: 'Custa 19,90.' },
    { frase: "They're twenty-four ninety.", dica: 0, traducao: 'Custam 24,90.' },
    { frase: 'Great! You can pay at the register.', dica: 0, traducao: 'Ótimo! Você pode pagar no caixa.' },

    { frase: 'What size?', dica: 0, traducao: 'Que tamanho?' },
    { frase: 'What color would you like?', dica: 0, traducao: 'Que cor você gostaria?' },
    { frase: 'We have small, medium and large.', dica: 0, traducao: 'Temos pequeno, médio e grande.' },
    { frase: 'Sure. Here you are.', dica: 0, traducao: 'Claro. Aqui está.' },
    { frase: 'No problem!', dica: 0, traducao: 'Sem problema!' }
