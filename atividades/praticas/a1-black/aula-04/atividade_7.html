/* A1 BLACK · Class 04 · Fala (Ordering Food - Drive-Thru)

  course: 'ativ-a1-black', aula: 4, num: 7, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: "I'll have a hamburger.", dica: 0, traducao: 'Vou querer um hambúrguer.' },
    { frase: 'I will have a cheeseburger.', dica: 0, traducao: 'Vou querer um cheeseburger.' },
    { frase: "I'll have large fries.", dica: 0, traducao: 'Vou querer batata grande.' },
    { frase: "I'll have a small Coke.", dica: 0, traducao: 'Vou querer uma Coca pequena.' },
    { frase: "I'll have two apple pies, please.", dica: 0, traducao: 'Vou querer duas tortas de maçã, por favor.' },
    { frase: "I'd like a chicken wrap.", dica: 0, traducao: 'Eu gostaria de um wrap de frango.' },
    { frase: 'Can I have a chocolate milkshake?', dica: 0, traducao: 'Pode me ver um milkshake de chocolate?' },
    { frase: "I'll have a pepperoni pizza.", dica: 0, traducao: 'Vou querer uma pizza de pepperoni.' },
    { frase: "I'll have a medium orange juice.", dica: 0, traducao: 'Vou querer um suco de laranja médio.' },
    { frase: "I'll have chicken nuggets and a large soda.", dica: 0, traducao: 'Vou querer nuggets de frango e um refrigerante grande.' },
    { frase: "I'll have a salad and a bottle of water.", dica: 0, traducao: 'Vou querer uma salada e uma garrafa de água.' },
    { frase: "I'll have an iced coffee.", dica: 0, traducao: 'Vou querer um café gelado.' },
    { frase: "I'll have two doughnuts and a small coffee.", dica: 0, traducao: 'Vou querer dois donuts e um café pequeno.' },
    { frase: "I'll have a double cheeseburger.", dica: 0, traducao: 'Vou querer um cheeseburger duplo.' },
    { frase: "I'll have a hot dog and medium fries.", dica: 0, traducao: 'Vou querer um cachorro-quente e batata média.' },
    { frase: "I'll have a bacon burger, please.", dica: 0, traducao: 'Vou querer um hambúrguer de bacon, por favor.' },
    { frase: "That's all.", dica: 0, traducao: 'É só isso.' },
    { frase: 'Yes, please.', dica: 0, traducao: 'Sim, por favor.' },
    { frase: 'Thank you!', dica: 0, traducao: 'Obrigado!' },
    { frase: "Hello! I'll have a cheeseburger, small fries and a large Coke.", dica: 0, traducao: 'Olá! Vou querer um cheeseburger, batata pequena e uma Coca grande.' }
  ]
});
