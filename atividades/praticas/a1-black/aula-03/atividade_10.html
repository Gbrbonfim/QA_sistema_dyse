<script>
/* A1 BLACK · Class 03 · Gramática (At the Hair Salon / Barber Shop)
   Vocabulário do slide em uso: verbos (wash, blow-dry, trim, shave), cabelo (straight, wavy,
   curly, short, long, bangs) e rosto (beard, mustache), com o to be (My hair is... / Your
   beard is...). Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 3, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right word',
  itens: [
    { frase: 'Hair with no waves or curls is ___.', opcoes: ['straight', 'curly', 'wavy'], certa: 0, traducao: 'Cabelo sem ondas nem cachos é liso.' },
    { frase: 'Hair like the letter S is ___.', opcoes: ['straight', 'wavy', 'short'], certa: 1, traducao: 'Cabelo como a letra S é ondulado.' },
    { frase: 'Hair with a lot of curls is ___.', opcoes: ['straight', 'wavy', 'curly'], certa: 2, traducao: 'Cabelo com muitos cachos é cacheado.' },
    { frase: 'Hair on the face, under the nose: a ___.', opcoes: ['mustache', 'beard', 'bangs'], certa: 0, traducao: 'Pelo no rosto, embaixo do nariz: bigode.' },
    { frase: 'Hair on the face, on the chin: a ___.', opcoes: ['mustache', 'beard', 'bangs'], certa: 1, traducao: 'Pelo no rosto, no queixo: barba.' },
    { frase: 'Hair on the forehead: ___.', opcoes: ['beard', 'mustache', 'bangs'], certa: 2, traducao: 'Cabelo na testa: franja.' },
    { frase: 'To cut a little: to ___.', opcoes: ['trim', 'wash', 'blow-dry'], certa: 0, traducao: 'Cortar um pouco: aparar.' },
    { frase: 'To clean the hair with water and shampoo: to ___.', opcoes: ['shave', 'wash', 'trim'], certa: 1, traducao: 'Limpar o cabelo com água e xampu: lavar.' },
    { frase: 'To dry the hair with hot air: to ___.', opcoes: ['wash', 'shave', 'blow-dry'], certa: 2, traducao: 'Secar o cabelo com ar quente: escovar/secar.' },
    { frase: 'To cut the beard very short: to ___.', opcoes: ['shave', 'blow-dry', 'wash'], certa: 0, traducao: 'Cortar a barba bem rente: barbear.' },
    { frase: 'The opposite of long is ___.', opcoes: ['straight', 'short', 'curly'], certa: 1, traducao: 'O contrário de comprido é curto.' },
    { frase: 'The opposite of short is ___.', opcoes: ['wavy', 'shorter', 'long'], certa: 2, traducao: 'O contrário de curto é comprido.' },
    { frase: 'My hair ___ long and wavy.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'O meu cabelo é comprido e ondulado.' },
    { frase: 'His beard ___ black.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'A barba dele é preta.' },
    { frase: 'Her bangs ___ very short.', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'A franja dela é muito curta.' },
    { frase: 'I ___ my hair short.', opcoes: ['like', 'likes', "'d likes"], certa: 0, traducao: 'Gosto do meu cabelo curto.' },
    { frase: 'A man has a haircut at a ___.', opcoes: ['bank', 'barber shop', 'gym'], certa: 1, traducao: 'Um homem corta o cabelo numa barbearia.' },
    { frase: 'A woman has a wash and blow-dry at a ___.', opcoes: ['bus stop', 'hotel gym', 'hair salon'], certa: 2, traducao: 'Uma mulher lava e escova o cabelo num salão.' },
    { frase: 'A ___ cuts hair in a salon.', opcoes: ['stylist', 'customer', 'receptionist'], certa: 0, traducao: 'Um cabeleireiro corta o cabelo num salão.' },
    { frase: 'The ___ is the person who wants a haircut.', opcoes: ['barber', 'customer', 'stylist'], certa: 1, traducao: 'O cliente é a pessoa que quer um corte.' },
    { frase: "I'd like a ___! I'd like bangs!", opcoes: ['trim', 'shave', 'change'], certa: 2, traducao: 'Eu gostaria de uma mudança! Eu gostaria de franja!' },
    { frase: "No haircut. Just a wash and ___.", opcoes: ['blow-dry', 'beard', 'bangs'], certa: 0, traducao: 'Sem corte. Só lavar e escovar.' },
    { frase: 'A clean ___: no beard and no mustache.', opcoes: ['trim', 'shave', 'haircut'], certa: 1, traducao: 'Barba bem rente: sem barba e sem bigode.' },
    { frase: 'I have a haircut every ___ months.', opcoes: ['once', 'twice', 'three'], certa: 2, traducao: 'Corto o cabelo a cada três meses.' }
  ]
});
</script>
