/* A1 BLACK · Class 02 · Fala (Functional Plus - Everyday Small Talk with Strangers)
   Alinhado ao Language box (Day & routine, Work & time pressure, Polite endings, Simple
   reactions) e aos diálogos do slide (fila, ônibus, trabalho). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 2, num: 8, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Wow, long line today!', dica: 0, traducao: 'Nossa, fila longa hoje!' },
    { frase: 'I know! Very busy.', dica: 0, traducao: 'Eu sei! Muito movimentado.' },
    { frase: 'Is the coffee good here?', dica: 0, traducao: 'O café é bom aqui?' },
    { frase: "Yes, it's the best.", dica: 0, traducao: 'Sim, é o melhor.' },
    { frase: 'Is the bus late?', dica: 0, traducao: 'O ônibus está atrasado?' },
    { frase: 'Yes, about ten minutes.', dica: 0, traducao: 'Sim, uns dez minutos.' },
    { frase: "Oh no. I'm late for work!", dica: 0, traducao: 'Ah, não. Estou atrasado para o trabalho!' },
    { frase: "Me too. It's a busy morning.", dica: 0, traducao: 'Eu também. É uma manhã corrida.' },
    { frase: 'Busy day today?', dica: 0, traducao: 'Dia corrido hoje?' },
    { frase: 'Yes, a lot of work.', dica: 0, traducao: 'Sim, muito trabalho.' },
    { frase: 'Same here.', dica: 0, traducao: 'Comigo também.' },
    { frase: 'Good luck today!', dica: 0, traducao: 'Boa sorte hoje!' },
    { frase: 'I have a meeting at ten.', dica: 0, traducao: 'Tenho uma reunião às dez.' },
    { frase: "It's a quiet day today.", dica: 0, traducao: 'É um dia tranquilo hoje.' },
    { frase: "I'm early today!", dica: 0, traducao: 'Cheguei cedo hoje!' },
    { frase: 'Really?', dica: 0, traducao: 'Sério?' },
    { frase: 'Have a good day!', dica: 0, traducao: 'Tenha um bom dia!' },
    { frase: 'Have a nice day!', dica: 0, traducao: 'Tenha um ótimo dia!' },
    { frase: 'Take care!', dica: 0, traducao: 'Se cuida!' },
    { frase: 'You too!', dica: 0, traducao: 'Você também!' }
  ]
});
</script>
