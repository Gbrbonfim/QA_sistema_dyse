<script src="/assets/dyse-auth.js"></script>

<script>
/* A1 BLACK · Class 02 · Escuta (Functional Plus - Everyday Small Talk with Strangers)
   Alinhado ao Warm Up do slide (tópicos bons para small talk: weather, work, food/drinks,
   sports, vacation, animals & nature, clothes & style, shows & books) e ao exercício "What
   topic are these small talk examples about?". Conteúdo NOVO: o aluno ouve uma fala e escolhe
   o tópico. 24 questões. */
const IC = { Weather: 'partly_cloudy_day', Work: 'work', 'Food / Drinks': 'restaurant', Sports: 'sports_soccer', Vacation: 'flight', 'Animals & Nature': 'pets', 'Clothes & Style': 'checkroom', 'Shows & Books': 'movie' };
let n = 0;
const q = (audioTexto, certa, iscas) => {
  const pos = n++ % 4;
  const ns = iscas.slice(0, 3);
  ns.splice(pos, 0, certa);
  return { audioTexto, opcoes: ns.map(c => ({ label: c, icon: IC[c] })), certa: pos };
};
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 2, num: 2, tipo: 'imagem',
  instrucao: 'Listen: what is the topic?',
  itens: [
    q('Sunny and warm today, right?', 'Weather', ['Work', 'Sports', 'Vacation']),
    q('Busy day at the office?', 'Work', ['Weather', 'Food / Drinks', 'Shows & Books']),
    q('Is the coffee good here?', 'Food / Drinks', ['Sports', 'Weather', 'Clothes & Style']),
    q('Do you like soccer?', 'Sports', ['Work', 'Vacation', 'Animals & Nature']),
    q('Is your dog friendly?', 'Animals & Nature', ['Food / Drinks', 'Work', 'Sports']),
    q('Nice jacket! Is it new?', 'Clothes & Style', ['Weather', 'Shows & Books', 'Work']),
    q('Is that book good?', 'Shows & Books', ['Sports', 'Food / Drinks', 'Vacation']),
    q('Are you on vacation here?', 'Vacation', ['Work', 'Clothes & Style', 'Animals & Nature']),
    q("It's very windy today!", 'Weather', ['Food / Drinks', 'Shows & Books', 'Clothes & Style']),
    q("I have a meeting at nine. I'm late!", 'Work', ['Vacation', 'Animals & Nature', 'Weather']),
    q('Is the pizza good here?', 'Food / Drinks', ['Clothes & Style', 'Work', 'Shows & Books']),
    q('Is the game on TV tonight?', 'Sports', ['Food / Drinks', 'Weather', 'Clothes & Style']),
    q('Look at the trees and the flowers! Beautiful park!', 'Animals & Nature', ['Work', 'Clothes & Style', 'Sports']),
    q('I like your shoes!', 'Clothes & Style', ['Animals & Nature', 'Vacation', 'Work']),
    q('Is this podcast good?', 'Shows & Books', ['Weather', 'Sports', 'Animals & Nature']),
    q('Are you from here, or on a trip?', 'Vacation', ['Food / Drinks', 'Shows & Books', 'Sports']),
    q('Bad weather today! Cloudy and cold.', 'Weather', ['Vacation', 'Work', 'Food / Drinks']),
    q('Long day at work today?', 'Work', ['Sports', 'Clothes & Style', 'Animals & Nature']),
    q('Is the tea hot?', 'Food / Drinks', ['Vacation', 'Sports', 'Shows & Books']),
    q('Is your team good this year?', 'Sports', ['Clothes & Style', 'Weather', 'Food / Drinks']),
    q('What a cute cat!', 'Animals & Nature', ['Shows & Books', 'Food / Drinks', 'Vacation']),
    q('Nice dress! The color is beautiful.', 'Clothes & Style', ['Sports', 'Work', 'Weather']),
    q('Is the new series on Netflix good?', 'Shows & Books', ['Work', 'Animals & Nature', 'Clothes & Style']),
    q('Is this your first time in Brazil?', 'Vacation', ['Weather', 'Food / Drinks', 'Work'])
  ]
});
</script>
