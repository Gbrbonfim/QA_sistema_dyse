<script>
/* A1 BLACK · Class 02 · Gramática (Functional Plus - Everyday Small Talk with Strangers)
   Alinhado ao "Listen and complete the gaps" do slide (busy, same here, sunny, have, late,
   good luck) e às frases de small talk (Is the...? / It's... / right?). Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 2, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'Nice day today. — Yes, ___ and warm.', opcoes: ['sunny', 'sun', 'busy'], certa: 0, traducao: 'Dia bonito hoje. — Sim, ensolarado e quente.' },
    { frase: '___ day today? — Yes, a lot of work.', opcoes: ['Sunny', 'Busy', 'Late'], certa: 1, traducao: 'Dia corrido hoje? — Sim, muito trabalho.' },
    { frase: "I'm very busy, too. — ___.", opcoes: ['You too', 'Take care', 'Same here'], certa: 2, traducao: 'Estou muito ocupado também. — Comigo também.' },
    { frase: 'Hi. Is the bus ___? — Yes, about ten minutes.', opcoes: ['late', 'early', 'busy'], certa: 0, traducao: 'Oi. O ônibus está atrasado? — Sim, uns dez minutos.' },
    { frase: 'Long line today. — Yes, very ___.', opcoes: ['sunny', 'busy', 'late'], certa: 1, traducao: 'Fila longa hoje. — Sim, muito movimentada.' },
    { frase: 'Nice. ___ a good day.', opcoes: ['Take', 'Good', 'Have'], certa: 2, traducao: 'Legal. Tenha um bom dia.' },
    { frase: "I have a big meeting today. — ___!", opcoes: ['Good luck', 'Same here', 'Me too, bad weather'], certa: 0, traducao: 'Tenho uma reunião importante hoje. — Boa sorte!' },
    { frase: 'Have a good day! — Thanks, you ___.', opcoes: ['to', 'too', 'two'], certa: 1, traducao: 'Tenha um bom dia! — Obrigado, você também.' },
    { frase: "I'm late for work! — ___ too!", opcoes: ['I', 'My', 'Me'], certa: 2, traducao: 'Estou atrasado para o trabalho! — Eu também!' },
    { frase: "It's cold today, ___?", opcoes: ['right', 'yes right', 'no'], certa: 0, traducao: 'Está frio hoje, né?' },
    { frase: '___ the coffee good here?', opcoes: ['Are', 'Is', 'Am'], certa: 1, traducao: 'O café é bom aqui?' },
    { frase: 'Finally some ___!', opcoes: ['sunny', 'cloudy', 'sun'], certa: 2, traducao: 'Finalmente um pouco de sol!' },
    { frase: "It's very ___ today. (vento)", opcoes: ['windy', 'wind', 'winds'], certa: 0, traducao: 'Está ventando muito hoje.' },
    { frase: "It's ___ today. (nuvens)", opcoes: ['cloud', 'cloudy', 'clouds'], certa: 1, traducao: 'Está nublado hoje.' },
    { frase: "Is the train late? — Yes, ___ five minutes.", opcoes: ['about', 'about of', 'of'], certa: 0, traducao: 'O trem está atrasado? — Sim, uns cinco minutos.' },
    { frase: "I'm late ___ work!", opcoes: ['to the', 'of', 'for'], certa: 2, traducao: 'Estou atrasado para o trabalho!' },
    { frase: 'Yes, a lot ___ work.', opcoes: ['of', 'for', 'in'], certa: 0, traducao: 'Sim, muito trabalho.' },
    { frase: "It's a ___ morning. (corrida)", opcoes: ['quiet', 'busy', 'late'], certa: 1, traducao: 'É uma manhã corrida.' },
    { frase: "It's a ___ day. (tranquilo)", opcoes: ['busy', 'long', 'quiet'], certa: 2, traducao: 'É um dia tranquilo.' },
    { frase: 'Is the food good here? — Yes, ___ very good.', opcoes: ["it's", 'is', "it"], certa: 0, traducao: 'A comida é boa aqui? — Sim, é muito boa.' },
    { frase: 'Is the bus late? — Yes, it ___.', opcoes: ["'s", 'is', 'are'], certa: 1, traducao: 'O ônibus está atrasado? — Sim, está.' },
    { frase: 'Small talk is ___.', opcoes: ['long', 'about private life', 'short'], certa: 2, traducao: 'Small talk é curto.' },
    { frase: 'A good small talk topic is ___.', opcoes: ['the weather', 'money', 'politics'], certa: 0, traducao: 'Um bom tópico de small talk é o tempo.' },
    { frase: 'A bad small talk topic is ___.', opcoes: ['sports', 'religion', 'food'], certa: 1, traducao: 'Um tópico ruim de small talk é religião.' }
  ]
});
</script>
