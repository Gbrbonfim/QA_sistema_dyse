<script>
/* A1 BLACK · Class 02 · Fala (Functional Plus - Everyday Small Talk with Strangers)
   Alinhado ao Language box (Weather: sunny, cloudy, windy, hot, nice day, bad weather) e aos
   exemplos do slide (It's cold today, right? / Nice weather today, right? / Finally some
   sun!). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 2, num: 7, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Nice weather today, right?', dica: 0, traducao: 'Que tempo bom hoje, né?' },
    { frase: "Yes, it's beautiful.", dica: 0, traducao: 'Sim, está lindo.' },
    { frase: 'Finally some sun!', dica: 0, traducao: 'Finalmente um pouco de sol!' },
    { frase: "It's cold today, right?", dica: 0, traducao: 'Está frio hoje, né?' },
    { frase: "It's very hot today!", dica: 0, traducao: 'Está muito quente hoje!' },
    { frase: "It's sunny and warm.", dica: 0, traducao: 'Está ensolarado e quente.' },
    { frase: "It's cloudy today.", dica: 0, traducao: 'Está nublado hoje.' },
    { frase: "It's very windy!", dica: 0, traducao: 'Está ventando muito!' },
    { frase: 'Bad weather today, right?', dica: 0, traducao: 'Tempo ruim hoje, né?' },
    { frase: 'Nice day today!', dica: 0, traducao: 'Que dia bonito hoje!' },
    { frase: 'Really nice weather.', dica: 0, traducao: 'Tempo muito bom mesmo.' },
    { frase: 'This wind is terrible!', dica: 0, traducao: 'Esse vento está horrível!' },
    { frase: 'Good morning!', dica: 0, traducao: 'Bom dia!' },
    { frase: 'Morning! Nice weather today, right?', dica: 0, traducao: 'Bom dia! Tempo bom hoje, né?' },
    { frase: 'Exactly. Have a nice day.', dica: 0, traducao: 'Exatamente. Tenha um ótimo dia.' },
    { frase: 'Thanks, you too.', dica: 0, traducao: 'Obrigado, você também.' },
    { frase: "Yes, it's cloudy and cold.", dica: 0, traducao: 'Sim, está nublado e frio.' },
    { frase: 'Are you a winter or summer person?', dica: 0, traducao: 'Você é uma pessoa de inverno ou de verão?' },
    { frase: "I'm a summer person!", dica: 0, traducao: 'Sou uma pessoa de verão!' },
    { frase: 'Me too! I love the sun.', dica: 0, traducao: 'Eu também! Adoro o sol.' }
  ]
});
</script>
