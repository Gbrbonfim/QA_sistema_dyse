<body>

<script>
/* A1 BLACK · Class 01 · Leitura (Functional Plus - Meeting Someone New)
   Alinhado aos diálogos do slide (Hello! / How are you? / Good! / What's your name? / Nice to
   meet you. / So, are you from...? / Oh, really? Where in...?). Conteúdo NOVO: a Emma e o Kenji
   se conhecem no primeiro dia de um curso. 20 questões: 12 de "próxima fala" + 8 de
   compreensão. */
const D = [
  ['Emma', 'Hello! How are you?'],
  ['Kenji', "Good! What's your name?"],
  ['Emma', "I'm Emma."],
  ['Kenji', "Emma, I'm Kenji. Nice to meet you!"],
  ['Emma', 'Nice to meet you, too!'],
  ['Kenji', 'So, are you from England?'],
  ['Emma', "No, I'm not. I'm from Canada."],
  ['Kenji', 'Oh, really? Where in Canada?'],
  ['Emma', 'From Vancouver. And you? Where are you from?'],
  ['Kenji', "I'm from Japan."],
  ['Emma', 'Oh, nice! Where in Japan?'],
  ['Kenji', 'I live in Osaka.'],
  ['Emma', 'Japan is beautiful!'],
  ['Kenji', 'Thank you! Canada is beautiful, too.'],
  ['Emma', 'Yes, it is! Oh, the class is starting. See you later, Kenji!'],
  ['Kenji', 'Bye, Emma!']
];
const lado = q => q === 'Emma' ? 'a' : 'b';
const prox = (k, opcoes, certa, traducao) => ({
  chat: D.slice(0, k).map(([quem, texto]) => ({ quem, texto, lado: lado(quem) })),
  quemProximo: D[k][0], ladoProximo: lado(D[k][0]), opcoes, certa, completa: D[k][1], traducao
});
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 1, num: 6, tipo: 'escolha',
  instrucao: 'Read the conversation and choose the next line',
  itens: [
    prox(1, ["Good! What's your name?", "I'm from Japan! What's your name?", "Good! Where's your name?"], 0, 'Bem! Qual é o seu nome?'),
    prox(2, ["I'm from Emma.", "I'm Emma.", "I Emma."], 1, 'Sou a Emma.'),
    prox(3, ["Emma, I'm Kenji. Nice to meet you, too!", "Emma, I'm Kenji. See you later!", "Emma, I'm Kenji. Nice to meet you!"], 2, 'Emma, sou o Kenji. Prazer em te conhecer!'),
    prox(4, ['Nice to meet you, too!', 'Nice to meet you, two!', 'Nice meet you, too!'], 0, 'Prazer em te conhecer também!'),
    prox(5, ['So, is you from England?', 'So, are you from England?', 'So, are you England?'], 1, 'Então, você é da Inglaterra?'),
    prox(6, ["No, I don't. I'm from Canada.", "No, I'm not. I'm Canada.", "No, I'm not. I'm from Canada."], 2, 'Não. Sou do Canadá.'),
    prox(7, ['Oh, really? Where in Canada?', 'Oh, really? Where from Canada?', 'Oh, really? What in Canada?'], 0, 'Ah, é mesmo? De onde no Canadá?'),
    prox(8, ['From Vancouver. And you? Where is you from?', 'From Vancouver. And you? Where are you from?', 'In Vancouver. And you? How are you from?'], 1, 'De Vancouver. E você? De onde você é?'),
    prox(10, ['Oh, nice! Where on Japan?', 'Oh, nice! Where are Japan?', 'Oh, nice! Where in Japan?'], 2, 'Ah, legal! De onde no Japão?'),
    prox(11, ['I live in Osaka.', 'I living in Osaka.', 'I live from Osaka.'], 0, 'Moro em Osaka.'),
    prox(13, ["You're welcome! Canada is beautiful, too.", 'Thank you! Canada is beautiful, too.', 'Thank you! Canada are beautiful, too.'], 1, 'Obrigado! O Canadá é lindo também.'),
    prox(15, ['Nice to meet you, Emma!', 'Hi, Emma!', 'Bye, Emma!'], 2, 'Tchau, Emma!'),
    { instrucao: 'How is Kenji?', frase: "He's ___.", opcoes: ['good', 'from Canada', 'Emma'], certa: 0, traducao: 'Ele está bem.' },
    { instrucao: 'Is Emma from England?', frase: '___', opcoes: ['Yes, she is.', "No, she isn't.", "No, she doesn't."], certa: 1, traducao: 'Não.' },
    { instrucao: 'Where is Emma from?', frase: "She's from ___.", opcoes: ['England', 'Japan', 'Canada'], certa: 2, traducao: 'Ela é do Canadá.' },
    { instrucao: 'Where in Canada?', frase: 'From ___.', opcoes: ['Vancouver', 'Toronto', 'Osaka'], certa: 0, traducao: 'De Vancouver.' },
    { instrucao: 'Where is Kenji from?', frase: "He's from ___.", opcoes: ['South Korea', 'Japan', 'China'], certa: 1, traducao: 'Ele é do Japão.' },
    { instrucao: 'Where does Kenji live?', frase: 'In ___.', opcoes: ['Tokyo', 'Vancouver', 'Osaka'], certa: 2, traducao: 'Em Osaka.' },
    { instrucao: 'What does Emma say about Japan?', frase: 'Japan is ___!', opcoes: ['beautiful', 'nice, too', 'great'], certa: 0, traducao: 'O Japão é lindo!' },
    { instrucao: 'What do they say at the end?', frase: '___', opcoes: ['Nice to meet you!', 'See you later! / Bye!', 'How are you?'], certa: 1, traducao: 'Até mais! / Tchau!' }
  ]
});
</script>
