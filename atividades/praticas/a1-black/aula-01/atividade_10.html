<script>
/* A1 BLACK · Class 01 · Gramática (Functional Plus - Meeting Someone New)
   To be nas perguntas e respostas de apresentação (What's / Where are you from? / Are you...?
   / Yes, I am. / No, I'm not.), pronomes possessivos my/your e from x in. Conteúdo NOVO.
   24 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 1, num: 10, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: "What's ___ name?", opcoes: ['your', 'you', "you're"], certa: 0, traducao: 'Qual é o seu nome?' },
    { frase: '___ name is Ali.', opcoes: ['I', 'My', 'Me'], certa: 1, traducao: 'O meu nome é Ali.' },
    { frase: 'Where ___ you from?', opcoes: ['is', 'am', 'are'], certa: 2, traducao: 'De onde você é?' },
    { frase: '___ Ali from Turkey?', opcoes: ['Is', 'Are', 'Am'], certa: 0, traducao: 'O Ali é da Turquia?' },
    { frase: 'Is Mina from South Korea? — Yes, she ___.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'A Mina é da Coreia do Sul? — Sim.' },
    { frase: 'Are you from England? — No, I ___.', opcoes: ["isn't", "aren't", "'m not"], certa: 2, traducao: 'Você é da Inglaterra? — Não.' },
    { frase: 'Neil ___ from Canada.', opcoes: ['is', 'are', 'am'], certa: 0, traducao: 'O Neil é do Canadá.' },
    { frase: 'Tom and Justine ___ from England and Australia.', opcoes: ['is', 'are', 'am'], certa: 1, traducao: 'O Tom e a Justine são da Inglaterra e da Austrália.' },
    { frase: 'Hi, Pedro! I live ___ São Paulo.', opcoes: ['from', 'on', 'in'], certa: 2, traducao: 'Oi, Pedro! Moro em São Paulo.' },
    { frase: 'Mina is ___ South Korea.', opcoes: ['from', 'in from', 'live'], certa: 0, traducao: 'A Mina é da Coreia do Sul.' },
    { frase: 'I ___ in Vancouver.', opcoes: ['lives', 'live', 'living'], certa: 1, traducao: 'Moro em Vancouver.' },
    { frase: 'We ___ in Melbourne.', opcoes: ['lives', 'living', 'live'], certa: 2, traducao: 'Moramos em Melbourne.' },
    { frase: "I'm from Canada. And ___?", opcoes: ['you', 'your', 'yours name'], certa: 0, traducao: 'Sou do Canadá. E você?' },
    { frase: 'Nice to meet you, ___!', opcoes: ['Tom too', 'too, Tom', 'Tom, to'], certa: 1, traducao: 'Prazer em te conhecer também, Tom!' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Where you are from?', 'Where is you from?', 'Where are you from?'], certa: 2, traducao: 'De onde você é?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ["What's your name?", 'What your name?', "What's you name?"], certa: 0, traducao: 'Qual é o seu nome?' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['Where on Brazil?', 'Where in Brazil?', 'Where from in Brazil?'], certa: 1, traducao: 'De onde no Brasil?' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ['I live from Seoul.', 'I am live in Seoul.', 'I live in Seoul.'], certa: 2, traducao: 'Moro em Seul.' },
    { instrucao: 'Which sentence is correct?', frase: '___', opcoes: ['Nice to meet you, too.', 'Nice to meeting you, too.', 'Nice meet you, too.'], certa: 0, traducao: 'Prazer em te conhecer também.' },
    { instrucao: 'Which question is correct?', frase: '___', opcoes: ['How you are?', 'How are you?', 'How is you?'], certa: 1, traducao: 'Como vai você?' },
    { frase: 'Turkey ___ beautiful!', opcoes: ['are', 'am', 'is'], certa: 2, traducao: 'A Turquia é linda!' },
    { frase: 'Australia is nice, too. — Yes, it ___.', opcoes: ['is', 'are', "'s"], certa: 0, traducao: 'A Austrália é legal também. — Sim, é.' },
    { frase: 'Hi! ___ Matthew.', opcoes: ['My', "I'm", 'Me'], certa: 1, traducao: 'Oi! Sou o Matthew.' },
    { frase: 'Where in Mexico? — ___ Monterrey.', opcoes: ['In from', 'Of', 'From'], certa: 2, traducao: 'De onde no México? — De Monterrey.' }
  ]
});
</script>
