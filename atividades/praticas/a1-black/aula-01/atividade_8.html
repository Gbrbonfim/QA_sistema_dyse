/* A1 BLACK · Class 01 · Fala (Functional Plus - Meeting Someone New)
   Alinhado ao "Where Are You From?" do slide (Where are you from? / I'm from... / Where in...?
   / I live in... / ...is beautiful! / ...is nice, too.). Conteúdo NOVO com outros lugares.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 1, num: 8, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Where are you from?', dica: 0, traducao: 'De onde você é?' },
    { frase: "I'm from Brazil. And you?", dica: 0, traducao: 'Sou do Brasil. E você?' },
    { frase: "I'm from Argentina.", dica: 0, traducao: 'Sou da Argentina.' },
    { frase: 'Where in Argentina?', dica: 0, traducao: 'De onde na Argentina?' },
    { frase: 'I live in Buenos Aires.', dica: 0, traducao: 'Moro em Buenos Aires.' },
    { frase: 'So, are you from Canada?', dica: 0, traducao: 'Então, você é do Canadá?' },
    { frase: 'Yes, I am. I live in Toronto.', dica: 0, traducao: 'Sim. Moro em Toronto.' },
    { frase: "I'm from England. I live in Manchester.", dica: 0, traducao: 'Sou da Inglaterra. Moro em Manchester.' },
    { frase: "I'm from Mexico. I live in Guadalajara.", dica: 0, traducao: 'Sou do México. Moro em Guadalajara.' },
    { frase: "I'm from Turkey. I live in Istanbul.", dica: 0, traducao: 'Sou da Turquia. Moro em Istambul.' },
    { frase: "I'm from Australia. I live in Melbourne.", dica: 0, traducao: 'Sou da Austrália. Moro em Melbourne.' },
    { frase: "I'm from South Korea. I live in Seoul.", dica: 0, traducao: 'Sou da Coreia do Sul. Moro em Seul.' },
    { frase: 'Oh, great! Where in Brazil?', dica: 0, traducao: 'Ah, que ótimo! De onde no Brasil?' },
    { frase: 'I live in São Paulo.', dica: 0, traducao: 'Moro em São Paulo.' },
    { frase: 'Brazil is beautiful!', dica: 0, traducao: 'O Brasil é lindo!' },
    { frase: 'Thank you! Mexico is nice, too.', dica: 0, traducao: 'Obrigado! O México é legal também.' },
    { frase: 'Yes, it is.', dica: 0, traducao: 'Sim, é.' },
    { frase: 'Oh, nice! Where in England?', dica: 0, traducao: 'Ah, legal! De onde na Inglaterra?' },
    { frase: 'From London.', dica: 0, traducao: 'De Londres.' },
    { frase: "No, I'm not. I'm from the USA.", dica: 0, traducao: 'Não. Sou dos Estados Unidos.' }
  ]
});
</script>
