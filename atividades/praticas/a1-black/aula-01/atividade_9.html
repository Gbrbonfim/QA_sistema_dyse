<script>
/* A1 BLACK · Class 01 · Gramática (Functional Plus - Meeting Someone New)
   Alinhado ao exercício "Complete the conversations" do slide (from, where, meet, nice, in,
   too, live) e às perguntas What / Where / How. Conteúdo NOVO com outras pessoas. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 1, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: "So, ___ your name?", opcoes: ["what's", "where's", "how's"], certa: 0, traducao: 'Então, qual é o seu nome?' },
    { frase: 'Nice to ___ you.', opcoes: ['know', 'meet', 'see'], certa: 1, traducao: 'Prazer em te conhecer.' },
    { frase: 'Nice to meet you, ___.', opcoes: ['to', 'two', 'too'], certa: 2, traducao: 'Prazer em te conhecer também.' },
    { frase: 'So, are you ___ Canada?', opcoes: ['from', 'in', 'of'], certa: 0, traducao: 'Então, você é do Canadá?' },
    { frase: 'Oh, really? Where ___ Canada?', opcoes: ['from', 'in', 'on'], certa: 1, traducao: 'Ah, é mesmo? De onde no Canadá?' },
    { frase: 'So, ___ are you from?', opcoes: ['what', 'how', 'where'], certa: 2, traducao: 'Então, de onde você é?' },
    { frase: 'I ___ in Guadalajara.', opcoes: ['live', 'from', 'am'], certa: 0, traducao: 'Moro em Guadalajara.' },
    { frase: '___ to meet you.', opcoes: ['Good', 'Nice', 'Fine'], certa: 1, traducao: 'Prazer em te conhecer.' },
    { frase: '___ are you? — Good, thanks!', opcoes: ['What', 'Where', 'How'], certa: 2, traducao: 'Como vai você? — Bem, obrigado!' },
    { frase: 'I live ___ Melbourne.', opcoes: ['in', 'from', 'on'], certa: 0, traducao: 'Moro em Melbourne.' },
    { frase: "I'm ___ Turkey.", opcoes: ['in', 'from', 'live'], certa: 1, traducao: 'Sou da Turquia.' },
    { frase: 'See you ___!', opcoes: ['after', 'soon later', 'later'], certa: 2, traducao: 'Até mais!' },
    { frase: 'Thank you! Brazil is nice, ___.', opcoes: ['too', 'two', 'to'], certa: 0, traducao: 'Obrigado! O Brasil é legal também.' },
    { frase: 'My name ___ Carla.', opcoes: ['are', 'is', 'am'], certa: 1, traducao: 'O meu nome é Carla.' },
    { frase: 'Are you from Canada? — Yes, I ___.', opcoes: ['do', 'is', 'am'], certa: 2, traducao: 'Você é do Canadá? — Sim.' },
    { frase: "What's your name? — ___", opcoes: ["I'm Carla.", "I'm from Argentina.", 'I live in Buenos Aires.'], certa: 0, traducao: 'Qual é o seu nome? — Sou a Carla.' },
    { frase: 'Where are you from? — ___', opcoes: ['I live in Buenos Aires.', "I'm from Argentina.", "I'm Carla."], certa: 1, traducao: 'De onde você é? — Sou da Argentina.' },
    { frase: 'Where in Argentina? — ___', opcoes: ["I'm Carla.", "I'm from Argentina.", 'I live in Buenos Aires.'], certa: 2, traducao: 'De onde na Argentina? — Moro em Buenos Aires.' },
    { frase: 'How are you? — ___', opcoes: ['Good! And you?', 'Nice to meet you.', 'From London.'], certa: 0, traducao: 'Como vai você? — Bem! E você?' },
    { frase: 'Nice to meet you. — ___', opcoes: ['See you later.', 'Nice to meet you, too.', "I'm from Canada."], certa: 1, traducao: 'Prazer em te conhecer. — Prazer em te conhecer também.' },
    { frase: 'See you later! — ___', opcoes: ['Nice to meet you!', 'How are you?', 'Bye!'], certa: 2, traducao: 'Até mais! — Tchau!' },
    { frase: 'Australia is beautiful! — ___', opcoes: ['Thank you!', 'Bye!', 'Yes, I am.'], certa: 0, traducao: 'A Austrália é linda! — Obrigado!' },
    { frase: "Where in England? — ___", opcoes: ["I'm Sophie.", 'From Manchester.', 'Nice to meet you.'], certa: 1, traducao: 'De onde na Inglaterra? — De Manchester.' },
    { frase: 'Hi! I\'m Ari. — ___', opcoes: ['Bye, Ari!', 'Where in Ari?', "Ari, I'm Meghana."], certa: 2, traducao: 'Oi! Sou o Ari. — Ari, sou a Meghana.' }
  ]
});
</script>
