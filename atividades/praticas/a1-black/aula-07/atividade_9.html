/* A1 BLACK · Class 07 · Gramática (Health & Emergency Basics)
   I have a headache / a cough / a sore throat / a fever / chest pain (sem artigo) x My head /
   stomach / throat hurts; hurt x hurts; o vocabulário do slide. Conteúdo NOVO. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 7, num: 9, tipo: 'escolha',
  instrucao: 'Complete the sentence',
  itens: [
    { frase: 'I have a ___. My head hurts.', opcoes: ['headache', 'stomachache', 'cough'], certa: 0, traducao: 'Estou com dor de cabeça. A minha cabeça dói.' },
    { frase: "I have a ___. I can't stop coughing.", opcoes: ['fever', 'cough', 'headache'], certa: 1, traducao: 'Estou com tosse. Não consigo parar de tossir.' },
    { frase: 'I have ___. It hurts here, in my chest.', opcoes: ['a sore throat', 'a headache', 'chest pain'], certa: 2, traducao: 'Estou com dor no peito. Dói aqui, no peito.' },
    { frase: 'I have a ___. My stomach hurts.', opcoes: ['stomachache', 'sore throat', 'broken arm'], certa: 0, traducao: 'Estou com dor de estômago. O meu estômago dói.' },
    { frase: 'I have a ___. My throat hurts.', opcoes: ['headache', 'sore throat', 'fever'], certa: 1, traducao: 'Estou com dor de garganta. A minha garganta dói.' },
    { frase: "I have a ___. I can't move my arm.", opcoes: ['cough', 'fever', 'broken arm'], certa: 2, traducao: 'Estou com o braço quebrado. Não consigo mexer o braço.' },
    { frase: 'My head ___.', opcoes: ['hurts', 'hurt', 'hurting'], certa: 0, traducao: 'A minha cabeça dói.' },
    { frase: 'My legs ___.', opcoes: ['hurts', 'hurt', 'is hurt'], certa: 1, traducao: 'As minhas pernas doem.' },
    { frase: 'It ___ here.', opcoes: ['hurt', 'hurting', 'hurts'], certa: 2, traducao: 'Dói aqui.' },
    { frase: 'I ___ a fever.', opcoes: ['have', 'has', 'am'], certa: 0, traducao: 'Estou com febre.' },
    { frase: 'She ___ a headache.', opcoes: ['have', 'has', 'is'], certa: 1, traducao: 'Ela está com dor de cabeça.' },
    { frase: 'I have ___ chest pain.', opcoes: ['a', 'an', '– (nothing)'], certa: 2, traducao: 'Estou com dor no peito.' },
    { frase: 'I have ___ cough.', opcoes: ['a', 'an', '– (nothing)'], certa: 0, traducao: 'Estou com tosse.' },
    { frase: 'I ___ feel well.', opcoes: ["doesn't", "don't", 'not'], certa: 1, traducao: 'Não estou me sentindo bem.' },
    { frase: 'My wife ___ feel well.', opcoes: ["don't", 'not', "doesn't"], certa: 2, traducao: 'A minha esposa não está se sentindo bem.' },
    { frase: 'Do you have a fever? — No, I ___.', opcoes: ["don't", "'m not", "haven't fever"], certa: 0, traducao: 'Você está com febre? — Não.' },
    { frase: 'Since ___? — Since this morning.', opcoes: ['what', 'when', 'where'], certa: 1, traducao: 'Desde quando? — Desde hoje de manhã.' },
    { frase: 'Where does it ___?', opcoes: ['hurts', 'hurting', 'hurt'], certa: 2, traducao: 'Onde dói?' },
    { frase: 'I need ___ doctor.', opcoes: ['a', 'an', 'some'], certa: 0, traducao: 'Preciso de um médico.' },
    { frase: 'I need ___ medicine.', opcoes: ['a', 'some', 'an'], certa: 1, traducao: 'Preciso de um remédio.' },
    { frase: "I'm calling ___ ambulance.", opcoes: ['a', 'some', 'an'], certa: 2, traducao: 'Estou chamando uma ambulância.' },
    { frase: "I can't stop ___.", opcoes: ['coughing', 'cough', 'coughs'], certa: 0, traducao: 'Não consigo parar de tossir.' },
    { frase: '___ you breathe?', opcoes: ['Do', 'Can', 'Are'], certa: 1, traducao: 'Você consegue respirar?' },
    { frase: '___ you OK?', opcoes: ['Do', 'Can', 'Are'], certa: 2, traducao: 'Você está bem?' }
  ]
});
