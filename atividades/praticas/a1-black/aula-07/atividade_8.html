/* A1 BLACK · Class 07 · Fala (Health & Emergency Basics)
   Alinhado ao "Functional Skills" e ao Speaking do slide (pedir ajuda e perguntar o que a
   pessoa tem: I need help. / Can you help me? / I need a doctor. / Are you OK? / What's
   wrong? / Do you need anything?). Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-a1-black', aula: 7, num: 8, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Excuse me! I need help.', dica: 0, traducao: 'Com licença! Preciso de ajuda.' },
    { frase: 'Can you help me?', dica: 0, traducao: 'Você pode me ajudar?' },
    { frase: 'I need a doctor.', dica: 0, traducao: 'Preciso de um médico.' },
    { frase: 'I need some medicine.', dica: 0, traducao: 'Preciso de um remédio.' },
    { frase: 'I need some water, please.', dica: 0, traducao: 'Preciso de um pouco de água, por favor.' },
    { frase: 'Are you OK?', dica: 0, traducao: 'Você está bem?' },
    { frase: "What's wrong?", dica: 0, traducao: 'O que você tem?' },
    { frase: 'Where does it hurt?', dica: 0, traducao: 'Onde dói?' },
    { frase: 'Do you have a fever?', dica: 0, traducao: 'Você está com febre?' },
    { frase: 'Can you breathe?', dica: 0, traducao: 'Você consegue respirar?' },
    { frase: 'Do you need anything?', dica: 0, traducao: 'Você precisa de alguma coisa?' },
    { frase: 'Do you need a doctor?', dica: 0, traducao: 'Você precisa de um médico?' },
    { frase: "I'm calling an ambulance now.", dica: 0, traducao: 'Estou chamando uma ambulância agora.' },
    { frase: 'Sit down, please.', dica: 0, traducao: 'Sente-se, por favor.' },
    { frase: 'Since when?', dica: 0, traducao: 'Desde quando?' },
    { frase: "You don't look well.", dica: 0, traducao: 'Você não parece bem.' },
    { frase: 'Sure. I can get some for you.', dica: 0, traducao: 'Claro. Posso comprar para você.' },
    { frase: 'Take it after food.', dica: 0, traducao: 'Tome depois de comer.' },
    { frase: 'The doctor will see you soon.', dica: 0, traducao: 'O médico vai te atender logo.' },
    { frase: "Of course. What's the problem?", dica: 0, traducao: 'Claro. Qual é o problema?' }
  ]
});
</script>
