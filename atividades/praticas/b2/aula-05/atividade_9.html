/* B2 · Class 06 · Fala (Welcome to the Future)
   Alinhado ao Reading And Writing (parágrafo: opinião, previsões, vantagens e preocupações
   com privacidade, usando futuro e expressões de tendência) e ao Vocabulary: Describing
   Trends. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b2', aula: 5, num: 9, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'AI will play a bigger role in our lives.', dica: 0, traducao: 'A IA vai ter um papel maior nas nossas vidas.' },
    { frase: 'Home robots are becoming increasingly common.', dica: 0, traducao: 'Robôs domésticos estão ficando cada vez mais comuns.' },
    { frase: 'Some experts believe AI could completely transform society.', dica: 0, traducao: 'Alguns especialistas acreditam que a IA pode transformar completamente a sociedade.' },
    { frase: 'Robots are likely to become more affordable over time.', dica: 0, traducao: 'É provável que os robôs fiquem mais acessíveis com o tempo.' },
    { frase: 'Robots will become part of everyday life.', dica: 0, traducao: 'Os robôs vão fazer parte do dia a dia.' },
    { frase: 'This will probably happen in the near future.', dica: 0, traducao: 'Isso provavelmente vai acontecer num futuro próximo.' },
    { frase: "For now, Neo is largely teleoperated.", dica: 0, traducao: 'Por enquanto, o Neo é em grande parte operado à distância.' },
    { frase: 'A human often operates it remotely with a VR headset.', dica: 0, traducao: 'Uma pessoa muitas vezes o opera à distância com óculos de realidade virtual.' },
    { frase: 'The learning process raises questions about privacy.', dica: 0, traducao: 'O processo de aprendizado levanta questões sobre privacidade.' },
    { frase: "Neo's cameras blur out people, says the company.", dica: 0, traducao: 'As câmeras do Neo borram as pessoas, diz a empresa.' },
    { frase: 'Would you feel comfortable with a robot in your home?', dica: 0, traducao: 'Você se sentiria confortável com um robô em casa?' },
    { frase: "I wouldn't feel comfortable, because of privacy.", dica: 0, traducao: 'Eu não me sentiria confortável, por causa da privacidade.' },
    { frase: 'One advantage is that it could save me a lot of time.', dica: 0, traducao: 'Uma vantagem é que ele poderia me poupar muito tempo.' },
    { frase: 'My biggest concern is that someone could watch my home.', dica: 0, traducao: 'Minha maior preocupação é que alguém poderia ver a minha casa.' },
    { frase: 'I think prices are going to fall in the next few years.', dica: 0, traducao: 'Acho que os preços vão cair nos próximos anos.' },
    { frase: "I'd rather wait until robots work on their own.", dica: 0, traducao: 'Prefiro esperar até os robôs funcionarem sozinhos.' },
    { frase: 'Early adopters help the robot learn.', dica: 0, traducao: 'Os primeiros compradores ajudam o robô a aprender.' },
    { frase: 'It costs twenty thousand dollars.', dica: 0, traducao: 'Custa vinte mil dólares.' },
    { frase: 'There will also be a monthly subscription.', dica: 0, traducao: 'Também vai haver uma assinatura mensal.' },
    { frase: 'In my opinion, robots will never replace humans.', dica: 0, traducao: 'Na minha opinião, os robôs nunca vão substituir os humanos.' }
  ]
});
</script>
