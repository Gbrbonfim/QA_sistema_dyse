/* B2 · Class 05 · Fala (Welcome to the Future)

   chatbot, você compraria um?) e às formas de futuro. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b2', aula: 5, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'Neo is a humanoid robot that helps with household chores.', dica: 0, traducao: 'O Neo é um robô humanoide que ajuda nas tarefas de casa.' },
    { frase: 'It can fold laundry, tidy shelves and fetch objects.', dica: 0, traducao: 'Ele dobra roupa, arruma prateleiras e busca objetos.' },
    { frase: 'An expert can guide Neo through unfamiliar tasks.', dica: 0, traducao: 'Um especialista pode guiar o Neo em tarefas desconhecidas.' },
    { frase: 'Its soft materials make it safer around people.', dica: 0, traducao: 'Os materiais macios o deixam mais seguro perto das pessoas.' },
    { frase: 'Unlike a chatbot, Neo has a physical body.', dica: 0, traducao: 'Diferente de um chatbot, o Neo tem um corpo físico.' },
    { frase: 'I think robots will become part of everyday life.', dica: 0, traducao: 'Acho que os robôs vão fazer parte do dia a dia.' },
    { frase: 'Neo is going to adapt to your lifestyle over time.', dica: 0, traducao: 'O Neo vai se adaptar ao seu estilo de vida com o tempo.' },
    { frase: 'Humanoid robots are stepping into real households.', dica: 0, traducao: 'Robôs humanoides estão entrando em casas de verdade.' },
    { frase: 'The company is opening pre-orders this month.', dica: 0, traducao: 'A empresa está abrindo as pré-vendas este mês.' },
    { frase: 'The first shipments begin in 2026.', dica: 0, traducao: 'As primeiras entregas começam em 2026.' },
    { frase: "Look at the price! I'm not going to buy one.", dica: 0, traducao: 'Olha o preço! Não vou comprar um.' },
    { frase: "I'm visiting a tech fair on Saturday.", dica: 0, traducao: 'Vou a uma feira de tecnologia no sábado.' },
    { frase: 'The fair opens at ten in the morning.', dica: 0, traducao: 'A feira abre às dez da manhã.' },
    { frase: "That box looks heavy. I'll help you.", dica: 0, traducao: 'Essa caixa parece pesada. Eu te ajudo.' },
    { frase: 'Would you pay monthly for a robot like Neo?', dica: 0, traducao: 'Você pagaria mensalidade por um robô como o Neo?' },
    { frase: 'The most interesting feature is that it learns from you.', dica: 0, traducao: 'A característica mais interessante é que ele aprende com você.' },
    { frase: "I wouldn't buy one, because it's too expensive.", dica: 0, traducao: 'Eu não compraria, porque é caro demais.' },
    { frase: 'This is a turning point in consumer technology.', dica: 0, traducao: 'Este é um ponto de virada na tecnologia de consumo.' },
    { frase: 'In ten years, most homes will probably have a robot.', dica: 0, traducao: 'Daqui a dez anos, a maioria das casas provavelmente terá um robô.' },
    { frase: 'Prices are falling every year.', dica: 0, traducao: 'Os preços estão caindo a cada ano.' }
  ]
});
</script>
