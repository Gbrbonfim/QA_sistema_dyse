<script>
/* B2 · Class 06 · Gramática (Welcome to the Future)
   Alinhado ao Vocabulary: Describing Trends, ao Reading (artigo sobre o Neo) e ao Writing
   (opinião com formas de futuro). Conteúdo NOVO. Uma só opção certa por item. 24 questões. */
DysePratica.iniciar({
  course: 'ativ-b2', aula: 5, num: 10, tipo: 'escolha',
  instrucao: 'Choose the right answer',
  itens: [
    { frase: 'AI will play a bigger ___ in our lives.', opcoes: ['role', 'game', 'rule'], certa: 0, traducao: 'A IA vai ter um papel maior nas nossas vidas.' },
    { frase: 'Technology is advancing fast. This will happen in the ___ future.', opcoes: ['nearly', 'near', 'nearby'], certa: 1, traducao: 'A tecnologia avança rápido. Isso vai acontecer num futuro próximo.' },
    { frase: 'Smart speakers are becoming ___ common these days.', opcoes: ['increasing', 'increase', 'increasingly'], certa: 2, traducao: 'Caixas de som inteligentes estão ficando cada vez mais comuns.' },
    { frase: 'Some experts believe AI could ___ transform society.', opcoes: ['completely', 'complete', 'completed'], certa: 0, traducao: 'Alguns especialistas acreditam que a IA pode transformar completamente a sociedade.' },
    { frase: 'Robots are ___ to become cheaper over time.', opcoes: ['like', 'likely', 'liking'], certa: 1, traducao: 'É provável que os robôs fiquem mais baratos com o tempo.' },
    { frase: 'Robots will become ___ of everyday life.', opcoes: ['parts', 'partly', 'part'], certa: 2, traducao: 'Os robôs vão fazer parte do dia a dia.' },
    { frase: 'For now, Neo is largely ___, so a human often controls it.', opcoes: ['teleoperated', 'autonomous', 'independent'], certa: 0, traducao: 'Por enquanto, o Neo é em grande parte teleoperado.' },
    { frase: 'The learning process raises questions about privacy and ___.', opcoes: ['dishes', 'trust', 'laundry'], certa: 1, traducao: 'O processo de aprendizado levanta questões sobre privacidade e confiança.' },
    { frase: "Neo's cameras ___ out humans to protect privacy.", opcoes: ['turn', 'give', 'blur'], certa: 2, traducao: 'As câmeras do Neo borram as pessoas para proteger a privacidade.' },
    { frase: "Neo can't be teleoperated without the owner's ___.", opcoes: ['approval', 'dog', 'car'], certa: 0, traducao: 'O Neo não pode ser teleoperado sem a aprovação do dono.' },
    { frase: 'Instead of paying $20,000, you can pay a monthly ___.', opcoes: ['ransom', 'subscription', 'headline'], certa: 1, traducao: 'Em vez de pagar 20 mil dólares, você pode pagar uma assinatura mensal.' },
    { frase: 'A broader international rollout is promised for ___.', opcoes: ['2025', '2030', '2027'], certa: 2, traducao: 'Um lançamento internacional maior está prometido para 2027.' },
    { frase: 'For conversation, Neo uses a large language ___.', opcoes: ['model', 'motor', 'monkey'], certa: 0, traducao: 'Para conversar, o Neo usa um grande modelo de linguagem.' },
    { frase: 'People who buy a new product very early are early ___.', opcoes: ['birds', 'adopters', 'owls'], certa: 1, traducao: 'Quem compra um produto novo bem cedo é um "early adopter".' },
    { frase: 'Neo is quieter than a ___.', opcoes: ['whisper', 'cat', 'refrigerator'], certa: 2, traducao: 'O Neo é mais silencioso que uma geladeira.' },
    { frase: "Neo's hands can go under ___.", opcoes: ['water', 'fire', 'the ground'], certa: 0, traducao: 'As mãos do Neo podem ir debaixo d\'água.' },
    { frase: 'Neo can lift up to ___ pounds.', opcoes: ['54', '154', '1,540'], certa: 1, traducao: 'O Neo levanta até 154 libras.' },
    { frase: 'Neo can work for about ___ hours before charging.', opcoes: ['ten', 'two', 'four'], certa: 2, traducao: 'O Neo funciona por cerca de quatro horas antes de carregar.' },
    { frase: 'In my opinion, robots ___ replace humans completely.', opcoes: ["won't", "aren't going", "don't will"], certa: 0, traducao: 'Na minha opinião, os robôs não vão substituir os humanos completamente.' },
    { frase: 'Look at the new prices! They ___ fall a lot next year.', opcoes: ['will to', 'are going to', 'going'], certa: 1, traducao: 'Olha os preços novos! Eles vão cair muito ano que vem.' },
    { frase: "I ___ my grandma on Sunday, so I can't go to the robot fair.", opcoes: ['visited', 'will visiting', 'am visiting'], certa: 2, traducao: 'Vou visitar minha avó no domingo, então não posso ir à feira de robôs.' },
    { frase: 'More and more homes ___ smart devices nowadays.', opcoes: ['are using', 'will used', 'used tomorrow'], certa: 0, traducao: 'Cada vez mais casas estão usando aparelhos inteligentes hoje em dia.' },
    { frase: 'The writing task asks for ___ words.', opcoes: ['50–80', '120–150', '300–400'], certa: 1, traducao: 'A tarefa de escrita pede de 120 a 150 palavras.' },
    { frase: 'The main controversy is that Neo still depends on remote ___ help.', opcoes: ['robot', 'animal', 'human'], certa: 2, traducao: 'A principal polêmica é que o Neo ainda depende de ajuda humana remota.' }
  ]
});
</script>
