/* B2 · Class 07 · Fala (Fast Cities, Slow Islands)
   Alinhado ao Speaking (quiz "Where do you really belong?": justificar escolhas com the
   more... the more, nowhere near as... as, by far the most, considerably / far + comparativo,
   is on the rise, a great deal) e às descrições de São Paulo, Nova York, Ikaria e
   Queenstown. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b2', aula: 7, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'I choose a slow morning because the more I rest, the more I can do.', dica: 0, traducao: 'Escolho uma manhã tranquila porque quanto mais descanso, mais consigo fazer.' },
    { frase: 'Staying at home is nowhere near as relaxing as walking in nature.', dica: 0, traducao: 'Ficar em casa não é nem de longe tão relaxante quanto caminhar na natureza.' },
    { frase: 'A quiet Sunday is by far the most important day of my week.', dica: 0, traducao: 'Um domingo tranquilo é de longe o dia mais importante da minha semana.' },
    { frase: 'Home-cooked food is considerably healthier than fast food.', dica: 0, traducao: 'Comida caseira é consideravelmente mais saudável que fast food.' },
    { frase: 'Online friendships are on the rise these days.', dica: 0, traducao: 'As amizades online estão em alta hoje em dia.' },
    { frase: 'For me, success means a great deal more than money.', dica: 0, traducao: 'Para mim, sucesso significa muito mais do que dinheiro.' },
    { frase: 'São Paulo has become considerably bigger than I expected.', dica: 0, traducao: 'São Paulo ficou consideravelmente maior do que eu esperava.' },
    { frase: 'Restaurants stay open far later than in Europe.', dica: 0, traducao: 'Os restaurantes ficam abertos até muito mais tarde do que na Europa.' },
    { frase: 'The nightlife is by far the best in South America.', dica: 0, traducao: 'A vida noturna é de longe a melhor da América do Sul.' },
    { frase: 'The city is nowhere near as simple as it looks.', dica: 0, traducao: 'A cidade não é nem de longe tão simples quanto parece.' },
    { frase: 'The more time I spend here, the more I realise how much I love it.', dica: 0, traducao: 'Quanto mais tempo passo aqui, mais percebo o quanto amo este lugar.' },
    { frase: 'Ikaria is a blue zone, where people live much longer.', dica: 0, traducao: 'Ikaria é uma blue zone, onde as pessoas vivem muito mais.' },
    { frase: 'Life on the island is slow and unhurried.', dica: 0, traducao: 'A vida na ilha é lenta e sem pressa.' },
    { frase: 'They only cook meat on Sundays.', dica: 0, traducao: 'Eles só cozinham carne aos domingos.' },
    { frase: 'Her grandmother is ninety-one and still walks every day.', dica: 0, traducao: 'A avó dela tem noventa e um anos e ainda caminha todo dia.' },
    { frase: 'Work hard, play hard. That is the unwritten rule.', dica: 0, traducao: 'Trabalhe muito, divirta-se muito. Essa é a regra não escrita.' },
    { frase: 'Going out here means staying out.', dica: 0, traducao: 'Sair aqui significa ficar na rua até tarde.' },
    { frase: 'Slow is not boring. Slow is rich.', dica: 0, traducao: 'Devagar não é chato. Devagar é rico.' },
    { frase: 'I think I belong in Queenstown, because I love mountains.', dica: 0, traducao: 'Acho que meu lugar é Queenstown, porque amo montanhas.' },
    { frase: 'Which life sounds more like yours?', dica: 0, traducao: 'Qual vida se parece mais com a sua?' }
  ]
});
</script>
