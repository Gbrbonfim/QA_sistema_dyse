/* B2 · Class 01 · Fala (Welcome Class)
   Alinhado ao "How Much Do You Remember?" (respostas em vários tempos verbais) e ao
   Talking Point (metas e compromissos: "To reach my goal, I will..."). Conteúdo NOVO.
   20 questões. */
DysePratica.iniciar({
  course: 'ativ-b2', aula: 1, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'After work, I usually go for a walk to relax.', dica: 0, traducao: 'Depois do trabalho, normalmente faço uma caminhada para relaxar.' },
    { frase: 'Last weekend, I visited my family and really enjoyed it.', dica: 0, traducao: 'No fim de semana passado, visitei minha família e gostei muito.' },
    { frase: 'At this time yesterday, I was cooking dinner.', dica: 0, traducao: 'A esta hora ontem, eu estava fazendo o jantar.' },
    { frase: 'If I had more free time, I would travel more.', dica: 0, traducao: 'Se eu tivesse mais tempo livre, viajaria mais.' },
    { frase: "I've never tried skydiving, but I'd love to.", dica: 0, traducao: 'Nunca saltei de paraquedas, mas adoraria.' },
    { frase: "Next weekend, I'm going to visit a friend.", dica: 0, traducao: 'No próximo fim de semana, vou visitar um amigo.' },
    { frase: 'When I was younger, I used to play outside every day.', dica: 0, traducao: 'Quando eu era mais novo, brincava na rua todos os dias.' },
    { frase: 'People should drink more water and sleep well.', dica: 0, traducao: 'As pessoas deveriam beber mais água e dormir bem.' },
    { frase: 'I think technology makes life easier, but more stressful.', dica: 0, traducao: 'Acho que a tecnologia facilita a vida, mas a deixa mais estressante.' },
    { frase: 'I recommend the park near my house. It is quiet and green.', dica: 0, traducao: 'Recomendo o parque perto da minha casa. É tranquilo e verde.' },
    { frase: 'I get on well with my colleagues.', dica: 0, traducao: 'Eu me dou bem com os meus colegas.' },
    { frase: 'When I feel tired, I take a short break.', dica: 0, traducao: 'Quando me sinto cansado, faço uma pausa curta.' },
    { frase: "You don't need to live abroad to learn a language.", dica: 0, traducao: 'Você não precisa morar fora para aprender um idioma.' },
    { frase: 'Learning should be fun and consistent.', dica: 0, traducao: 'Aprender deveria ser divertido e constante.' },
    { frase: 'I will speak English in every class, even if I make mistakes.', dica: 0, traducao: 'Vou falar inglês em todas as aulas, mesmo se errar.' },
    { frase: 'I will try to give longer answers.', dica: 0, traducao: 'Vou tentar dar respostas mais longas.' },
    { frase: "I will ask questions when I don't understand something.", dica: 0, traducao: 'Vou fazer perguntas quando não entender algo.' },
    { frase: 'I will review vocabulary after every lesson.', dica: 0, traducao: 'Vou revisar o vocabulário depois de cada aula.' },
    { frase: 'To reach my goal, I will practise English every day.', dica: 0, traducao: 'Para alcançar minha meta, vou praticar inglês todos os dias.' },
    { frase: 'One habit I want to change is checking my phone in bed.', dica: 0, traducao: 'Um hábito que quero mudar é olhar o celular na cama.' }
  ]
});
</script>
