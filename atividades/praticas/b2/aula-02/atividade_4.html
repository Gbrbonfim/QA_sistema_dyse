<script>
/* B2 · Class 02 · Fala (Why are these monkeys stealing from tourists?)
   Alinhado ao Speaking (continuar a história com past continuous + past simple: "I was
   walking in the park when...") e ao vocabulário de crime. Conteúdo NOVO. 20 questões. */
DysePratica.iniciar({
  course: 'ativ-b2', aula: 2, num: 4, tipo: 'fala',
  instrucao: 'Listen and record the whole sentence',
  itens: [
    { frase: 'I was walking in the park when something strange happened.', dica: 0, traducao: 'Eu estava andando no parque quando aconteceu algo estranho.' },
    { frase: 'I was looking at my phone when a dog ran towards me.', dica: 0, traducao: 'Eu estava olhando o celular quando um cachorro correu na minha direção.' },
    { frase: 'We were travelling last summer when our car broke down.', dica: 0, traducao: 'Estávamos viajando no verão passado quando o carro quebrou.' },
    { frase: 'I was sleeping when the phone rang.', dica: 0, traducao: 'Eu estava dormindo quando o telefone tocou.' },
    { frase: 'I was taking a selfie when a monkey jumped on my head.', dica: 0, traducao: 'Eu estava tirando uma selfie quando um macaco pulou na minha cabeça.' },
    { frase: 'The monkey stole my sunglasses and ran up a tree.', dica: 0, traducao: 'O macaco roubou meus óculos e subiu numa árvore.' },
    { frase: 'While we were walking back, it started to rain.', dica: 0, traducao: 'Enquanto voltávamos, começou a chover.' },
    { frase: 'The other tourists were laughing and filming everything.', dica: 0, traducao: 'Os outros turistas estavam rindo e filmando tudo.' },
    { frase: 'These monkeys are expert thieves.', dica: 0, traducao: 'Esses macacos são ladrões experientes.' },
    { frase: 'They barter stolen items for food.', dica: 0, traducao: 'Eles trocam objetos roubados por comida.' },
    { frase: "They're notorious for holding people to ransom.", dica: 0, traducao: 'Eles são famosos por fazer as pessoas pagarem resgate.' },
    { frase: "It's like taking candy from children.", dica: 0, traducao: 'É como tirar doce de criança.' },
    { frase: 'My bike was nicked again last night.', dica: 0, traducao: 'Minha bicicleta foi roubada de novo ontem à noite.' },
    { frase: 'The police caught the gang with an undercover agent.', dica: 0, traducao: 'A polícia pegou a gangue com um agente disfarçado.' },
    { frase: 'The thieves stole ten thousand dollars and some jewellery.', dica: 0, traducao: 'Os ladrões roubaram dez mil dólares e algumas joias.' },
    { frase: 'He talked about the robbery with brazen confidence.', dica: 0, traducao: 'Ele falou do assalto com uma confiança descarada.' },
    { frase: 'What were you doing when it happened?', dica: 0, traducao: 'O que você estava fazendo quando aconteceu?' },
    { frase: 'Have you ever heard about sneaky animals like these?', dica: 0, traducao: 'Você já ouviu falar de animais espertinhos como esses?' },
    { frase: 'The most interesting part of the video was the barter.', dica: 0, traducao: 'A parte mais interessante do vídeo foi a troca.' },
    { frase: 'Next time, I will put my things away.', dica: 0, traducao: 'Da próxima vez, vou guardar as minhas coisas.' }
  ]
});
</script>
